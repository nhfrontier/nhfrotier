.html_content<\/code>를 덮어쓰지 않고 패치로 쌓인다. 화면에 보이는 것은 프레임이 얹은 결과지만, HTML 다운로드·AI 검토(FR-14·FR-15)는 서버에서 저장본을 읽는다 — 얹지 않으면 <strong>그쪽만 편집 이전 상태를 본다.<\/strong> 그래서 서버에서 화면 HTML을 읽는 곳은 전부 <code>bakeScreenHtml()<\/code>을 거친다. 저장본은 그대로 두고 사본만 만든다.<\/p><p><code>ai-edit<\/code> 요청에 <code>commentId<\/code>를 실으면 만들어진 편집이 그 의견에 연결된다(<code>element_patches.comment_id<\/code>). 이것이 &quot;의견 → AI 반영 → 스레드로 회신&quot;의 연결 고리다. AI의 답을 <code>comments<\/code> 행으로 만들지 않는 이유는 ARCHITECTURE.md 12절과 같다 — <strong>저장은 분리하고 합치는 것은 화면에서만 한다.<\/strong><\/p><p>팬아웃(화면별 호출)은 <strong>클라이언트가 한다.<\/strong> 서버가 한 요청에서 N개를 처리하면 타임아웃 위험이 커지고 부분 실패가 감춰진다.<\/p><h3 id=\"05_API_DB_SPEC-h19\">3-3. UX 리스크 검토 (2026-09-08)<\/h3><p>FR-14의 두 테이블과 구조가 같고 세 곳이 다르다. (FR-15)<\/p><div class=\"table-wrap\"><table><thead><tr><th>테이블<\/th><th>주요 컬럼<\/th><th>목적<\/th><\/tr><\/thead><tbody><tr><td><code>usability_reviews<\/code><\/td><td><code>version_id<\/code>, <code>status<\/code>(<code>RUNNING<\/code>/<code>DONE<\/code>/<code>FAILED<\/code>), <code>model<\/code>, <code>error<\/code>, <code>requested_by<\/code><\/td><td>검토 1회 실행. **<code>requested_by<\/code>가 FR-14와 다른 컬럼** — 수동 트리거라 누가 불렀는지가 의미를 갖는다<\/td><\/tr><tr><td><code>usability_findings<\/code><\/td><td><code>review_id<\/code>, <code>lens_id<\/code>, <code>severity<\/code>, <code>title<\/code>, <code>evidence<\/code>, <code>evidence_source<\/code>, <code>why<\/code>, <code>suggestion<\/code>, <code>decision<\/code>, <code>decision_by<\/code>, <code>decision_reason<\/code>, <code>decided_at<\/code><\/td><td>지적 한 건. <code>lens_id<\/code>는 <code>UR-01<\/code>~<code>UR-06<\/code><\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>evidence_source<\/code>는 <code>PROPOSAL<\/code> / <code>SCREEN<\/code> / <code>DISCUSSION<\/code> 중 하나다. 근거가 기획안·화면·의견 중 어디서 왔는지가 담당자의 판단 재료다.<\/li><li><code>evidence<\/code>에는 <strong>원문 대조를 통과한 인용만<\/strong> 저장한다. 모델이 낸 인용 조각을 기획안 + 전 화면 HTML + 전 의견 본문과 부분문자열로 대조하고, 살아남은 것이 없으면 그 지적을 저장하지 않는다.<\/li><li><code>needs_compliance_review<\/code> / <code>COMPLIANCE_REQUESTED<\/code>는 <strong>두지 않는다.<\/strong> 준법 축은 FR-14의 몫이다.<\/li><li>**<code>comments<\/code> 테이블은 건드리지 않는다.** AI 지적을 사람 댓글 행으로 넣으면 근거·심각도·결정 필드를 붙여야 하고, 삭제·해결 토글의 의미가 사람 댓글과 달라져 스키마가 탁해진다. 화면에서만 시간순으로 합쳐 보여준다.<\/li><\/ul><h2 id=\"05_API_DB_SPEC-h20\">4. 핵심 관계<\/h2><pre><code class=\"lang-text\">USER 1:N PROJECT_MEMBER N:1 PROJECT\nPROJECT 1:N FILE\nPROJECT 1:N AI_JOB\nPROJECT 1:N COMMENT\nVERSION 1:N RESPONSIBILITY_REVIEW 1:N RESPONSIBILITY_FINDING\nVERSION 1:N USABILITY_REVIEW 1:N USABILITY_FINDING\nPROJECT 1:N VERSION\nPROJECT 1:N HISTORY_EVENT\nVERSION 1:N VERSION_FILE\nCOMMENT 1:N REVIEW_ITEM\nREVIEW_ITEM 1:1 REVIEW_DECISION\nAI_JOB 1:N AI_JOB_INPUT/OUTPUT\nTEMPLATE 1:N TEMPLATE_VERSION<\/code><\/pre><h2 id=\"05_API_DB_SPEC-h21\">5. Version 모델<\/h2><p>Version은 결과물의 논리적 스냅샷이다.<\/p><ul><li>version_id<\/li><li>project_id<\/li><li>parent_version_id<\/li><li>version_no<\/li><li>source_type(AI_GENERATION, AI_REVISION, MANUAL_EDIT, IMPORT)<\/li><li>source_job_id<\/li><li>created_by<\/li><li>created_at<\/li><li>summary<\/li><li>status<\/li><\/ul><h2 id=\"05_API_DB_SPEC-h22\">6. History 모델<\/h2><p>History는 과정과 의사결정 기록이다.<\/p><ul><li>history_id<\/li><li>project_id<\/li><li>actor_type(USER, AI, SYSTEM)<\/li><li>actor_id<\/li><li>action_type<\/li><li>target_type<\/li><li>target_id<\/li><li>payload_summary<\/li><li>created_at<\/li><\/ul><h2 id=\"05_API_DB_SPEC-h23\">7. API 오류 원칙<\/h2><ul><li>400 입력 오류<\/li><li>401 인증 필요<\/li><li>403 권한 없음<\/li><li>404 대상 없음<\/li><li>409 Version/동시성 충돌<\/li><li>413 파일 용량 초과<\/li><li>422 업무 규칙 위반<\/li><li>429 AI 호출 제한<\/li><li>500 서버 오류<\/li><li>502/504 LLM/외부 연계 오류<\/li><\/ul><h2 id=\"05_API_DB_SPEC-h24\">8. 산출물 유형 확장 (FR-13 브랜드 시안)<\/h2><p>카드 실물·홍보물 컨셉 시안을 위해 <strong>새 테이블과 새 엔드포인트를 만들지 않는다.<\/strong> 기존 리소스에 구분 필드만 둔다. 근거: <a href=\"#FR-13_브랜드시안제작\">FR-13<\/a><\/p><h3 id=\"05_API_DB_SPEC-h25\">8-1. 추가 필드<\/h3><div class=\"table-wrap\"><table><thead><tr><th>테이블<\/th><th>필드<\/th><th>값<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td><code>templates<\/code><\/td><td><code>template_type<\/code><\/td><td><code>DOCUMENT<\/code> / <code>BRAND_ASSET<\/code><\/td><td>문서 양식과 브랜드 자산(로고·컬러 토큰·서체 규칙·규격 프리셋)을 구분<\/td><\/tr><tr><td><code>ai_jobs<\/code><\/td><td><code>job_type<\/code><\/td><td><code>DOC_DRAFT<\/code> / <code>SCREEN_MOCKUP<\/code> / <code>BRAND_CONCEPT<\/code><\/td><td>산출물 종류별 프롬프트·후처리 분기<\/td><\/tr><tr><td><code>ai_job_outputs<\/code><\/td><td><code>variant_no<\/code><\/td><td>1 · 2 · 3<\/td><td>한 Job이 만든 시안 3안의 구분<\/td><\/tr><tr><td><code>ai_job_outputs<\/code><\/td><td><code>variant_label<\/code><\/td><td>텍스트<\/td><td>방향 설명 (예: &quot;정통·신뢰형&quot;)<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"05_API_DB_SPEC-h26\">8-2. 규격 프리셋<\/h3><p>프리셋은 코드가 아니라 <code>templates<\/code>(<code>BRAND_ASSET<\/code>) 데이터로 관리한다. 유형 추가 시 코드를 고치지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>프리셋 ID<\/th><th>비율<\/th><\/tr><\/thead><tbody><tr><td><code>CARD_H<\/code><\/td><td>1.586 : 1<\/td><\/tr><tr><td><code>CARD_V<\/code><\/td><td>1 : 1.586<\/td><\/tr><tr><td><code>POSTER_A<\/code><\/td><td>1 : 1.414<\/td><\/tr><tr><td><code>BANNER_SQ<\/code><\/td><td>1 : 1<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"05_API_DB_SPEC-h27\">8-3. Version 생성 시점<\/h3><p><code>BRAND_CONCEPT<\/code> Job이 완료돼도 <strong>Version은 생성되지 않는다.<\/strong> 3안은 <code>ai_job_outputs<\/code>에만 남는 후보다.<br>사용자가 하나를 선택할 때 <code>versions<\/code> 1행이 생성되며 <code>source_type = AI_GENERATION<\/code>, <code>source_job_id<\/code>로 Job과 연결된다. 선택되지 않은 시안은 Version이 되지 않는다.<\/p><hr><h2 id=\"05_API_DB_SPEC-h28\">9. 디자인 시스템 선택 (FR-04)<\/h2><p>산출물이 어떤 디자인으로 만들어질지는 <strong>생성 시점에 사용자가 고른다.<\/strong> 근거: <a href=\"#FR-04_템플릿\">FR-04<\/a><\/p><h3 id=\"05_API_DB_SPEC-h29\">9-1. 운영 스펙 — 새 리소스를 만들지 않는다<\/h3><p>디자인 시스템은 <code>templates<\/code> 의 <code>template_type = BRAND_ASSET<\/code> 레코드다. 별도 테이블·엔드포인트를 두지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/templates?type=BRAND_ASSET<\/code><\/td><td>선택 가능한 디자인 시스템 목록<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"05_API_DB_SPEC-h30\">9-2. 추가 필드<\/h3><div class=\"table-wrap\"><table><thead><tr><th>테이블<\/th><th>필드<\/th><th>값<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td><code>versions<\/code><\/td><td><code>design_system_id<\/code><\/td><td><code>templates.id<\/code> (<code>BRAND_ASSET<\/code>) 참조. NULL 허용<\/td><td><strong>어떤 디자인 시스템으로 만든 결과물인가.<\/strong> 재생성·요소 편집이 같은 시스템을 쓰도록 하고, 버전 비교 시 디자인 축을 고정한다<\/td><\/tr><\/tbody><\/table><\/div><ul><li>프로젝트가 아니라 <strong>Version에 둔다.<\/strong> 같은 프로젝트에서 v1은 모바일, v2는 웹으로 만들 수 있어야 하기 때문이다.<\/li><li>NULL 은 &quot;선택 이전에 만들어진 결과물&quot;이다. 값이 없으면 화면에 배지를 그리지 않는다.<\/li><li>값 검증은 애플리케이션에서 한다. FK 제약으로 묶지 않는 이유는 프로토타입 단계에서 목록 정본이 DB가 아니라 파일(<code>design-systems/registry.json<\/code>)이기 때문이다. 운영에서 <code>templates<\/code> 로 흡수되면 FK 로 전환한다.<\/li><\/ul><h3 id=\"05_API_DB_SPEC-h31\">9-3. 프로토타입 대응<\/h3><div class=\"table-wrap\"><table><thead><tr><th>프로토타입 (<code>mockup/<\/code>)<\/th><th>운영 스펙<\/th><\/tr><\/thead><tbody><tr><td><code>GET /api/design-systems<\/code><\/td><td><code>GET /api/v1/templates?type=BRAND_ASSET<\/code><\/td><\/tr><tr><td><code>design-systems/registry.json<\/code> (파일)<\/td><td><code>templates<\/code> 테이블 (<code>template_type = BRAND_ASSET<\/code>)<\/td><\/tr><tr><td><code>mockup_versions.design_system_id<\/code><\/td><td><code>versions.design_system_id<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>프로토타입은 파일을 목록 정본으로 쓴다. 반입할 NH 실제 자산의 관리 주체가 미결이라 등록·수정 화면을 만들 근거가 없기 때문이다 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a><\/p>"},{"id":"06_DEVELOPMENT_BACKLOG","group":"개발문서","title":"06 · 개발 백로그","lede":"P0~P5 단계 · Sprint · 티켓","author":"김태정","commit":"dd0fb14","date":"2026-08-30","path":"개발문서/06_DEVELOPMENT_BACKLOG.md","size":"3KB","changed":false,"roles":["dev"],"body":"<h1 id=\"06_DEVELOPMENT_BACKLOG-h0\">개발 프로젝트 분할 및 Backlog v1.0<\/h1><h2 id=\"06_DEVELOPMENT_BACKLOG-h1\">1. 개발 전략<\/h2><p>제품 전체를 한 번에 개발하지 않고 업무가치가 연결되는 5개 프로젝트로 나눈다. 각 프로젝트는 독립적으로 테스트 가능하지만 다음 프로젝트의 기반이 된다.<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h2\">P0. 착수/환경 확정<\/h2><p><strong>목표:<\/strong> 개발·보안·인프라 기준을 먼저 확정<\/p><ul><li>Repository/branch 전략<\/li><li>Docker build/run 기준<\/li><li>개발/검증 환경 구성<\/li><li>SSO 연계 방식 확정<\/li><li>LLM API 인증/endpoint 확정<\/li><li>파일 저장 위치/보존정책 확정<\/li><li>로그/감사 정책 초안<\/li><li>화면/DB/API 기본 규칙<\/li><\/ul><p><strong>완료 기준:<\/strong> 개발계에서 최소 Hello API + Docker 배포 + SSO/LLM 연계 가능성 검증<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h3\">P1. 업무공간 기반<\/h2><p><strong>목표:<\/strong> 프로젝트를 만들고 자료를 관리할 수 있는 기반 확보<\/p><ul><li>Dashboard<\/li><li>Project CRUD<\/li><li>Project Member/권한<\/li><li>File Upload/Download<\/li><li>Template 목록/선택<\/li><li>PostgreSQL schema<\/li><li>Redis 초기 연계<\/li><\/ul><p><strong>완료 기준:<\/strong> 사용자가 프로젝트를 생성하고 멤버/자료/Template을 관리할 수 있다.<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h4\">P2. AI 제작<\/h2><p><strong>목표:<\/strong> 승인된 LLM으로 실제 결과물을 생성<\/p><ul><li>Chat UI<\/li><li>AI Job API<\/li><li>AI Orchestrator<\/li><li>LLM 인증/호출<\/li><li>Prompt/Context builder<\/li><li>Async Worker<\/li><li>결과 저장<\/li><li>실패/Retry<\/li><\/ul><p><strong>완료 기준:<\/strong> 프로젝트 자료와 Template을 선택하고 AI 결과를 생성/저장할 수 있다.<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h5\">P3. 협업/의사결정<\/h2><p><strong>목표:<\/strong> 여러 담당자의 의견을 하나의 결과물에 연결<\/p><ul><li>Comment<\/li><li>Mention/담당자<\/li><li>AI Review<\/li><li>합의/이견/추가확인 분류<\/li><li>반영/보류/반려 결정<\/li><li>AI 수정 작업 생성<\/li><\/ul><p><strong>완료 기준:<\/strong> 의견 등록 → AI 취합 → 담당자 결정 → 수정 작업 요청까지 완주한다.<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h6\">P4. Version/History/Export<\/h2><p><strong>목표:<\/strong> 업무 과정을 조직의 자산으로 남김<\/p><ul><li>Version Snapshot<\/li><li>Version Compare<\/li><li>History Timeline<\/li><li>변경 이유 연결<\/li><li>Export Job<\/li><li>파일별 Version 연결<\/li><li>Audit Log<\/li><\/ul><p><strong>완료 기준:<\/strong> v1 → v2 변경과정 및 변경 이유를 추적할 수 있고 결과물을 다운로드할 수 있다.<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h7\">P5. 고도화<\/h2><ul><li>RAG<\/li><li>업무기준/VOC 연계<\/li><li>Template 추천<\/li><li>유사 프로젝트 추천<\/li><li>승인/결재 연계<\/li><li>협업 분석<\/li><li>Agent 자동화<\/li><\/ul><h2 id=\"06_DEVELOPMENT_BACKLOG-h8\">2. Sprint 권장 순서<\/h2><p>Sprint 0: 환경/아키텍처<br>Sprint 1-2: P1<br>Sprint 3-4: P2<br>Sprint 5-6: P3<br>Sprint 7-8: P4<br>Sprint 9+: P5/운영 고도화<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h9\">3. 우선 개발 티켓 예시<\/h2><h3 id=\"06_DEVELOPMENT_BACKLOG-h10\">FE<\/h3><p>FE-001 Layout/Router<br>FE-002 Project List<br>FE-003 Project Workspace<br>FE-004 AI Chat<br>FE-005 File UI<br>FE-006 Comment UI<br>FE-007 AI Review Panel<br>FE-008 Version Compare<br>FE-009 History Timeline<\/p><h3 id=\"06_DEVELOPMENT_BACKLOG-h11\">BE<\/h3><p>BE-001 SSO Middleware<br>BE-002 Project API<br>BE-003 Member/Authorization<br>BE-004 File API<br>BE-005 Template API<br>BE-006 AI Job API<br>BE-007 AI Orchestrator Client<br>BE-008 Comment/Review API<br>BE-009 Version Service<br>BE-010 History/Audit Service<br>BE-011 Export Service<\/p><h3 id=\"06_DEVELOPMENT_BACKLOG-h12\">Infra/DevOps<\/h3><p>OPS-001 Docker image standard<br>OPS-002 Environment config/Secret<br>OPS-003 Reverse Proxy<br>OPS-004 DB backup/restore<br>OPS-005 File storage backup/retention<br>OPS-006 Monitoring/logging<br>OPS-007 LLM endpoint connectivity<br>OPS-008 Deployment runbook<\/p><h2 id=\"06_DEVELOPMENT_BACKLOG-h13\">4. 프로젝트 완료 판단<\/h2><p>기능이 &quot;동작&quot;하는 것 외에 API/DB/로그/권한/실패 시나리오/테스트 결과가 함께 있어야 완료로 본다.<\/p>"},{"id":"07_QA_SECURITY_OPERATIONS","group":"개발문서","title":"07 · QA · 보안 · 운영","lede":"테스트 · 장애 대응 · 배포 승인","author":"김태정","commit":"dd0fb14","date":"2026-08-30","path":"개발문서/07_QA_SECURITY_OPERATIONS.md","size":"2KB","changed":false,"roles":[],"body":"<h1 id=\"07_QA_SECURITY_OPERATIONS-h0\">QA / 보안 / 운영 체크리스트 v1.0<\/h1><h2 id=\"07_QA_SECURITY_OPERATIONS-h1\">1. 기능 테스트<\/h2><ul><li>SSO 성공/실패/세션 만료<\/li><li>프로젝트 생성/수정/삭제<\/li><li>권한 없는 프로젝트 접근<\/li><li>파일 업로드/다운로드/삭제<\/li><li>파일 용량/확장자 오류<\/li><li>Template 선택/버전 변경<\/li><li>AI 생성 성공/실패/Retry<\/li><li>동일 AI Job 중복 제출<\/li><li>댓글/수정/삭제<\/li><li>AI 의견 누락 여부<\/li><li>반영/보류/반려 상태 전이<\/li><li>Version 생성/비교<\/li><li>History 기록<\/li><li>Export 실패/재시도<\/li><\/ul><h2 id=\"07_QA_SECURITY_OPERATIONS-h2\">2. 보안 테스트<\/h2><ul><li>Browser Network에서 LLM credential 노출 여부<\/li><li>API 직접 호출 시 권한 우회 여부<\/li><li>프로젝트 간 파일 접근 차단<\/li><li>IDOR 검사(projectId/fileId/versionId)<\/li><li>업로드 파일 확장자 위장<\/li><li>악성 파일 업로드 방어<\/li><li>민감정보 로그 노출 여부<\/li><li>SQL injection / command injection 기본 검사<\/li><li>XSS/HTML preview 정책 검토<\/li><li>CSRF/SSO 연계 방식 점검<\/li><li>Secret 파일/환경변수 노출 점검<\/li><\/ul><h2 id=\"07_QA_SECURITY_OPERATIONS-h3\">3. AI 품질 테스트<\/h2><ul><li>참고자료 미선택/선택 상태 차이<\/li><li>Template 적용 여부<\/li><li>동일 입력 반복 시 일관성<\/li><li>잘못된 정보 생성에 대한 UI 처리<\/li><li>의견 취합 누락률<\/li><li>근거자료가 필요한 고도화 시 RAG 출처 표시<\/li><li>프롬프트/응답 저장 정책 준수<\/li><\/ul><h2 id=\"07_QA_SECURITY_OPERATIONS-h4\">4. 운영 체크리스트<\/h2><ul><li>컨테이너 health check<\/li><li>DB backup/restore<\/li><li>파일 저장소 backup/restore<\/li><li>LLM endpoint 장애 시 서비스 상태<\/li><li>Retry 폭주 방지<\/li><li>대용량 Job queue 적체<\/li><li>디스크 용량<\/li><li>DB connection pool<\/li><li>Redis 장애 시 영향 범위<\/li><li>로그 보존 정책<\/li><\/ul><h2 id=\"07_QA_SECURITY_OPERATIONS-h5\">5. 장애 대응 우선순위<\/h2><h3 id=\"07_QA_SECURITY_OPERATIONS-h6\">LLM 장애<\/h3><p>사용자는 일반 기능을 계속 사용할 수 있어야 하며 AI 작업은 FAILED/RETRY 상태로 남는다.<\/p><h3 id=\"07_QA_SECURITY_OPERATIONS-h7\">DB 장애<\/h3><p>쓰기 기능을 제한하고 기존 읽기 가능 여부를 판단한다. 무리한 재시작보다 원인과 복구 상태를 먼저 확인한다.<\/p><h3 id=\"07_QA_SECURITY_OPERATIONS-h8\">File Storage 장애<\/h3><p>신규 업로드/Export를 제한하고 Version/메타데이터 손상 여부를 확인한다.<\/p><h3 id=\"07_QA_SECURITY_OPERATIONS-h9\">Container 장애<\/h3><p>health check 및 재기동 정책을 사용하되 반복 장애 원인을 먼저 확인한다.<\/p><h2 id=\"07_QA_SECURITY_OPERATIONS-h10\">6. 배포 전 승인 목록<\/h2><ul><li>소스/이미지 취약점 점검<\/li><li>Secret/환경변수 점검<\/li><li>SSO 연계 테스트 완료<\/li><li>LLM API 인증 테스트 완료<\/li><li>파일 저장소 권한 검증<\/li><li>DB schema migration 검증<\/li><li>Rollback 절차 검증<\/li><li>운영 로그/감사 로그 확인<\/li><\/ul>"},{"id":"08_DECISIONS_OPEN_ISSUES","group":"개발문서","title":"08 · 결정 & 미결","lede":"확정 사항 · 협의 필요 항목","author":"Lucas-one","commit":"221c643","date":"2026-09-08","path":"개발문서/08_DECISIONS_OPEN_ISSUES.md","size":"10KB","changed":false,"roles":["pm"],"body":"<h1 id=\"08_DECISIONS_OPEN_ISSUES-h0\">Decision Log &amp; Open Issues v1.0<\/h1><h2 id=\"08_DECISIONS_OPEN_ISSUES-h1\">1. 현재 결정사항<\/h2><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>결정<\/th><\/tr><\/thead><tbody><tr><td>AI 모델<\/td><td>자체 LLM 개발하지 않고 승인된 LLM API 사용<\/td><\/tr><tr><td>LLM 호출 위치<\/td><td>Backend/AI Orchestrator에서 서버 측 호출<\/td><\/tr><tr><td>초기 배포<\/td><td>Linux + Docker<\/td><\/tr><tr><td>향후 확장<\/td><td>K8s 전환 가능 구조 유지<\/td><\/tr><tr><td>Version<\/td><td>결과물 상태 관리<\/td><\/tr><tr><td>History<\/td><td>작업/의사결정 과정 관리<\/td><\/tr><tr><td>파일 저장<\/td><td>DB와 분리된 File Storage<\/td><\/tr><tr><td>긴 AI 작업<\/td><td>Async Job 확장 구조<\/td><\/tr><tr><td>디자인 시스템<\/td><td>기존 NH 자산과 연결, 중복 구축 최소화<\/td><\/tr><tr><td>디자인 시스템의 개수 (FR-04)<\/td><td><strong>하나로 고정하지 않고 복수로 보유하고 생성 시점에 고른다.<\/strong> 모바일 앱(360×780·하단 내비)과 기업 웹(1200px·GNB)은 표면이 달라 한쪽으로 통일할 수 없다. 정본은 <code>design-systems/registry.json<\/code><\/td><\/tr><tr><td>디자인 시스템 선택의 기록 위치<\/td><td>프로젝트가 아니라 <strong>Version<\/strong>에 남긴다(<code>versions.design_system_id<\/code>). 같은 프로젝트에서 v1은 모바일, v2는 웹으로 만들 수 있어야 한다<\/td><\/tr><tr><td>참고 템플릿 선택 (FR-04)<\/td><td><strong>고르게 하지 않는다.<\/strong> 고른 디자인 시스템의 <strong>완성 화면을 전부<\/strong> 화면 생성 프롬프트에 예시로 넣고, 지금 만들 화면에 어느 것이 가까운지는 모델이 판단한다. 사용자가 고르는 것은 디자인 시스템 하나뿐이다 (2026-09-08)<\/td><\/tr><tr><td>예시를 골라 넣지 않고 전부 넣는 이유<\/td><td>시스템 프롬프트는 <code>cache_control<\/code>로 캐시된다. 화면마다 다른 예시를 골라 넣으면 프롬프트 접두가 달라져 <strong>캐시가 매번 깨진다<\/strong> — 토큰을 줄이려다 오히려 비용이 늘어난다. 현재 최대치는 nh-ibz 4장 약 34,000자다<\/td><\/tr><tr><td>디자인 시스템 자산의 성격<\/td><td><code>allone-bank<\/code>는 올원뱅크 앱에서 <strong>UX 패턴만<\/strong> 가져온 것이고 색·로고·서체는 <strong>실제 CI가 아닌 대체재<\/strong>다. <code>nh-ibz<\/code>는 <strong>컬러 토큰만 실제 NH<\/strong>이며 로고·서체·아이콘은 대체재다. 생성 결과를 &quot;NH 공식 디자인&quot;이라고 부르지 않는다 → design-systems/README.md<\/td><\/tr><tr><td>브랜드 시안 제작 (FR-13)<\/td><td>카드 실물·홍보물의 <strong>컨셉 시안<\/strong>까지만 다룬다. 인쇄용 최종 파일(규격·CMYK·재단선)은 범위 밖<\/td><\/tr><tr><td>브랜드 시안 파이프라인<\/td><td>새 테이블·엔드포인트를 만들지 않고 FR-05의 AI Job을 <code>job_type = BRAND_CONCEPT<\/code>으로 재사용<\/td><\/tr><tr><td>시안 3안과 Version<\/td><td>3안은 후보이며 Version이 아니다. 사용자가 하나를 <strong>선택할 때<\/strong> Version 1개가 생성된다<\/td><\/tr><tr><td>책임성 검토 (FR-14)<\/td><td>AI는 <strong>준법 검토가 필요한 지점을 제시<\/strong>할 뿐 적법성을 판정하지 않는다. Export·공유를 차단하는 게이트가 아니다 — PRD 5절 비범위를 넘지 않는다<\/td><\/tr><tr><td>책임성 검토의 근거<\/td><td>목업에서 그대로 인용한 근거가 없는 지적은 <strong>서버에서 버린다.<\/strong> 담당자가 검증할 수 없는 지적은 결정을 내릴 수 없기 때문<\/td><\/tr><tr><td>책임성 규칙 정본<\/td><td><a href=\"#RESPONSIBLE_DESIGN\">docs/guidelines/RESPONSIBLE_DESIGN.md<\/a>. 코드의 규칙 배열은 프롬프트를 규칙에서 생성하기 위한 사본이며, 정본이 아니다<\/td><\/tr><tr><td>UX 리스크 검토 (FR-15)<\/td><td>FR-14와 <strong>합치지 않고 별도 기능으로 둔다.<\/strong> 입력(전 화면+의견 전문)·기준(질문 렌즈 vs 위반 규칙)·실행 시점(수동 vs 자동)이 달라 한 함수에 넣으면 두 결과가 다 흐려진다. 요소 하나로 판정되는 것은 FR-14, 개수·맥락이 문제인 것은 FR-15<\/td><\/tr><tr><td>UX 리스크 검토의 트리거<\/td><td><strong>담당자가 요청할 때만<\/strong> 실행한다. 댓글마다 자동 실행하면 같은 지적이 반복되어 스레드를 오염시키고, 비용·지연이 예측 불가능해진다<\/td><\/tr><tr><td>UX 리스크 검토의 근거<\/td><td>모델이 낸 인용 조각을 <strong>기획안·화면 HTML·의견 원문과 글자 그대로 대조<\/strong>하고, 살아남은 것이 없으면 그 지적을 통째로 버린다. 렌즈가 규칙보다 느슨한 만큼 근거는 FR-14보다 조인다<\/td><\/tr><tr><td>UX 리스크 검토의 결과 위치<\/td><td>별도 탭이 아니라 <strong>의견 목록에 사람 댓글과 시간순으로 섞어<\/strong> 놓는다. 저장은 별도 테이블에 하며 <code>comments<\/code>에 AI 행을 넣지 않는다<\/td><\/tr><tr><td>UX 검토 렌즈 정본<\/td><td><a href=\"#USABILITY_REVIEW\">docs/guidelines/USABILITY_REVIEW.md<\/a>. <code>mockup/lib/usability-lenses.ts<\/code>는 프롬프트 생성을 위한 사본이며 정본이 아니다<\/td><\/tr><tr><td>프로젝트 권한 모델 (FR-01)<\/td><td>**<code>OWNER<\/code> / <code>EDITOR<\/code> / <code>REVIEWER<\/code> / <code>VIEWER<\/code> 4단계로 확정** (2026-09-08). 기획안 7-3절 후보를 그대로 채택했다. 2단계(Owner/Member)로는 &quot;읽기만 가능한 참여자&quot;와 &quot;의견은 내지만 반영 결정은 못 하는 검토자&quot;를 표현할 수 없는데, FR-08 반영 결정과 FR-14·15 지적 결정이 이 구분을 전제로 한다. 권한 판정 지점은 Backend 한 곳(<code>@RequireProjectRole<\/code>)이며 프론트는 표시만 제어한다<\/td><\/tr><tr><td>권한 단계별 허용 범위<\/td><td><code>VIEWER<\/code> 읽기·다운로드 / <code>REVIEWER<\/code> + 의견·검토 요청 / <code>EDITOR<\/code> + 생성·편집·반영 결정·Export / <code>OWNER<\/code> + 프로젝트 설정·멤버 관리·삭제. 상위 단계는 하위 단계를 포함한다<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"08_DECISIONS_OPEN_ISSUES-h2\">2. 반드시 협의해야 할 사항<\/h2><h3 id=\"08_DECISIONS_OPEN_ISSUES-h3\">인프라<\/h3><ul><li>Linux 서버 사양<\/li><li>Docker 운영 방식<\/li><li>내부 DNS/Reverse Proxy<\/li><li>컨테이너 이미지 반입 경로 및 Registry<\/li><li>운영/개발 서버 분리<\/li><li>NFS/Object Storage 종류와 접근권한<\/li><li>DB/Redis 운영 주체<\/li><\/ul><h3 id=\"08_DECISIONS_OPEN_ISSUES-h4\">AI<\/h3><ul><li>LLM API endpoint<\/li><li>인증 방식(Token/API Key/OAuth 등)<\/li><li>사용 가능한 모델 목록<\/li><li>최대 입력/출력 토큰<\/li><li>동시 호출 제한<\/li><li>Timeout/Rate Limit 정책<\/li><li>Prompt/Response 저장 허용 범위<\/li><li>시안 3안 동시 생성이 LLM 호출 3회인지 1회인지 (FR-13) — 동시 호출 제한·최대 토큰 정책과 직결<\/li><\/ul><h3 id=\"08_DECISIONS_OPEN_ISSUES-h5\">보안<\/h3><ul><li>SSO 방식<\/li><li><del>프로젝트 권한 모델<\/del> → <strong>결정 (2026-09-08).<\/strong> 1절 표 참고. Backend는 <code>AuthenticationProvider<\/code> 어댑터로 SSO 방식과 분리해 두므로 SSO 확정 전에도 인가는 구현할 수 있다<\/li><li>파일 반출 정책<\/li><li>로그/감사로그 보존 정책<\/li><li><strong>AI 입력 데이터의 민감정보 처리 기준<\/strong> — FR-15가 범위를 넓혔다. FR-14까지는 목업 HTML과 기획안만 LLM에 보냈으나, FR-15는 <strong>사람이 작성한 의견 원문<\/strong>을 함께 보낸다. 의견에는 사내 정보·개인정보가 섞일 수 있다. 어떤 자료를 AI에 넣을 수 있는지 기준이 필요하다 → SECURITY_CHECKLIST 1절<\/li><li><del>HTML preview 보안 정책<\/del> → <strong>부분 결정 (2026-09-05).<\/strong> 샌드박스는 <code>allow-scripts<\/code> <strong>단독<\/strong>(불투명 오리진), 통신은 postMessage만, 저장 전 서버측 정제, <code>srcDoc<\/code>에 CSP meta 주입. 근거와 상세는 SECURITY_CHECKLIST.md 4절. 금지 대상은 <code>allow-same-origin<\/code>과 <code>allow-scripts<\/code>의 <strong>동시<\/strong> 부여이므로 규칙 위반이 아니다. <strong>운영 적용 시 행내 보안 검토 필요<\/strong><\/li><\/ul><h3 id=\"08_DECISIONS_OPEN_ISSUES-h6\">업무<\/h3><ul><li>공식 NH Template의 관리 주체<\/li><li>개인 Template 공유 허용 범위<\/li><li><strong>디자인 시스템 대체재의 교체 주체<\/strong> (FR-04) — NH 바른고딕 웹폰트, 공식 CI 로고, NH 자체 아이콘셋·아이소메트릭 일러스트가 반입되면 <code>design-systems/nh-ibz/<\/code>의 대체재(Noto Sans KR · 타이포 플레이스홀더 로고 · Lucide)를 갈아 끼워야 한다. 누가 반입하고 누가 갱신하는가<\/li><li><strong>디자인 시스템 등록·관리 화면의 필요 여부<\/strong> (FR-04) — 현재 목록 정본은 파일(<code>registry.json<\/code>)이다. 관리 주체가 정해지면 <code>templates<\/code>(<code>BRAND_ASSET<\/code>) 데이터로 옮기고 등록 화면을 만들지 결정한다<\/li><li>Version 승인 개념 필요 여부<\/li><li>준법/보안 검토를 워크플로우에 넣을지 여부 — FR-14가 <code>준법 검토 요청<\/code> <strong>결정 상태<\/strong>까지는 만들었다. 아래 3건이 정해져야 실제로 넘어간다<\/li><li><strong>준법 검토 요청의 수신자<\/strong> (FR-14) — 누구에게 가는가. 현재는 상태로만 남고 아무에게도 전달되지 않는다<\/li><li><strong>준법 검토 요청의 알림·SLA<\/strong> (FR-14) — 어떻게 통지하고 며칠 안에 회신하는가<\/li><li><strong>책임성 규칙·UX 검토 렌즈의 개정 주체<\/strong> (FR-14·FR-15) — RR 규칙과 UR 렌즈의 추가·삭제를 누가 승인하는가. 두 정본이 같은 성격이므로 함께 정한다<\/li><li>최종 Export 형식 우선순위<\/li><li><strong>NH 실제 브랜드 자산(로고·캐릭터·컬러·서체) 파일의 반입 경로와 관리 주체<\/strong> — FR-13 최대 블로커. 자산이 없으면 기능이 동작해도 결과가 NH답지 않다<\/li><li>카드 실물의 필수 표기 요소(카드사 로고, 은행명, 법정 문구) 규칙의 출처와 관리 주체<\/li><li>브랜드 시안 컨셉의 Export 형식 (PNG / PDF / HTML) — 위 Export 형식 우선순위와 함께 협의<\/li><\/ul><h2 id=\"08_DECISIONS_OPEN_ISSUES-h7\">3. 중요한 제품 의사결정<\/h2><h3 id=\"08_DECISIONS_OPEN_ISSUES-h8\">Q1. 이 서비스는 디자인 시스템인가?<\/h3><p><strong>아니다.<\/strong> 디자인 시스템은 구성요소 중 하나이며, 제품의 중심은 업무 제작과 협의/의사결정 관리다.<\/p><h3 id=\"08_DECISIONS_OPEN_ISSUES-h9\">Q2. AI가 최종 판단하는가?<\/h3><p><strong>아니다.<\/strong> AI는 의견과 수정안을 제안하고, 최종 반영 여부는 담당자가 결정한다.<\/p><h3 id=\"08_DECISIONS_OPEN_ISSUES-h10\">Q3. 댓글/Version만 있으면 차별점이 되는가?<\/h3><p><strong>아니다.<\/strong> 핵심은 의견을 의사결정과 Version에 연결하고 이후 업무에서 재사용 가능한 자산으로 남기는 것이다.<\/p><h3 id=\"08_DECISIONS_OPEN_ISSUES-h11\">Q4. 카드·홍보물 시안을 만드는 것은 Q1(디자인 시스템이 아니다)의 번복인가?<\/h3><p><strong>아니다.<\/strong> FR-13은 새 디자인 체계를 세우지 않는다. 기존 NH 자산을 배치해 <strong>방향 합의용 컨셉 시안<\/strong>을 만들 뿐이고, 값은 시안 자체가 아니라 &quot;어느 방향으로 갈지&quot;가 Version·History에 기록되는 데 있다. 제품의 중심이 업무 제작과 의사결정 관리라는 Q1의 결론은 그대로다.<\/p><h2 id=\"08_DECISIONS_OPEN_ISSUES-h12\">4. 향후 확장 방향<\/h2><p>현재 프로젝트에서 축적되는 프로젝트/Template/Review/History 데이터는 이후 RAG와 유사업무 추천, 업무사례 검색, Agent 자동화의 입력 자산이 될 수 있다.<\/p>"},{"id":"09_UI_SPEC_브랜드시안","group":"개발문서","title":"09 · 브랜드 시안 화면","lede":"S08 · S09 화면 상세 명세","author":"Lucas-one","commit":"96221a4","date":"2026-09-08","path":"개발문서/09_UI_SPEC_브랜드시안.md","size":"11KB","changed":false,"roles":["dev"],"body":"<h1 id=\"09_UI_SPEC_브랜드시안-h0\">09 · 브랜드 시안 화면 상세 명세 (S08 · S09) v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#FR-13_브랜드시안제작\">FR-13 브랜드 시안 제작<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면 정본<\/a> | <a href=\"#01_PRD\">PRD<\/a><\/p><p><strong>정본 관계<\/strong>: 화면 목록과 역할의 정본은 <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a>다. 본 문서는 그 S08·S09를 <strong>화면 제작에 넘길 수 있는 수준<\/strong>으로 상세화한 것이다. 03이 바뀌면 본 문서를 함께 갱신한다.<\/p><\/blockquote><h2 id=\"09_UI_SPEC_브랜드시안-h1\">0-0. 확인할 수 있는 곳<\/h2><div class=\"table-wrap\"><table><thead><tr><th>형태<\/th><th>위치<\/th><th>성격<\/th><\/tr><\/thead><tbody><tr><td>정적 클릭스루<\/td><td><code>mockup-site/brand-concept-brief.html<\/code> → <code>brand-concept-compare.html<\/code> → <code>brand-concept-decided.html<\/code><\/td><td>팀 공유용. GitHub Pages <code>/dev/<\/code>에 그대로 배포된다. JS 없이 링크로만 이동하는 기존 목업 사이트 규칙을 따른다<\/td><\/tr><tr><td>동작 프로토타입<\/td><td>Claude Design 캔버스 (S08·S09 + S09 대안 2안)<\/td><td>유형 전환·키워드 선택·확대 보기·결정 확인 단계까지 실제로 눌러볼 수 있다. 저장소에는 포함하지 않는다<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"09_UI_SPEC_브랜드시안-h2\">0. 이 문서를 읽는 사람에게<\/h2><p>이 화면을 쓰는 사람은 <strong>전원 비디자이너<\/strong>다 — 카드 상품 기획자, 마케팅/홍보 담당자, 영업점·부서 실무자. 이들은 디자인 용어를 쓰지 않고, 자기가 원하는 걸 시각적으로 설명하지 못한다.<\/p><p>그래서 이 화면의 목표는 <strong>&quot;좋은 디자인을 뽑는 것&quot;이 아니라 &quot;디자인 얘기가 말로만 끝나는 걸 막는 것&quot;<\/strong>이다. 설계 판단이 갈릴 때는 항상 이 기준으로 정한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>원칙<\/th><th>화면에서의 의미<\/th><\/tr><\/thead><tbody><tr><td>디자인 용어를 요구하지 않는다<\/td><td>&quot;여백&quot;, &quot;커닝&quot;, &quot;그리드&quot; 같은 말을 입력칸에 쓰지 않는다. &quot;전달할 느낌&quot;처럼 업무 언어로 묻는다<\/td><\/tr><tr><td>비교가 본체다<\/td><td>잘 만든 하나보다, 방향이 다른 셋을 나란히 놓는 것이 이 화면의 값이다<\/td><\/tr><tr><td>고르는 순간이 의사결정이다<\/td><td>선택은 되돌릴 수 있는 UI 조작이 아니라 <strong>기록되는 결정<\/strong>이다. 그렇게 보이게 만든다<\/td><\/tr><tr><td>AI 제안과 사람 결정을 시각적으로 구분한다<\/td><td><a href=\"#03_IA_FUNCTION_SPEC\">03 4절 UX 원칙<\/a> 계승<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"09_UI_SPEC_브랜드시안-h3\">1. 화면 흐름<\/h2><pre class=\"mermaid\">flowchart LR\n  S03[S03 Project Workspace] --&gt;|브랜드 시안 만들기| S08[S08 Brand Concept Brief]\n  S08 --&gt;|생성 요청| P[생성 중]\n  P --&gt;|성공| S09[S09 Concept Compare]\n  P --&gt;|실패| S08E[S08 오류 상태]\n  S08E --&gt;|재시도| P\n  S09 --&gt;|시안 선택| V[Version 확정]\n  V --&gt; S05[S05 Result/Review]\n  S09 --&gt;|다시 생성| S08<\/pre><ul><li>진입점은 S03 Project Workspace다. 새 화면 계층을 만들지 않고 기존 워크스페이스 안에 둔다.<\/li><li>S09에서 <strong>선택하지 않으면 Version이 생기지 않는다.<\/strong> 이것이 이 흐름의 핵심 규칙이다.<\/li><\/ul><hr><h2 id=\"09_UI_SPEC_브랜드시안-h4\">2. S08 — Brand Concept Brief<\/h2><h3 id=\"09_UI_SPEC_브랜드시안-h5\">2-1. 역할<\/h3><p>무엇을 만들지 AI에게 설명하는 화면. 입력칸 하나하나가 결과 품질을 좌우하므로, <strong>비디자이너가 채울 수 있는 질문<\/strong>으로만 구성한다.<\/p><h3 id=\"09_UI_SPEC_브랜드시안-h6\">2-2. 구성 요소<\/h3><div class=\"table-wrap\"><table><thead><tr><th>#<\/th><th>요소<\/th><th>형태<\/th><th>필수<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>산출물 유형<\/td><td>2택 카드형 선택 (카드 실물 / 홍보물)<\/td><td>필수<\/td><td>선택에 따라 2번 프리셋 목록이 바뀐다<\/td><\/tr><tr><td>2<\/td><td>규격<\/td><td>프리셋 선택 (썸네일에 비율 도형 표시)<\/td><td>필수<\/td><td>카드 → <code>CARD_H<\/code>·<code>CARD_V<\/code> / 홍보물 → <code>POSTER_A<\/code>·<code>BANNER_SQ<\/code><\/td><\/tr><tr><td>3<\/td><td>상품·캠페인명<\/td><td>한 줄 입력<\/td><td>필수<\/td><td>예: &quot;NH 청년 우대 체크카드&quot;<\/td><\/tr><tr><td>4<\/td><td>타겟<\/td><td>한 줄 입력<\/td><td>선택<\/td><td>예: &quot;사회초년생 20대 후반&quot;<\/td><\/tr><tr><td>5<\/td><td>전달할 느낌<\/td><td>키워드 칩 입력 (직접 입력 + 추천 칩)<\/td><td>필수<\/td><td><strong>디자인 용어를 묻지 않는 칸.<\/strong> 추천 칩 예: 신뢰감 · 젊은 · 따뜻한 · 프리미엄 · 깔끔한 · 활기찬<\/td><\/tr><tr><td>6<\/td><td>꼭 들어갈 문구<\/td><td>여러 줄 입력<\/td><td>선택<\/td><td>상품명 외 슬로건·필수 고지 문구<\/td><\/tr><tr><td>7<\/td><td>브랜드 자산<\/td><td>다중 선택 목록<\/td><td>필수<\/td><td><code>template_type = BRAND_ASSET<\/code>. 로고·컬러 세트·서체 규칙<\/td><\/tr><tr><td>8<\/td><td>참고자료<\/td><td>다중 선택 목록<\/td><td>선택<\/td><td>프로젝트에 업로드된 파일 (<a href=\"#FR-03_참고자료\">FR-03<\/a>)<\/td><\/tr><tr><td>9<\/td><td>생성 버튼<\/td><td>주 버튼<\/td><td>—<\/td><td>라벨: <strong>&quot;시안 3개 만들기&quot;<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"09_UI_SPEC_브랜드시안-h7\">2-3. 반드시 화면에 있어야 하는 안내<\/h3><p>AI가 이미지를 만들지 못한다는 사실을 <strong>사용자가 결과를 보기 전에<\/strong> 알아야 한다. 이걸 숨기면 &quot;왜 사진이 안 나오죠?&quot;가 반복된다.<\/p><blockquote><p>브랜드 자산 선택 영역 하단 고정 안내<br><strong>&quot;로고·캐릭터 같은 그림 요소는 위에서 고른 자산만 사용됩니다. AI가 새 그림을 그리지는 않습니다.&quot;<\/strong><\/p><\/blockquote><h3 id=\"09_UI_SPEC_브랜드시안-h8\">2-4. 상태<\/h3><div class=\"table-wrap\"><table><thead><tr><th>상태<\/th><th>화면<\/th><\/tr><\/thead><tbody><tr><td>기본<\/td><td>산출물 유형만 선택된 상태. 나머지는 비활성 또는 접힘<\/td><\/tr><tr><td>입력 부족<\/td><td>생성 버튼 비활성 + 미충족 필수 항목 인라인 표시<\/td><\/tr><tr><td>브랜드 자산 없음<\/td><td>목록 자리에 빈 상태: <strong>&quot;등록된 브랜드 자산이 없습니다. 자산 없이 만들면 NH 색·로고가 반영되지 않습니다.&quot;<\/strong> + 그대로 진행 가능<\/td><\/tr><tr><td>생성 중<\/td><td>생성 버튼 비활성 + 진행 표시. Job 상태 <code>REQUESTED → PROCESSING<\/code>을 그대로 노출<\/td><\/tr><tr><td>실패<\/td><td>인라인 오류 + 원인 요약 + <strong>재시도<\/strong> 버튼. 입력값은 유지한다<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"09_UI_SPEC_브랜드시안-h9\">2-5. 오류 문구 규칙<\/h3><p>내부 정보(스택 트레이스·DB·경로)를 노출하지 않는다. HTTP 코드별 사용자 문구:<\/p><div class=\"table-wrap\"><table><thead><tr><th>코드<\/th><th>문구<\/th><\/tr><\/thead><tbody><tr><td>429<\/td><td>&quot;지금 AI 요청이 몰려 있습니다. 잠시 후 다시 시도해 주세요.&quot;<\/td><\/tr><tr><td>502 / 504<\/td><td>&quot;AI 연결에 실패했습니다. 입력하신 내용은 그대로 있습니다. 다시 시도해 주세요.&quot;<\/td><\/tr><tr><td>422<\/td><td>&quot;입력 내용으로는 시안을 만들 수 없습니다. 전달할 느낌을 한 가지 이상 넣어 주세요.&quot;<\/td><\/tr><\/tbody><\/table><\/div><p>근거: ARCHITECTURE.md 9절 · <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a> 7절<\/p><hr><h2 id=\"09_UI_SPEC_브랜드시안-h10\">3. S09 — Concept Compare<\/h2><h3 id=\"09_UI_SPEC_브랜드시안-h11\">3-1. 역할<\/h3><p><strong>이 제품에서 가장 중요한 한 화면.<\/strong> 서로 다른 방향 3개를 나란히 놓고, 팀이 의견을 붙이고, 한 방향을 고른다. 고르는 행위가 곧 의사결정 기록이 된다.<\/p><h3 id=\"09_UI_SPEC_브랜드시안-h12\">3-2. 구성 요소<\/h3><div class=\"table-wrap\"><table><thead><tr><th>#<\/th><th>요소<\/th><th>형태<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>시안 3개<\/td><td>가로 3열 나란히 배치<\/td><td>각 시안은 규격 비율을 유지한 캔버스<\/td><\/tr><tr><td>2<\/td><td>방향 라벨<\/td><td>각 시안 상단<\/td><td><code>variant_label<\/code> (예: &quot;정통·신뢰형&quot;)<\/td><\/tr><tr><td>3<\/td><td>방향 설명<\/td><td>라벨 아래 1~2줄<\/td><td>AI가 왜 이 방향인지 설명. <strong>AI 제안임이 시각적으로 구분되어야 한다<\/strong><\/td><\/tr><tr><td>4<\/td><td>확대 보기<\/td><td>각 시안 액션<\/td><td>단일 시안 전체화면<\/td><\/tr><tr><td>5<\/td><td>의견 달기<\/td><td>각 시안 액션<\/td><td><a href=\"#FR-06_협업의견\">FR-06<\/a> 재사용. 시안별로 의견이 분리된다<\/td><\/tr><tr><td>6<\/td><td>의견 수 배지<\/td><td>각 시안<\/td><td>어느 방향에 논의가 몰렸는지 한눈에<\/td><\/tr><tr><td>7<\/td><td><strong>이 방향으로 결정<\/strong><\/td><td>각 시안의 주 버튼<\/td><td>누르면 Version 생성<\/td><\/tr><tr><td>8<\/td><td>다시 생성<\/td><td>보조 버튼<\/td><td>S08으로 입력값을 안고 복귀<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"09_UI_SPEC_브랜드시안-h13\">3-3. 시안 렌더링 — 보안 필수 사항<\/h3><p>AI 생성 HTML을 화면에 넣는 지점이다. <strong>이 규칙은 협상 대상이 아니다.<\/strong><\/p><ul><li>각 시안은 <strong>샌드박스 iframe<\/strong>으로 격리해 렌더링한다.<\/li><li><code>sandbox<\/code> 속성에 <code>allow-same-origin<\/code>과 <code>allow-scripts<\/code>를 <strong>동시에 부여하지 않는다.<\/strong><\/li><li>부모 페이지에 <code>innerHTML<\/code> / <code>dangerouslySetInnerHTML<\/code>로 직접 주입하지 않는다.<\/li><\/ul><p>근거: SECURITY_CHECKLIST.md 4절 · <a href=\"#FR-05_AI제작\">FR-05<\/a> 2절. FR-13은 이 정책을 새로 만들지 않고 그대로 따른다.<\/p><h3 id=\"09_UI_SPEC_브랜드시안-h14\">3-4. 선택 = 의사결정<\/h3><p>선택 버튼은 일반적인 UI 토글처럼 보이면 안 된다. <strong>기록이 남는 결정<\/strong>임이 드러나야 한다.<\/p><ul><li>누르면 확인 단계를 한 번 둔다: <strong>&quot;이 방향으로 결정하면 Version 1이 만들어지고, 결정 기록이 History에 남습니다.&quot;<\/strong><\/li><li>확인 시: <code>versions<\/code> 1행 생성 (<code>source_type = AI_GENERATION<\/code>, <code>source_job_id<\/code> 연결) → S05 Result/Review로 이동<\/li><li><strong>선택하지 않은 나머지 2안은 Version이 되지 않는다.<\/strong> 후보로 Job 결과에만 남는다.<\/li><li>선택 이유를 선택적으로 입력받는다(한 줄). 입력하면 Version <code>summary<\/code>와 History에 함께 남는다.<\/li><\/ul><h3 id=\"09_UI_SPEC_브랜드시안-h15\">3-5. 상태<\/h3><div class=\"table-wrap\"><table><thead><tr><th>상태<\/th><th>화면<\/th><\/tr><\/thead><tbody><tr><td>기본<\/td><td>3안 나란히, 아직 아무것도 선택되지 않음<\/td><\/tr><tr><td>일부 생성 실패<\/td><td>성공한 시안만 표시 + 실패 자리에 사유와 재시도. <strong>전체를 실패로 처리하지 않는다<\/strong><\/td><\/tr><tr><td>전체 실패<\/td><td>S08 오류 상태로 되돌리고 입력값 유지<\/td><\/tr><tr><td>선택 완료<\/td><td>선택된 시안에 결정 표식. 나머지는 &quot;검토한 후보&quot;로 흐리게 유지 (지우지 않는다)<\/td><\/tr><tr><td>권한 없음<\/td><td>조회는 되고 선택·의견 등록 액션이 숨겨진다 (<a href=\"#FR-01_인증권한\">FR-01<\/a>)<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"09_UI_SPEC_브랜드시안-h16\">3-6. 반응형<\/h3><ul><li>넓은 화면: 3열 나란히 — <strong>기본이자 이 화면의 존재 이유<\/strong><\/li><li>좁은 화면: 가로 스크롤 유지. <strong>세로로 쌓지 않는다.<\/strong> 세로로 쌓으면 비교라는 목적 자체가 사라진다.<\/li><\/ul><hr><h2 id=\"09_UI_SPEC_브랜드시안-h17\">4. 화면 밖으로 남기는 것<\/h2><p>아래는 본 명세에서 정의하지 않는다. 임의로 만들지 말 것.<\/p><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>이유<\/th><\/tr><\/thead><tbody><tr><td>브랜드 자산 <strong>등록·관리<\/strong> 화면<\/td><td><a href=\"#00_INDEX\">00_INDEX.md<\/a>에서 Template 관리 화면이 ❓ 미정의로 남아 있다. S08은 <strong>선택 UI만<\/strong> 정의한다<\/td><\/tr><tr><td>시안 Export 화면<\/td><td>Export 형식(PNG/PDF/HTML)이 미결 (<a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a>)<\/td><\/tr><tr><td>시안 직접 편집 기능<\/td><td>컨셉 시안 범위를 넘는다. 수정은 대화형 재생성으로만 한다. <strong>(2026-09-05 주석)<\/strong> S03 작업공간의 화면 목업에는 요소 단위 직접 편집이 도입됐다(03_IA_FUNCTION_SPEC.md S03). 이 항목은 <strong>번복되지 않았다<\/strong> — 브랜드 시안(S08·S09)에 한정해 그대로 유지한다. 이유: 컨셉 시안은 &quot;세 방향 중 하나를 고르는&quot; 것이 목적이라 개별 수정이 비교를 흐린다. 화면 목업은 반대로 &quot;하나를 함께 다듬는&quot; 것이 목적이다<\/td><\/tr><tr><td>인쇄 규격 입력(mm·CMYK·재단선)<\/td><td>컨셉 시안 범위 밖 (<a href=\"#FR-13_브랜드시안제작\">FR-13<\/a> 1절)<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"00_CHANGELOG","group":"기능명세","title":"변경 이력","lede":"누가 · 언제 · 어떤 기능명세를 · 무엇을 · 왜 고쳤는지","author":"Lucas-one","commit":"71491d0","date":"2026-09-08","path":"개발문서/기능명세/00_CHANGELOG.md","size":"26KB","changed":false,"roles":[],"body":"<h1 id=\"00_CHANGELOG-h0\">기능명세 변경 이력 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정사항<\/a> | <a href=\"#01_PRD\">PRD<\/a><\/p><p><code>개발문서/기능명세/<\/code> 하위 md를 <strong>누가 · 언제 · 어떤 파일을 · 무엇을 · 왜<\/strong> 고쳤는지 한 곳에 모은다.<\/p><\/blockquote><h2 id=\"00_CHANGELOG-h1\">1. 기록 규칙<\/h2><ul><li>기능명세 md를 고치면 <strong>고치는 그 자리에서<\/strong> 2절 표에 행을 추가한다. 커밋할 때가 아니다.<\/li><li><code>날짜<\/code> · <code>작성자<\/code> · <code>커밋<\/code> 칸은 **비워두거나 <code>-<\/code>로 둔다.** pre-commit 훅(<code>scripts/build-fspec-changelog.mjs<\/code>)이 채운다.<\/li><li><code>변경 내용<\/code> · <code>사유 · 근거<\/code> 칸은 <strong>사람 또는 Claude가 채운다.<\/strong> 훅은 이 두 칸을 읽기만 하고 절대 덮어쓰지 않는다.<\/li><li><code>커밋<\/code> 칸은 커밋이 만들어진 뒤에야 확정되므로 <strong>다음 문서 커밋 때 자동으로 채워진다.<\/strong> 그 전까지 <code>-<\/code>로 남는다.<\/li><li>결정이 번복되면 <strong>이전 행을 지우지 않는다.<\/strong> 새 행을 추가하고 사유에 무엇을 번복했는지 적는다. (<a href=\"#00_INDEX\">00_INDEX.md<\/a> 3절 취소선 원칙과 같은 취지)<\/li><li>기능명세 파일이 staged인데 대응 행이 없으면 훅이 행을 자동 생성한다. 이때 <code>변경 내용<\/code>이 <code>—<\/code>로 남으므로 커밋 전에 채우는 편이 좋다.<\/li><li>표는 <code>날짜 내림차순 → 파일명<\/code> 순으로 훅이 자동 정렬한다. 직접 순서를 맞출 필요는 없다.<\/li><\/ul><h3 id=\"00_CHANGELOG-h2\">유형 값<\/h3><div class=\"table-wrap\"><table><thead><tr><th>값<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>신규<\/td><td>파일 추가<\/td><\/tr><tr><td>수정<\/td><td>내용 변경<\/td><\/tr><tr><td>삭제<\/td><td>파일 제거<\/td><\/tr><tr><td>이름변경<\/td><td>파일명·경로 변경<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"00_CHANGELOG-h3\">2. 변경 이력<\/h2><p>&lt;!-- CHANGELOG:BEGIN — 날짜·작성자·커밋 칸은 scripts/build-fspec-changelog.mjs 가 채운다. 이 주석을 지우지 말 것 --&gt;<\/p><div class=\"table-wrap\"><table><thead><tr><th>날짜<\/th><th>작성자<\/th><th>커밋<\/th><th>대상 파일<\/th><th>유형<\/th><th>변경 내용<\/th><th>사유 · 근거<\/th><\/tr><\/thead><tbody><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스 FR-04 행 — 화면 칸에 <code>Template<\/code> 추가, API 칸에 <code>/design-systems<\/code>(프로토타입) 추가<\/td><td>FR-04 3·4절 변경에 따른 매트릭스 동기화 (00_INDEX.md 3절 정본 원칙)<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스에 FR-15 행 추가, 1절 안내 FR-01~14 → FR-01~15, 2절 구현 상태 14→15 및 미검증 5→6<\/td><td>FR-15 신설에 따른 매트릭스 동기화 (00_INDEX.md 3절 정본 원칙)<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>df6f9a5<\/td><td>FR-01_인증권한.md<\/td><td>수정<\/td><td>2절의 권한 모델 ❓미결을 취소선 처리하고 <code>OWNER<\/code>/<code>EDITOR<\/code>/<code>REVIEWER<\/code>/<code>VIEWER<\/code> 4단계와 단계별 허용 범위 표를 확정. SSO 방식은 미결로 남기되 <code>AuthenticationProvider<\/code> 어댑터로 분리했음을 명시. 6절 운영 구현 상태를 미착수 → 진행 중으로 갱신<\/td><td>운영 백엔드(<code>backend/<\/code>) 착수에 앞서 인가를 구현해야 하는데, 권한 모델이 미결이면 모든 엔드포인트의 접근 통제를 쓸 수 없었다. 2단계(Owner/Member)를 택하지 않은 것은 FR-08 반영 결정과 FR-14·15 지적 결정이 &quot;의견은 낼 수 있으나 반영은 결정하지 못하는 검토자&quot;를 전제로 하기 때문이다. SSO와 인가를 분리해 SSO 확정을 기다리지 않고 진행할 수 있게 했다 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">08 결정사항<\/a><\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>a64e2bb<\/td><td>FR-02_프로젝트.md<\/td><td>수정<\/td><td>6절 운영 구현을 미착수 → 백엔드 완료로 갱신<\/td><td>운영 백엔드(<code>backend/<\/code>)를 착수해 해당 FR 의 API 를 구현했다. 실 PostgreSQL 을 띄워 기동·마이그레이션·API 호출까지 확인했으므로 구현 상태를 미착수로 둘 수 없다. 프론트엔드가 없어 &#39;완료&#39;가 아니라 &#39;백엔드 완료&#39;로 표기한다 — 06 백로그의 완료 판단은 화면까지 포함한다<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>a64e2bb<\/td><td>FR-03_참고자료.md<\/td><td>수정<\/td><td>6절 운영 구현을 미착수 → 백엔드 완료로 갱신 (업로드·다운로드·확장자 위장 검사)<\/td><td>운영 백엔드(<code>backend/<\/code>)를 착수해 해당 FR 의 API 를 구현했다. 실 PostgreSQL 을 띄워 기동·마이그레이션·API 호출까지 확인했으므로 구현 상태를 미착수로 둘 수 없다. 프론트엔드가 없어 &#39;완료&#39;가 아니라 &#39;백엔드 완료&#39;로 표기한다 — 06 백로그의 완료 판단은 화면까지 포함한다<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>&quot;참고 템플릿을 고른다&quot;는 진입 규약을 취소선 처리하고 <code>?tpl=&lt;slug&gt;<\/code> 파라미터를 폐기. 대신 시스템의 완성 화면(<code>templates[]<\/code>의 <code>.dc.html<\/code> 본문)을 생성 프롬프트에 자동 주입한다는 항목 추가. 3절 화면 표에서 화면 템플릿 카드·참고 템플릿 칩 제거를 반영<\/td><td>명세에는 &quot;참고 템플릿이 함께 지정된다&quot;고 적혔지만 그 값이 AI로 전달된다는 서술이 FR-04·FR-05 어느 쪽에도 없었고, 실제 코드도 <code>ProjectPicker.tsx<\/code>에서 선택값을 버리고 있었다 — 사용자에게 고르라고 시키고 쓰지 않는 선택이었다. 반면 <code>templates[]<\/code>가 가리키는 완성 화면 HTML은 디스크에 실재하면서도 어느 코드도 열지 않았다. 선택 노동을 없애고 자산을 쓰는 쪽으로 바꿈<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>6절 운영 구현을 미착수 → 백엔드 완료로 갱신. 다만 <code>templates<\/code> 에 실제 자산 데이터가 없다는 한계를 함께 적음<\/td><td>운영 백엔드(<code>backend/<\/code>)를 착수해 해당 FR 의 API 를 구현했다. 실 PostgreSQL 을 띄워 기동·마이그레이션·API 호출까지 확인했으므로 구현 상태를 미착수로 둘 수 없다. 프론트엔드가 없어 &#39;완료&#39;가 아니라 &#39;백엔드 완료&#39;로 표기한다 — 06 백로그의 완료 판단은 화면까지 포함한다. 자산 등록 주체가 미결이라 API 는 있는데 내용물이 비어 있는 상태이며, 이 점을 적지 않으면 &#39;되어 있다&#39;로 오해된다<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>디자인 시스템 id를 <code>naru-bank<\/code> → <code>allone-bank<\/code>로 바꾸고, 2절 표의 성격 칸을 다시 씀 — &quot;NH 자산이 아닌 창작 브랜드 나루뱅크&quot;에서 &quot;올원뱅크에서 <strong>UX 패턴만<\/strong> 가져왔고 색·로고·서체는 대체재&quot;로<\/td><td>id가 실체와 어긋나 있었다. 화면 라벨은 &quot;올원뱅크&quot;인데 id·폴더·문서는 &quot;나루뱅크&quot;라 같은 자산을 두 이름으로 부르고 있었고, 문서만 읽어서는 어느 쪽이 실체인지 알 수 없었다. 자산의 성격 서술도 &quot;창작 브랜드&quot;라 해두면 올원뱅크 UX를 참고했다는 사실이 지워진다 — 무엇이 실제이고 무엇이 대체재인지가 이 표의 존재 이유다. 정본은 <code>design-systems/registry.json<\/code><\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>디자인 시스템 카드가 <strong>선택 스위치가 아니라 진입 링크<\/strong>임을 2절에 명시. 정적 목업은 <code>screen-brief.html?ds=&amp;tpl=<\/code>, Next.js 앱은 프로젝트 선택 단계를 거쳐 <code>/projects/{id}?tab=generate&amp;ds=<\/code>로 들어간다. 카드 표시값(대표 색·토큰 수·컴포넌트 수·템플릿 목록)을 매니페스트에서 뽑는다는 규칙 추가. 3절 관련 화면 표에 화면 만들기 브리프 행 추가, Template 행에 Next.js 라우트 병기<\/td><td>카드를 눌러도 아래 목록이 CSS로 필터링될 뿐 선택값이 페이지 밖으로 나가지 않았고, &quot;이 Template로 시작&quot; 버튼 9개는 전부 무동작이었다. 디자인 시스템을 고르는 행위가 생성으로 이어지지 않으면 FR-04의 &quot;선택 Template이 AI 컨텍스트로 전달&quot;(US-010)이 화면상 성립하지 않는다. 실앱에서 프로젝트 선택 단계를 둔 것은 생성이 프로젝트에 매달린 구조(05 API/DB) 때문이며, 진행 중인 프로 PostgreSQL 을 띄워 기동·마이그레이션·API 호출까지 확인했으므로 구현 상태를 미착수로 둘 수 없다. 프론트엔드가 없어 &#39;완료&#39;가 아니라 &#39;백엔드 완료&#39;로 표기한다 — 06 백로그의 완료 판단은 화면까지 포함한다. 기존 스키마에는 기획안을 담을 자리가 없어 <code>evidence_source=&#39;PROPOSAL&#39;<\/code> 의 대조 원문이 존재하지 않았다. 컬럼을 추가해 근거 대조가 실제로 성립하게 했다<\/td><\/tr><tr><td>2026-09-08<\/td><td>Lucas-one<\/td><td>96221a4<\/td><td>FR-15_UX리스크검토.md<\/td><td>신규<\/td><td>UX 리스크 검토 기능 명세 신설 — 렌즈 6개(UR-01~06)로 전 화면 + 의견 전문을 함께 읽고 사용성 문제를 의견 흐름에 얹는다. 담당자 요청 시에만 실행, 결정 3종(반영/보류/반려)<\/td><td>개별로는 타당한 의견들이 합쳐지면 사용자가 불편해지는 경우(예: 서로 다른 의견에서 나온 팝업 4개)를 짚는 지점이 저장소 어디에도 없었다. 렌즈 정본은 docs/guidelines/USABILITY_REVIEW.md<\/td><\/tr><tr><td>2026-09-06<\/td><td>Lucas-one<\/td><td>21fc3c1<\/td><td>FR-05_AI제작.md<\/td><td>수정<\/td><td>관련 API 표에 Job 취소(<code>/ai/jobs/{jobId}/cancel<\/code>) 추가<\/td><td>03 상태 모델의 <code>CANCELLED<\/code>에 도달할 API가 없던 불일치 해소 — 05 API 정본 변경에 따른 발췌 표 동기화<\/td><\/tr><tr><td>2026-09-06<\/td><td>Lucas-one<\/td><td>21fc3c1<\/td><td>FR-05_AI제작.md<\/td><td>수정<\/td><td>화면 목업의 2단계 생성(화면 흐름 설계 → 화면별 생성)과 요소 단위 재생성을 동작 상세에 추가<\/td><td>화면 목업을 단일 산출물로만 다루던 전제를 확장. 한 응답에 여러 화면을 넣으면 토큰 한도에 걸리고 부분 실패가 감춰진다 — 03 IA S03 재정의와 05 API/DB 3-2절에 대응<\/td><\/tr><tr><td>2026-09-06<\/td><td>Lucas-one<\/td><td>21fc3c1<\/td><td>FR-11_Export.md<\/td><td>수정<\/td><td>Export 결과 파일 다운로드 API(<code>/exports/{exportId}/download<\/code>) 추가, 기존 조회는 상태·메타 조회로 명확화<\/td><td>다운로드 경로가 API 정본에 없던 누락 해소 — 05 API 정본 변경에 따른 발췌 표 동기화<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>2절 구현 상태 — 프로토타입 검증 부분 7→8, 미검증 6→5 (FR-13 이동)<\/td><td>FR-13의 화면 흐름을 정적 프로토타입(mockup-site)에서 확인했으므로 상태 동기화<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스 FR-04 행 화면 칸에 S10 추가 및 ❓ 범위 축소, 2절 프로토타입 검증 부분 6 → 7 (FR-04 편입)<\/td><td>FR-04 3·6절 변경에 따른 매트릭스 동기화 (00_INDEX.md 3절 정본 원칙)<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스에 FR-13 행 추가, FR-04 행에 US-012·S08 반영, 2절 구현 상태 12→13 갱신<\/td><td>FR-13 신설에 따른 매트릭스 동기화 (00_INDEX.md 3절 정본 원칙)<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스에 FR-14 행 추가, 1절 안내 FR-01~13 → FR-01~14, 2절 구현 상태 13→14 및 프로토타입 검증에 <code>완료 1 (FR-14)<\/code> 신설<\/td><td>FR-14 신설에 따른 매트릭스 동기화 (00_INDEX.md 3절 정본 원칙). FR-14는 <code>mockup/<\/code>에 전 구간을 구현해 유일하게 프로토타입 검증 &#39;완료&#39;다<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>3절 관련 화면에 <code>S10 Design Asset Library<\/code> 추가, &quot;IA D/D1/D2 대응 화면 미정의 ❓&quot;를 취소선 처리하고 미결 범위를 Template 버전·소유 구분으로 좁힘. 6절 프로토타입 검증을 미검증 → 부분(자산 열람만)으로 갱신<\/td><td>보유 자산을 종류별로 펼쳐 보이는 갤러리 화면을 <code>mockup/app/proto/assets/<\/code>에 구현하면서 IA의 D 노드에 대응하는 화면이 처음 생겼다. 제품 차별점(&quot;외부 AI는 백지에서, 뚝딱은 NH 자산에서&quot;)을 화면으로 증명하기 위함 — 기획안 86행 Asset Library 항목이 FR/화면으로 내려온 첫 사례<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>FR-04_템플릿.md<\/td><td>수정<\/td><td>Template에 <code>template_type<\/code>(DOCUMENT / BRAND_ASSET) 유형 구분 추가, S08 화면·US-012 매핑 추가<\/td><td>AI가 로고·캐릭터 등 그림 요소를 생성하지 못하므로 사전 등록된 브랜드 자산이 유일한 공급 경로다. FR-13이 이 자산만 사용하도록 Template에 유형 개념을 부여<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>FR-05_AI제작.md<\/td><td>수정<\/td><td><code>ai_jobs.job_type<\/code>(DOC_DRAFT / SCREEN_MOCKUP / BRAND_CONCEPT) 구분 한 줄 추가 및 FR-13 링크<\/td><td>브랜드 시안은 새 파이프라인을 만들지 않고 기존 AI Job 구조를 재사용한다는 결정을 명시 (08_DECISIONS 1절)<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>FR-13_브랜드시안제작.md<\/td><td>수정<\/td><td>6절 구현 상태 — 프로토타입 검증 <code>미검증<\/code> → <code>🔶 부분<\/code>, 근거로 mockup-site 3개 페이지 명시<\/td><td>S08·S09 화면 흐름과 &#39;선택 시점에만 Version 생성&#39; 규칙을 정적 프로토타입으로 검증. 3안 생성·자산 주입·비동기 Job은 여전히 미검증이라 부분으로 표기<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>3fd2dee<\/td><td>FR-13_브랜드시안제작.md<\/td><td>신규<\/td><td>FR-13 브랜드 시안 제작 신규 명세 — 카드 실물·홍보물 컨셉 시안, 규격 프리셋 4종, 3안 동시 생성, 선택 시점 Version 생성, 선결 과제 4건<\/td><td>제품 산출물이 보고서·PPT·웹/앱 시안 3종으로 한정돼 있어 카드·홍보물 시안을 다룰 곳이 없었다. PRD 4절에 산출물 유형을 추가하고 상세 명세를 신설 — 비디자이너의 디자인 방향 합의를 지원하기 위함<\/td><\/tr><tr><td>2026-09-05<\/td><td>Lucas-one<\/td><td>b192827<\/td><td>FR-14_책임성검토.md<\/td><td>신규<\/td><td>FR-14 책임성 검토 신규 명세 — 표현·차별 / 금융소비자보호 / 다크패턴 / 접근성 4축 검토, 생성 가드레일(1차)과 사후 검토(2차) 2단 구성, 반영·보류·반려에 더해 <code>준법 검토 요청<\/code> 결정 추가<\/td><td>AI가 만든 화면을 은행 산출물로 쓰는데 윤리·소비자보호·접근성 축의 문서가 저장소 전체에 0건이었다. PRD 5절 &quot;준법 판단의 완전 자동화&quot; 비범위를 넘지 않도록 판정이 아닌 자문으로 설계했고, 판단이 필요한 건은 사람에게 넘기는 경로를 만들었다 (08_DECISIONS Q2 · 기획안 189행 선례)<\/td><\/tr><tr><td>2026-08-30<\/td><td>Lucas-one<\/td><td>c3b3cae<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>추적 매트릭스 FR-09·FR-10 행의 화면 칸에 <code>S03 진입<\/code> 추가<\/td><td>FR-09·FR-10 상세 명세 3절은 S03(Version/History 진입)을 이미 포함하는데 매트릭스에는 빠져 있었다. FR-11 행의 <code>S03 진입<\/code> 표기와 같은 규칙으로 맞춘다 — 문서 허브 기능 대시보드 빌드의 정본 대조에서 발견<\/td><\/tr><tr><td>2026-08-30<\/td><td>Lucas-one<\/td><td>ef9fc66<\/td><td>00_INDEX.md<\/td><td>수정<\/td><td>3절 표기 규칙에 변경 이력 파일 안내 추가<\/td><td>00_CHANGELOG.md 도입 — 취소선(결정 번복)과 CHANGELOG(변경 이력) 역할 구분<\/td><\/tr><\/tbody><\/table><\/div><p>&lt;!-- CHANGELOG:END --&gt;<\/p>"},{"id":"00_INDEX","group":"기능명세","title":"기능명세 인덱스","lede":"FR ↔ US ↔ 화면 ↔ API ↔ 백로그 추적 매트릭스","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/00_INDEX.md","size":"6KB","changed":false,"roles":["dev"],"body":"<h1 id=\"00_INDEX-h0\">기능명세 인덱스 &amp; 추적 매트릭스 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#02_USER_STORIES_AC\">User Stories<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a> | <a href=\"#06_DEVELOPMENT_BACKLOG\">백로그<\/a><\/p><p>PRD의 FR-01~15 각각을 기능별 상세 명세 파일로 분리하고, FR ↔ US ↔ 화면 ↔ API ↔ 백로그의 추적 관계를 이 문서에서 관리한다.<\/p><\/blockquote><h2 id=\"00_INDEX-h1\">1. 추적 매트릭스<\/h2><div class=\"table-wrap\"><table><thead><tr><th>FR<\/th><th>상세 명세<\/th><th>US<\/th><th>화면<\/th><th>주요 API<\/th><th>P단계<\/th><th>티켓<\/th><\/tr><\/thead><tbody><tr><td>FR-01 인증/권한<\/td><td><a href=\"#FR-01_인증권한\">FR-01<\/a><\/td><td>US-001<\/td><td>공통 (❓ SSO·Admin 화면 미정의)<\/td><td><code>GET /me<\/code><\/td><td>P0·P1<\/td><td>BE-001·003<\/td><\/tr><tr><td>FR-02 프로젝트<\/td><td><a href=\"#FR-02_프로젝트\">FR-02<\/a><\/td><td>US-002<\/td><td>S01·S02·S03<\/td><td><code>/projects<\/code> CRUD·members<\/td><td>P1<\/td><td>FE-002·003, BE-002·003<\/td><\/tr><tr><td>FR-03 참고자료<\/td><td><a href=\"#FR-03_참고자료\">FR-03<\/a><\/td><td>US-011<\/td><td>S03·S04<\/td><td><code>/projects/{id}/files<\/code><\/td><td>P1 (버전 연결은 P4)<\/td><td>FE-005, BE-004<\/td><\/tr><tr><td>FR-04 Template<\/td><td><a href=\"#FR-04_템플릿\">FR-04<\/a><\/td><td>US-010·012<\/td><td>S03·S04·S08·S10·Template (❓ D1/D2 관리 화면 미정의)<\/td><td><code>/templates<\/code> · <code>/design-systems<\/code>(프로토타입)<\/td><td>P1<\/td><td>BE-005<\/td><\/tr><tr><td>FR-05 AI 제작<\/td><td><a href=\"#FR-05_AI제작\">FR-05<\/a><\/td><td>US-020·021<\/td><td>S03·S04<\/td><td><code>/ai/jobs<\/code> 3종<\/td><td>P2<\/td><td>FE-004, BE-006·007<\/td><\/tr><tr><td>FR-06 협업<\/td><td><a href=\"#FR-06_협업의견\">FR-06<\/a><\/td><td>US-030<\/td><td>S03·S05<\/td><td><code>/comments<\/code><\/td><td>P3<\/td><td>FE-006, BE-008<\/td><\/tr><tr><td>FR-07 AI 의견 취합<\/td><td><a href=\"#FR-07_AI의견취합\">FR-07<\/a><\/td><td>US-031<\/td><td>S05<\/td><td><code>/reviews/summarize<\/code>·<code>/reviews<\/code><\/td><td>P3<\/td><td>FE-007, BE-008<\/td><\/tr><tr><td>FR-08 반영 결정<\/td><td><a href=\"#FR-08_반영결정\">FR-08<\/a><\/td><td>US-032<\/td><td>S05<\/td><td><code>/reviews/{id}/decisions<\/code><\/td><td>P3<\/td><td>FE-007, BE-008<\/td><\/tr><tr><td>FR-09 Version<\/td><td><a href=\"#FR-09_버전관리\">FR-09<\/a><\/td><td>US-040·041<\/td><td>S06·S03 진입<\/td><td><code>/versions<\/code> 3종<\/td><td>P4<\/td><td>FE-008, BE-009<\/td><\/tr><tr><td>FR-10 History<\/td><td><a href=\"#FR-10_히스토리\">FR-10<\/a><\/td><td>US-042<\/td><td>S07·S03 진입<\/td><td><code>/history<\/code><\/td><td>P4<\/td><td>FE-009, BE-010<\/td><\/tr><tr><td>FR-11 Export<\/td><td><a href=\"#FR-11_Export\">FR-11<\/a><\/td><td>US-050<\/td><td>S03 진입 (❓ 전용 화면 미정의)<\/td><td><code>/exports<\/code> 2종<\/td><td>P4<\/td><td>BE-011<\/td><\/tr><tr><td>FR-12 감사 추적<\/td><td><a href=\"#FR-12_감사추적\">FR-12<\/a><\/td><td>US-060<\/td><td>없음 (❓ Admin 미정의)<\/td><td>없음 (❓ <code>audit_logs<\/code>만)<\/td><td>P0·P4<\/td><td>BE-010<\/td><\/tr><tr><td>FR-13 브랜드 시안 제작<\/td><td><a href=\"#FR-13_브랜드시안제작\">FR-13<\/a><\/td><td>US-012·022·023<\/td><td>S08·S09·S03 진입<\/td><td><code>/ai/jobs<\/code> 3종 재사용 · <code>/templates<\/code><\/td><td>P2<\/td><td>❓ 티켓 미발행<\/td><\/tr><tr><td>FR-14 책임성 검토<\/td><td><a href=\"#FR-14_책임성검토\">FR-14<\/a><\/td><td>US-033<\/td><td>S03·S05<\/td><td><code>/responsibility-review<\/code> 2종 · <code>/responsibility-findings/{id}<\/code><\/td><td>P3<\/td><td>❓ 티켓 미발행<\/td><\/tr><tr><td>FR-15 UX 리스크 검토<\/td><td><a href=\"#FR-15_UX리스크검토\">FR-15<\/a><\/td><td>US-034<\/td><td>S03·S05<\/td><td><code>/usability-review<\/code> 2종 · <code>/usability-findings/{id}<\/code><\/td><td>P3<\/td><td>❓ 티켓 미발행<\/td><\/tr><\/tbody><\/table><\/div><p>❓는 미정의/미결 사항이다. 임의로 확정하지 말고 <a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a>에 따라 협의한다.<\/p><h2 id=\"00_INDEX-h2\">2. 구현 상태 요약<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>현황<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>15 / 15 — 전 FR이 PRD·US·API 초안에 반영됨<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>완료 1 (FR-14) / 부분 8 (FR-02·03·04·05·06·09·11·13) / 미검증 6 (FR-01·07·08·10·12·15)<\/td><\/tr><tr><td>운영 구현<\/td><td><strong>백엔드 14 / 15<\/strong> (2026-09-08 <code>backend/<\/code> 착수) — 완료 11, 부분 3 (FR-01·11·12).&lt;br&gt;<strong>프론트엔드(Vue 3)는 0 / 15.<\/strong> 화면이 없으므로 어느 FR도 &#39;완료&#39;가 아니다<\/td><\/tr><\/tbody><\/table><\/div><p><strong>&quot;백엔드 완료&quot;가 무슨 뜻인가<\/strong>: 해당 FR의 API가 <code>backend/<\/code>에 구현되어 있고, 실제 PostgreSQL을 띄워<br>기동·마이그레이션·API 호출까지 확인했다는 뜻이다. <a href=\"#06_DEVELOPMENT_BACKLOG\">06 백로그<\/a> 4절의<br>완료 판단(화면·로그·권한·실패 시나리오·테스트)에는 못 미친다.<\/p><p><strong>남은 것 세 가지<\/strong> — 어느 것도 백엔드 코드로 풀리지 않는다.<\/p><ul><li><strong>FR-01<\/strong>: 인가는 구현했으나 <strong>인증이 없다.<\/strong> SSO 방식이 확정되어야 한다. 지금은 개발용 헤더 스텁이다.<\/li><li><strong>FR-05·13·14·15<\/strong>: 코드는 돌지만 <strong>LLM endpoint가 없어 대역 응답<\/strong>이다. 결과 품질은 확인되지 않았다.<\/li><li><strong>FR-04·13<\/strong>: API는 있으나 <strong>실제 NH 자산 데이터가 비어 있다.<\/strong> 반입 주체가 미결이다.<\/li><\/ul><p>상세 근거는 각 FR 파일의 &quot;6. 구현 상태&quot; 절 참고.<\/p><h2 id=\"00_INDEX-h3\">3. 표기 규칙<\/h2><ul><li><strong>구현 상태 3단계<\/strong><ul><li><strong>설계<\/strong>: PRD·US·화면·API 문서에 반영된 상태<\/li><li><strong>프로토타입 검증<\/strong>: <code>mockup/<\/code> 또는 정적 프로토타입(<a href=\"#MockupGen_기능명세서\">MockupGen 기능명세서<\/a>)에서 동작이 확인된 상태. &quot;부분&quot;은 일부 동작만 확인됨을 뜻한다. 프로토타입 코드는 운영으로 이식하지 않는다.<\/li><li><strong>운영 구현<\/strong>: 목표 운영 스택(Vue3 + Spring Boot)에 구현·테스트 완료된 상태<\/li><\/ul><\/li><li><strong>ID 네임스페이스<\/strong>: <code>FR-xx<\/code>(2단)는 PRD 제품 요구사항, <code>PFR-xx-yy<\/code>(3단)는 MockupGen 프로토타입 역공학 명세, <code>US-xxx<\/code>는 유저스토리, <code>S0x<\/code>는 화면, <code>P0~P5<\/code>는 백로그 단계다.<\/li><li><strong>P번호 주의<\/strong>: 본 문서의 P단계는 <a href=\"#06_DEVELOPMENT_BACKLOG\">06_DEVELOPMENT_BACKLOG.md<\/a> 기준이다. 기획안 5절의 P번호 체계(P2=NH 업무자산, P3=AI 제작)와 다르다.<\/li><li><strong>정본 원칙<\/strong>: FR 파일의 화면·API·US 절은 발췌 표이고, 정본은 각각 03·05·02 문서다. 정본이 바뀌면 해당 FR 파일과 이 매트릭스를 함께 갱신한다.<\/li><li><strong>링크 규칙<\/strong>: 문서 링크는 저장소 루트 기준 경로로 쓴다(예: <code>개발문서/01_PRD.md<\/code>). <code>../<\/code> 상대경로는 문서 허브에서 링크가 살지 않는다.<\/li><li><strong>변경 이력<\/strong>: 결정이 바뀌면 이전 내용을 지우지 말고 <del>취소선<\/del>으로 남기고 새 내용을 추가한다.<\/li><li><strong>이력 파일<\/strong>: 파일 단위 변경 이력은 <a href=\"#00_CHANGELOG\">00_CHANGELOG.md<\/a>에 모은다. 문서 안 취소선은 &quot;결정 번복&quot;을, CHANGELOG는 &quot;누가 · 언제 · 무엇을 · 왜 고쳤는가&quot;를 담당한다.<\/li><\/ul>"},{"id":"FR-01_인증권한","group":"기능명세","title":"FR-01 · 인증/권한","lede":"사내 SSO · 프로젝트 단위 접근권한","author":"Lucas-one","commit":"df6f9a5","date":"2026-09-08","path":"개발문서/기능명세/FR-01_인증권한.md","size":"4KB","changed":false,"roles":[],"feature":"FR-01","body":"<h1 id=\"FR-01_인증권한-h0\">FR-01 인증/권한 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-01_인증권한-h1\">1. 개요<\/h2><p>사내 SSO를 통해 사용자를 인증하고 프로젝트 단위 접근권한을 통제한다. (PRD 9절)<br>자체 계정·비밀번호를 만들지 않고 사내 인증 체계에 위임하며, 인가는 프로젝트 멤버십을 기준으로 한다.<\/p><h2 id=\"FR-01_인증권한-h2\">2. 동작 상세<\/h2><ul><li>SSO 인증 성공 시 서비스 접속 시점에 사용자 계정과 기본 권한이 생성/조회된다.<\/li><li>인증 실패·세션 만료 시 모든 서비스 API가 보호된다(401). Backend가 매 요청마다 세션을 검증한다.<\/li><li>리소스 접근 시 프로젝트 멤버십을 검증한다(403). UUID PK는 보조 수단일 뿐 권한 검증을 대체하지 않는다(IDOR).<\/li><li>LLM Token·credential은 브라우저에 절대 노출하지 않는다. AI 호출은 서버 측 AI Orchestrator만 수행한다.<\/li><li>계정 잠금·비밀번호 정책은 사내 SSO 정책에 위임한다.<\/li><li><del>❓ <strong>미결<\/strong>: SSO 연계 방식, 프로젝트 권한 모델(Owner/Editor/Reviewer/Viewer 후보 — 기획안 7-3절). 확정 전 임의 구현 금지<\/del><\/li><li><strong>권한 모델 확정 (2026-09-08)<\/strong>: <code>OWNER<\/code> / <code>EDITOR<\/code> / <code>REVIEWER<\/code> / <code>VIEWER<\/code> 4단계. 상위가 하위를 포함한다.<\/li><\/ul><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>허용 범위<\/th><\/tr><\/thead><tbody><tr><td><code>VIEWER<\/code><\/td><td>프로젝트·결과물 읽기, 파일·Export 다운로드<\/td><\/tr><tr><td><code>REVIEWER<\/code><\/td><td>+ 의견 등록·답글, 책임성/UX 검토 요청<\/td><\/tr><tr><td><code>EDITOR<\/code><\/td><td>+ AI 생성·요소 편집, 반영 결정(FR-08·14·15), Export 실행<\/td><\/tr><tr><td><code>OWNER<\/code><\/td><td>+ 프로젝트 설정 변경, 멤버 추가·역할 변경·제거, 프로젝트 삭제<\/td><\/tr><\/tbody><\/table><\/div><ul><li>권한 판정은 <strong>Backend 한 곳<\/strong>에서만 한다. 프론트의 버튼 노출 제어는 편의이며 통제가 아니다.<\/li><li>❓ <strong>미결 (계속)<\/strong>: SSO 연계 방식. Backend는 <code>AuthenticationProvider<\/code> 어댑터로 분리해 두었고 확정 시 구현체만 추가한다 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a><\/li><\/ul><h2 id=\"FR-01_인증권한-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>(전 화면 공통)<\/td><td>모든 화면 진입 전 SSO 세션을 전제로 한다<\/td><\/tr><tr><td>❓ 미정의<\/td><td>SSO 리다이렉트/세션 만료 화면, IA의 Admin(F) 화면은 S0x로 정의되지 않음<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-01_인증권한-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/me<\/code><\/td><td>로그인 사용자 정보 조회<\/td><\/tr><tr><td>(공통)<\/td><td>모든 <code>/api/v1/*<\/code><\/td><td>요청마다 SSO 세션 검증 + 멤버십 확인<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-01_인증권한-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-001<\/td><td>SSO 로그인<\/td><td>인증 성공 시 계정/권한 생성·조회, 실패 시 API 보호, LLM Token 브라우저 미노출<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-01_인증권한-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-01 · US-001 · API <code>GET /me<\/code> 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>— 미검증<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-02는 인증 없는 사용자 전환 UI로, SSO 인증 검증이 아님<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 진행 중<\/td><td><code>backend/<\/code> 착수 (2026-09-08). 인가(<code>ProjectRole<\/code>·<code>@RequireProjectRole<\/code>)와 <code>GET /api/v1/me<\/code>는 구현. 인증은 <code>AuthenticationProvider<\/code> 어댑터 + dev 스텁이며 SSO 구현체는 방식 확정 후 — 티켓 BE-001, BE-003 (<a href=\"#06_DEVELOPMENT_BACKLOG\">백로그<\/a>)<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-02_프로젝트","group":"기능명세","title":"FR-02 · 프로젝트","lede":"프로젝트 · 멤버 · 상태 관리","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-02_프로젝트.md","size":"3KB","changed":false,"roles":[],"feature":"FR-02","body":"<h1 id=\"FR-02_프로젝트-h0\">FR-02 프로젝트 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-02_프로젝트-h1\">1. 개요<\/h2><p>프로젝트명, 설명, 상태, 소유자, 멤버, 생성일, 최근 활동을 관리한다. (PRD 9절)<br>Canvas가 아니라 Project가 시작점이다 — 사람·자료·결과물·검토·Version·History를 한 단위로 묶는다(기획안 2-2절).<\/p><h2 id=\"FR-02_프로젝트-h2\">2. 동작 상세<\/h2><ul><li>프로젝트명/설명/소유자를 입력해 생성한다. 생성자는 소유자가 된다.<\/li><li>멤버를 초대하고 멤버별 권한을 구분한다. (권한 모델 ❓ 미결 — <a href=\"#FR-01_인증권한\">FR-01<\/a> 참조)<\/li><li>프로젝트 상태 전이: <code>DRAFT → ACTIVE → REVIEW → COMPLETED → ARCHIVED<\/code> (03 상태 모델)<\/li><li>프로젝트의 모든 주요 변경(생성·수정·멤버 변경)은 History에 남는다 → <a href=\"#FR-10_히스토리\">FR-10<\/a><\/li><li>파일/의견/Version은 프로젝트 단위로 묶여 검색 가능해야 한다(03 UX 원칙).<\/li><\/ul><h2 id=\"FR-02_프로젝트-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S01 Dashboard<\/td><td>최근 프로젝트, 나의 작업, 검토 대기, 최근 활동<\/td><\/tr><tr><td>S02 Project List<\/td><td>프로젝트명·상태·소유자·마지막 활동·멤버 수·미처리 검토 건수<\/td><\/tr><tr><td>S03 Project Workspace<\/td><td>좌측 멤버 관리 포함 작업 공간<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-02_프로젝트-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/projects<\/code><\/td><td>목록<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/projects<\/code><\/td><td>생성<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}<\/code><\/td><td>상세<\/td><\/tr><tr><td>PATCH<\/td><td><code>/api/v1/projects/{projectId}<\/code><\/td><td>수정<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/members<\/code><\/td><td>멤버 추가<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-02_프로젝트-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-002<\/td><td>프로젝트 생성<\/td><td>프로젝트명/설명/소유자 입력 생성, 멤버별 권한 구분, 주요 변경 History 기록<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-02_프로젝트-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-02 · US-002 · <code>/projects<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-01(프로젝트 식별·초기 렌더), PFR-07(담당자 관리). 상태 모델·권한은 미검증<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>/projects<\/code> CRUD·멤버·권한(OWNER/EDITOR/REVIEWER/VIEWER)·대시보드 집계까지 backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-002·003<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-03_참고자료","group":"기능명세","title":"FR-03 · 참고자료","lede":"파일 업로드 · AI 참조 대상 선택","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-03_참고자료.md","size":"3KB","changed":false,"roles":[],"feature":"FR-03","body":"<h1 id=\"FR-03_참고자료-h0\">FR-03 참고자료 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-03_참고자료-h1\">1. 개요<\/h2><p>파일 업로드, 목록, 삭제, 버전 연결, AI 참조 대상 선택을 지원한다. (PRD 9절)<br>내부 자료와 과거 산출물을 프로젝트 자산으로 축적해 AI 생성 맥락으로 재사용한다(기획안 1-1절).<\/p><h2 id=\"FR-03_참고자료-h2\">2. 동작 상세<\/h2><ul><li>파일은 프로젝트와 연결되어 업로드·조회·삭제된다. 바이너리는 File Storage에, DB에는 메타데이터(경로·크기·mime)만 저장한다.<\/li><li>허용된 파일 형식과 크기 정책을 적용한다. 확장자·MIME·용량 검증과 확장자 위장 검사를 수행한다. (❓ 허용 형식·용량 상한 값 미결)<\/li><li>AI 요청 시 사용자가 참조 여부를 <strong>명시적으로 선택<\/strong>한다. 선택하지 않은 자료는 AI에 전달되지 않는다(보안 결정).<\/li><li>파일 조회·삭제 시 프로젝트 멤버십을 검증한다(IDOR — 보안 규칙 <a href=\"#SECURITY\">SECURITY.md<\/a>).<\/li><li>산출물과의 버전 연결은 <code>version_files<\/code>로 관리한다 → <a href=\"#FR-09_버전관리\">FR-09<\/a> (구현 시기는 P4)<\/li><\/ul><h2 id=\"FR-03_참고자료-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>좌측 파일 목록·업로드<\/td><\/tr><tr><td>S04 AI Chat<\/td><td>참고자료 선택(참조 대상 지정)<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-03_참고자료-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/files<\/code><\/td><td>업로드<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}/files<\/code><\/td><td>목록<\/td><\/tr><tr><td>DELETE<\/td><td><code>/api/v1/projects/{projectId}/files/{fileId}<\/code><\/td><td>삭제<\/td><\/tr><\/tbody><\/table><\/div><p>오류: 413(용량 초과). 정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-03_참고자료-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-011<\/td><td>참고자료 등록<\/td><td>허용 형식·크기 정책 적용, 파일-프로젝트 연결, AI 참조 여부 사용자 선택<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-03_참고자료-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-03 · US-011 · <code>/files<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-03(이미지 업로드·개수/용량 제한·삭제·AI 반영). 이미지 한정이며 프로토타입 정책값(3장·5MB)은 운영 정책이 아님<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>업로드·목록·스트리밍 다운로드·삭제, 확장자 위장 검사(매직바이트), 저장소 인터페이스. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-004<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-04_템플릿","group":"기능명세","title":"FR-04 · Template","lede":"NH 공통 · 개인/부서 Template","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-04_템플릿.md","size":"9KB","changed":false,"roles":[],"feature":"FR-04","body":"<h1 id=\"FR-04_템플릿-h0\">FR-04 Template v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-04_템플릿-h1\">1. 개요<\/h2><p>NH 공통 Template과 개인/부서 Template을 구분하고 사용 이력과 버전을 관리한다. (PRD 9절)<br>새 디자인 시스템을 만들지 않고, 기존 NH 자산을 &quot;업무 자산 계층&quot;으로 제공해 NH다운 결과물을 만든다(기획안 1-2절).<\/p><h2 id=\"FR-04_템플릿-h2\">2. 동작 상세<\/h2><ul><li>Template은 NH 공통 / 개인·부서 소유로 구분된다. IA 기준 진입: Template(D) → NH Template(D1) / My Template(D2).<\/li><li>Template은 용도에 따라 <strong>두 유형<\/strong>으로 나뉜다(<code>template_type<\/code>).<ul><li><code>DOCUMENT<\/code> — 보고서·PPT 등 문서 양식 (기존 개념)<\/li><li><code>BRAND_ASSET<\/code> — <strong>NH 브랜드 자산.<\/strong> 로고 SVG, 캐릭터, 컬러 토큰, 서체 규칙, 규격 프리셋, 카드 필수 표기 요소 규칙. <a href=\"#FR-13_브랜드시안제작\">FR-13<\/a>의 시안 생성이 이 자산만 사용한다<\/li><\/ul><\/li><li><code>BRAND_ASSET<\/code>은 AI가 만들지 못하는 그림 요소(로고·캐릭터)를 공급하는 유일한 경로다. AI는 등록된 자산을 <strong>배치만<\/strong> 하고 새로 그리지 않는다.<\/li><li>~~저장소의 <code>design-system/<\/code>(토큰·컴포넌트 자산)은 실제 NH 자산 반입 전까지 <code>BRAND_ASSET<\/code>의 원형이자 검증용 대체재로 쓸 수 있다.~~<\/li><\/ul><p>→ <strong>디자인 시스템을 복수로 보유하고 생성 시점에 고른다.<\/strong> 저장소의 <code>design-systems/<\/code> 아래 폴더 하나가 디자인 시스템 하나이며, 선택지 정본은 <code>design-systems/registry.json<\/code>이다. 이것이 <code>BRAND_ASSET<\/code>의 현재 실현체다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>id<\/th><th>라벨<\/th><th>표면<\/th><th>성격<\/th><\/tr><\/thead><tbody><tr><td><code>allone-bank<\/code><\/td><td>올원뱅크 (모바일 앱)<\/td><td>모바일 360×780<\/td><td><strong>UX 패턴만 올원뱅크에서 가져왔다.<\/strong> 색(teal 팔레트)·로고·서체는 실제 CI가 아닌 대체재다. 실제 NH 자산 반입 전까지 검증용이다<\/td><\/tr><tr><td><code>nh-ibz<\/code><\/td><td>NH 기업인터넷뱅킹 (웹)<\/td><td>웹 1200px<\/td><td><strong>컬러 토큰은 실제 NH 값<\/strong>(NH Blue <code>#0094D9<\/code> · NH Green <code>#00A04E<\/code> · navy <code>#122F50<\/code>). 로고·서체·아이콘은 여전히 대체재다<\/td><\/tr><\/tbody><\/table><\/div><p>자산의 실체와 대체재 목록은 design-systems/README.md.<\/p><ul><li>선택한 디자인 시스템은 <strong>화면 계획(1단계)과 화면 생성(2단계) 양쪽의 AI 컨텍스트로 전달된다.<\/strong> 표면(mobile/web)이 화면 흐름을, 토큰이 색·간격·반경을 결정한다 → <a href=\"#FR-05_AI제작\">FR-05<\/a><\/li><li><strong>(2026-09-08) 시스템의 완성 화면이 생성 프롬프트의 예시로 자동 전달된다.<\/strong> <code>_ds_manifest.json<\/code>의 <code>templates[]<\/code>가 가리키는 <code>.dc.html<\/code> 본문을 읽어 화면 생성(2단계) 시스템 프롬프트에 넣는다 (<code>buildExampleScreensSection<\/code>). 어느 예시가 지금 만들 화면에 가까운지는 모델이 판단한다.<ul><li>저장 전 정제(<code>sanitizeFragment<\/code>)를 거치고 <code>var(--token)<\/code>을 실제 값으로 치환해 넣는다. 생성 규칙이 CSS 변수를 금지하므로 예시도 같은 형태여야 한다.<\/li><li>화면 계획(1단계)과 요소 단위 AI 편집에는 넣지 않는다. 각각 화면 목록만 만들고 요소 하나만 고치므로 예시가 불필요하다.<\/li><li>자산을 못 읽으면 예시 절만 빠지고 화면 생성은 그대로 동작한다.<\/li><\/ul><\/li><li>선택값은 <strong>버전마다 기록된다<\/strong>(<code>mockup_versions.design_system_id<\/code>). 같은 프로젝트에서 v1은 모바일, v2는 웹으로 만들 수 있고 어느 시스템으로 만든 버전인지 화면에 표시된다.<\/li><li>요소 단위 AI 편집도 그 버전을 만든 디자인 시스템을 그대로 쓴다. 편집 결과만 다른 팔레트로 나오지 않게 하기 위함이다.<\/li><li>디자인 시스템을 추가하려면 <code>design-systems/&lt;id&gt;/<\/code>에 폴더를 넣고 <code>registry.json<\/code>에 한 줄 더한다. 읽는 것은 <code>&lt;id&gt;/_ds_manifest.json<\/code>의 <code>tokens[]<\/code>·<code>templates[]<\/code> 두 개뿐이라 코드를 고칠 일이 없다. <code>templates[]<\/code>는 이름만이 아니라 <code>entryPath<\/code>가 가리키는 HTML 본문까지 읽는다.<\/li><li><strong>디자인 시스템은 고르는 순간 진입이다.<\/strong> Template 화면의 시스템 카드는 선택 스위치가 아니라 링크이며, 누르면 그 시스템이 <strong>선택된 채로 화면 만들기<\/strong>에 들어간다. <del>화면 템플릿 카드의 &quot;이 Template로 시작&quot;도 같은 자리로 가되 참고 템플릿이 함께 지정된다.<\/del> → <strong>(2026-09-08) 참고 템플릿을 고르는 단계를 없앱다.<\/strong> 고르는 것은 디자인 시스템 하나뿐이고, 그 시스템의 <strong>완성 화면을 전부<\/strong> 생성 프롬프트에 예시로 넣는다(아래 항목). 화면 템플릿 카드는 제거됐다.<ul><li>정적 목업은 <code>screen-brief.html?ds=&lt;id&gt;<\/code>로 넘긴다. ~~<code>&amp;tpl=&lt;slug&gt;<\/code>~~ — 이 파라미터는 폐기했다.<\/li><li>Next.js 앱은 생성이 프로젝트 안에서만 가능하므로(<code>mockup_versions<\/code>가 프로젝트에 매달린다) <strong>프로젝트를 고르는 단계<\/strong>를 한 번 거쳐 <code>/projects/{id}?tab=generate&amp;ds=&lt;id&gt;<\/code>로 들어간다. 진행 중인 프로젝트에 이어 붙이는 경로를 겸한다.<\/li><\/ul><\/li><li>카드에 표시되는 대표 색·토큰 수·컴포넌트 수·템플릿 목록은 손으로 적지 않는다. <code>_ds_manifest.json<\/code>에서 뽑는다(<code>describeDesignSystem<\/code>). 시스템을 추가해도 화면 문구를 따라 고칠 일이 없다.<\/li><li>(❓ NH 실제 브랜드 자산의 반입 경로와 관리 주체 미결 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a>)<\/li><li>Template 버전을 선택할 수 있다. 버전은 <code>template_versions<\/code>로 관리한다(TEMPLATE 1:N TEMPLATE_VERSION).<\/li><li>사용자가 선택한 Template은 AI 요청 컨텍스트로 전달된다 → <a href=\"#FR-05_AI제작\">FR-05<\/a><\/li><li>Template 사용 이력을 남겨 재사용률(성공 지표)을 측정할 수 있게 한다.<\/li><li>후속 고도화: Template 추천, Marketplace(PRD 4절 후속·P5).<\/li><\/ul><h2 id=\"FR-04_템플릿-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>좌측 Template 선택<\/td><\/tr><tr><td>S04 AI Chat<\/td><td>Template 선택(생성 컨텍스트 지정)<\/td><\/tr><tr><td>S08 Brand Concept Brief<\/td><td>브랜드 자산(<code>BRAND_ASSET<\/code>) 선택 — 선택 UI만 제공하며 등록·관리는 다루지 않는다<\/td><\/tr><tr><td>S10 Design Asset Library<\/td><td>IA <code>D3<\/code>. 보유 자산을 종류별로 펼쳐 보여주고 프로젝트에 담는 진입점. <code>BRAND_ASSET<\/code>의 열람 표면이다<\/td><\/tr><tr><td>Template (<code>mockup-site/template.html<\/code> · <code>mockup/app/proto/template/<\/code>)<\/td><td>IA <code>D<\/code>. 디자인 시스템과 문서 양식을 보여준다. 카드를 누르면 그 시스템으로 화면 만들기에 진입한다. <del>화면 템플릿 카드<\/del> → 2026-09-08 제거(고르는 대상이 아니라 자동 참고되는 예시다)<\/td><\/tr><tr><td>화면 만들기 브리프 (정적 목업 <code>mockup-site/screen-brief.html<\/code>)<\/td><td>Template에서 고른 시스템을 이어받아 기획안을 적는 자리. <del>참고 템플릿 칩<\/del> → 2026-09-08 제거. Next.js 앱에서는 프로젝트 상세의 생성 탭이 같은 역할을 한다<\/td><\/tr><tr><td><del>❓ 미정의<\/del><\/td><td><del>IA의 D/D1/D2(Template 관리) 노드에 대응하는 S0x 화면이 정의되지 않음<\/del> → S10으로 해소. 단 Template의 <strong>버전 선택·소유 구분(D1/D2)<\/strong> 관리 화면은 여전히 미정의다<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-04_템플릿-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/templates<\/code><\/td><td>목록<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/templates/{templateId}<\/code><\/td><td>상세<\/td><\/tr><tr><td>GET<\/td><td><code>/api/design-systems<\/code><\/td><td>(프로토타입) 선택 가능한 디자인 시스템 목록. 운영에서는 <code>/templates?type=BRAND_ASSET<\/code>으로 흡수된다<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-04_템플릿-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-010<\/td><td>Template 선택<\/td><td>NH 공통/개인·부서 구분, 버전 선택 가능, 선택 Template이 AI 컨텍스트로 전달<\/td><\/tr><tr><td>US-012<\/td><td>브랜드 자산 선택<\/td><td><code>BRAND_ASSET<\/code> 유형 조회, 선택 자산이 AI 컨텍스트로 전달, 자산 없이도 생성 가능하되 안내 표시<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-04_템플릿-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-04 · US-010 · <code>/templates<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>🔶 부분<\/td><td><del>미검증<\/del> → ~~<code>mockup/app/proto/assets/<\/code>(S10)에서 자산 <strong>열람<\/strong>만 검증. Template 선택·버전·<code>template_type<\/code> 구분은 여전히 미검증~~ → <strong>디자인 시스템 선택이 생성까지 이어지는 경로를 검증했다.<\/strong> <code>mockup/lib/canvas/designSystem.ts<\/code>(레지스트리) · <code>GET /api/design-systems<\/code> · 생성 탭 셀렉트 · <code>mockup_versions.design_system_id<\/code>. Template <strong>버전 선택<\/strong>과 <strong>소유 구분(D1/D2)<\/strong>, <code>DOCUMENT<\/code> 유형의 실제 적용은 여전히 미검증. Template 화면 → 생성 진입 경로는 정적 목업·Next.js 양쪽에 구현<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>GET /templates?type=BRAND_ASSET<\/code> 로 디자인 시스템 목록, 선택값은 <code>versions.design_system_id<\/code> 에 기록되고 생성 프롬프트의 토큰 절을 만든다. **다만 <code>templates<\/code> 에 실제 자산 데이터가 아직 없다**(등록 주체 미결). backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-005<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-05_AI제작","group":"기능명세","title":"FR-05 · AI 제작","lede":"비동기 AI Job · Orchestrator 경유 생성","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-05_AI제작.md","size":"6KB","changed":false,"roles":[],"feature":"FR-05","body":"<h1 id=\"FR-05_AI제작-h0\">FR-05 AI 제작 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-05_AI제작-h1\">1. 개요<\/h2><p>사용자의 요청과 선택한 자료/Template을 LLM API에 전달하고 결과를 저장한다. (PRD 9절)<br>브라우저는 LLM을 직접 호출하지 않는다 — Frontend → Backend → AI Orchestrator → LLM API Gateway 경로만 사용한다(기획안 4-2절).<\/p><h2 id=\"FR-05_AI제작-h2\">2. 동작 상세<\/h2><ul><li>사용자 요청 + 선택한 참고자료(<a href=\"#FR-03_참고자료\">FR-03<\/a>) + Template(<a href=\"#FR-04_템플릿\">FR-04<\/a>)으로 AI 작업(Job)을 생성한다.<\/li><li>산출물 종류는 <code>ai_jobs.job_type<\/code>으로 구분한다: <code>DOC_DRAFT<\/code> / <code>SCREEN_MOCKUP<\/code> / <code>BRAND_CONCEPT<\/code>. 카드·홍보물 컨셉 시안(<code>BRAND_CONCEPT<\/code>)은 본 Job 구조를 그대로 재사용하며 별도 파이프라인을 두지 않는다 → <a href=\"#FR-13_브랜드시안제작\">FR-13<\/a><\/li><li><strong>(2026-09-05) 화면 목업은 단일 산출물이 아니다.<\/strong> <code>SCREEN_MOCKUP<\/code>은 서로 연결된 화면 여러 장을 만들 수 있고, 생성은 2단계로 나뉜다.<ol><li><strong>화면 흐름 설계<\/strong> — 기획안을 읽고 화면 목록·역할·전환 관계만 만든다. HTML을 만들지 않으므로 짧고 빠르다.<\/li><li><strong>화면별 생성<\/strong> — 화면마다 따로 호출해 HTML을 만든다. 토큰 한도에 걸리지 않고, <strong>실패한 화면만 재시도<\/strong>할 수 있다.<\/li><\/ol><\/li><li><strong>(2026-09-08) 두 단계의 입력이 다르다.<\/strong> 선택한 디자인 시스템(→ <a href=\"#FR-04_템플릿\">FR-04<\/a>)이 양쪽 컴텍스트로 들어가되 범위가 다르다.<ul><li>1단계(화면 흐름 설계): 표면(mobile/web)과 기준 폭만 받는다. 화면 목록만 만들므로 그 이상은 필요 없다.<\/li><li>2단계(화면별 생성): 컬러·간격 <strong>디자인 토큰 전체<\/strong>와 그 시스템의 <strong>완성 화면 예시 전체<\/strong>를 받는다. 사용자가 참고할 화면을 고르지 않으며, 지금 만들 화면에 어느 예시가 가까운지는 모델이 판단한다.<\/li><li>예시는 시스템 프롬프트에 들어가 <code>cache_control<\/code>로 캐시된다. 화면 N장을 만들어도 캐시 쓰기 1회 + 읽기 N-1회다.<\/li><\/ul><\/li><\/ul><p>화면 간 이동은 생성 HTML의 <code>data-goto<\/code> 속성으로 표현하며 별도 테이블을 두지 않는다 → 05_API_DB_SPEC.md 3-1절<\/p><ul><li><strong>(2026-09-05) 요소 단위 재생성<\/strong> — 결과물 전체가 아니라 사용자가 지목한 요소 하나만 다시 만들 수 있다. 그 요소의 outerHTML만 모델에 보내고, 결과는 정제 후 편집 패치로 쌓는다(원본 HTML 미변경). 이쪽에는 완성 화면 예시를 넣지 않는다 — 요소 하나를 고치는 데 화면 전장은 과하다.<\/li><li>장시간 작업은 <strong>비동기 Job<\/strong>으로 처리한다. 상태 전이: <code>REQUESTED → PROCESSING → COMPLETED / FAILED / CANCELLED<\/code> (03 상태 모델)<\/li><li>실패한 작업은 원인 요약과 재시도 옵션을 제공한다(retry API). LLM 오류는 502/504로 정규화된다.<\/li><li>중복 제출을 방지한다. (❓ idempotency 처리 방식 미결 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a>)<\/li><li>완료된 결과는 프로젝트와 연결해 저장하고, Version 생성의 근거(<code>source_job_id<\/code>)가 된다 → <a href=\"#FR-09_버전관리\">FR-09<\/a><\/li><li>입력·출력은 <code>ai_job_inputs<\/code> / <code>ai_job_outputs<\/code>로 기록한다. (❓ Prompt·Response 원문 저장 허용 범위 미결 — 확정 전 원문 저장 금지)<\/li><li>프로토타입에서 검증된 생성 흐름: 사전 검증 → 생성 중 UI(버튼 비활성) → 멀티모달 호출(참조 이미지 스타일 반영) → 응답 후처리(코드펜스 제거) → 버전 채번 → 저장·즉시 표시 → 실패 시 인라인 오류 + 재활성화.<\/li><li>AI 생성 HTML은 신뢰할 수 없는 입력으로 취급하고 샌드박스 iframe으로 격리 렌더링한다(보안 규칙 <a href=\"#SECURITY\">SECURITY.md<\/a>, ❓ 최종 정책 미결).<\/li><\/ul><h2 id=\"FR-05_AI제작-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>우측 AI Chat, 중앙 생성 결과물<\/td><\/tr><tr><td>S04 AI Chat<\/td><td>입력 + 참고자료 선택 + Template 선택 + 작업 유형 선택<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-05_AI제작-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/ai/jobs<\/code><\/td><td>Job 생성<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/ai/jobs/{jobId}<\/code><\/td><td>상태 조회<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/ai/jobs/{jobId}/retry<\/code><\/td><td>재시도<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/ai/jobs/{jobId}/cancel<\/code><\/td><td>취소 — <code>REQUESTED<\/code>/<code>PROCESSING<\/code>에서만, <code>CANCELLED<\/code>로 전이<\/td><\/tr><\/tbody><\/table><\/div><p>오류: 429(호출 제한), 502/504(LLM 연계). 정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-05_AI제작-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-020<\/td><td>AI 초안 생성<\/td><td>요청/참고자료/Template 기준 작업 생성, 실패 시 상태·재시도 표시, 결과-프로젝트 연결<\/td><\/tr><tr><td>US-021<\/td><td>비동기 AI 작업<\/td><td>4단 상태 보유, 실패 원인 요약 + 재시도, 중복 제출 방지<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-05_AI제작-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-05 · US-020/021 · <code>/ai/jobs<\/code> API · AI Orchestrator 계층 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-04(생성 파이프라인), PFR-05(격리 뷰어). 단 프로토타입은 브라우저 직접 호출·동기 처리라 Orchestrator·비동기 Job은 미검증. <del>Template 연계 미검증<\/del> → <strong>(2026-09-08) 디자인 시스템 토큰과 완성 화면 예시가 2단계 프롬프트로 들어가는 경로까지 연결됨<\/strong>(FR-04). 생성 품질 대조는 미실시<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>2단계 생성(<code>plan-screens<\/code> → <code>screens/{id}/generate<\/code>)·요소 AI 편집·비동기 Job·워커·AI Orchestrator. <strong>LLM endpoint 가 미확정이라 대역 응답으로 동작한다<\/strong>(<code>LLM_ENABLED=false<\/code>). backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-006·007<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-06_협업의견","group":"기능명세","title":"FR-06 · 협업","lede":"결과물 의견 등록 · 담당자 지정","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-06_협업의견.md","size":"6KB","changed":false,"roles":[],"feature":"FR-06","body":"<h1 id=\"FR-06_협업의견-h0\">FR-06 협업 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-06_협업의견-h1\">1. 개요<\/h2><p>결과물 또는 특정 영역에 의견을 남기고 담당자를 지정할 수 있어야 한다. (PRD 9절)<br>여러 채널로 분산되던 사업·테크·디자인·준법 의견을 하나의 결과물 위에서 취합한다(기획안 1-1절).<\/p><h2 id=\"FR-06_협업의견-h2\">2. 동작 상세<\/h2><ul><li>일반 의견과 특정 영역/요소에 대한 의견을 구분해 등록한다.<ul><li><strong>(2026-09-05 구체화)<\/strong> &quot;요소&quot;는 화면 목업 안의 <strong>임의의 HTML 요소<\/strong>(버튼·입력창·카드 등)다. 디자인시스템 컴포넌트 단위가 아니다.<\/li><li>앵커는 <code>(화면, 요소 id)<\/code> 쌍으로 저장한다(<code>comments.screen_id<\/code> · <code>comments.nh_id<\/code> · <code>comments.anchor_status<\/code>). 요소 id는 AI 출력이 아니라 <strong>서버가 저장 시점에 부여<\/strong>한다.<\/li><li>화면에서는 지목한 요소 위에 번호 핀으로 겹쳐 보여준다. (03_IA_FUNCTION_SPEC.md S03)<\/li><li><strong>화면을 다시 만들면 요소 id가 바뀐다.<\/strong> 텍스트·구조·순서 지문을 대조해 다시 잇고, 못 이으면 <strong>삭제하지 않고<\/strong> <code>orphaned<\/code>로 남겨 사람이 요소를 골라 다시 붙인다. &quot;완벽히 안정된 id&quot;는 만들 수 없다는 것을 전제로 한 설계다.<\/li><\/ul><\/li><li><strong>(2026-09-08 추가) 의견은 스레드다.<\/strong> 뿌리 의견에 답글을 달 수 있다(<code>comments.parent_id<\/code>).<ul><li><strong>답글은 자기 앵커를 갖지 않는다.<\/strong> 스레드가 가리키는 요소는 뿌리의 것이고, 답글마다 앵커를 주면 같은 요소에 핀이 여러 개 겹친다.<\/li><li>스레드는 <strong>한 겹까지만<\/strong> 둔다. 답글의 답글은 뿌리로 평탄화한다 — 들여쓰기가 깊어질수록 어느 요소를 가리키는 논의인지 흐려진다.<\/li><\/ul><\/li><li><strong>(2026-09-08 추가) 의견을 AI에게 보내면 그 요소만 다시 만든다.<\/strong> 작성 영역의 <code>AI에게 보내기<\/code>가 의견을 저장한 뒤 그 내용을 프롬프트로 FR-05의 요소 단위 재생성을 호출한다.<ul><li><strong>의견을 먼저 저장한다.<\/strong> AI 호출이 실패해도 사람이 쓴 말은 남아야 한다.<\/li><li>결과는 <code>element_patches.comment_id<\/code>로 그 의견에 연결되어 <strong>스레드 안에 결과 카드로 되돌아온다.<\/strong> AI의 답을 <code>comments<\/code> 행으로 만들지 않는 이유는 ARCHITECTURE.md 12절과 같다 — 사람 댓글 테이블에 AI용 필드를 붙이면 삭제·해결 토글의 의미가 달라진다. <strong>저장은 분리하고 합치는 것은 화면에서만 한다.<\/strong><\/li><li>AI에게 보내려면 가리키는 요소가 있어야 한다. 요소를 고르지 않았고 답글도 아니면 이 경로는 막힌다 — 무엇을 고칠지 알 수 없기 때문이다.<\/li><li>반영 결과는 카드의 <code>되돌리기<\/code>로 취소한다(soft revert, <code>reverted_at<\/code>). 되돌려도 행은 남아 편집 이력에 보인다.<\/li><\/ul><\/li><li>작성자와 작성시각이 기록된다. 담당자를 지정할 수 있고, 알림 확장 포인트를 둔다.<\/li><li>의견은 단순 코멘트로 끝나지 않는다 — 상태 전이 <code>OPEN → REVIEWED → ACCEPTED / REJECTED / DEFERRED<\/code>를 가지며(03 상태 모델), <code>comments → review_items → review_decisions → versions<\/code>로 연결된다 → <a href=\"#FR-07_AI의견취합\">FR-07<\/a>, <a href=\"#FR-08_반영결정\">FR-08<\/a><\/li><li>의견 조회·작성 시 프로젝트 멤버십을 검증한다(IDOR).<\/li><li>프로토타입에서 검증된 UX: 버전 단위 의견 스레드, 본인 작성 건만 삭제, 미선택 상태 가드 문구. (프로토타입의 프로젝트 단위 팀 채팅(PFR-09)은 정본 FR에 미반영 — ❓ 제품 채택 여부 협의 필요)<\/li><\/ul><h2 id=\"FR-06_협업의견-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>우측 협업 패널<\/td><\/tr><tr><td>S05 Result/Review<\/td><td>결과물 미리보기 + 댓글을 한 화면에서 연결<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-06_협업의견-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}/comments<\/code><\/td><td>목록<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/comments<\/code><\/td><td>등록<\/td><\/tr><tr><td>PATCH<\/td><td><code>/api/v1/comments/{commentId}<\/code><\/td><td>수정/상태 변경<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-06_협업의견-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-030<\/td><td>의견 등록<\/td><td>일반/영역 의견 구분, 작성자·시각 기록, 담당자 알림 확장 포인트<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-06_협업의견-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-06 · US-030 · <code>/comments<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-08(버전 단위 의견), PFR-09(팀 채팅), PFR-07(담당자 관리). <del>영역 지정 의견·상태 전이는 미검증<\/del> → <strong>요소 앵커 의견은 2026-09-05 프로토타입 검증 완료<\/strong>(작성·핀 표시·재생성 후 재연결·수동 재부착). <strong>2026-09-08 스레드(답글)·의견→AI 반영 연결·되돌리기 UI 검증 완료<\/strong> — 답글이 앵커를 갖지 않는 것, 3단계 답글의 뿌리 평탄화, 핀 클릭 시 요소 선택, 되돌린 편집이 화면에서 빠지고 이력에는 남는 것까지 확인. <strong>AI 호출 자체는 미검증<\/strong>(API 키 없이 검증) · 상태 전이(OPEN→REVIEWED→…)는 여전히 미검증<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>일반/요소 앵커 의견, 답글(뿌리로 평탄화), 재생성 시 orphaned 처리, 의견→AI 편집 연결(<code>element_patches.comment_id<\/code>). backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-008<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-07_AI의견취합","group":"기능명세","title":"FR-07 · AI 의견 취합","lede":"합의 / 이견 / 추가확인 분류","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-07_AI의견취합.md","size":"3KB","changed":false,"roles":[],"feature":"FR-07","body":"<h1 id=\"FR-07_AI의견취합-h0\">FR-07 AI 의견 취합 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-07_AI의견취합-h1\">1. 개요<\/h2><p>다수 의견을 합의/이견/추가확인으로 분류하고 수정 후보를 제시한다. (PRD 9절)<br>댓글을 &quot;합의/이견/추가확인&quot;으로 구조화하는 것이 이 제품의 핵심 차별점이다(기획안 2-2절).<\/p><h2 id=\"FR-07_AI의견취합-h2\">2. 동작 상세<\/h2><ul><li>프로젝트에 쌓인 의견(<a href=\"#FR-06_협업의견\">FR-06<\/a>)을 AI가 <strong>합의 / 이견 / 추가확인<\/strong> 세 분류로 정리하고 수정 후보를 제시한다.<\/li><li>원 의견과 AI 요약 결과의 연결관계를 보존한다(<code>comments → review_items<\/code>, <code>review_summaries<\/code>).<\/li><li><strong>AI 결과는 제안일 뿐 자동 확정되지 않는다.<\/strong> 최종 반영 여부는 담당자가 결정한다 → <a href=\"#FR-08_반영결정\">FR-08<\/a><\/li><li>분류되지 않은 의견도 누락되지 않아야 한다.<\/li><li>취합은 AI Orchestrator 경유 서버 측 호출로 수행하며, 장시간 처리 시 비동기 Job 규칙을 따른다 → <a href=\"#FR-05_AI제작\">FR-05<\/a><\/li><li>AI 제안과 사람의 최종 결정은 UI에서 시각적으로 구분한다(03 UX 원칙).<\/li><\/ul><h2 id=\"FR-07_AI의견취합-h3\">3. 관련 화면
