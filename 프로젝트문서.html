/li><\/ul><h2 id=\"CLEAN_CODE-h5\">Comments &amp; Documentation<\/h2><ul><li>Code should be self-documenting<\/li><li>Comments explain <strong>why<\/strong>, not what<\/li><li>Update comments with code changes<\/li><li>Delete commented-out code immediately<\/li><li>Document public APIs thoroughly<\/li><\/ul><h2 id=\"CLEAN_CODE-h6\">Error Handling<\/h2><ul><li>Fail fast with clear messages<\/li><li>Use exceptions over error codes<\/li><li>Handle errors at appropriate levels<\/li><li>Never catch generic exceptions<\/li><li>Log errors with context<\/li><\/ul><h2 id=\"CLEAN_CODE-h7\">Testing<\/h2><ul><li><strong>TDD<\/strong> when possible<\/li><li>Test behavior, not implementation<\/li><li>One assertion per test<\/li><li>Descriptive test names: <code>should_X_when_Y<\/code><\/li><li><strong>AAA pattern<\/strong>: Arrange, Act, Assert<\/li><li>Maintain test coverage &gt; 80%<\/li><\/ul><h2 id=\"CLEAN_CODE-h8\">Performance &amp; Optimization<\/h2><ul><li>Profile before optimizing<\/li><li>Optimize algorithms before micro-optimizations<\/li><li>Cache expensive operations<\/li><li>Lazy load when appropriate<\/li><li>Avoid premature optimization<\/li><\/ul><h2 id=\"CLEAN_CODE-h9\">Security<\/h2><ul><li>Never trust user input<\/li><li>Sanitize all inputs<\/li><li>Use parameterized queries<\/li><li>Follow <strong>principle of least privilege<\/strong><\/li><li>Keep dependencies updated<\/li><li>No secrets in code<\/li><\/ul><h2 id=\"CLEAN_CODE-h10\">Version Control<\/h2><ul><li>Atomic commits - one logical change<\/li><li>Imperative mood commit messages<\/li><li>Reference issue numbers<\/li><li>Branch names: <code>type/description<\/code><\/li><li>Rebase feature branches before merging<\/li><\/ul><h2 id=\"CLEAN_CODE-h11\">Code Reviews<\/h2><ul><li>Review for correctness first<\/li><li>Check edge cases<\/li><li>Verify naming clarity<\/li><li>Ensure consistent style<\/li><li>Suggest improvements constructively<\/li><\/ul><h2 id=\"CLEAN_CODE-h12\">Refactoring Triggers<\/h2><ul><li>Duplicate code (Rule of Three)<\/li><li>Long methods/classes<\/li><li>Feature envy<\/li><li>Data clumps<\/li><li>Divergent change<\/li><li>Shotgun surgery<\/li><\/ul><h2 id=\"CLEAN_CODE-h13\">Final Checklist<\/h2><p>Before committing, ensure:<\/p><ul><li><span class=\"chk\">☐<\/span>All tests pass<\/li><li><span class=\"chk\">☐<\/span>No linting errors<\/li><li><span class=\"chk\">☐<\/span>No console logs<\/li><li><span class=\"chk\">☐<\/span>No commented code<\/li><li><span class=\"chk\">☐<\/span>No TODOs without tickets<\/li><li><span class=\"chk\">☐<\/span>Performance acceptable<\/li><li><span class=\"chk\">☐<\/span>Security considered<\/li><li><span class=\"chk\">☐<\/span>Documentation updated<\/li><\/ul><p>Remember: <strong>Clean code reads like well-written prose<\/strong>. Optimize for readability and maintainability over cleverness.<\/p>"},{"id":"SECURITY","group":"개발 가이드라인","title":"보안 규칙","lede":"ISMS-P 기반 시큐어 개발","author":"Lucas-one","commit":"cce6eab","date":"2026-08-30","path":"docs/guidelines/SECURITY.md","size":"6KB","changed":false,"roles":[],"body":"<h1 id=\"SECURITY-h0\">ISMS-P Based Secure Development Rules<\/h1><p>This document defines the mandatory security rules for developers during code implementation.<\/p><h2 id=\"SECURITY-h1\">1. Authentication &amp; Authorization<\/h2><ul><li><strong>(A-1) User Identification and Authentication<\/strong><ul><li><strong>MUST<\/strong>: Every user must be individually identifiable. The use of shared accounts is prohibited.<\/li><li><strong>MUST<\/strong>: Passwords MUST satisfy one of the following policies:<ul><li>(a) 8+ characters with a mix of letters, numbers, and special characters.<\/li><li>(b) 10+ characters with a mix of letters and numbers.<\/li><\/ul><\/li><li><strong>MUST<\/strong>: An account lockout policy MUST be implemented for failed login attempts (e.g., lock the account for 5 minutes after 5 consecutive failures).<\/li><\/ul><\/li><\/ul><ul><li><strong>(A-2) Management of Authentication Credentials<\/strong><ul><li><strong>MUST<\/strong>: Authentication credentials such as passwords MUST be stored using an adaptive hash function like <strong>bcrypt, scrypt, or Argon2<\/strong>. (Using SHA-256 alone is prohibited).<\/li><\/ul><\/li><\/ul><ul><li><strong>(A-3) Privilege Management<\/strong><ul><li><strong>MUST<\/strong>: Grant only the minimum necessary privileges for a role, following the <strong>Principle of Least Privilege<\/strong>.<\/li><li><strong>MUST<\/strong>: All actions of granting, changing, and revoking privileges MUST be logged.<\/li><\/ul><\/li><\/ul><ul><li><strong>(A-4) Privileged Access Management<\/strong><ul><li><strong>MUST<\/strong>: Administrative privileges (e.g., root, admin) MUST be granted to a minimum number of users, and the reason for using such accounts MUST be clearly logged.<\/li><li><strong>SHOULD<\/strong>: Administrative accounts SHOULD be separate from regular user accounts.<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h2\">2. Access Control<\/h2><ul><li><strong>(AC-1) System Access<\/strong><ul><li><strong>MUST<\/strong>: Access to information systems by unauthorized users MUST be blocked.<\/li><li><strong>MUST<\/strong>: Access logs for critical systems MUST be retained for <strong>at least one year<\/strong>.<\/li><\/ul><\/li><\/ul><ul><li><strong>(AC-2) Network Access<\/strong><ul><li><strong>MUST<\/strong>: Public-facing services MUST be located in a <strong>DMZ<\/strong>, separate from the internal network.<\/li><li><strong>MUST<\/strong>: Firewalls MUST allow only the minimum necessary ports required for the service. (Prohibit &quot;allow all&quot; rules).<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h3\">3. Cryptography<\/h2><ul><li><strong>(C-1) Encryption of Sensitive Information<\/strong><ul><li><strong>MUST<\/strong>: Legally defined sensitive information (e.g., national ID numbers, passport numbers, bank account numbers, credit card numbers) and passwords MUST be encrypted during storage and transmission.<\/li><li><strong>MUST<\/strong>: Use secure and vetted cryptographic algorithms such as <strong>AES-256<\/strong>.<\/li><li><strong>MUST NOT<\/strong>: Do not use homegrown or custom-developed cryptographic algorithms.<\/li><\/ul><\/li><\/ul><ul><li><strong>(C-2) Cryptographic Key Management<\/strong><ul><li><strong>MUST NOT<\/strong>: Do not hardcode cryptographic keys in source code, configuration files, or comments.<\/li><li><strong>MUST<\/strong>: Cryptographic keys MUST be managed securely using <strong>environment variables<\/strong> or a dedicated <strong>Key Management System (KMS, HSM)<\/strong>.<\/li><li><strong>MUST<\/strong>: Minimize access to keys and log all lifecycle management procedures, including generation, use, and destruction.<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h4\">4. Secure Development<\/h2><ul><li><strong>(D-1) Secure Design<\/strong><ul><li><strong>MUST<\/strong>: Defense mechanisms against major vulnerabilities like the <strong>OWASP Top 10<\/strong> (e.g., SQL Injection, XSS, CSRF) MUST be incorporated during the design phase.<\/li><\/ul><\/li><\/ul><ul><li><strong>(D-2) Secure Coding<\/strong><ul><li><strong>MUST<\/strong>: Treat all external input (e.g., request parameters, headers, cookies) as untrusted. <strong>Validation and sanitization<\/strong> logic MUST always be applied.<\/li><li><strong>MUST<\/strong>: All SQL queries MUST use <strong>parameterized queries (prepared statements)<\/strong>. (Dynamic query string concatenation is prohibited).<\/li><li><strong>MUST<\/strong>: When handling errors, ensure that internal system details (e.g., stack traces, database information) are not exposed to the user.<\/li><\/ul><\/li><\/ul><ul><li><strong>(D-3) Security Testing<\/strong><ul><li><strong>SHOULD<\/strong>: Periodically scan for security vulnerabilities using static/dynamic analysis tools (<strong>SAST/DAST<\/strong>).<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h5\">5. Personal Information Handling<\/h2><ul><li><strong>(P-1) Collection and Use<\/strong><ul><li><strong>MUST<\/strong>: Collect only the minimum personal information necessary to provide the service. The purpose of collection MUST be clearly disclosed to users, and consent must be obtained.<\/li><li><strong>MUST NOT<\/strong>: Do not process sensitive information (e.g., beliefs, ideology) or unique identification information without a legal basis or separate user consent.<\/li><\/ul><\/li><\/ul><ul><li><strong>(P-2) Storage and Display<\/strong><ul><li><strong>MUST<\/strong>: Personal information MUST be <strong>masked<\/strong> when displayed on screen (e.g., John D<strong>, +1-<\/strong>*-*<strong>-1234, test@<\/strong>**.com).<\/li><li><strong>MUST NOT<\/strong>: Do not use personal information or provide it to third parties beyond the scope of the consented purpose.<\/li><\/ul><\/li><\/ul><ul><li><strong>(P-3) Destruction<\/strong><ul><li><strong>MUST<\/strong>: When the retention period expires or the processing purpose is achieved, personal information MUST be completely destroyed using an irreversible method.<\/li><li><strong>MUST<\/strong>: Establish a personal information destruction procedure and maintain a log of all destructions.<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h6\">6. Logging &amp; Management<\/h2><ul><li><strong>(L-1) Log Recording<\/strong><ul><li><strong>MUST<\/strong>: Logs for critical activities (e.g., login, access to personal information, privilege changes) MUST be securely retained for <strong>at least one year<\/strong>.<\/li><li><strong>MUST<\/strong>: Logs MUST be standardized and include at least the following: [Timestamp, User ID, Source IP Address, Request/Action, Success/Failure Status].<\/li><li><strong>MUST NOT<\/strong>: Do not log or print sensitive information (e.g., passwords, tokens, API keys).<\/li><\/ul><\/li><\/ul><h2 id=\"SECURITY-h7\">7. Secrets &amp; Credential Handling<\/h2><ul><li><strong>MUST NOT<\/strong>: Never include real credentials in code, logs, comments, or responses. Use placeholders such as <code>YOUR_API_KEY<\/code> in all examples.<\/li><li><strong>MUST NOT<\/strong>: Frontend code MUST NOT contain private API keys. Sensitive logic and API calls MUST be handled on the backend.<\/li><li><strong>MUST<\/strong>: Ensure <code>.env<\/code> and secret files are always included in <code>.gitignore<\/code>.<\/li><li><strong>MUST<\/strong>: If a secret is detected in code or output, redact it immediately.<\/li><li><strong>MUST<\/strong>: Refuse to proceed if secure handling of secrets cannot be ensured.<\/li><\/ul>"},{"id":"RESPONSIBLE_DESIGN","group":"개발 가이드라인","title":"책임성 설계 규칙","lede":"RR 규칙 정본 · 판정 아닌 자문","author":"Lucas-one","commit":"b192827","date":"2026-09-05","path":"docs/guidelines/RESPONSIBLE_DESIGN.md","size":"13KB","changed":false,"roles":[],"body":"<h1 id=\"RESPONSIBLE_DESIGN-h0\">책임성 설계 규칙 (Responsible Design Rules)<\/h1><blockquote><p>화면 설계·목업 산출물이 <strong>사회적·윤리적으로 문제가 될 만한 지점<\/strong>을 점검하는 규칙 원문입니다.<br>SECURITY.md가 보안(ISMS-P) 축을 다루듯, 이 문서는 <strong>표현·소비자보호·설계윤리·접근성<\/strong> 축을 다룹니다.<\/p><p><strong>관련 문서<\/strong>: 보안 규칙 원문 | 보안 체크리스트 | FR-14 책임성 검토<\/p><\/blockquote><hr><h2 id=\"RESPONSIBLE_DESIGN-h1\">0. 이 문서의 위치와 경계<\/h2><h3 id=\"RESPONSIBLE_DESIGN-h2\">왜 필요한가<\/h3><p>이 제품은 <strong>AI가 만든 화면을 은행 업무 산출물로 쓰는 것<\/strong>이 핵심이다. 생성물에 성별 고정관념, 오인 유발 문구, 기본 체크된 동의, 판독 불가능한 색 대비가 섞여도 지금은 아무도 걸러내지 않는다. 이 문서는 &quot;무엇을 문제로 볼 것인가&quot;를 한곳에 모아 둔 정본이다.<\/p><h3 id=\"RESPONSIBLE_DESIGN-h3\">반드시 지킬 경계 — 이 규칙은 판정 기준이 아니다<\/h3><p><code>개발문서/01_PRD.md<\/code> 5절은 <strong>&quot;자동 승인 또는 준법 판단의 완전 자동화&quot;를 비범위<\/strong>로 명시한다. <code>개발문서/08_DECISIONS_OPEN_ISSUES.md<\/code> Q2도 &quot;AI는 의견과 수정안을 제안하고, 최종 반영 여부는 담당자가 결정한다&quot;로 확정돼 있다.<\/p><p>따라서 이 규칙을 적용하는 도구(FR-14)는:<\/p><div class=\"table-wrap\"><table><thead><tr><th>한다<\/th><th>하지 않는다<\/th><\/tr><\/thead><tbody><tr><td>&quot;이 표현은 준법 검토가 필요해 보입니다&quot;<\/td><td>&quot;이 표현은 위법입니다&quot;<\/td><\/tr><tr><td>목업에서 발견한 근거를 인용해 제시한다<\/td><td>근거 없이 지적한다<\/td><\/tr><tr><td>담당자에게 판단 재료를 준다<\/td><td>대신 판단한다<\/td><\/tr><tr><td>준법 담당자에게 넘길 경로를 만든다<\/td><td>준법 검토를 대체한다<\/td><\/tr><tr><td>의견으로 띄운다<\/td><td>Export·공유를 차단한다<\/td><\/tr><\/tbody><\/table><\/div><p>기획안의 선례가 이 모양이다 — <code>우대금리 표현 → 추가 확인 → 준법 검토 요청<\/code>.<\/p><h3 id=\"RESPONSIBLE_DESIGN-h4\">규칙 ID 체계<\/h3><p><code>RR-&lt;축&gt;&lt;번호&gt;<\/code> — RR = Responsible Rule.<\/p><div class=\"table-wrap\"><table><thead><tr><th>축<\/th><th>코드<\/th><th>범위<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td><code>EXPRESSION<\/code><\/td><td>표현·차별<\/td><\/tr><tr><td>B<\/td><td><code>CONSUMER<\/code><\/td><td>금융소비자보호<\/td><\/tr><tr><td>C<\/td><td><code>DARKPATTERN<\/code><\/td><td>다크패턴·설계 윤리<\/td><\/tr><tr><td>D<\/td><td><code>ACCESSIBILITY<\/code><\/td><td>접근성·포용성<\/td><\/tr><\/tbody><\/table><\/div><p>**B축(금융소비자보호)은 전 항목이 <code>준법 검토 필요 = 예<\/code>다.** 금융 표현의 적법성 판단은 사람의 몫이며, 이 경계를 규칙 데이터에 직접 박아 둔다.<\/p><hr><h2 id=\"RESPONSIBLE_DESIGN-h5\">1. A축 — 표현·차별 (EXPRESSION)<\/h2><h3 id=\"RESPONSIBLE_DESIGN-h6\">RR-A01 성별 고정관념<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 역할·직업·가사·육아·소비 성향을 성별과 결부한 문구나 인물 묘사. (&quot;주부 고객&quot;, &quot;아빠는 대출, 엄마는 적금&quot;)<\/li><li><strong>왜 문제인가<\/strong>: 은행 산출물은 불특정 다수에게 노출된다. 특정 성별을 특정 역할에 고정하면 그 역할 밖의 고객을 배제하고, 조직의 공식 입장으로 읽힌다.<\/li><li><strong>권장 조치<\/strong>: 성별 대신 실제 겨냥한 상황·니즈로 바꾼다. (&quot;주부 고객&quot; → &quot;생활비를 나눠 관리하는 고객&quot;)<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h7\">RR-A02 연령 배제·시혜적 표현<\/h3><ul><li><strong>무엇을 보는가<\/strong>: &quot;어르신도 쉽게&quot;, &quot;요즘 젊은 세대라면&quot; 같은 시혜적·구분짓는 표현. 특정 연령대만 인물로 등장하는 구성.<\/li><li><strong>왜 문제인가<\/strong>: 쉬움을 강조하려다 특정 연령을 능력이 부족한 집단으로 전제하게 된다. 농협 고객층은 연령 분포가 넓다.<\/li><li><strong>권장 조치<\/strong>: 대상을 나이로 부르지 말고 기능으로 설명한다. (&quot;어르신도 쉽게&quot; → &quot;큰 글씨로 보기&quot;)<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h8\">RR-A03 가족 형태 전제<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 4인 핵가족·기혼을 기본값으로 두는 문구, 일러스트, 입력 폼. (배우자 정보가 필수, &quot;우리 가족 4명&quot; 기본값)<\/li><li><strong>왜 문제인가<\/strong>: 1인가구·비혼·한부모·동거 가구가 자신의 상황을 입력할 수 없거나, 표준에서 벗어난 것으로 취급된다.<\/li><li><strong>권장 조치<\/strong>: 가족 구성을 선택 항목으로 두고, 예시 인물 구성을 다양화한다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h9\">RR-A04 지역·직업·학력 위계<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 특정 지역·직업·학력을 우월하거나 열등하게 배치하는 표현·이미지. (&quot;서울 직장인이라면&quot;, &quot;농촌에서도 이제&quot;)<\/li><li><strong>왜 문제인가<\/strong>: 농협의 기반은 지역과 농업이다. 도시를 기준으로 두고 그 밖을 &quot;~도 이제&quot;로 서술하면 핵심 고객을 후순위로 표현하게 된다.<\/li><li><strong>권장 조치<\/strong>: 지역·직업을 우열 없이 병렬로 두거나 언급하지 않는다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h10\">RR-A05 장애·질병 표현<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 비하 어휘, 장애를 극복 서사로 소비하는 구성, 장애를 불행의 상징으로 쓰는 이미지.<\/li><li><strong>왜 문제인가<\/strong>: 당사자를 감동의 소재로 대상화한다. 금융 상품 화면에서 이런 서사는 상품과 무관한 정서적 압박으로도 작동한다.<\/li><li><strong>권장 조치<\/strong>: 장애를 서사 장치로 쓰지 않는다. 접근성은 D축에서 기능으로 해결한다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h11\">RR-A06 국적·인종<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 국적·인종에 따른 구분 표현. 농협 맥락상 <strong>농촌 외국인 노동자<\/strong>에 대한 서술을 포함한다.<\/li><li><strong>왜 문제인가<\/strong>: 외국인 근로자는 농협의 실제 고객이다. 시혜 대상이나 관리 대상으로 서술하면 고객을 잘못 규정한다.<\/li><li><strong>권장 조치<\/strong>: 국적을 필요 없는 곳에서 언급하지 않는다. 필요한 곳(외국인등록번호 입력 등)에서는 절차만 중립적으로 안내한다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><hr><h2 id=\"RESPONSIBLE_DESIGN-h12\">2. B축 — 금융소비자보호 (CONSUMER)<\/h2><blockquote><p><strong>전 항목 준법 검토 필요 = 예.<\/strong> 아래 지적은 &quot;검토가 필요하다&quot;는 신호이며, 적법성 판단이 아니다.<\/p><\/blockquote><h3 id=\"RESPONSIBLE_DESIGN-h13\">RR-B01 단정·과장 표현<\/h3><ul><li><strong>무엇을 보는가<\/strong>: &quot;무조건&quot;, &quot;최고&quot;, &quot;100%&quot;, &quot;확정&quot;, &quot;보장&quot;, &quot;누구나&quot; 같은 단정 어휘.<\/li><li><strong>왜 문제인가<\/strong>: 조건부 상품을 무조건적인 것으로 오인하게 만든다. 금융 광고 표현에서 가장 흔한 지적 대상이다.<\/li><li><strong>권장 조치<\/strong>: 조건을 함께 적거나 단정 어휘를 뺀다. (&quot;최고 연 5%&quot; → &quot;조건 충족 시 최고 연 5%&quot;)<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h14\">RR-B02 위험 고지 없이 수익만 강조<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 금리·수익률만 크게 배치하고 원금손실 가능성·투자위험·중도해지 불이익을 표시할 자리가 없는 구성.<\/li><li><strong>왜 문제인가<\/strong>: 시각적 비중 자체가 오인을 만든다. 문구가 있어도 읽히지 않는 크기면 없는 것과 같다.<\/li><li><strong>권장 조치<\/strong>: 수익 표시 근처에 위험 고지 영역을 확보한다.<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h15\">RR-B03 필수 고지 누락<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 준법감시인 심의필, 예금자보호 안내, 상품설명서·약관 열람 경로가 화면 어디에도 없는 상태.<\/li><li><strong>왜 문제인가<\/strong>: 실제 화면으로 전개될 때 반드시 들어가야 할 요소가 설계 단계에서 빠지면, 뒤늦게 레이아웃을 다시 잡아야 한다.<\/li><li><strong>권장 조치<\/strong>: 목업 단계에서도 자리를 잡아 둔다.<\/li><li><strong>참고 (미결)<\/strong>: 카드·상품별 <strong>필수 표기 요소의 출처와 관리 주체는 아직 미확정<\/strong>이다 — <code>개발문서/08_DECISIONS_OPEN_ISSUES.md<\/code>. 확정 전까지 이 규칙은 &quot;자리가 있는가&quot;만 본다.<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h16\">RR-B04 조건부 혜택의 조건 은닉<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 우대금리·할인의 달성 조건이 없거나, 각주로만 있거나, 본문 대비 현저히 작게 표시된 상태.<\/li><li><strong>왜 문제인가<\/strong>: 조건을 충족하지 못하는 고객이 대표 숫자를 자신의 조건으로 오인한다.<\/li><li><strong>권장 조치<\/strong>: 대표 숫자 바로 옆에 핵심 조건을 같은 위계로 둔다.<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h17\">RR-B05 근거 없는 비교 우위<\/h3><ul><li><strong>무엇을 보는가<\/strong>: &quot;업계 최저&quot;, &quot;타사 대비&quot; 등 출처 없는 비교 주장.<\/li><li><strong>왜 문제인가<\/strong>: 비교 광고는 객관적 근거와 기준 시점이 없으면 성립하지 않는다.<\/li><li><strong>권장 조치<\/strong>: 비교를 빼거나, 기준·시점·출처를 함께 표시한다.<\/li><\/ul><hr><h2 id=\"RESPONSIBLE_DESIGN-h18\">3. C축 — 다크패턴·설계 윤리 (DARKPATTERN)<\/h2><h3 id=\"RESPONSIBLE_DESIGN-h19\">RR-C01 사전 체크된 동의<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 마케팅 수신·제3자 제공 등 <strong>선택<\/strong> 동의가 기본 체크(<code>checked<\/code>)된 상태.<\/li><li><strong>왜 문제인가<\/strong>: 선택 동의는 이용자가 능동적으로 선택해야 한다. 기본 체크는 동의를 얻은 것으로 보기 어렵다.<\/li><li><strong>권장 조치<\/strong>: 선택 동의는 기본 해제. 필수와 선택을 시각적으로 분리한다.<\/li><li><strong>준법 검토 필요<\/strong>: 예<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h20\">RR-C02 거절·취소 경로 약화<\/h3><ul><li><strong>무엇을 보는가<\/strong>: &quot;동의 안 함&quot;, &quot;취소&quot;, &quot;나중에&quot; 버튼이 회색·작은 글씨·링크 형태로 약화되고, 긍정 버튼만 강조된 구성.<\/li><li><strong>왜 문제인가<\/strong>: 시각적 위계로 선택을 유도하는 것은 의사결정 왜곡이다.<\/li><li><strong>권장 조치<\/strong>: 두 선택지를 같은 위계의 버튼으로 둔다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h21\">RR-C03 근거 없는 긴급성<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 카운트다운 타이머, &quot;마감 임박&quot;, &quot;선착순 n명&quot; 중 실제 근거가 화면에 없는 것.<\/li><li><strong>왜 문제인가<\/strong>: 인위적 시간 압박은 비교·검토 없는 결정을 유도한다. 금융 상품에서는 영향이 특히 크다.<\/li><li><strong>권장 조치<\/strong>: 실제 기한이면 정확한 일시를 적고, 아니면 없앤다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h22\">RR-C04 해지·탈퇴 경로 부재<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 가입·신청은 눈에 띄는 경로로 있는데, 해지·해제·탈퇴 경로가 화면에 없는 구성.<\/li><li><strong>왜 문제인가<\/strong>: 들어오기는 쉽고 나가기는 어려운 비대칭은 대표적 다크패턴이다.<\/li><li><strong>권장 조치<\/strong>: 설계 단계에서 해지 경로의 자리를 함께 잡는다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h23\">RR-C05 오도하는 기본 선택<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 가장 비싸거나 은행에 유리한 옵션이 기본 선택·추천 배지로 놓인 상태.<\/li><li><strong>왜 문제인가<\/strong>: 기본값은 대다수가 그대로 둔다. 기본값 선정은 그 자체로 강한 개입이다.<\/li><li><strong>권장 조치<\/strong>: 기본값을 두지 않거나, 추천이라면 추천 기준을 함께 표시한다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><hr><h2 id=\"RESPONSIBLE_DESIGN-h24\">4. D축 — 접근성·포용성 (ACCESSIBILITY)<\/h2><blockquote><p>기준은 WCAG 2.1 AA를 참고하되, <strong>목업 단계에서 눈으로 판단 가능한 것<\/strong>만 다룬다. 실제 측정은 구현 단계의 몫이다.<\/p><\/blockquote><h3 id=\"RESPONSIBLE_DESIGN-h25\">RR-D01 색 대비 부족<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 본문 텍스트와 배경의 명도 대비가 4.5:1 미만으로 보이는 조합. (연회색 텍스트 위 흰 배경 등)<\/li><li><strong>왜 문제인가<\/strong>: 저시력 사용자와 밝은 환경의 모든 사용자가 읽지 못한다.<\/li><li><strong>권장 조치<\/strong>: 본문 4.5:1, 큰 텍스트 3:1 이상.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h26\">RR-D02 색상만으로 정보 전달<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 상태·오류·필수 여부를 색만으로 구분한 구성. (빨강=오류, 초록=정상)<\/li><li><strong>왜 문제인가<\/strong>: 색각 이상 사용자에게 정보가 전달되지 않는다.<\/li><li><strong>권장 조치<\/strong>: 색에 아이콘·텍스트·패턴을 함께 붙인다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h27\">RR-D03 본문 글자 크기<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 본문 텍스트가 12px 미만으로 지정된 곳.<\/li><li><strong>왜 문제인가<\/strong>: 금액·조건 같은 중요한 정보가 작게 들어가는 경우가 많고, 이는 B축(고지 누락)과도 겹친다.<\/li><li><strong>권장 조치<\/strong>: 본문 14px 이상. 고지 문구도 최소 12px.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h28\">RR-D04 터치 영역<\/h3><ul><li><strong>무엇을 보는가<\/strong>: 버튼·체크박스·링크의 터치 가능 영역이 44px 미만인 곳.<\/li><li><strong>왜 문제인가<\/strong>: 오조작을 유발한다. 금융 화면에서 오조작은 되돌리기 어려운 결과로 이어진다.<\/li><li><strong>권장 조치<\/strong>: 최소 44×44px 확보.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><h3 id=\"RESPONSIBLE_DESIGN-h29\">RR-D05 이미지 대체 텍스트<\/h3><ul><li><strong>무엇을 보는가<\/strong>: <code>&lt;img&gt;<\/code>에 <code>alt<\/code>가 없거나, 의미를 전달하는 아이콘이 장식으로 취급된 곳.<\/li><li><strong>왜 문제인가<\/strong>: 스크린리더 사용자가 화면의 핵심 정보를 얻지 못한다.<\/li><li><strong>권장 조치<\/strong>: 의미 있는 이미지에 <code>alt<\/code>를 적고, 순수 장식에는 <code>alt=&quot;&quot;<\/code>를 명시한다.<\/li><li><strong>준법 검토 필요<\/strong>: 아니오<\/li><\/ul><hr><h2 id=\"RESPONSIBLE_DESIGN-h30\">5. 규칙을 고칠 때<\/h2><ul><li>이 문서가 <strong>정본<\/strong>이다. <code>mockup/lib/responsibility-rules.ts<\/code>는 이 표를 코드로 옮긴 사본이며, 각 항목이 여기 절 번호를 참조한다. <strong>한쪽만 고치지 말 것.<\/strong><\/li><li>규칙을 추가·수정하면 <code>개발문서/기능명세/FR-14_책임성검토.md<\/code>와 <code>개발문서/기능명세/00_CHANGELOG.md<\/code>를 함께 갱신한다.<\/li><li>결정이 바뀌면 이전 내용을 지우지 말고 <del>취소선<\/del>으로 남기고 새 내용을 추가한다.<\/li><li><strong>A~D 축을 늘리는 것은 신중하게.<\/strong> 축이 늘어나면 검토 결과가 길어지고, 길어진 결과는 읽히지 않는다.<\/li><\/ul>"},{"id":"USABILITY_REVIEW","group":"개발 가이드라인","title":"UX 리스크 검토 렌즈","lede":"UR 렌즈 정본 · 판정 아닌 질문","author":"Lucas-one","commit":"96221a4","date":"2026-09-08","path":"docs/guidelines/USABILITY_REVIEW.md","size":"10KB","changed":false,"roles":[],"body":"<h1 id=\"USABILITY_REVIEW-h0\">UX 리스크 검토 렌즈 (Usability Review Lenses)<\/h1><blockquote><p>화면과 <strong>그 화면을 두고 오간 논의<\/strong>를 함께 읽고, 담당자들이 짚지 못한 사용성 문제를 찾는 검토 관점의 원문입니다.<br>RESPONSIBLE_DESIGN.md가 &quot;이러면 문제&quot;라는 <strong>규칙<\/strong>을 다룬다면, 이 문서는 &quot;이걸 물어봐라&quot;라는 <strong>질문<\/strong>을 다룹니다.<\/p><p><strong>관련 문서<\/strong>: 책임성 설계 규칙 | 보안 체크리스트 | FR-15 UX 리스크 검토<\/p><\/blockquote><hr><h2 id=\"USABILITY_REVIEW-h1\">0. 이 문서의 위치와 경계<\/h2><h3 id=\"USABILITY_REVIEW-h2\">왜 필요한가<\/h3><p>프로젝트 의견 패널에는 기획·개발·디자인 담당자가 각자의 관점으로 코멘트를 남긴다. 문제는 <strong>각 의견이 개별로는 타당한데 합쳐 놓으면 사용자가 불편해지는 경우<\/strong>를 아무도 짚지 못한다는 것이다.<\/p><p>대표 사례가 팝업이다. &quot;가입 완료 안내 팝업&quot;, &quot;약관 변경 팝업&quot;, &quot;혜택 안내 모달&quot;, &quot;앱 평가 요청&quot;이 각기 다른 의견에서 나오면 하나하나는 다 필요해 보인다. 그런데 사용자는 한 흐름에서 팝업을 네 번 닫아야 한다. 이 문제는 <strong>요소를 아무리 들여다봐도 잡히지 않는다.<\/strong> 여러 결정이 쌓인 결과이기 때문이다.<\/p><p>이 문서는 그 &quot;쌓인 결과&quot;를 무엇으로 볼 것인가를 모아 둔 정본이다.<\/p><h3 id=\"USABILITY_REVIEW-h3\">왜 규칙이 아니라 렌즈인가<\/h3><p>RESPONSIBLE_DESIGN.md의 RR 규칙은 요소 하나로 판정된다. &quot;선택 동의가 기본 체크되어 있는가&quot;는 체크박스 하나만 보면 답이 나온다.<\/p><p>여기서 다루는 문제는 그렇지 않다. 팝업 4개, 확인 단계 3개, 되돌릴 수 없는 버튼 하나 — 개수와 맥락이 문제이지 개별 요소는 멀쩡하다. 그래서 조건이 아니라 <strong>질문<\/strong>을 목록으로 둔다.<\/p><p>대신 느슨해진 만큼 <strong>근거는 더 엄격하게<\/strong> 요구한다 (아래 0-4절).<\/p><h3 id=\"USABILITY_REVIEW-h4\">반드시 지킬 경계 — 이 렌즈는 판정 기준이 아니다<\/h3><p><code>개발문서/01_PRD.md<\/code> 5절의 비범위와 <code>개발문서/08_DECISIONS_OPEN_ISSUES.md<\/code> Q2(&quot;AI는 의견과 수정안을 제안하고, 최종 반영 여부는 담당자가 결정한다&quot;)를 그대로 승계한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>한다<\/th><th>하지 않는다<\/th><\/tr><\/thead><tbody><tr><td>&quot;이 흐름에서 팝업을 네 번 닫아야 합니다&quot;<\/td><td>&quot;이 설계는 잘못되었습니다&quot;<\/td><\/tr><tr><td>화면과 의견에서 <strong>그대로 인용한 근거<\/strong>를 제시한다<\/td><td>근거 없이 인상을 말한다<\/td><\/tr><tr><td>담당자에게 판단 재료를 준다<\/td><td>담당자 대신 판단한다<\/td><\/tr><tr><td>의견으로 띄운다<\/td><td>생성·Export·공유를 차단한다<\/td><\/tr><tr><td>사람이 놓친 관점을 하나 더 얹는다<\/td><td>사람의 의견을 대체하거나 반박한다<\/td><\/tr><\/tbody><\/table><\/div><p><strong>특히<\/strong>: 이 검토는 <strong>다른 팀원의 의견을 읽고<\/strong> 나온 것이다. 그러므로 특정 의견이나 작성자를 지목해 틀렸다고 말하지 않는다. &quot;이 결정들이 합쳐지면 이런 결과가 됩니다&quot;까지만 말한다.<\/p><h3 id=\"USABILITY_REVIEW-h5\">렌즈 ID 체계<\/h3><p><code>UR-&lt;번호&gt;<\/code> — UR = Usability Review lens.<\/p><p>렌즈는 여섯 개이며 축(카테고리)을 따로 두지 않는다. 여섯 개뿐이라 렌즈 ID 자체가 분류다.<\/p><h3 id=\"USABILITY_REVIEW-h6\">근거 요구 — 인용은 원문 그대로<\/h3><p>각 지적은 <strong>원문에서 글자 그대로 복사한 조각<\/strong>을 1~3개 제시해야 한다. 검토 대상은 셋이다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>출처<\/th><th>무엇<\/th><\/tr><\/thead><tbody><tr><td><code>PROPOSAL<\/code><\/td><td>기획안 본문<\/td><\/tr><tr><td><code>SCREEN<\/code><\/td><td>생성된 화면 HTML (전 화면)<\/td><\/tr><tr><td><code>DISCUSSION<\/code><\/td><td>의견 패널에 달린 코멘트 본문<\/td><\/tr><\/tbody><\/table><\/div><p>서버는 이 조각들이 원문에 실제로 존재하는지 대조하고, <strong>하나도 맞지 않으면 그 지적을 통째로 버린다.<\/strong> 요약·의역은 검증에서 탈락한다. 지어낸 근거로는 담당자가 판단할 수 없고, 검증 불가능한 카드가 한 장이라도 섞이면 나머지 카드까지 읽히지 않기 때문이다.<\/p><hr><h2 id=\"USABILITY_REVIEW-h7\">1. UR-01 누적과 반복<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 한 번이면 괜찮지만 반복되면 피로해지는 것이 흐름 전체에 몇 개인지. 팝업·모달·확인 다이얼로그·동의 요청·알림·배너·튜토리얼 오버레이를 <strong>화면을 가로질러 센다.<\/strong><\/li><li><strong>왜 문제인가<\/strong>: 각 항목은 서로 다른 담당자가 서로 다른 이유로 요청해서 개별로는 모두 타당하다. 그러나 사용자는 그 총합을 한 번에 겪는다. 안내가 일정 수를 넘으면 읽히지 않고 반사적으로 닫히며, 그때부터는 정말 중요한 고지도 함께 닫힌다.<\/li><li><strong>권장 조치<\/strong>: 같은 성격의 안내를 한 자리에 합치거나, 시점을 분산하거나(첫 방문 / 3회차 이후), 흐름을 막지 않는 표시(배너·인라인)로 낮춘다. 무엇을 남길지 우선순위를 정한다.<\/li><\/ul><h2 id=\"USABILITY_REVIEW-h8\">2. UR-02 흐름 중단<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 사용자가 하던 일을 <strong>멈춰 세우는<\/strong> 지점. 진행을 막는 확인 단계, 별도 화면으로 튕겨 나갔다 돌아와야 하는 구간, 입력 도중 끼어드는 요청.<\/li><li><strong>왜 문제인가<\/strong>: 중단마다 사용자는 맥락을 다시 잡아야 하고, 그 지점이 이탈 지점이 된다. 중단이 정말 필요한 곳(되돌릴 수 없는 행동)과 습관적으로 넣은 곳이 구분되지 않은 채 섞여 있는 경우가 많다.<\/li><li><strong>권장 조치<\/strong>: 각 중단에 &quot;여기서 멈추지 않으면 무슨 일이 생기는가&quot;를 답해 보고, 답이 없으면 인라인 처리나 사후 안내로 바꾼다. 되돌릴 수 있는 행동은 멈춰 세우지 않는다.<\/li><\/ul><h2 id=\"USABILITY_REVIEW-h9\">3. UR-03 예외 상황<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 데이터가 <strong>없을 때<\/strong> / 요청이 <strong>실패했을 때<\/strong> / 항목이 <strong>아주 많을 때<\/strong> 이 화면이 어떻게 되는지. 빈 목록·오류 문구·로딩·긴 목록의 자리가 화면과 논의 어디에도 없는 상태.<\/li><li><strong>왜 문제인가<\/strong>: 목업은 늘 &quot;잘 된 경우&quot;만 그린다. 그런데 실제로 사용자가 불편을 느끼는 순간은 대부분 예외 상황이다. 설계 단계에서 자리를 잡아 두지 않으면 개발 시점에 각자 다르게 처리되고, 그때는 고치는 비용이 크다.<\/li><li><strong>권장 조치<\/strong>: 목업 단계에서도 빈 상태·오류 상태의 자리와 문구를 잡는다. 목록에는 개수 상한과 그 이후의 처리(더 보기·검색·정렬)를 정한다.<\/li><\/ul><h2 id=\"USABILITY_REVIEW-h10\">4. UR-04 되돌리기·오조작<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 잘못 눌렀을 때 되돌릴 수 있는지. 되돌릴 수 없는 행동(삭제·전송·신청·해지)이 확인 없이 실행되거나, 반대로 되돌릴 수 있는 행동에 과한 확인이 붙어 있는지. 위험한 버튼이 자주 누르는 버튼 바로 옆에 있는지.<\/li><li><strong>왜 문제인가<\/strong>: 금융 화면에서 오조작은 되돌리기 어려운 결과로 이어진다. 확인 절차의 무게가 행동의 무게와 어긋나 있으면, 사용자는 모든 확인을 습관적으로 통과시키게 되어 정작 중요한 확인이 작동하지 않는다.<\/li><li><strong>권장 조치<\/strong>: 행동의 되돌림 가능 여부에 따라 확인의 무게를 맞춘다. 되돌릴 수 없는 것에만 확인을 두고, 나머지는 실행 후 취소(undo)로 바꾼다. 위험한 버튼은 물리적으로 떨어뜨린다.<\/li><\/ul><h2 id=\"USABILITY_REVIEW-h11\">5. UR-05 사용 맥락<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 실제로 쓰이는 상황에서도 되는지. 창구 대기줄에서 서둘러 쓸 때, 작은 화면에서, 한 손으로, 밝은 곳에서, 통신이 느릴 때. 화면이 전제하고 있는 사용 환경이 논의에서 확인된 적 있는지.<\/li><li><strong>왜 문제인가<\/strong>: 설계와 검토는 큰 모니터 앞에서 여유 있게 이루어지는데, 사용은 그렇지 않다. 한 화면에 담긴 정보량과 필요한 조작 정확도가 실제 맥락과 맞지 않으면 화면 자체는 멀쩡한데 못 쓰는 상태가 된다.<\/li><li><strong>권장 조치<\/strong>: 이 화면이 언제·어디서 쓰이는지를 논의에서 먼저 정한다. 그 맥락에서 한 화면에 필요한 결정의 수와 터치 정확도를 낮춘다.<\/li><\/ul><h2 id=\"USABILITY_REVIEW-h12\">6. UR-06 빠진 이해관계자<\/h2><ul><li><strong>무엇을 보는가<\/strong>: 이 논의에 <strong>없었던 사람<\/strong>에게 이 화면이 어떻게 보이는지. 운영자·콜센터 상담원·창구 직원 같은 내부 사용자, 저시력·고령·저숙련 사용자, 처음 쓰는 사람과 매일 쓰는 사람.<\/li><li><strong>왜 문제인가<\/strong>: 논의 참여자는 대개 제품을 잘 아는 사람들이다. 그래서 &quot;이 정도면 알겠지&quot;의 기준이 실제 사용자보다 높게 잡히고, 화면에 나오지 않는 운영 부담(문의 응대·수동 처리)이 논의에서 통째로 빠진다.<\/li><li><strong>권장 조치<\/strong>: 지적할 때 <strong>누가<\/strong> 곤란해지는지를 함께 적는다. 필요하면 그 역할의 담당자를 논의에 부른다.<\/li><\/ul><hr><h2 id=\"USABILITY_REVIEW-h13\">7. 렌즈를 고칠 때<\/h2><ul><li>이 문서가 <strong>정본<\/strong>이다. <code>mockup/lib/usability-lenses.ts<\/code>는 이 표를 코드로 옮긴 사본이며, 각 항목이 여기 절 번호를 참조한다. <strong>한쪽만 고치지 말 것.<\/strong><\/li><li>렌즈를 추가·수정하면 <code>개발문서/기능명세/FR-15_UX리스크검토.md<\/code>와 <code>개발문서/기능명세/00_CHANGELOG.md<\/code>를 함께 갱신한다.<\/li><li>결정이 바뀌면 이전 내용을 지우지 말고 <del>취소선<\/del>으로 남기고 새 내용을 추가한다.<\/li><li><strong>렌즈를 늘리는 것은 신중하게.<\/strong> RESPONSIBLE_DESIGN.md 5절과 같은 이유다 — 렌즈가 늘면 검토 결과가 길어지고, 길어진 결과는 읽히지 않는다. 새 렌즈를 넣기 전에 기존 여섯 개 중 하나로 담기지 않는지 먼저 본다.<\/li><li><strong>RR 규칙으로 판정 가능한 것은 여기 넣지 않는다.<\/strong> 요소 하나로 답이 나오는 것은 RESPONSIBLE_DESIGN.md의 몫이다.<\/li><\/ul>"}];

    INDEX.push({ doc:d.id, anchor:cur, kind:kind, text:t });

  g0.appendChild(h0);

    var d = DOCMAP[f.doc];

    b.onclick = function(){ go("#"+f.doc) };

  });
  g0.appendChild(b0); nav.appendChild(g0);

  GROUPS.forEach(function(g){

    var wrap = el("div","grp" + (S.closed[g] ? " closed" : ""));

    h.innerHTML = '<svg class="cv" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 4L5 6.5L7.5 4"/></svg><span class="tt">'+esc(g)+'</span><span class="ct">'+list.length+'</span>';
    h.onclick = function(){ S.closed[g] = !S.closed[g]; navRender() };
    wrap.appendChild(h);
    var body = el("div","grp-b");
    list.forEach(function(d){
      var on = S.view==="doc" && S.doc===d.id;
      var b = el("button","nl" + (on ? " on" : "") + (roleDim(d) ? " dim" : ""));
      b.innerHTML = (d.feature ? '<span class="frid">'+d.feature+'</span>' : '')
        + '<span class="nm">'+esc(d.feature ? d.title.slice(6) : d.title)+'</span>'
        + (d.changed ? '<span class="dot" title="이번 커밋에서 수정됨"></span>' : '');
      b.onclick = function(){ go("#"+d.id) };
      body.appendChild(b);
      if(on && d.headings.length){
        var sub = el("div","sub");
        d.headings.filter(function(x){return x.lv===2}).forEach(function(x){
          var s = el("button",null,x.text);
          s.onclick = function(){ go("#"+x.id) };
          sub.appendChild(s);
        });
        body.appendChild(sub);
      }
    });
    wrap.appendChild(body); nav.appendChild(wrap);
  });
}
function roleDim(d){ return S.role!=="all" && d.roles.indexOf(S.role)<0 }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

/* ============================================================ COVER */
function visible(){
  return FEATURES.filter(function(f){
    if(S.f.phase!=="all" && f.phases.indexOf(S.f.phase)<0) return false;
    if(S.f.proto==="partial" && f.stages.proto!=="partial") return false;
    if(S.f.proto==="todo" && f.stages.proto!=="todo") return false;
    if(S.f.area!=="all" && f.areas.indexOf(S.f.area)<0) return false;
    if(S.f.open && !f.open) return false;
    return true;
  });
}
/* 값을 고정하지 않고 FEATURES 에서 뽑는다 — 프로젝트마다 단계·영역 체계가 다르고,
   쓰이지 않는 필터가 남으면 눌러도 아무것도 걸러지지 않는다. */
function dimOpts(key, label){
  var seen = [];
  FEATURES.forEach(function(f){
    (f[key] || []).forEach(function(v){ if(seen.indexOf(v) < 0) seen.push(v) });
  });
  return [["all","전체"]].concat(seen.sort().map(function(v){ return [v, label ? (label[v] || v) : v] }));
}
var DIMS = [
  {k:"phase", lbl:"개발 단계", opts:dimOpts("phases")},
  {k:"proto", lbl:"프로토타입", opts:[["all","전체"],["partial","부분 검증"],["todo","미검증"]]},
  {k:"area",  lbl:"영역", opts:dimOpts("areas", AREA_LABEL)}
];
function dimLabel(k,v){ var d=DIMS.filter(function(x){return x.k===k})[0]; var o=d.opts.filter(function(x){return x[0]===v})[0]; return o?o[1]:v }

function coverRender(){
  var m = $("#main"); m.className="main wide"; m.innerHTML="";
  var inner = el("div","inner");

  var head = el("div","cover-h");
  head.innerHTML = '<div class="eyebrow">PROJECT DOCUMENTATION</div>'
    + '<h2>NH 위드캔버스 프로젝트 문서</h2>'
    + '<p>기획부터 구현 규범까지, 개발에 필요한 기준을 한곳에 모았습니다. 문서를 순회하지 않고 기능 하나를 끝까지 확인하실 수 있습니다.</p>';
  inner.appendChild(head);

  var part = FEATURES.filter(function(f){return f.stages.proto==="partial"}).length;
  var ops  = FEATURES.filter(function(f){return f.stages.ops==="done"}).length;
  var open = FEATURES.reduce(function(a,f){return a+f.open},0);

  var sh = el("div","sect-h");
  sh.innerHTML = '<h3>기능 단위 개발 요건</h3><div class="sum">기능 <b>'+FEATURES.length+'개</b> · 프로토타입 부분 검증 <b>'+part+'개</b> · 운영 구현 <b>'+ops+'개</b> · 미결 <b>'+open+'건</b></div>';
  inner.appendChild(sh);

  /* filter bar */
  var bar = el("div","fbar");
  var grid = el("div","fgrid");
  DIMS.forEach(function(d){
    var box = el("div","fdim");
    box.appendChild(el("div","lbl",d.lbl));
    var cs = el("div","chips");
    d.opts.forEach(function(o){
      var b = el("button","chip",o[1]);
      b.setAttribute("aria-pressed", S.f[d.k]===o[0] ? "true":"false");
      b.onclick = function(){ S.f[d.k] = (S.f[d.k]===o[0] && o[0]!=="all") ? "all" : o[0]; coverRender() };
      cs.appendChild(b);
    });
    box.appendChild(cs); grid.appendChild(box);
  });
  var solo = el("div","fdim");
  solo.appendChild(el("div","lbl","단독 조건"));
  var sc = el("div","chips");
  var sb = el("button","chip solo","❓ 미결 있는 기능만");
  sb.setAttribute("aria-pressed", S.f.open ? "true":"false");
  sb.onclick = function(){ S.f.open = !S.f.open; coverRender() };
  sc.appendChild(sb); solo.appendChild(sc); grid.appendChild(solo);
  bar.appendChild(grid);

  var vis = visible();
  var foot = el("div","fbar-foot");
  var st = el("div","st"); st.innerHTML = '<b>'+vis.length+'개</b> / '+FEATURES.length+'개 표시';
  foot.appendChild(st);
  var actives = [];
  DIMS.forEach(function(d){ if(S.f[d.k]!=="all") actives.push([d.k, d.lbl, dimLabel(d.k,S.f[d.k])]) });
  if(S.f.open) actives.push(["open","단독","미결 있는 기능만"]);
  actives.forEach(function(a){
    var c = el("span","act");
    c.innerHTML = '<i>'+esc(a[1])+'</i> '+esc(a[2]);
    var x = el("button",null,"×"); x.setAttribute("aria-label", a[2]+" 해제");
    x.onclick = function(){ if(a[0]==="open") S.f.open=false; else S.f[a[0]]="all"; coverRender() };
    c.appendChild(x); foot.appendChild(c);
  });
  if(actives.length){
    var r = el("button","reset","조건 모두 해제");
    r.onclick = function(){ S.f={phase:"all",proto:"all",area:"all",open:false}; coverRender() };
    foot.appendChild(r);
  }
  bar.appendChild(foot); inner.appendChild(bar);

  /* cards */
  var cards = el("div","fgridcards");
  if(!vis.length){
    cards.appendChild(el("div","empty","조건에 맞는 기능이 없습니다. 조건을 완화해 주세요."));
  } else vis.forEach(function(f){
    var c = el("button","fc");
    var top = '<div class="fc-top"><span class="fc-id">'+f.id+'</span><span class="fc-ph">'+f.phases.join("·")+'</span>'
      + (f.open ? '<span class="fc-q">❓ '+f.open+'</span>' : '') + '</div>';
    var body = '<div class="fc-body"><h4>'+esc(f.name)+'</h4><p>'+esc(f.summary)+'</p>'
      + '<dl class="fc-meta">'
      + '<dt>US</dt><dd>'+esc(f.us)+'</dd>'
      + '<dt>화면</dt><dd>'+esc(f.screens)+'</dd>'
      + '<dt>API</dt><dd class="mono">'+esc(f.api)+'</dd>'
      + '<dt>티켓</dt><dd>'+esc(f.ticket)+'</dd></dl></div>';
    var rail = '<div class="rail3">' + ["design","proto","ops"].map(function(k){
      var v = f.stages[k];
      return '<span class="st '+v+'" data-tip="'+STAGE_LABEL[k]+' — '+STATE_LABEL[v]+'"><span class="bar"></span><span class="nm">'+STAGE_LABEL[k]+'</span></span>';
    }).join("") + '</div>';
    c.innerHTML = top + body + rail;
    c.onclick = function(){ go("#"+f.doc) };
    cards.appendChild(c);
  });
  inner.appendChild(cards);

  /* role entries */
  var roles = el("div","roles");
  ROLES.forEach(function(r){
    var box = el("div","role" + (r.id==="dev" ? " dev":""));
    box.innerHTML = '<h4>'+esc(r.label)+'</h4><p>'+esc(r.desc)+'</p>';
    var ul = el("ul");
    r.docs.forEach(function(id){
      var d = DOCMAP[id]; if(!d) return;
      var li = el("li"); var b = el("button");
      b.innerHTML = '<span>'+esc(d.title)+'</span>' + (d.changed ? '<span class="dot" style="width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500)"></span>' : '') + '<span class="ar">›</span>';
      b.onclick = function(){ go("#"+id) };
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul); roles.appendChild(box);
  });
  inner.appendChild(roles);
  m.appendChild(inner);
  tocRender(null);
}

/* ============================================================ DOC VIEW */
/* 링크 띠 그룹. 빌드가 f.links 를 주입하면 그것을 쓴다 — 문서 단위가 아니라
   US-020 · S03 같은 식별자로 찾아낸 정확한 헤딩 앵커까지 담겨 있다.
   주입이 없으면(이 파일을 단독으로 열어 디자인만 볼 때) CANON 으로 문서 단위 링크를 만든다. */
function railGroups(f){
  if(f.links) return f.links;
  function grp(key, texts, mono){
    return { key:CANON[key].label, mono:!!mono,
             links:texts.filter(Boolean).map(function(t){ return { label:t, href:"#"+CANON[key].doc } }) };
  }
  return [
    grp("req", [f.id+" 요구 항목"]),
    grp("us",  f.us ? f.us.split(", ") : []),
    grp("sc",  [f.screens]),
    grp("api", [f.api], true),
    grp("bl",  [f.ticket]),
    grp("q",   f.open ? Array.from({length:f.open}).map(function(_,i){ return "OI-"+f.id.slice(3)+"-"+(i+1) }) : [])
  ];
}

function docRender(id){
  var d = DOCMAP[id]; if(!d){ coverRender(); return }
  var m = $("#main"); m.className="main"; m.innerHTML="";
  var inner = el("div","inner");

  var h = el("div","doc-h");
  h.innerHTML = '<div class="crumb">'+esc(d.group)+' <span style="color:var(--bd)">›</span> '+esc(d.feature ? d.feature : d.id)+'</div>'
    + '<h2>'+esc(d.title)+'</h2><p class="lede">'+esc(d.lede)+'</p>';
  var chips = el("div","metachips");
  /* 문서마다 마지막으로 바뀐 시점이 다르다. 저장소 HEAD(BUILD)로 갈음하지 않는다. */
  chips.innerHTML = '<span class="mchip"><b class="mono">'+esc(d.commit || BUILD.commit)+'</b></span>'
    + '<span class="mchip">최종 수정 <b>'+esc(d.date || BUILD.date)+'</b></span>'
    + '<span class="mchip">작성 <b>'+esc(d.author)+'</b></span>'
    + '<span class="mchip mono">'+esc(d.path)+'</span>'
    + '<span class="mchip">'+d.size+'</span>'
    + (d.changed ? '<span class="mchip hi">이번 커밋에서 수정됨</span>' : '');
  h.appendChild(chips); inner.appendChild(h);

  if(d.feature){
    var f = FEATMAP[d.feature];
    var band = el("div","canon");
    band.innerHTML = '<div class="canon-h"><span class="t">이 기능 관련 정본</span><span class="d">본 문서와 상충하면 아래 문서를 우선합니다</span>'
      + '<span class="rail-mini">' + ["design","proto","ops"].map(function(k){
          return '<span class="rmini '+f.stages[k]+'">'+STAGE_LABEL[k]+' · '+STATE_LABEL[f.stages[k]]+'</span>' }).join("") + '</span></div>';
    var b = el("div","canon-b");
    railGroups(f).forEach(function(g){
      var box = el("div","cgrp" + (g.key==="미결" ? " q":""));
      box.appendChild(el("div","gl",g.key));
      var gi = el("div","gi");
      if(!g.links.length) gi.appendChild(el("span","none","없음"));
      else g.links.forEach(function(t){
        var bt = el("button",null,t.label); if(g.mono) bt.style.fontFamily="var(--mono)", bt.style.fontSize="12px";
        bt.onclick = function(){ go(t.href) };
        gi.appendChild(bt);
      });
      box.appendChild(gi); b.appendChild(box);
    });
    band.appendChild(b); inner.appendChild(band);
  }

  var md = el("div","md"); md.innerHTML = d.body;
  Array.prototype.forEach.call(md.querySelectorAll("table"), function(t){
    var w = el("div","tw"), sc = el("div","tw-scroll");
    t.parentNode.insertBefore(w,t); sc.appendChild(t); w.appendChild(sc);
    var upd = function(){ w.classList.toggle("more", sc.scrollWidth - sc.clientWidth - sc.scrollLeft > 8) };
    sc.addEventListener("scroll", upd); setTimeout(upd,0);
  });
  inner.appendChild(md);
  m.appendChild(inner);
  tocRender(d);
}

/* ============================================================ TOC */
var spy = null;
function tocRender(d){
  var t = $("#toc"), shell = $("#shell");
  if(spy){ spy.disconnect(); spy = null }
  if(!d || !d.headings.length){ shell.classList.remove("has-toc"); t.innerHTML=""; return }
  shell.classList.add("has-toc");
  t.innerHTML = '<div class="h">이 문서</div>';
  var ul = el("ul");
  d.headings.forEach(function(x){
    var li = el("li", x.lv===3 ? "l3":"");
    var b = el("button",null,x.text);
    b.dataset.a = x.id;
    b.onclick = function(){ jump(x.id) };
    li.appendChild(b); ul.appendChild(li);
  });
  t.appendChild(ul);
  var btns = Array.prototype.slice.call(t.querySelectorAll("button"));
  spy = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      btns.forEach(function(b){ b.classList.toggle("on", b.dataset.a === e.target.id) });
    });
  },{ rootMargin:"0px 0px -72% 0px", threshold:0 });
  d.headings.forEach(function(x){ var n=document.getElementById(x.id); if(n) spy.observe(n) });
}
function jump(a){
  var n = document.getElementById(a);
  if(n){ window.scrollTo({ top: n.getBoundingClientRect().top + window.pageYOffset - 20, behavior:"smooth" }) }
  if(location.hash.slice(1) !== a) history.pushState(null,"","#"+a);
}

/* ============================================================ SEARCH */
function searchRender(q){
  var m = $("#main"); m.className="main"; m.innerHTML="";
  var inner = el("div","inner");
  var needle = q.toLowerCase(), hits = [];
  for(var i=0;i<INDEX.length && hits.length<400;i++){
    var e = INDEX[i], p = e.text.toLowerCase().indexOf(needle);
    if(p>=0) hits.push({ e:e, p:p });
  }
  var h = el("div","sr-h");
  var t = el("h2"); t.appendChild(document.createTextNode('"'));
  var em = el("em",null,q); t.appendChild(em);
  t.appendChild(document.createTextNode('" 검색 결과 ' + hits.length + '건'));
  h.appendChild(t);
  h.appendChild(el("div","c", hits.length>60 ? "관련도 순 상위 60건을 표시합니다." : "모든 결과를 표시합니다."));
  inner.appendChild(h);

  if(!hits.length){
    inner.appendChild(el("div","sr-none","일치하는 내용이 없어요."));
  } else {
    var list = el("div","sr-list");
    hits.slice(0,60).forEach(function(hit){
      var e = hit.e, d = DOCMAP[e.doc];
      var b = el("button","sr");
      var src = el("div","src");
      src.appendChild(el("span","kind", e.kind));
      var bb = el("b",null,d.title); src.appendChild(bb);
      b.appendChild(src);
      var sn = el("div","snip");
      var start = Math.max(0, hit.p-42), pre = e.text.slice(start, hit.p);
      if(start>0) sn.appendChild(document.createTextNode("… "));
      sn.appendChild(document.createTextNode(pre));
      var mk = el("mark", null, e.text.substr(hit.p, q.length)); sn.appendChild(mk);
      var post = e.text.slice(hit.p+q.length, hit.p+q.length+120);
      sn.appendChild(document.createTextNode(post));
      if(e.text.length > hit.p+q.length+120) sn.appendChild(document.createTextNode(" …"));
      b.appendChild(sn);
      b.onclick = function(){ $("#q").value=""; $("#searchWrap").classList.remove("filled"); S.q=""; go("#" + (e.anchor || e.doc)) };
      list.appendChild(b);
    });
    inner.appendChild(list);
  }
  m.appendChild(inner);
  tocRender(null);
}

/* ============================================================ ROUTER */
function go(hash){ if(location.hash === hash) route(); else location.hash = hash }
/* 모바일 드로어. 데스크톱에서는 .mtop 이 숨겨져 있어 열릴 일이 없다. */
function setNav(open){
  $("#shell").classList.toggle("nav-open", open);
  $("#mnavBtn").setAttribute("aria-expanded", open ? "true" : "false");
  document.body.style.overflow = open ? "hidden" : "";
}
$("#mnavBtn").onclick = function(){ setNav(!$("#shell").classList.contains("nav-open")) };
$("#mnavBack").onclick = function(){ setNav(false) };
document.addEventListener("keydown", function(e){ if(e.key === "Escape") setNav(false) });

function route(){
  setNav(false);
  var a = decodeURIComponent(location.hash.slice(1));
  if(S.q.length>=2){ searchRender(S.q); navRender(); return }
  if(!a){ S.view="cover"; S.doc=null; coverRender(); navRender(); window.scrollTo(0,0); return }
  var doc = DOCMAP[a], anchor = null;
  if(!doc){
    for(var i=0;i<DOCS.length;i++){
      if(DOCS[i].headings.some(function(h){return h.id===a})){ doc = DOCS[i]; anchor = a; break }
    }
  }
  if(!doc){ S.view="cover"; S.doc=null; coverRender(); navRender(); return }
  S.view="doc"; S.doc=doc.id;
  docRender(doc.id); navRender();
  if(anchor){ var n=document.getElementById(anchor); if(n) window.scrollTo(0, n.getBoundingClientRect().top + window.pageYOffset - 20) }
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ============================================================ WIRING */
$("#brandBtn").onclick = function(){ $("#q").value=""; S.q=""; $("#searchWrap").classList.remove("filled"); go("#") };
$("#docCount").textContent = DOCS.length;
$("#buildCommit").textContent = BUILD.commit;
$("#buildDate").textContent = BUILD.date;
$("#buildVersion").textContent = BUILD.version;

var qt;
$("#q").addEventListener("input", function(e){
  var v = e.target.value.trim();
  $("#searchWrap").classList.toggle("filled", !!e.target.value);
  clearTimeout(qt);
  qt = setTimeout(function(){
    var was = S.q.length>=2;
    S.q = v;
    if(v.length>=2){ searchRender(v); navRender(); window.scrollTo(0,0) }
    else if(was){ route(); window.scrollTo(0,0) }
  }, 120);
});
$("#clrBtn").onclick = function(){ $("#q").value=""; S.q=""; $("#searchWrap").classList.remove("filled"); route(); $("#q").focus() };

Array.prototype.forEach.call($("#roleSeg").children, function(b){
  b.onclick = function(){
    S.role = b.dataset.role;
    Array.prototype.forEach.call($("#roleSeg").children, function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false") });
    navRender();
  };
});

var THEME_KEY = "wc-doc-theme";
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeTxt").textContent = t==="dark" ? "라이트 모드" : "다크 모드";
  $("#themeIco").textContent = t==="dark" ? "◑" : "◐";
  try{ localStorage.setItem(THEME_KEY, t) }catch(e){}
}
$("#themeBtn").onclick = function(){ setTheme(document.documentElement.dataset.theme==="dark" ? "light":"dark") };
try{ setTheme(localStorage.getItem(THEME_KEY)==="dark" ? "dark":"light") }catch(e){ setTheme("light") }

route();
</script>
