<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S05 Result/Review<\/td><td>AI 의견 요약 표시, 원 의견과 연결<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-07_AI의견취합-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/reviews/summarize<\/code><\/td><td>AI 취합 요청<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}/reviews<\/code><\/td><td>취합 결과 조회<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-07_AI의견취합-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-031<\/td><td>AI 의견 취합<\/td><td>원 의견-요약 연결 보존, AI 결과는 제안(자동 확정 금지), 미분류 의견 누락 금지<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-07_AI의견취합-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-07 · US-031 · <code>/reviews<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>— 미검증<\/td><td>프로토타입(<a href=\"#MockupGen_기능명세서\">MockupGen<\/a>)에 의견 취합 기능 없음<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>POST /reviews/summarize<\/code> 가 비동기 Job 을 만들고 워커가 합의/이견/추가확인으로 묶는다. <strong>근거 댓글이 없는 항목은 저장하지 않는다.<\/strong> backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-008<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-08_반영결정","group":"기능명세","title":"FR-08 · 반영 결정","lede":"반영 / 보류 / 반려 — 사람이 확정","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-08_반영결정.md","size":"3KB","changed":false,"roles":[],"feature":"FR-08","body":"<h1 id=\"FR-08_반영결정-h0\">FR-08 반영 결정 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-08_반영결정-h1\">1. 개요<\/h2><p>AI 제안은 자동 확정하지 않으며 담당자가 반영/보류/반려를 선택한다. (PRD 9절)<br>&quot;AI가 제안하고, 사람이 최종 결정한다&quot;는 이 제품의 설계 원칙을 실행하는 기능이다(기획안 3-3절).<\/p><h2 id=\"FR-08_반영결정-h2\">2. 동작 상세<\/h2><ul><li>AI가 취합한 각 의견(<a href=\"#FR-07_AI의견취합\">FR-07<\/a>)에 대해 담당자가 <strong>반영 / 보류 / 반려<\/strong>를 선택한다.<\/li><li>결정 이유를 선택적으로 기록한다. 결정은 <code>review_items 1:1 review_decisions<\/code>로 남는다.<\/li><li>반영으로 선택된 의견을 기준으로 AI 수정 작업이 생성된다 → <a href=\"#FR-05_AI제작\">FR-05<\/a> (source_type=AI_REVISION)<\/li><li>결정은 새 Version 생성의 근거가 되어, 어떤 의견이 어떤 결정을 거쳐 어느 버전에 반영됐는지 추적할 수 있다 → <a href=\"#FR-09_버전관리\">FR-09<\/a><\/li><li>관련 의견 상태가 함께 전이된다: <code>REVIEWED → ACCEPTED / REJECTED / DEFERRED<\/code> (03 상태 모델)<\/li><\/ul><h2 id=\"FR-08_반영결정-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S05 Result/Review<\/td><td>AI 의견 요약과 반영 선택을 한 화면에서 연결<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-08_반영결정-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/reviews/{reviewId}/decisions<\/code><\/td><td>반영/보류/반려 결정 등록<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-08_반영결정-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-032<\/td><td>반영 결정<\/td><td>의견별 반영/보류/반려 선택, 결정 이유 선택 기록, 선택 의견 기준 AI 수정 작업 생성<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-08_반영결정-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-08 · US-032 · <code>/decisions<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>— 미검증<\/td><td>프로토타입(<a href=\"#MockupGen_기능명세서\">MockupGen<\/a>)에 반영 결정 기능 없음<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>POST /reviews/{id}/decisions<\/code> 로 항목별 반영/보류/반려를 한 번에 확정하고 <code>resulting_version_id<\/code> 로 Version 에 잇는다. EDITOR 이상만 가능. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-008<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-09_버전관리","group":"기능명세","title":"FR-09 · Version","lede":"스냅샷 · 부모 관계 · 비교","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-09_버전관리.md","size":"5KB","changed":false,"roles":[],"feature":"FR-09","body":"<h1 id=\"FR-09_버전관리-h0\">FR-09 Version v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-09_버전관리-h1\">1. 개요<\/h2><p>결과물이 변경되면 불변에 가까운 Version 스냅샷을 만들고 작성 원인과 연결한다. (PRD 9절)<br>Version은 결과물의 논리적 스냅샷(상태)이고, 과정 기록은 History가 담당한다 — 두 모델은 분리된다(기획안 6-1절).<\/p><h2 id=\"FR-09_버전관리-h2\">2. 동작 상세<\/h2><ul><li>Version 번호(<code>version_no<\/code>)는 순차 부여되고, 각 Version은 <code>parent_version_id<\/code>로 이전 Version과 부모 관계를 가진다.<\/li><li>생성 원인을 <code>source_type<\/code>으로 남긴다: <code>AI_GENERATION / AI_REVISION / MANUAL_EDIT / IMPORT<\/code>. AI 작업이 원인이면 <code>source_job_id<\/code>로 Job과 연결한다 → <a href=\"#FR-05_AI제작\">FR-05<\/a><\/li><li>두 Version의 변경 전/후를 비교하고, 변경 사유와 연결된 의견·결정을 함께 볼 수 있다 → <a href=\"#FR-08_반영결정\">FR-08<\/a><\/li><li>Version별 산출물 파일은 <code>version_files<\/code>로 연결하고 바이너리는 File Storage에 둔다.<\/li><li>사용자가 &quot;왜 바뀌었는지&quot;를 두 번 이상 클릭하지 않고 확인할 수 있어야 한다(03 UX 원칙).<\/li><li><strong>(2026-09-05) 요소 단위 편집은 새 Version을 만들지 않는다.<\/strong> 버튼 문구 하나를 고칠 때마다 Version이 늘면 계보가 잡음으로 가득 찬다. 대신 <code>element_patches<\/code>에 편집 이력으로 쌓고(누가·왜·언제·되돌림 여부), 결과물을 확정할 때 Version으로 승격한다.<ul><li>Version = 합의된 스냅샷, 패치 = 그 사이의 손질. 이 구분이 ARCHITECTURE.md 5절의 Version/History 분리와 같은 축이다.<\/li><li>화면을 다시 만드는 것(재생성)은 기존 화면을 덮어쓰지 않고 <strong>새 Version + 새 화면 행<\/strong>을 만든다. 그래서 과거 Version의 패치와 의견은 그 Version 안에서 영구히 유효하다.<\/li><li><strong>(2026-09-08) 저장본은 덮어쓰지 않되, 서버가 읽을 때 얹는다(baking).<\/strong> 화면에 보이는 것은 프레임이 패치를 얹은 결과지만 HTML 다운로드·AI 검토는 서버에서 저장본을 읽는다. 얹지 않으면 <strong>그쪽만 편집 이전 상태를 본다<\/strong> — 화면과 산출물이 갈린다. <code>lib/canvas/patches.ts<\/code>의 <code>bakeScreenHtml()<\/code>이 사본을 만들며 <code>screens.html_content<\/code>는 그대로 둔다. <strong>서버에서 화면 HTML을 읽는 곳은 전부 이 함수를 거친다.<\/strong><\/li><li>❓ <strong>미결<\/strong>: 패치를 Version으로 승격하는 시점을 사용자가 명시적으로 정하는지, 아니면 자동인지. 위 Version 승인 개념과 함께 정해야 한다.<\/li><\/ul><\/li><li>❓ <strong>미결<\/strong>: Version 승인 개념 도입 여부 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a>. 프로토타입은 버전 삭제를 허용하지만 정본은 &quot;불변에 가까운&quot; 스냅샷이 원칙 — 삭제 정책 확정 필요.<\/li><\/ul><h2 id=\"FR-09_버전관리-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S06 Version<\/td><td>목록, 현재 버전, 비교 대상 선택, 변경 요약, 관련 의견<\/td><\/tr><tr><td>S03 Project Workspace<\/td><td>상단 Version 진입<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-09_버전관리-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}/versions<\/code><\/td><td>목록<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/versions/{versionId}<\/code><\/td><td>상세<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/versions/{versionId}/compare?baseVersionId=...<\/code><\/td><td>비교<\/td><\/tr><\/tbody><\/table><\/div><p>오류: 409(Version/동시성 충돌). 정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-09_버전관리-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-040<\/td><td>Version 생성<\/td><td>순차 번호, 부모 관계, 생성 원인(AI 작업/사용자 변경) 연결<\/td><\/tr><tr><td>US-041<\/td><td>변경 비교<\/td><td>전/후 비교, 변경 사유·연결 의견 확인<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-09_버전관리-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-09 · US-040/041 · <code>/versions<\/code> API · Version 모델(05 5절) 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-06(버전 목록·선택·삭제·채번). 비교·부모 관계·source_type은 미검증<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>Version 목록·상세·비교. 비교는 화면 key·파일 이름으로 짝짓고 <strong>baking 을 거친 HTML<\/strong> 을 비교한다. <code>version_no<\/code> 채번은 프로젝트 행을 잠그고 한다. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-009<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-10_히스토리","group":"기능명세","title":"FR-10 · History","lede":"행위 · 의사결정 시간순 기록","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-10_히스토리.md","size":"3KB","changed":false,"roles":[],"feature":"FR-10","body":"<h1 id=\"FR-10_히스토리-h0\">FR-10 History v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-10_히스토리-h1\">1. 개요<\/h2><p>사용자 행동, AI 작업, 댓글, 반영 결정, Version 생성을 시간순으로 기록한다. (PRD 9절)<br>History는 &quot;왜 이렇게 됐는가&quot;의 과정 기록이며, &quot;지금 어떤 상태인가&quot;를 담는 Version과 분리된 모델이다(기획안 6-1절).<\/p><h2 id=\"FR-10_히스토리-h2\">2. 동작 상세<\/h2><ul><li>행위 주체를 <code>actor_type<\/code>(USER / AI / SYSTEM)으로 구분해 기록한다. 사용자 행동과 AI 작업을 모두 조회할 수 있다.<\/li><li>기록 대상: 프로젝트 변경, 파일 등록, AI 작업, 댓글, 반영 결정, Version 생성. Version 생성 이벤트는 History와 연결된다 → <a href=\"#FR-09_버전관리\">FR-09<\/a><\/li><li>이벤트는 <code>action_type / target_type / target_id / payload_summary<\/code>로 남긴다(05 6절 History 모델). 원문 전체가 아닌 요약을 저장한다.<\/li><li>권한 없는 사용자는 History를 조회할 수 없다(프로젝트 멤버십 검증).<\/li><li>History(업무 과정 기록)와 감사 로그(운영·보안 기록)는 목적과 보존 정책이 다르다 → <a href=\"#FR-12_감사추적\">FR-12<\/a><\/li><\/ul><h2 id=\"FR-10_히스토리-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S07 History<\/td><td>시간순 Timeline — 사용자 작업, AI 작업, 댓글, 반영 결정, Version 생성<\/td><\/tr><tr><td>S03 Project Workspace<\/td><td>상단 History 진입<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-10_히스토리-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/v1/projects/{projectId}/history<\/code><\/td><td>프로젝트 History 조회<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-10_히스토리-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-042<\/td><td>History 조회<\/td><td>사용자·AI 작업 모두 조회, Version 생성 이벤트 연결, 무권한 조회 차단<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-10_히스토리-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-10 · US-042 · <code>/history<\/code> API · History 모델(05 6절) 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>— 미검증<\/td><td>프로토타입(<a href=\"#MockupGen_기능명세서\">MockupGen<\/a>)의 &quot;히스토리 탭&quot;은 버전 목록이며 행위 이력 기록이 아님<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>history_events<\/code> 기록기와 커서 기반 조회. USER/AI/SYSTEM 행위를 모두 남긴다. 무한 증가 리소스라 전체 반환 API 를 두지 않았다. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-010<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-11_Export","group":"기능명세","title":"FR-11 · Export","lede":"업무파일 생성 · Version 연결","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-11_Export.md","size":"4KB","changed":false,"roles":[],"feature":"FR-11","body":"<h1 id=\"FR-11_Export-h0\">FR-11 Export v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-11_Export-h1\">1. 개요<\/h2><p>최종 산출물을 실제 업무파일 형태로 생성/다운로드한다. (PRD 9절)<br>MVP는 기본 Export까지, PPTX/DOCX/HWPX/HTML 고도화는 후속 범위다(PRD 4절).<\/p><h2 id=\"FR-11_Export-h2\">2. 동작 상세<\/h2><ul><li>Export는 Version 단위로 요청한다. 장시간 변환은 비동기 Job으로 처리하고 포맷별 생성 상태를 보여준다.<\/li><li>다운로드 파일과 해당 Version을 연결해, 반출된 산출물이 어느 버전에서 나왔는지 추적한다 → <a href=\"#FR-09_버전관리\">FR-09<\/a><\/li><li>Export 결과 파일은 File Storage에 저장하고 DB에는 메타데이터만 남긴다(<code>exports<\/code>).<\/li><li>Export 요청·다운로드는 감사 대상 이벤트다 → <a href=\"#FR-12_감사추적\">FR-12<\/a><\/li><li><strong>(2026-09-08) 반출되는 HTML은 편집이 반영된 것이어야 한다.<\/strong> 요소 편집은 저장본을 덮어쓰지 않고 패치로 쌓이므로(<a href=\"#FR-09_버전관리\">FR-09<\/a>), 저장본을 그대로 내보내면 <strong>사람이 고친 내용이 빠진 파일<\/strong>이 나간다. 프로토타입의 화면 다운로드는 서버가 얹어 주는 <code>GET /api/screens/{screenId}/html<\/code>을 받는다.<ul><li>다운로드 단위는 <strong>지금 보고 있는 화면 한 장<\/strong>이다. 한 Version이 화면 여러 장을 가지므로 &quot;그 버전의 HTML&quot; 하나를 고를 수 없다. (이전에는 <code>mockup_versions.html_content<\/code>, 즉 첫 화면만 내려받았다)<\/li><li>❓ <strong>미결<\/strong>: Version 전체를 한 번에 반출하는 형태(화면 여러 장 묶음)는 정하지 않았다. 위 포맷 우선순위와 함께 정해야 한다.<\/li><\/ul><\/li><li>❓ <strong>미결<\/strong>: 지원 포맷 우선순위(HTML/PPTX/DOCX/HWPX — 기획안 7-3절), 파일 반출 허용 범위·승인 절차 — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a><\/li><\/ul><h2 id=\"FR-11_Export-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>상단 Export 진입<\/td><\/tr><tr><td>❓ 미정의<\/td><td>Export 상태·포맷 선택 전용 화면(S0x)이 정의되지 않음<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-11_Export-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/versions/{versionId}/exports<\/code><\/td><td>Export Job 생성<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/exports/{exportId}<\/code><\/td><td>상태·메타데이터 조회<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/exports/{exportId}/download<\/code><\/td><td>완료된 결과 파일 다운로드 — 감사 대상 이벤트(<a href=\"#FR-12_감사추적\">FR-12<\/a>)<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-11_Export-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-050<\/td><td>Export<\/td><td>포맷별 생성 상태 표시, 다운로드 파일-Version 연결<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-11_Export-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-11 · US-050 · <code>/exports<\/code> API 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>부분<\/td><td><a href=\"#MockupGen_기능명세서\">MockupGen<\/a> PFR-05-05(HTML 다운로드), PFR-10(기획서 HTML 생성·다운로드). HTML 한정이며 업무 포맷 변환·Version 연결은 미검증<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 부분<\/td><td>Export Job·전용 워커·다운로드·감사 기록까지. <strong>지원 포맷은 ZIP(화면별 HTML) 하나<\/strong>이며 반출 HTML 은 baking 을 거친다. PDF/PNG 는 렌더러가 필요하고 포맷 우선순위가 미결이라 422 로 거절한다. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-011<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-12_감사추적","group":"기능명세","title":"FR-12 · 감사 추적","lede":"인증 · 권한 · AI 호출 감사 이벤트","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-12_감사추적.md","size":"3KB","changed":false,"roles":[],"feature":"FR-12","body":"<h1 id=\"FR-12_감사추적-h0\">FR-12 감사 추적 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-12_감사추적-h1\">1. 개요<\/h2><p>주요 인증·권한·변경·AI 호출 관련 이벤트를 감사 대상으로 남길 수 있어야 한다. (PRD 9절)<br>운영 로그와 감사 로그를 구분하고(PRD 10절), 접근·감사 로그는 1년 이상 보존한다(<a href=\"#SECURITY\">보안 규칙<\/a>).<\/p><h2 id=\"FR-12_감사추적-h2\">2. 동작 상세<\/h2><ul><li>감사 대상 이벤트: 인증(로그인), 권한 부여·변경·회수, 파일 접근, AI 요청, Version 생성, Export/반출.<\/li><li>저장소는 <code>audit_logs<\/code> 테이블. 업무 과정 기록인 History(<code>history_events<\/code>)와 목적·보존 정책이 다르므로 분리한다 → <a href=\"#FR-10_히스토리\">FR-10<\/a><\/li><li>민감정보 원문(비밀번호·토큰·API 키·개인정보)은 로그에 남기지 않는다. Prompt·Response 원문 저장은 허용 범위 확정 전까지 금지.<\/li><li>로그 표준 포맷은 [시각, 사용자 ID, 출발지 IP, 요청/행위, 성공/실패]를 포함해야 한다. (❓ 포맷 정의 미착수)<\/li><li>❓ <strong>미결<\/strong>: 감사 정책·보존 정책 상세, 관리자용 조회 화면/API — <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a><\/li><\/ul><h2 id=\"FR-12_감사추적-h3\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>없음<\/td><td>사용자 대상 화면 없음. IA의 Admin(F) 노드가 후보이나 S0x 화면으로 정의되지 않음 (❓)<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-12_감사추적-h4\">4. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>없음<\/td><td>—<\/td><td>전용 API 미정의 (❓). 각 API 처리 과정에서 서버가 <code>audit_logs<\/code>에 기록<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-12_감사추적-h5\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-060<\/td><td>감사 로그<\/td><td>인증·권한 변경·파일 접근·AI 요청·Version 생성 이벤트를 정책에 따라 기록, 민감정보 원문 미기록<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-12_감사추적-h6\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-12 · US-060 · <code>audit_logs<\/code> 테이블 반영 (전용 API·화면은 미정의)<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>— 미검증<\/td><td>프로토타입(<a href=\"#MockupGen_기능명세서\">MockupGen<\/a>)에 감사 기능 없음<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 부분<\/td><td><code>audit_logs<\/code> 에 [시각·사용자·출발지 IP·행위·성공/실패] 를 남긴다. 업무 트랜잭션이 롤백돼도 시도 기록은 남도록 별도 트랜잭션이다. 다운로드·검토 실행·권한 변경이 대상. <strong>보존 정책(1년 이상)의 실제 운영 방식과 Admin 조회 화면은 미결.<\/strong> backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수 — 티켓 BE-010<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-13_브랜드시안제작","group":"기능명세","title":"FR-13 · 브랜드 시안 제작","lede":"카드 · 홍보물 컨셉 시안 · 3안 비교","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-13_브랜드시안제작.md","size":"9KB","changed":false,"roles":[],"feature":"FR-13","body":"<h1 id=\"FR-13_브랜드시안제작-h0\">FR-13 브랜드 시안 제작 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#09_UI_SPEC_브랜드시안\">화면 상세<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a><\/p><\/blockquote><h2 id=\"FR-13_브랜드시안제작-h1\">1. 개요<\/h2><p>카드 실물·홍보물의 <strong>컨셉 시안<\/strong>을 AI로 생성하고, 여러 방향을 나란히 놓고 관련 담당자가 방향을 합의하도록 지원한다. (PRD 9절)<\/p><p><strong>이 기능이 하는 일과 하지 않는 일을 먼저 못박는다.<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>한다<\/th><th>하지 않는다<\/th><\/tr><\/thead><tbody><tr><td>방향·톤·레이아웃·문구를 눈으로 비교할 수 있게 만든다<\/td><td>인쇄에 넘길 최종 파일을 만들지 않는다<\/td><\/tr><tr><td>기존 NH 자산(로고·컬러·서체)을 <strong>배치<\/strong>한다<\/td><td>새 디자인 시스템을 만들지 않는다 (PRD 5절 비범위 유지)<\/td><\/tr><tr><td>규격·자산·용도가 고정된 업무 산출물을 만든다<\/td><td>범용 디자인 생성기가 아니다 (<a href=\"#README\">개발문서 README<\/a>)<\/td><\/tr><tr><td>방향 결정을 Version·History에 남긴다<\/td><td>AI가 최종안을 확정하지 않는다 (<a href=\"#08_DECISIONS_OPEN_ISSUES\">결정 Q2<\/a>)<\/td><\/tr><\/tbody><\/table><\/div><p>산출물 수준은 <strong>컨셉 시안<\/strong>이다. 인쇄 규격(mm·CMYK·재단선·해상도)은 다루지 않는다. 실제 제작은 디자인 조직 또는 대행사가 이어받는다.<\/p><h3 id=\"FR-13_브랜드시안제작-h2\">기술적 전제 — 이미지는 생성되지 않는다<\/h3><p>LLM의 출력은 텍스트다. 시안은 <strong>고정 비율 캔버스 위의 HTML/CSS + 인라인 SVG<\/strong>로 그린다.<\/p><ul><li>표현 가능: 배경 그라데이션, 도형, 패턴, 타이포그래피, 레이아웃, 색 조합<\/li><li><strong>표현 불가: 로고·캐릭터·일러스트·사진.<\/strong> 이 소재는 AI가 만들지 못한다.<\/li><\/ul><p>따라서 소재는 <strong>브랜드 자산 라이브러리에 사전 등록된 것만<\/strong> 쓰고, AI는 그것을 배치하는 역할만 맡는다 → <a href=\"#FR-04_템플릿\">FR-04<\/a><\/p><h2 id=\"FR-13_브랜드시안제작-h3\">2. 동작 상세<\/h2><h3 id=\"FR-13_브랜드시안제작-h4\">2-1. 산출물 유형과 규격 프리셋<\/h3><p>MVP 지원 유형은 <strong>카드 실물<\/strong>과 <strong>홍보물(포스터/배너)<\/strong> 2종이다. 컨셉 시안이므로 물리 치수가 아니라 <strong>비율과 안전영역<\/strong>만 사용한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>프리셋 ID<\/th><th>이름<\/th><th>비율<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td><code>CARD_H<\/code><\/td><td>카드 (가로형)<\/td><td>1.586 : 1<\/td><td>ISO/IEC 7810 ID-1 비율<\/td><\/tr><tr><td><code>CARD_V<\/code><\/td><td>카드 (세로형)<\/td><td>1 : 1.586<\/td><td><\/td><\/tr><tr><td><code>POSTER_A<\/code><\/td><td>포스터 (A 계열 세로)<\/td><td>1 : 1.414<\/td><td>A2·A3 공용 비율<\/td><\/tr><tr><td><code>BANNER_SQ<\/code><\/td><td>디지털 배너 (정사각)<\/td><td>1 : 1<\/td><td>SNS·행내 게시<\/td><\/tr><\/tbody><\/table><\/div><p>프리셋은 코드에 넣지 않고 <code>templates<\/code>(BRAND_ASSET 유형)의 데이터로 관리한다. 유형을 늘릴 때 코드를 고치지 않게 한다.<\/p><h3 id=\"FR-13_브랜드시안제작-h5\">2-2. 입력<\/h3><ul><li><strong>브리프<\/strong>: 상품·캠페인명 / 타겟 / 전달할 느낌(키워드) / 반드시 들어갈 문구<\/li><li><strong>브랜드 자산 선택<\/strong>: 로고·컬러 토큰·서체 규칙 등 → <a href=\"#FR-04_템플릿\">FR-04<\/a><\/li><li><strong>참고자료 선택<\/strong>: 기존 업로드 파일 중 참조 대상 지정 → <a href=\"#FR-03_참고자료\">FR-03<\/a><\/li><\/ul><h3 id=\"FR-13_브랜드시안제작-h6\">2-3. 3안 동시 생성<\/h3><ul><li>AI 작업은 <strong><a href=\"#FR-05_AI제작\">FR-05<\/a>의 비동기 Job 구조를 그대로 재사용<\/strong>한다. 새 파이프라인을 만들지 않는다.<\/li><li><code>ai_jobs.job_type = BRAND_CONCEPT<\/code>으로 문서·화면 생성과 구분한다.<\/li><li>한 Job이 <strong>서로 다른 방향의 시안 3개<\/strong>를 만든다. <code>ai_job_outputs<\/code> 3행으로 저장하고 <code>variant_no<\/code>(1·2·3)로 구분한다.<\/li><li>각 시안에 <code>variant_label<\/code>(예: &quot;정통·신뢰형&quot;, &quot;젊고 경쾌한&quot;, &quot;프리미엄&quot;)을 붙여 <strong>왜 다른 방향인지<\/strong>를 화면에서 설명할 수 있게 한다. 비디자이너가 시각적 차이를 언어로 다룰 수 있어야 논의가 된다.<\/li><li>상태 전이·실패 처리·재시도·중복 제출 방지는 FR-05와 동일하다.<\/li><li>(❓ 3안 생성이 LLM 호출 3회인지 1회인지 미결 — AI 동시 호출 제한·최대 토큰과 직결. <a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a>)<\/li><\/ul><h3 id=\"FR-13_브랜드시안제작-h7\">2-4. 선택과 Version — 3안은 후보이지 Version이 아니다<\/h3><ul><li><strong>3안이 생성되는 시점에는 Version을 만들지 않는다.<\/strong> 아직 후보이기 때문이다.<\/li><li>사용자가 <strong>하나를 고르는 순간<\/strong> <code>versions<\/code> 1행이 생성된다. <code>source_type = AI_GENERATION<\/code>, <code>source_job_id<\/code>로 Job과 연결한다 → <a href=\"#FR-09_버전관리\">FR-09<\/a><\/li><li>고른 뒤 대화로 수정하면 <code>source_type = AI_REVISION<\/code>으로 새 Version이 이어진다.<\/li><li>이렇게 해야 Version 목록이 채택되지 않은 후보로 오염되지 않고, <strong>&quot;왜 이 방향을 골랐는가&quot;가 선택 시점의 History로 남는다<\/strong> → <a href=\"#FR-10_히스토리\">FR-10<\/a><\/li><\/ul><h3 id=\"FR-13_브랜드시안제작-h8\">2-5. 의견과 반영 결정<\/h3><ul><li>각 시안에 개별 의견을 등록할 수 있다 → <a href=\"#FR-06_협업의견\">FR-06<\/a><\/li><li>의견 취합·반영 결정은 기존 흐름을 그대로 쓴다 → <a href=\"#FR-07_AI의견취합\">FR-07<\/a> · <a href=\"#FR-08_반영결정\">FR-08<\/a><\/li><li>AI 제안은 자동 확정되지 않는다. 방향 선택도 반영 결정도 사람이 한다.<\/li><\/ul><h3 id=\"FR-13_브랜드시안제작-h9\">2-6. 보안<\/h3><p>생성 HTML은 <strong><a href=\"#FR-05_AI제작\">FR-05<\/a>와 완전히 동일한 정책<\/strong>을 따른다. 본 기능에서 별도 정책을 만들지 않는다.<\/p><ul><li>AI 생성 HTML은 신뢰할 수 없는 입력으로 취급한다.<\/li><li>샌드박스 iframe으로 격리 렌더링한다. <code>allow-same-origin<\/code>과 <code>allow-scripts<\/code>를 동시에 부여하지 않는다.<\/li><li>상세: SECURITY_CHECKLIST.md 4절 (❓ 최종 정책 미결)<\/li><\/ul><h2 id=\"FR-13_브랜드시안제작-h10\">3. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S08 Brand Concept Brief<\/td><td>산출물 유형·규격 선택, 브리프 입력, 브랜드 자산·참고자료 선택, 생성 요청<\/td><\/tr><tr><td>S09 Concept Compare<\/td><td>3안 나란히 비교, 개별 의견 등록, 하나 선택 → Version 확정<\/td><\/tr><tr><td>S03 Project Workspace<\/td><td>Brand Concept 진입<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a> · 화면 상세: <a href=\"#09_UI_SPEC_브랜드시안\">09_UI_SPEC_브랜드시안.md<\/a><\/p><h2 id=\"FR-13_브랜드시안제작-h11\">4. 관련 API<\/h2><p>기존 AI Job API를 재사용한다. <strong>신규 엔드포인트를 만들지 않는다.<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/projects/{projectId}/ai/jobs<\/code><\/td><td>Job 생성 (<code>job_type = BRAND_CONCEPT<\/code>)<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/ai/jobs/{jobId}<\/code><\/td><td>상태 조회 · 3안 결과 조회<\/td><\/tr><tr><td>POST<\/td><td><code>/api/v1/ai/jobs/{jobId}/retry<\/code><\/td><td>재시도<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/templates<\/code><\/td><td>브랜드 자산 목록 (<code>template_type = BRAND_ASSET<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><p>오류: 429(호출 제한), 502/504(LLM 연계). 정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-13_브랜드시안제작-h12\">5. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-012<\/td><td>브랜드 자산 선택<\/td><td>선택한 자산이 AI 컨텍스트로 전달되고 시안에 반영된다<\/td><\/tr><tr><td>US-022<\/td><td>브랜드 시안 생성<\/td><td>유형·규격·브리프 기준으로 서로 다른 방향 3안이 생성된다<\/td><\/tr><tr><td>US-023<\/td><td>시안 비교·선택<\/td><td>3안을 나란히 보고 의견을 남기며, 하나를 골라야 Version이 생성된다<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-13_브랜드시안제작-h13\">6. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>PRD FR-13 · US-012/022/023 · S08/S09 · <code>/ai/jobs<\/code> 재사용 반영<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>🔶 부분<\/td><td><del>미검증<\/del> → 정적 프로토타입 <code>mockup-site/brand-concept-brief.html<\/code>(S08) · <code>brand-concept-compare.html<\/code>(S09) · <code>brand-concept-decided.html<\/code>(선택 후 Version 생성)에서 <strong>화면 흐름과 선택 시점 Version 생성 규칙<\/strong>을 확인. 3안 생성·자산 주입·비동기 Job은 여전히 미검증 — <code>mockup/<\/code>(Next.js)의 생성 파이프라인은 화면 목업 단일 산출물 전용이다<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td><code>job_type=BRAND_CONCEPT<\/code> 로 3안을 만들고(호출 3회) 선택 시점에 Version 1개가 생긴다. 시안도 화면 한 장으로 담아 의견·편집·검토를 그대로 쓴다. <strong>NH 실제 브랜드 자산이 없어 결과의 품질은 여전히 블로커.<\/strong> backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"FR-13_브랜드시안제작-h14\">7. 선결 과제<\/h2><p>아래가 해결되지 않으면 기능이 동작해도 결과가 쓸모없다. 임의로 확정하지 말 것. (<a href=\"#08_DECISIONS_OPEN_ISSUES\">결정/미결<\/a>)<\/p><div class=\"table-wrap\"><table><thead><tr><th>#<\/th><th>과제<\/th><th>영향<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>NH 실제 브랜드 자산(로고·캐릭터·컬러·서체) 파일의 반입 경로와 관리 주체<\/strong><\/td><td>최대 블로커. 자산이 없으면 결과가 NH답지 않다<\/td><\/tr><tr><td>2<\/td><td>카드 실물의 필수 표기 요소(카드사 로고, 은행명, 법정 문구) 규칙의 출처<\/td><td>컨셉 시안이라도 빠지면 검토 회의에서 지적된다<\/td><\/tr><tr><td>3<\/td><td>3안 생성의 LLM 호출 횟수<\/td><td>동시 호출 제한·최대 토큰 정책과 직결<\/td><\/tr><tr><td>4<\/td><td>컨셉 시안의 Export 형식 (PNG / PDF / HTML)<\/td><td><a href=\"#FR-11_Export\">FR-11<\/a> Export 형식 우선순위와 함께 협의<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"FR-14_책임성검토","group":"기능명세","title":"FR-14 · 책임성 검토","lede":"표현 · 소비자보호 · 다크패턴 · 접근성","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-14_책임성검토.md","size":"9KB","changed":false,"roles":[],"feature":"FR-14","body":"<h1 id=\"FR-14_책임성검토-h0\">FR-14 책임성 검토 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a> | <strong>규칙 정본<\/strong>: <a href=\"#RESPONSIBLE_DESIGN\">RESPONSIBLE_DESIGN.md<\/a><\/p><\/blockquote><h2 id=\"FR-14_책임성검토-h1\">1. 개요<\/h2><p>생성된 화면 설계·목업 산출물에서 <strong>사회적·윤리적으로 문제가 될 만한 지점<\/strong>을 AI가 찾아 의견으로 제시하고, 담당자가 반영 여부를 결정하는 기능이다.<\/p><p>네 축을 본다 — <strong>표현·차별 / 금융소비자보호 / 다크패턴·설계 윤리 / 접근성·포용성<\/strong>. 규칙 정본은 <a href=\"#RESPONSIBLE_DESIGN\">docs/guidelines/RESPONSIBLE_DESIGN.md<\/a>이며, 이 문서는 그 규칙을 제품 기능으로 어떻게 운용하는지를 정의한다.<\/p><p><strong>왜 필요한가<\/strong>: 이 제품은 AI가 만든 화면을 은행 업무 산출물로 쓴다. 성별 고정관념, 오인 유발 문구, 기본 체크된 동의, 판독 불가능한 색 대비가 섞여도 지금까지는 아무도 걸러내지 않았다. 저장소 전체에 이 축의 문서가 없었다.<\/p><h2 id=\"FR-14_책임성검토-h2\">2. 비범위 — 이 기능이 하지 않는 것<\/h2><p><strong><a href=\"#01_PRD\">PRD 5절<\/a>의 &quot;자동 승인 또는 준법 판단의 완전 자동화&quot; 비범위를 그대로 승계한다.<\/strong> FR-14는 그 경계를 넓히지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>한다<\/th><th>하지 않는다<\/th><\/tr><\/thead><tbody><tr><td>&quot;이 표현은 준법 검토가 필요해 보입니다&quot;<\/td><td>&quot;이 표현은 위법입니다&quot; — 적법성 판정<\/td><\/tr><tr><td>목업에서 발견한 근거를 인용해 제시<\/td><td>근거 없는 지적<\/td><\/tr><tr><td>담당자에게 판단 재료 제공<\/td><td>담당자 대신 판단<\/td><\/tr><tr><td>준법 담당자에게 넘길 <strong>경로<\/strong> 제공<\/td><td>준법 검토 자체를 대체<\/td><\/tr><tr><td>의견으로 노출<\/td><td>Export·공유 <strong>차단<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a> Q2(&quot;AI는 제안하고 최종 반영은 담당자가 결정한다&quot;)와 동일한 원칙이며, 기획안의 <code>우대금리 표현 → 추가 확인 → 준법 검토 요청<\/code> 선례를 따른다.<\/p><h3 id=\"FR-14_책임성검토-h3\">FR-15와의 경계<\/h3><p><a href=\"#FR-15_UX리스크검토\">FR-15 UX 리스크 검토<\/a>와 다크패턴(RR-C\\*)·접근성(RR-D\\*) 축이 겹쳐 보이지만 판정 단위가 다르다.<\/p><ul><li><strong>요소 하나로 답이 나오는 것은 FR-14다.<\/strong> &quot;선택 동의가 기본 체크되어 있는가&quot;는 체크박스 하나만 보면 된다.<\/li><li><strong>개수와 맥락이 문제인 것은 FR-15다.<\/strong> &quot;팝업이 흐름 전체에 네 개&quot;는 요소를 아무리 들여다봐도 잡히지 않는다.<\/li><\/ul><p>FR-14는 화면만 보고 자동 실행되며, FR-15는 의견까지 읽고 담당자 요청 시에만 실행된다.<\/p><h2 id=\"FR-14_책임성검토-h4\">3. 동작 상세<\/h2><h3 id=\"FR-14_책임성검토-h5\">3-1. 1차 방지 — 생성 가드레일<\/h3><p>목업 생성 프롬프트에 규칙 정본에서 파생한 설계 기본값을 덧붙여, 문제 요소가 애초에 덜 만들어지게 한다 → <a href=\"#FR-05_AI제작\">FR-05<\/a><\/p><p><strong>단, 프롬프트 지시는 통제가 아니다.<\/strong> SECURITY_CHECKLIST 4절이 같은 논리를 이미 명시한다. 그래서 3-2의 2차 검토가 필수이며, 가드레일만으로 검토를 생략하지 않는다.<\/p><h3 id=\"FR-14_책임성검토-h6\">3-2. 2차 검토<\/h3><p><strong>(2026-09-08) 검토 입력은 저장본이 아니라 요소 편집을 반영한 HTML이다.<\/strong> 편집은 저장본을 덮어쓰지 않고 패치로 쌓이므로(<a href=\"#FR-09_버전관리\">FR-09<\/a> baking), 저장본을 넣으면 사람이 이미 고친 것을 AI가 다시 지적한다.<\/p><p>❗ <strong>다만 이 검토는 여전히 첫 화면만 본다.<\/strong> <code>mockup_versions.html_content<\/code>가 <code>sort_order<\/code> 0 화면으로만 채워지기 때문이다. <code>responsibility_findings<\/code>에 화면 구분 컬럼이 없어 다화면으로 넓히려면 스키마와 프롬프트를 함께 고쳐야 한다. (<a href=\"#FR-15_UX리스크검토\">FR-15<\/a>는 전 화면을 본다) → ❓ 미결<\/p><ul><li>목업 <strong>생성 직후 자동 실행<\/strong>된다. 담당자가 <code>다시 검토<\/code>로 수동 재실행할 수도 있다.<\/li><li>재실행은 이전 검토를 덮어쓰지 않는다. 새 검토 이력을 만들고 이전 결정은 그대로 보존한다.<\/li><li>결과는 규칙 목록에 비추어 <strong>서버에서 검증한 뒤에만<\/strong> 저장한다:<ul><li>정본에 없는 규칙 ID → 버린다<\/li><li>근거(<code>evidence<\/code>)가 비어 있음 → 버린다<\/li><li>카테고리는 모델 출력이 아니라 <strong>규칙 정의<\/strong>를 신뢰한다<\/li><\/ul><\/li><li>지적할 것이 없으면 빈 결과를 그대로 보고한다. <strong>억지로 채우지 않는다<\/strong> — 노이즈가 섞이면 담당자가 전체를 신뢰하지 않게 되어 검토 자체가 무의미해진다.<\/li><\/ul><h3 id=\"FR-14_책임성검토-h7\">3-3. 결정<\/h3><p>담당자는 각 지적에 대해 넷 중 하나를 고른다. <strong>반영 / 보류 / 반려<\/strong>는 <a href=\"#FR-08_반영결정\">FR-08<\/a>과 같은 체계이고, <strong>준법 검토 요청<\/strong>이 FR-14에서 추가된다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>결정<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>반영<\/td><td>지적을 받아들여 고친다<\/td><\/tr><tr><td>보류<\/td><td>지금은 두고 나중에 판단한다<\/td><\/tr><tr><td>반려<\/td><td>지적이 타당하지 않다<\/td><\/tr><tr><td><strong>준법 검토 요청<\/strong><\/td><td>AI도 담당자도 판단하지 않고 준법 담당자에게 넘긴다<\/td><\/tr><\/tbody><\/table><\/div><ul><li>금융소비자보호 축(RR-B\\*)과 사전 체크 동의(RR-C01)는 <code>준법 검토 필요 = 예<\/code>로 표시되어 해당 버튼이 강조된다.<\/li><li>결정은 <strong>누가·언제<\/strong> 했는지와 함께 기록된다.<\/li><li><strong>AI 제안과 사람의 결정은 UI에서 시각적으로 구분한다<\/strong> — AI 카드는 축별 좌측 보더와 <code>AI<\/code> 표기, 사람 결정은 아바타 배지 (<a href=\"#03_IA_FUNCTION_SPEC\">03 UX 원칙<\/a>).<\/li><\/ul><h3 id=\"FR-14_책임성검토-h8\">3-4. 운영 스택에서의 호출 경로<\/h3><p>브라우저는 LLM을 직접 호출하지 않는다. 검토 호출은 AI Orchestrator 경유 서버 측 호출이며, 장시간 처리 시 비동기 Job 규칙을 따른다 → <a href=\"#FR-05_AI제작\">FR-05<\/a> · ARCHITECTURE 2·3절<\/p><h2 id=\"FR-14_책임성검토-h9\">4. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>우측 패널 <code>AI 검토<\/code> 탭 — 지적 건수, 미결 고위험 표시<\/td><\/tr><tr><td>S05 Result/Review<\/td><td>지적 카드(근거·사유·제안)와 결정 버튼 4종<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-14_책임성검토-h10\">5. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/versions/{versionId}/responsibility-review<\/code><\/td><td>검토 실행<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/versions/{versionId}/responsibility-review<\/code><\/td><td>최신 검토 + 지적 목록 조회<\/td><\/tr><tr><td>PATCH<\/td><td><code>/api/v1/responsibility-findings/{findingId}<\/code><\/td><td>담당자 결정 기록<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-14_책임성검토-h11\">6. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-033<\/td><td>책임성 검토<\/td><td>생성 직후 자동 검토, 근거 인용 필수, 판정 표현 금지, 결정 4종 기록<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-14_책임성검토-h12\">7. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>규칙 정본 <a href=\"#RESPONSIBLE_DESIGN\">RESPONSIBLE_DESIGN.md<\/a> · US-033 · API 3종<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>✅<\/td><td><code>mockup/<\/code>에 가드레일·검토·결정 흐름 전 구간 구현 — <code>lib/responsibility-rules.ts<\/code>, <code>lib/review-responsibility.ts<\/code>, <code>app/components/ReviewPanel.tsx<\/code><\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>검토 실행·조회·결정 4종. 규칙 사본은 <code>backend/src/main/resources/rules/responsibility-rules.json<\/code> 이며 가드레일·검토 프롬프트를 규칙에서 생성한다. 근거가 목업에 글자 그대로 없으면 저장하지 않고 버린 개수를 응답에 담는다. **<code>COMPLIANCE_REQUESTED<\/code> 는 여전히 상태로만 남고 아무에게도 전달되지 않는다.** backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"FR-14_책임성검토-h13\">8. 설계 판단 기록<\/h2><ul><li><strong>왜 게이트가 아니라 자문인가<\/strong>: 차단형은 <a href=\"#01_PRD\">PRD 5절<\/a> 비범위 및 <a href=\"#08_DECISIONS_OPEN_ISSUES\">08 Q2<\/a>와 충돌한다. AI 오판이 업무를 멈추게 하는 비용이 놓친 지적의 비용보다 크다고 판단했다.<\/li><li><strong>왜 근거 인용을 강제하는가<\/strong>: 근거 없는 지적은 담당자가 검증할 수 없어 결정을 내릴 수 없다. 서버에서 버린다.<\/li><li><strong>왜 규칙을 문서와 코드 양쪽에 두는가<\/strong>: 정본은 문서다. 코드 사본은 프롬프트를 규칙에서 <strong>생성<\/strong>하기 위한 것으로, 규칙을 추가하면 가드레일과 검토 지시가 함께 갱신되어 드리프트를 막는다.<\/li><li><strong>왜 zod를 쓰지 않는가<\/strong>: 구조화 출력에 <code>zodOutputFormat<\/code>을 쓰면 새 의존성이 필요하다. Anthropic SDK의 strict tool use가 같은 스키마 보장을 주므로 패키지를 추가하지 않았다 (TECH_STACK D절 3항).<\/li><\/ul><h2 id=\"FR-14_책임성검토-h14\">9. 미결 사항<\/h2><ul><li>❓ <strong>준법 검토 요청의 수신자<\/strong> — 준법 담당자 지정·알림·SLA가 정해지지 않았다. 현재는 결정 상태로만 남고 실제로 넘어가지 않는다. → <a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a><\/li><li>❓ <strong>RR-B03 필수 고지 항목의 출처<\/strong> — 카드·상품별 법정 표기 요소의 출처와 관리 주체가 미확정이다. 확정 전까지 규칙은 &quot;자리가 있는가&quot;만 본다.<\/li><li>❓ <strong>규칙 정본의 관리 주체<\/strong> — 규칙 추가·개정을 누가 승인하는지 미정.<\/li><\/ul>"},{"id":"FR-15_UX리스크검토","group":"기능명세","title":"FR-15 · UX 리스크 검토","lede":"논의+화면 동시 검토 · 렌즈 6개","author":"Lucas-one","commit":"a64e2bb","date":"2026-09-08","path":"개발문서/기능명세/FR-15_UX리스크검토.md","size":"12KB","changed":false,"roles":[],"feature":"FR-15","body":"<h1 id=\"FR-15_UX리스크검토-h0\">FR-15 UX 리스크 검토 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a> | <a href=\"#03_IA_FUNCTION_SPEC\">IA·화면<\/a> | <a href=\"#05_API_DB_SPEC\">API/DB<\/a> | <strong>렌즈 정본<\/strong>: <a href=\"#USABILITY_REVIEW\">USABILITY_REVIEW.md<\/a><\/p><\/blockquote><h2 id=\"FR-15_UX리스크검토-h1\">1. 개요<\/h2><p>담당자가 요청하면 AI가 <strong>화면 전체와 그 화면을 두고 오간 의견 전체를 함께 읽고<\/strong>, 담당자들이 짚지 못한 사용성 문제를 의견 패널에 카드로 올리는 기능이다. 담당자는 각 지적에 대해 반영 / 보류 / 반려를 결정한다.<\/p><p>여섯 개 렌즈로 본다 — <strong>누적과 반복 / 흐름 중단 / 예외 상황 / 되돌리기·오조작 / 사용 맥락 / 빠진 이해관계자<\/strong>. 렌즈 정본은 <a href=\"#USABILITY_REVIEW\">docs/guidelines/USABILITY_REVIEW.md<\/a>이며, 이 문서는 그 렌즈를 제품 기능으로 어떻게 운용하는지를 정의한다.<\/p><p><strong>왜 필요한가<\/strong>: 의견 패널에는 기획·개발·디자인 담당자가 각자의 관점으로 코멘트를 남긴다. 그런데 <strong>각 의견이 개별로는 타당한데 합쳐 놓으면 사용자가 불편해지는 경우<\/strong>를 아무도 짚지 못한다. &quot;가입 완료 안내 팝업&quot;, &quot;약관 변경 팝업&quot;, &quot;혜택 안내 모달&quot;, &quot;앱 평가 요청&quot;이 각기 다른 의견에서 나오면 하나하나는 다 필요해 보이지만, 사용자는 한 흐름에서 팝업을 네 번 닫아야 한다.<\/p><h2 id=\"FR-15_UX리스크검토-h2\">2. 비범위 — 이 기능이 하지 않는 것<\/h2><p><strong><a href=\"#01_PRD\">PRD 5절<\/a>의 &quot;자동 승인 또는 준법 판단의 완전 자동화&quot; 비범위를 그대로 승계한다.<\/strong> FR-15는 그 경계를 넓히지 않으며, <a href=\"#08_DECISIONS_OPEN_ISSUES\">08 Q2<\/a>(&quot;AI는 제안하고 최종 반영은 담당자가 결정한다&quot;)를 따른다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>한다<\/th><th>하지 않는다<\/th><\/tr><\/thead><tbody><tr><td>&quot;이 흐름에서 팝업을 네 번 닫아야 합니다&quot;<\/td><td>&quot;이 설계는 잘못되었습니다&quot; — 품질 판정<\/td><\/tr><tr><td>화면·의견에서 <strong>그대로 인용한 근거<\/strong>를 제시<\/td><td>근거 없이 인상을 말한다<\/td><\/tr><tr><td>담당자에게 판단 재료 제공<\/td><td>담당자 대신 판단<\/td><\/tr><tr><td>사람이 놓친 관점을 하나 더 얹는다<\/td><td>사람의 의견을 대체하거나 반박<\/td><\/tr><tr><td>의견으로 노출<\/td><td>생성·Export·공유 <strong>차단<\/strong><\/td><\/tr><tr><td>담당자가 요청할 때 실행<\/td><td>논의에 상시 끼어들기<\/td><\/tr><\/tbody><\/table><\/div><p><strong>특히<\/strong>: 이 검토는 다른 팀원의 의견을 읽고 나온 것이다. 그러므로 <strong>특정 의견이나 작성자를 지목해 틀렸다고 말하지 않는다.<\/strong> &quot;이 결정들이 합쳐지면 이런 결과가 됩니다&quot;까지만 말한다.<\/p><h2 id=\"FR-15_UX리스크검토-h3\">3. FR-14와의 경계<\/h2><p>파이프라인 구조는 <a href=\"#FR-14_책임성검토\">FR-14 책임성 검토<\/a>와 같지만 다섯 가지가 다르다. <strong>한 기능으로 합치지 않는 이유<\/strong>가 이 표다.<\/p><div class=\"table-wrap\"><table><thead><tr><th><\/th><th>FR-14 책임성 검토<\/th><th>FR-15 UX 리스크 검토<\/th><\/tr><\/thead><tbody><tr><td>입력<\/td><td>화면 HTML + 기획안<\/td><td><strong>전 화면 HTML + 기획안 + 의견 전문<\/strong><\/td><\/tr><tr><td>기준<\/td><td>규칙 21개 (<code>RR-xx<\/code>, &quot;이러면 위반&quot;)<\/td><td>**렌즈 6개 (<code>UR-xx<\/code>, &quot;이걸 물어봐라&quot;)**<\/td><\/tr><tr><td>판정 단위<\/td><td>요소 하나로 성립<\/td><td><strong>여러 결정이 쌓인 결과<\/strong><\/td><\/tr><tr><td>실행<\/td><td>생성 직후 자동 + 수동 재실행<\/td><td><strong>담당자 요청 시에만<\/strong><\/td><\/tr><tr><td>결과 위치<\/td><td><code>AI 검토<\/code> 탭 (별도)<\/td><td>**<code>의견<\/code> 탭에 사람 댓글과 섞여서**<\/td><\/tr><tr><td>결정<\/td><td>반영/보류/반려/<strong>준법 검토 요청<\/strong><\/td><td>반영/보류/반려<\/td><\/tr><\/tbody><\/table><\/div><p>경계 규칙: <strong>요소 하나로 답이 나오는 것은 FR-14의 몫이다.<\/strong> 팝업 4개처럼 개수와 맥락이 문제인 것만 FR-15가 본다.<\/p><h2 id=\"FR-15_UX리스크검토-h4\">4. 동작 상세<\/h2><h3 id=\"FR-15_UX리스크검토-h5\">4-1. 생성 가드레일을 두지 않는 이유<\/h3><p>FR-14는 규칙에서 파생한 설계 기본값을 생성 프롬프트에 주입한다(FR-14 3-1). FR-15는 <strong>그에 해당하는 가드레일을 두지 않는다.<\/strong><\/p><p>렌즈는 위반 조건이 아니라 질문이라 생성 시점에 주입할 제약이 못 된다. &quot;누적을 조심하라&quot;는 지시는 화면 한 장을 만드는 프롬프트에서 의미가 없고, 생성 프롬프트를 더 길게 만들면 FR-14 가드레일과 섞여 양쪽 다 약해진다. FR-15는 <strong>사후 검토 하나만<\/strong> 한다.<\/p><h3 id=\"FR-15_UX리스크검토-h6\">4-2. 실행 — 담당자 요청 시에만<\/h3><ul><li>자동 실행하지 않는다. 의견 패널의 <code>AI에게 검토 요청<\/code> 버튼으로만 돈다.<\/li><li><strong>왜 수동인가<\/strong>: 댓글마다 자동 실행하면 같은 지적이 반복되어 스레드를 오염시킨다. 논의가 어느 정도 쌓였을 때 사람이 부르는 편이 결과가 낫고, 비용·지연이 예측 가능하다.<\/li><li>재실행은 이전 검토를 덮어쓰지 않는다. 새 검토 이력을 만들고 이전 결정은 그대로 보존한다. (FR-14와 동일)<\/li><li>누가 요청했는지 기록한다(<code>requested_by<\/code>).<\/li><\/ul><h3 id=\"FR-15_UX리스크검토-h7\">4-3. 입력<\/h3><p>세 가지를 한 번에 넣는다. <strong>나눠 부를 수 없다<\/strong> — 누적을 보려면 흐름 전체가 한 컨텍스트에 있어야 한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>출처<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td><code>PROPOSAL<\/code><\/td><td>기획안 본문<\/td><\/tr><tr><td><code>SCREEN<\/code><\/td><td><strong>전 화면<\/strong>의 HTML (첫 화면만이 아니다). <strong>(2026-09-08) 저장본이 아니라 요소 편집을 반영한 HTML을 넣는다<\/strong> — 저장본을 넣으면 사람이 이미 고친 것을 AI가 다시 지적한다 → <a href=\"#FR-09_버전관리\">FR-09<\/a> baking<\/td><\/tr><tr><td><code>DISCUSSION<\/code><\/td><td>의견 패널의 코멘트 전문. <code>[의견 #3] 작성자 · 화면 s02 / 요소 nh-14<\/code> 형태로 번호를 매겨 넘긴다<\/td><\/tr><\/tbody><\/table><\/div><p>의견에 번호를 매기는 이유는 지적 카드에서 &quot;의견 #3&quot;으로 되짚을 수 있어야 하기 때문이다.<\/p><p>입력 총량에 상한을 둔다. 초과하면 <strong>잘라내지 않고 거부한다<\/strong> — 잘린 뒷부분에 있던 팝업을 못 보면 결과가 조용히 틀린다.<\/p><h3 id=\"FR-15_UX리스크검토-h8\">4-4. 근거 검증 — FR-14보다 엄격하다<\/h3><p>렌즈는 규칙보다 느슨하다. 그래서 근거 검증을 한 단계 더 조인다.<\/p><div class=\"table-wrap\"><table><thead><tr><th><\/th><th>FR-14<\/th><th>FR-15<\/th><\/tr><\/thead><tbody><tr><td>요구<\/td><td><code>evidence<\/code>가 비어 있지 않을 것<\/td><td><code>evidence_quotes<\/code> 1~3개<\/td><\/tr><tr><td>검증<\/td><td>비어 있으면 버린다<\/td><td><strong>원문에 글자 그대로 존재하는지 대조<\/strong>한다<\/td><\/tr><tr><td>탈락 조건<\/td><td>빈 근거<\/td><td>살아남은 인용이 0개<\/td><\/tr><\/tbody><\/table><\/div><ul><li>검증 코퍼스는 기획안 + 전 화면 HTML + 전 의견 본문이다. 공백을 정규화하고 소문자화한 뒤 부분문자열로 대조한다. 너무 짧은 조각은 우연히 맞을 수 있으므로 무시한다.<\/li><li><strong>살아남은 인용이 하나도 없으면 그 지적을 통째로 버린다.<\/strong> 요약·의역은 탈락한다.<\/li><li>렌즈 ID가 정본 목록에 없어도 버린다.<\/li><li>지적할 것이 없으면 빈 결과를 그대로 보고한다. <strong>억지로 채우지 않는다<\/strong> — 검증 불가능한 카드가 한 장이라도 섞이면 나머지 카드까지 읽히지 않는다.<\/li><\/ul><h3 id=\"FR-15_UX리스크검토-h9\">4-5. 결정<\/h3><p>담당자는 각 지적에 대해 셋 중 하나를 고른다. <a href=\"#FR-08_반영결정\">FR-08<\/a> 및 FR-14와 같은 체계다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>결정<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>반영<\/td><td>지적을 받아들여 고친다<\/td><\/tr><tr><td>보류<\/td><td>지금은 두고 나중에 판단한다<\/td><\/tr><tr><td>반려<\/td><td>지적이 타당하지 않다<\/td><\/tr><\/tbody><\/table><\/div><p><code>준법 검토 요청<\/code>은 두지 않는다 — 준법 축은 FR-14 고유다. UX 리스크에서 준법 사안이 보이면 그것은 RR 규칙의 대상이며 FR-14가 잡는다.<\/p><p>결정은 <strong>누가·언제<\/strong> 했는지와 함께 기록된다.<\/p><h3 id=\"FR-15_UX리스크검토-h10\">4-6. 의견 흐름에의 결합<\/h3><ul><li>AI 지적은 사람 댓글과 <strong>같은 목록에 시간순으로 섞여<\/strong> 표시된다. 별도 탭으로 빼지 않는다 — 논의에 얹는 것이 이 기능의 요지이기 때문이다.<\/li><li><strong>AI 카드와 사람 댓글은 시각적으로 구분한다<\/strong> — AI 카드는 좌측 보더와 <code>AI<\/code> 표기, 사람 댓글은 아바타 (<a href=\"#03_IA_FUNCTION_SPEC\">03 UX 원칙<\/a>).<\/li><li>저장은 별도 테이블에 한다. 근거·심각도·결정 필드를 <code>comments<\/code>에 억지로 넣지 않으며, AI가 사람 작성자로 위장하지도 않는다.<\/li><li>캔버스 메모 핀 번호는 <strong>사람 댓글만 세어<\/strong> 매긴다. AI 카드가 번호를 밀면 화면 위의 핀과 목록이 어긋난다.<\/li><\/ul><h3 id=\"FR-15_UX리스크검토-h11\">4-7. 운영 스택에서의 호출 경로<\/h3><p>브라우저는 LLM을 직접 호출하지 않는다. 검토 호출은 AI Orchestrator 경유 서버 측 호출이며, 장시간 처리 시 비동기 Job 규칙을 따른다 → <a href=\"#FR-05_AI제작\">FR-05<\/a> · ARCHITECTURE 2·3절<\/p><h2 id=\"FR-15_UX리스크검토-h12\">5. 관련 화면<\/h2><div class=\"table-wrap\"><table><thead><tr><th>화면<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>S03 Project Workspace<\/td><td>우측 패널 <code>의견<\/code> 탭 — <code>AI에게 검토 요청<\/code> 버튼, 사람 댓글과 섞인 AI 카드<\/td><\/tr><tr><td>S05 Result/Review<\/td><td>지적 카드(근거·사유·제안)와 결정 버튼 3종<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#03_IA_FUNCTION_SPEC\">03_IA_FUNCTION_SPEC.md<\/a><\/p><h2 id=\"FR-15_UX리스크검토-h13\">6. 관련 API<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Method<\/th><th>Path<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/api/v1/versions/{versionId}/usability-review<\/code><\/td><td>검토 실행<\/td><\/tr><tr><td>GET<\/td><td><code>/api/v1/versions/{versionId}/usability-review<\/code><\/td><td>최신 검토 + 지적 목록 조회<\/td><\/tr><tr><td>PATCH<\/td><td><code>/api/v1/usability-findings/{findingId}<\/code><\/td><td>담당자 결정 기록<\/td><\/tr><\/tbody><\/table><\/div><p>정본: <a href=\"#05_API_DB_SPEC\">05_API_DB_SPEC.md<\/a><\/p><h2 id=\"FR-15_UX리스크검토-h14\">7. US 매핑<\/h2><div class=\"table-wrap\"><table><thead><tr><th>US<\/th><th>요지<\/th><th>핵심 AC 요약<\/th><\/tr><\/thead><tbody><tr><td>US-034<\/td><td>UX 리스크 검토<\/td><td>요청 시 실행, 화면+의견 동시 입력, 원문 인용 대조 필수, 의견 목록에 섞여 표시, 결정 3종 기록<\/td><\/tr><\/tbody><\/table><\/div><p>AC 전문 정본: <a href=\"#02_USER_STORIES_AC\">02_USER_STORIES_AC.md<\/a><\/p><h2 id=\"FR-15_UX리스크검토-h15\">8. 구현 상태<\/h2><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>설계<\/td><td>✅<\/td><td>렌즈 정본 <a href=\"#USABILITY_REVIEW\">USABILITY_REVIEW.md<\/a> · US-034 · API 3종<\/td><\/tr><tr><td>프로토타입 검증<\/td><td>⬜ 미착수<\/td><td>—<\/td><\/tr><tr><td>운영 구현<\/td><td>🟡 백엔드 완료<\/td><td>검토 실행·조회·결정 3종. 입력(기획안+전 화면+의견 전문)은 서버가 DB 에서 조립하고 상한 초과 시 413 이다. 인용은 선언한 출처와 대조한 뒤 실패하면 전체와 다시 맞춰 출처를 바로잡고, 살아남은 것이 없으면 지적을 버린다. 기획안은 <code>versions.proposal<\/code> 에 남는다. backend/ 구현 (2026-09-08). PostgreSQL 기동·API 호출까지 확인. 프론트엔드(Vue 3)는 미착수<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"FR-15_UX리스크검토-h16\">9. 설계 판단 기록<\/h2><ul><li><strong>왜 FR-14에 합치지 않는가<\/strong>: 3절 표의 다섯 가지가 다르다. 특히 입력(전 화면+의견)과 실행 시점(수동)이 달라 한 함수에 넣으면 조건 분기가 늘고, 규칙과 렌즈가 한 프롬프트에 섞여 양쪽 결과가 다 흐려진다.<\/li><li><strong>왜 규칙이 아니라 렌즈인가<\/strong>: 팝업 4개는 요소를 아무리 들여다봐도 잡히지 않는다. 개수와 맥락이 문제이지 개별 요소는 멀쩡하다. 조건으로는 쓸 수 없어 질문으로 둔다.<\/li><li><strong>왜 근거 대조를 FR-14보다 조이는가<\/strong>: 렌즈가 느슨한 만큼 지어낸 근거가 통과할 여지가 커진다. 검증 불가능한 카드는 담당자가 판단할 수 없고, 한 장만 섞여도 나머지 카드까지 읽히지 않는다.<\/li><li><strong>왜 별도 테이블인가<\/strong>: 근거·심각도·결정 필드를 <code>comments<\/code>에 붙이면 사람 댓글의 삭제·해결 토글과 의미가 어긋나 스키마가 탁해진다. AI가 사람 작성자로 위장하는 것도 피한다.<\/li><li><strong>왜 별도 탭으로 빼지 않는가<\/strong>: 논의에 얹는 것이 이 기능의 요지다. 별도 탭으로 빼면 FR-14와 구별되지 않고, 논의를 읽은 의미가 사라진다.<\/li><\/ul><h2 id=\"FR-15_UX리스크검토-h17\">10. 미결 사항<\/h2><ul><li>❓ <strong>렌즈 정본의 관리 주체<\/strong> — 렌즈 추가·개정을 누가 승인하는지 미정. RR 규칙 정본의 관리 주체 미결과 함께 정한다. → <a href=\"#08_DECISIONS_OPEN_ISSUES\">08_DECISIONS_OPEN_ISSUES.md<\/a><\/li><li>❓ <strong>의견 원문의 AI 입력 허용 범위<\/strong> — 이 기능은 <strong>사람이 작성한 의견 원문<\/strong>을 LLM에 보낸다. FR-14는 목업과 기획안만 보냈다. 어떤 자료를 AI에 넣을 수 있는지 기준이 미확정이다. → SECURITY_CHECKLIST 1절<\/li><li>❓ <strong>입력 총량 상한값<\/strong> — 프로토타입은 임의값으로 두었다. 운영 LLM의 컨텍스트 한도 확정 후 재산정한다.<\/li><\/ul>"},{"id":"MockupGen_기능명세서","group":"프로토타입","title":"MockupGen 기능명세서","lede":"정적 프로토타입 역공학 명세 · PFR-xx · P0~P3 이슈","author":"Lucas-one","commit":"ef9fc66","date":"2026-08-30","path":"MockupGen_기능명세서.md","size":"26KB","changed":false,"roles":["dev"],"body":"<h1 id=\"MockupGen_기능명세서-h0\">MockupGen 기능 명세서<\/h1><p><strong>대상 화면:<\/strong> <code>project.html<\/code> (프로젝트 상세 / 목업 작업 화면)<br><strong>서비스명:<\/strong> MockupGen — AI 기반 화면 목업 · 기획서 자동 생성 도구<\/p><hr><h2 id=\"MockupGen_기능명세서-h1\">1. 문서 정보<\/h2><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>문서명<\/td><td>MockupGen 기능 명세서<\/td><\/tr><tr><td>버전<\/td><td>v1.0<\/td><\/tr><tr><td>작성일<\/td><td>2026-08-30<\/td><\/tr><tr><td>분석 대상<\/td><td><code>https://ktj1221.github.io/claude_test/project.html?id=&lt;projectId&gt;<\/code><\/td><\/tr><tr><td>소스 규모<\/td><td>단일 HTML 파일 / 1,135 라인 (마크업 + 스타일 + 스크립트 통합)<\/td><\/tr><tr><td>연관 화면<\/td><td><code>index.html<\/code> (대시보드 · 프로젝트 목록 · API 키 설정 · 시드 데이터 생성)<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h2\">2. 개요<\/h2><h3 id=\"MockupGen_기능명세서-h3\">2.1 목적<\/h3><p>기획자가 작성한 <strong>기획안 텍스트<\/strong>를 입력하면 AI가 <strong>실행 가능한 HTML 목업 화면<\/strong>을 생성하고,<br>팀원이 버전별로 <strong>의견 · 채팅<\/strong>으로 피드백하며, 최종적으로 <strong>한국어 화면 기획서(HTML)<\/strong> 까지<br>자동 생성하는 기획–디자인 협업 워크플로우 도구.<\/p><h3 id=\"MockupGen_기능명세서-h4\">2.2 범위<\/h3><p>본 명세서는 <code>project.html<\/code> 한 화면이 제공하는 전 기능을 다룬다.<br>프로젝트 생성 · 삭제 · API 키 설정은 <code>index.html<\/code> 소관이므로 참조 수준으로만 기술한다.<\/p><h3 id=\"MockupGen_기능명세서-h5\">2.3 용어 정의<\/h3><blockquote><p><strong>ID 네임스페이스<\/strong>: 본 문서의 <code>PFR-xx-yy<\/code>는 프로토타입 역공학 명세 ID로, 제품 정본 PRD의 <code>FR-01~12<\/code>(<a href=\"#00_INDEX\">기능명세 인덱스<\/a>)와 무관하다.<\/p><\/blockquote><div class=\"table-wrap\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td>프로젝트<\/td><td>하나의 화면 개선 과제 단위. 목업 · 참조화면 · 담당자 · 채팅을 소유<\/td><\/tr><tr><td>목업(Mockup)<\/td><td>AI가 생성한 자체 완결형 HTML 문서 1건. 버전 번호를 가짐<\/td><\/tr><tr><td>버전<\/td><td>동일 프로젝트 내 목업의 순번 (v1, v2, …). 생성 시 자동 증가<\/td><\/tr><tr><td>참조 화면<\/td><td>AI에게 디자인 스타일을 학습시키기 위해 업로드하는 기존 화면 이미지<\/td><\/tr><tr><td>의견(Comment)<\/td><td><strong>목업 버전 단위<\/strong>로 달리는 피드백<\/td><\/tr><tr><td>채팅(Chat)<\/td><td><strong>프로젝트 단위<\/strong>로 이어지는 대화<\/td><\/tr><tr><td>현재 사용자<\/td><td>헤더에서 선택한 활동 주체. 로그인이 아닌 계정 전환 방식<\/td><\/tr><tr><td>기획서(Spec)<\/td><td>목업 캡처 이미지 + 기획안을 근거로 AI가 작성한 7섹션 한국어 문서<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h6\">3. 시스템 구성<\/h2><h3 id=\"MockupGen_기능명세서-h7\">3.1 기술 스택<\/h3><div class=\"table-wrap\"><table><thead><tr><th>계층<\/th><th>사용 기술<\/th><\/tr><\/thead><tbody><tr><td>마크업 / 스타일<\/td><td>HTML5, Tailwind CSS (CDN), 인라인 style<\/td><\/tr><tr><td>스크립트<\/td><td>Vanilla JavaScript (ES2020+, 빌드 도구 없음)<\/td><\/tr><tr><td>데이터 저장<\/td><td>브라우저 localStorage (서버 · DB 없음)<\/td><\/tr><tr><td>AI 연동<\/td><td>Anthropic Messages API 직접 호출 (<code>api.anthropic.com/v1/messages<\/code>)<\/td><\/tr><tr><td>화면 캡처<\/td><td>html2canvas 1.4.1 (cdnjs, 최초 사용 시 동적 로드)<\/td><\/tr><tr><td>앱화<\/td><td>PWA — <code>manifest.json<\/code>, <code>sw.js<\/code> Service Worker 등록<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h8\">3.2 아키텍처 특징<\/h3><ul><li><strong>백엔드 없음.<\/strong> 모든 로직 · 데이터가 브라우저 안에서 완결된다.<\/li><li><strong>단일 파일 배포.<\/strong> 번들러 · 프레임워크 없이 정적 호스팅(GitHub Pages)만으로 동작.<\/li><li><strong>AI 직접 호출.<\/strong> 프록시 서버 없이 브라우저가 Anthropic API를 호출한다<\/li><\/ul><p>(<code>anthropic-dangerous-direct-browser-access: true<\/code> 헤더 사용).<\/p><h3 id=\"MockupGen_기능명세서-h9\">3.3 외부 의존성<\/h3><div class=\"table-wrap\"><table><thead><tr><th>대상<\/th><th>용도<\/th><th>실패 시 영향<\/th><\/tr><\/thead><tbody><tr><td><code>cdn.tailwindcss.com<\/code><\/td><td>전체 스타일<\/td><td>레이아웃 전면 붕괴<\/td><\/tr><tr><td><code>api.anthropic.com<\/code><\/td><td>목업 · 기획서 생성<\/td><td>생성 기능 불가 (조회는 정상)<\/td><\/tr><tr><td><code>cdnjs.cloudflare.com<\/code><\/td><td>html2canvas<\/td><td>기획서 생성만 불가<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h10\">4. 데이터 모델<\/h2><h3 id=\"MockupGen_기능명세서-h11\">4.1 localStorage 키 스키마<\/h3><div class=\"table-wrap\"><table><thead><tr><th>키<\/th><th>범위<\/th><th>값<\/th><\/tr><\/thead><tbody><tr><td><code>mg_projects<\/code><\/td><td>전역<\/td><td><code>Project[]<\/code><\/td><\/tr><tr><td><code>mg_users<\/code><\/td><td>전역<\/td><td><code>User[]<\/code><\/td><\/tr><tr><td><code>mg_current_user<\/code><\/td><td>전역<\/td><td><code>User<\/code> (현재 활동 주체)<\/td><\/tr><tr><td><code>mg_api_key<\/code><\/td><td>전역<\/td><td><code>string<\/code> (Anthropic API 키, <strong>평문<\/strong>)<\/td><\/tr><tr><td><code>mg_refs_{projectId}<\/code><\/td><td>프로젝트<\/td><td><code>RefScreen[]<\/code> (최대 3)<\/td><\/tr><tr><td><code>mg_mockups_{projectId}<\/code><\/td><td>프로젝트<\/td><td><code>Mockup[]<\/code> (최신순 정렬)<\/td><\/tr><tr><td><code>mg_members_{projectId}<\/code><\/td><td>프로젝트<\/td><td><code>string[]<\/code> (userId 배열)<\/td><\/tr><tr><td><code>mg_chat_{projectId}<\/code><\/td><td>프로젝트<\/td><td><code>ChatMessage[]<\/code><\/td><\/tr><tr><td><code>mg_comments_{mockupId}<\/code><\/td><td>목업<\/td><td><code>Comment[]<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h12\">4.2 엔티티 정의<\/h3><p><strong>Project<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>필드<\/th><th>타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>string<\/td><td>UUID 또는 시드 ID (<code>seed-p1<\/code>)<\/td><\/tr><tr><td><code>name<\/code><\/td><td>string<\/td><td>프로젝트명. 헤더 및 문서 타이틀에 표시<\/td><\/tr><tr><td><code>description<\/code><\/td><td>string<\/td><td>설명<\/td><\/tr><tr><td><code>createdAt<\/code><\/td><td>ISO8601<\/td><td>생성 일시<\/td><\/tr><\/tbody><\/table><\/div><p><strong>User<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>필드<\/th><th>타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>string<\/td><td>UUID<\/td><\/tr><tr><td><code>name<\/code><\/td><td>string<\/td><td>이름. 첫 글자가 아바타 문자로 사용됨<\/td><\/tr><tr><td><code>role<\/code><\/td><td>string<\/td><td>직책/부서. 미입력 시 <code>member<\/code> (UI 미표시)<\/td><\/tr><tr><td><code>color<\/code><\/td><td>string<\/td><td>아바타 색상 키 (10색 팔레트에서 순차 배정)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>RefScreen<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>필드<\/th><th>타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>string<\/td><td>UUID<\/td><\/tr><tr><td><code>name<\/code><\/td><td>string<\/td><td>화면 이름. 미입력 시 파일명<\/td><\/tr><tr><td><code>data<\/code><\/td><td>string<\/td><td><strong>순수 base64<\/strong> (data URL 접두사 제거됨)<\/td><\/tr><tr><td><code>mimeType<\/code><\/td><td>string<\/td><td>예: <code>image/png<\/code><\/td><\/tr><tr><td><code>createdAt<\/code><\/td><td>ISO8601<\/td><td>업로드 일시<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Mockup<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>필드<\/th><th>타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>string<\/td><td>UUID<\/td><\/tr><tr><td><code>version<\/code><\/td><td>number<\/td><td>버전 번호 (기존 최대값 + 1)<\/td><\/tr><tr><td><code>proposalContent<\/code><\/td><td>string<\/td><td>생성에 사용된 기획안 원문<\/td><\/tr><tr><td><code>htmlContent<\/code><\/td><td>string<\/td><td>AI가 생성한 완전한 HTML 문서<\/td><\/tr><tr><td><code>description<\/code><\/td><td>string \\<\/td><td>null<\/td><td>버전 메모<\/td><\/tr><tr><td><code>createdAt<\/code><\/td><td>ISO8601<\/td><td>생성 일시<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Comment<\/strong> — <code>id<\/code>, <code>userId<\/code>, <code>content<\/code>, <code>createdAt<\/code> / 목업 버전에 종속<br><strong>ChatMessage<\/strong> — <code>id<\/code>, <code>userId<\/code>, <code>content<\/code>, <code>createdAt<\/code> / 프로젝트에 종속<\/p><h3 id=\"MockupGen_기능명세서-h13\">4.3 데이터 생명주기<\/h3><ul><li>목업 삭제 → 해당 <code>mg_comments_{mockupId}<\/code> 동시 삭제 (연쇄 정리 수행)<\/li><li>프로젝트 삭제(<code>index.html<\/code>) → 소속 목업의 댓글 + refs/mockups/members/chat 키 일괄 삭제<\/li><li>사용자 삭제 기능은 <strong>없음<\/strong><\/li><\/ul><hr><h2 id=\"MockupGen_기능명세서-h14\">5. 화면 구조<\/h2><h3 id=\"MockupGen_기능명세서-h15\">5.1 데스크톱 레이아웃 (≥768px)<\/h3><pre><code>┌──────────────────────────────────────────────────────────────┐\n│ 헤더 (56px)   ← 뒤로 | 로고 | 프로젝트명 |      사용자 스위처  │\n├───────────┬────────────────────────────────┬─────────────────┤\n│ 좌 사이드바 │        중앙 목업 뷰어           │   우 패널       │\n│   288px   │  ┌ 툴바 ──────────────────────┐ │    320px       │\n│           │  │ v2 | 메모 | 뷰모드 · 기획서 │ │  ┌ 의견|채팅 ┐ │\n│  참조     │  │      · HTML · 의견/채팅     │ │  │           │ │\n│  생성     │  └────────────────────────────┘ │  │  타임라인  │ │\n│  히스토리 │      &lt;iframe srcdoc&gt;            │  │           │ │\n│  담당자   │                                 │  ├ 입력 폼 ──┤ │\n└───────────┴────────────────────────────────┴─────────────────┘<\/code><\/pre><h3 id=\"MockupGen_기능명세서-h16\">5.2 모바일 레이아웃 (&lt;768px)<\/h3><ul><li>좌/우 패널이 <strong>하단 바텀시트<\/strong>로 전환 (<code>translateY(100%)<\/code> → <code>0<\/code>)<\/li><li>하단 고정 5탭 네비게이션: 생성 / 히스토리 / 의견 / 채팅 / 담당자<\/li><li>반투명 오버레이 탭 또는 <strong>아래로 스와이프(60px 이상)<\/strong> 시 닫힘<\/li><li>뷰 모드 전환 버튼 · 우패널 토글 버튼 숨김<\/li><li><code>env(safe-area-inset-bottom)<\/code> 으로 iOS 홈 인디케이터 대응<\/li><\/ul><hr><h2 id=\"MockupGen_기능명세서-h17\">6. 기능 명세<\/h2><h3 id=\"MockupGen_기능명세서-h18\">6.1 진입 및 초기화<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-01-01<\/td><td>프로젝트 식별<\/td><td>URL 쿼리 <code>?id=<\/code> 로 프로젝트 조회<\/td><\/tr><tr><td>PFR-01-02<\/td><td>유효성 검증<\/td><td><code>id<\/code> 누락 또는 프로젝트 미존재 시 <code>index.html<\/code>로 즉시 리다이렉트<\/td><\/tr><tr><td>PFR-01-03<\/td><td>타이틀 반영<\/td><td>헤더 제목 및 문서 타이틀을 <code>{프로젝트명} - MockupGen<\/code> 으로 설정<\/td><\/tr><tr><td>PFR-01-04<\/td><td>초기 렌더<\/td><td>참조화면 · 히스토리 · 담당자 · 채팅 · 의견 영역 일괄 렌더<\/td><\/tr><tr><td>PFR-01-05<\/td><td>최신 버전 자동 선택<\/td><td>저장된 목업이 있으면 최신 버전 선택 후 히스토리 탭 전환 <strong>(※ 9.1 이슈 — 현재 무효화됨)<\/strong><\/td><\/tr><tr><td>PFR-01-06<\/td><td>탭 뱃지<\/td><td>히스토리 / 담당자 탭 라벨에 건수 표시 (예: <code>히스토리(2)<\/code>)<\/td><\/tr><tr><td>PFR-01-07<\/td><td>Service Worker<\/td><td>페이지 로드 시 <code>./sw.js<\/code> 등록 (PWA 오프라인 지원)<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h19\">6.2 사용자 관리 (헤더)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-02-01<\/td><td>사용자 스위처<\/td><td>헤더 우측 드롭다운. 전역 사용자 목록 표시, 현재 사용자에 체크 표시<\/td><\/tr><tr><td>PFR-02-02<\/td><td>사용자 전환<\/td><td>선택 시 <code>mg_current_user<\/code> 갱신 → 헤더 아바타 · 의견/채팅 입력 폼 즉시 재구성<\/td><\/tr><tr><td>PFR-02-03<\/td><td>사용자 생성<\/td><td>이름(필수) + 직책/부서(선택) 입력 → 생성 즉시 현재 사용자로 지정<\/td><\/tr><tr><td>PFR-02-04<\/td><td>아바타 규칙<\/td><td>이름 첫 글자 + <code>COLORS[users.length % 10]<\/code> 자동 색상 배정<\/td><\/tr><tr><td>PFR-02-05<\/td><td>외부 클릭 닫기<\/td><td>드롭다운 외 영역 클릭 시 자동 닫힘<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p><strong>비고:<\/strong> 인증·인가 없음. 누구나 임의 사용자로 전환 가능한 데모용 계정 전환 모델.<\/p><\/blockquote><h3 id=\"MockupGen_기능명세서-h20\">6.3 참조 화면 관리 (참조 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-03-01<\/td><td>업로드<\/td><td>이미지 파일 선택 → base64 변환 후 저장. 화면 이름 선택 입력<\/td><\/tr><tr><td>PFR-03-02<\/td><td>개수 제한<\/td><td><strong>최대 3장.<\/strong> 3장 도달 시 업로드 영역 자동 숨김, 라벨에 <code>(n/3)<\/code> 표시<\/td><\/tr><tr><td>PFR-03-03<\/td><td>파일 검증<\/td><td>MIME <code>image/*<\/code> 여부, 크기 5MB 이하 검사<\/td><\/tr><tr><td>PFR-03-04<\/td><td>저장 실패 처리<\/td><td><code>QuotaExceededError<\/code> 감지 시 &quot;저장 공간 부족&quot; 전용 안내<\/td><\/tr><tr><td>PFR-03-05<\/td><td>썸네일 그리드<\/td><td>3열 정사각 그리드, 하단 이름 오버레이, 호버 시 삭제 버튼 노출<\/td><\/tr><tr><td>PFR-03-06<\/td><td>삭제<\/td><td>확인 대화상자 후 제거<\/td><\/tr><tr><td>PFR-03-07<\/td><td>반영 힌트<\/td><td>생성 탭 하단에 <code>참조 화면 n개 스타일 반영<\/code> 안내 표시<\/td><\/tr><\/tbody><\/table><\/div><p><strong>예외 처리<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>상황<\/th><th>메시지<\/th><\/tr><\/thead><tbody><tr><td>4장째 업로드<\/td><td>최대 3개까지 등록 가능합니다.<\/td><\/tr><tr><td>비이미지 파일<\/td><td>이미지 파일만 업로드 가능합니다.<\/td><\/tr><tr><td>5MB 초과<\/td><td>파일 크기는 5MB 이하여야 합니다.<\/td><\/tr><tr><td>용량 부족<\/td><td>저장 공간이 부족합니다. 기존 참조 화면을 삭제 후 다시 시도하세요.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h21\">6.4 목업 생성 (생성 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-04-01<\/td><td>입력<\/td><td>버전 메모(선택, 1줄) + 기획안 내용(<strong>필수<\/strong>, 14행, 예시 placeholder 제공)<\/td><\/tr><tr><td>PFR-04-02<\/td><td>사전 검증<\/td><td>① 기획안 공백 여부 ② API 키 설정 여부<\/td><\/tr><tr><td>PFR-04-03<\/td><td>생성 중 UI<\/td><td>중앙 영역을 스피너 화면으로 전환, 버튼 비활성화 + <code>생성 중...<\/code><\/td><\/tr><tr><td>PFR-04-04<\/td><td>참조 반영 안내<\/td><td>참조화면 존재 시 <code>참조 화면 n개의 스타일을 분석 중입니다.<\/code> 표시<\/td><\/tr><tr><td>PFR-04-05<\/td><td>AI 호출<\/td><td>참조 이미지 + 기획안을 멀티모달 메시지로 전송 (7절 참조)<\/td><\/tr><tr><td>PFR-04-06<\/td><td>응답 후처리<\/td><td>html 코드펜스 감지 시 내부 내용만 추출<\/td><\/tr><tr><td>PFR-04-07<\/td><td>버전 채번<\/td><td><code>max(기존 version) + 1<\/code>. 중간 버전 삭제 후에도 번호 충돌 없음<\/td><\/tr><tr><td>PFR-04-08<\/td><td>저장 및 표시<\/td><td>목록 선두에 저장 → 즉시 선택·렌더 → 입력 필드 초기화<\/td><\/tr><tr><td>PFR-04-09<\/td><td>완료 알림<\/td><td>토스트 <code>v{n} 목업이 생성됐습니다<\/code> (2.5초 후 소멸)<\/td><\/tr><tr><td>PFR-04-10<\/td><td>실패 처리<\/td><td>빈 화면 복귀 + 생성 탭 재활성화 + <code>생성 실패: {메시지}<\/code> 인라인 표시<\/td><\/tr><\/tbody><\/table><\/div><p><strong>예외 처리<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>상황<\/th><th>메시지<\/th><\/tr><\/thead><tbody><tr><td>기획안 미입력<\/td><td>기획안 내용을 입력해주세요.<\/td><\/tr><tr><td>API 키 미설정<\/td><td>API 키가 설정되지 않았습니다. 대시보드에서 API 키를 먼저 설정해주세요.<\/td><\/tr><tr><td>API 오류<\/td><td>생성 실패: {API 오류 메시지 또는 HTTP 상태코드}<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h22\">6.5 목업 뷰어 (중앙 영역)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-05-01<\/td><td>4단 상태<\/td><td><code>empty<\/code>(안내) / <code>generating<\/code>(스피너) / <code>mockup<\/code>(뷰어) / 툴바 표시 여부 연동<\/td><\/tr><tr><td>PFR-05-02<\/td><td>렌더링<\/td><td><code>iframe srcdoc<\/code> 으로 HTML 문서 격리 렌더<\/td><\/tr><tr><td>PFR-05-03<\/td><td>툴바 정보<\/td><td>버전 뱃지 <code>v{n}<\/code> + 버전 메모 표시<\/td><\/tr><tr><td>PFR-05-04<\/td><td>뷰 모드<\/td><td><strong>데스크톱<\/strong>(최대 1280×800) ↔ <strong>모바일<\/strong>(390×844) 전환<\/td><\/tr><tr><td>PFR-05-05<\/td><td>HTML 다운로드<\/td><td>Blob 생성 → <code>mockup-v{n}.html<\/code> 파일 저장<\/td><\/tr><tr><td>PFR-05-06<\/td><td>우패널 토글<\/td><td>의견/채팅 패널 열기·닫기 (버튼 라벨·색상 연동, 데스크톱 전용)<\/td><\/tr><tr><td>PFR-05-07<\/td><td>빈 상태 안내<\/td><td>데스크톱/모바일 각각 다른 문구 표시<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h23\">6.6 버전 히스토리 (히스토리 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-06-01<\/td><td>목록<\/td><td>최신순. 버전 번호 · 메모 · 기획안 요약(2줄 말줄임) · 생성 일시(한국 로케일)<\/td><\/tr><tr><td>PFR-06-02<\/td><td>선택<\/td><td>클릭 시 해당 버전 로드, 선택 항목에 좌측 인디고 보더 + 배경 강조<\/td><\/tr><tr><td>PFR-06-03<\/td><td>삭제<\/td><td>확인 대화상자 → 목업 + 해당 버전 댓글 동시 삭제<\/td><\/tr><tr><td>PFR-06-04<\/td><td>삭제 후 처리<\/td><td>삭제 대상이 현재 선택 버전이면 빈 화면으로 복귀<\/td><\/tr><tr><td>PFR-06-05<\/td><td>빈 상태<\/td><td><code>아직 생성된 목업이 없습니다.<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h24\">6.7 담당자 관리 (담당자 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-07-01<\/td><td>목록<\/td><td>아바타 · 이름 · 직책 표시<\/td><\/tr><tr><td>PFR-07-02<\/td><td>추가<\/td><td>전역 사용자 중 <strong>미등록자만<\/strong> 셀렉트에 노출 → 추가<\/td><\/tr><tr><td>PFR-07-03<\/td><td>제거<\/td><td>확인 대화상자 후 제거<\/td><\/tr><tr><td>PFR-07-04<\/td><td>뱃지 동기화<\/td><td>추가·제거 시 탭 라벨 건수 즉시 갱신<\/td><\/tr><tr><td>PFR-07-05<\/td><td>안내<\/td><td>새 사용자는 헤더 우상단에서 추가하도록 유도 문구 표시<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h25\">6.8 의견 (우패널 · 의견 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-08-01<\/td><td>범위<\/td><td><strong>목업 버전 단위.<\/strong> 버전 전환 시 해당 버전의 의견만 표시<\/td><\/tr><tr><td>PFR-08-02<\/td><td>작성<\/td><td>아바타 + 텍스트영역. <strong>Enter 전송 / Shift+Enter 줄바꿈<\/strong><\/td><\/tr><tr><td>PFR-08-03<\/td><td>표시<\/td><td>작성자 · 시간(오늘이면 시각, 아니면 월/일 + 시각) · 줄바꿈 보존<\/td><\/tr><tr><td>PFR-08-04<\/td><td>삭제<\/td><td><strong>본인 작성 건에만<\/strong> 삭제 버튼 노출<\/td><\/tr><tr><td>PFR-08-05<\/td><td>자동 스크롤<\/td><td>작성 직후 목록 최하단으로 이동<\/td><\/tr><tr><td>PFR-08-06<\/td><td>가드<\/td><td>목업 미선택 / 사용자 미선택 시 각각 안내 문구 표시 및 입력 차단<\/td><\/tr><\/tbody><\/table><\/div><p><strong>빈 상태 문구<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>상황<\/th><th>문구<\/th><\/tr><\/thead><tbody><tr><td>목업 미선택<\/td><td>목업 버전을 선택하면 의견을 작성할 수 있습니다.<\/td><\/tr><tr><td>의견 0건<\/td><td>아직 의견이 없습니다. 첫 번째 의견을 남겨보세요!<\/td><\/tr><tr><td>사용자 미선택<\/td><td>의견을 남기려면 상단에서 사용자를 선택하세요.<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h26\">6.9 채팅 (우패널 · 채팅 탭)<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-09-01<\/td><td>범위<\/td><td><strong>프로젝트 단위.<\/strong> 버전과 무관하게 하나의 대화 스레드<\/td><\/tr><tr><td>PFR-09-02<\/td><td>말풍선 UI<\/td><td>본인 메시지는 우측 정렬 + 인디고 배경, 타인은 좌측 + 회색 배경<\/td><\/tr><tr><td>PFR-09-03<\/td><td>발신자 표시<\/td><td>타인 메시지에만 이름 라벨 노출<\/td><\/tr><tr><td>PFR-09-04<\/td><td>전송<\/td><td>폼 제출 (Enter 전송)<\/td><\/tr><tr><td>PFR-09-05<\/td><td>자동 스크롤<\/td><td>렌더 및 전송 시 최하단 유지<\/td><\/tr><tr><td>PFR-09-06<\/td><td>가드<\/td><td>사용자 미선택 시 입력 폼 숨김 + 안내 문구<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h27\">6.10 화면 기획서 생성 (툴바 · 기획서)<\/h3><p>2단계 파이프라인으로 동작한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-10-01<\/td><td>사전 검증<\/td><td>목업 선택 여부 · API 키 설정 여부 (미충족 시 토스트)<\/td><\/tr><tr><td>PFR-10-02<\/td><td>모달 오픈<\/td><td>전체화면 모달 + 진행 상태 메시지 표시<\/td><\/tr><tr><td>PFR-10-03<\/td><td><strong>1단계 캡처<\/strong><\/td><td>DOMParser로 목업 HTML 파싱 → style 추출 + body 내용을 화면 밖 390px 컨테이너에 재구성 → html2canvas로 PNG 캡처 → base64 반환<\/td><\/tr><tr><td>PFR-10-04<\/td><td>진행 안내<\/td><td><code>목업 화면을 캡처하고 있습니다...<\/code> → <code>AI가 기획서를 작성하고 있습니다...<\/code><\/td><\/tr><tr><td>PFR-10-05<\/td><td><strong>2단계 작성<\/strong><\/td><td>기획안 텍스트 + 캡처 이미지를 AI에 전달, 한국어 7섹션 기획서 HTML 요청<\/td><\/tr><tr><td>PFR-10-06<\/td><td>이미지 삽입<\/td><td>응답 내 <code>__MOCKUP__<\/code> 플레이스홀더를 base64 이미지로 치환<\/td><\/tr><tr><td>PFR-10-07<\/td><td>폴백<\/td><td>플레이스홀더 누락 시 body 종료 직전에 이미지 블록 자동 추가<\/td><\/tr><tr><td>PFR-10-08<\/td><td>미리보기<\/td><td>샌드박스 iframe으로 결과 렌더, 부제에 <code>v{n} — {메모}<\/code> 표시<\/td><\/tr><tr><td>PFR-10-09<\/td><td>다운로드<\/td><td><code>기획서-v{n}.html<\/code> 파일 저장<\/td><\/tr><tr><td>PFR-10-10<\/td><td>실패 처리<\/td><td>모달 닫고 토스트 <code>기획서 생성 실패: {메시지}<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>기획서 구성 (AI 지시 사항)<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th>#<\/th><th>섹션<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>문서 정보 (버전 · 작성일 · 작성자 테이블)<\/td><\/tr><tr><td>2<\/td><td>화면 개요<\/td><\/tr><tr><td>3<\/td><td>기획 배경 및 목적<\/td><\/tr><tr><td>4<\/td><td>화면 구성 설명 (목업 스크린샷 분석 기반)<\/td><\/tr><tr><td>5<\/td><td>주요 기능 정의 (번호 목록)<\/td><\/tr><tr><td>6<\/td><td>UX 고려사항<\/td><\/tr><tr><td>7<\/td><td>목업 화면 (캡처 이미지)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>문서 스타일 규격:<\/strong> 흰 배경 / 최대 폭 800px 중앙 정렬 / 패딩 48px / 강조색 <code>#4f46e5<\/code> / 인라인 CSS 전용 / 전문 한국어.<\/p><h3 id=\"MockupGen_기능명세서-h28\">6.11 모바일 UI<\/h3><div class=\"table-wrap\"><table><thead><tr><th>ID<\/th><th>기능<\/th><th>상세<\/th><\/tr><\/thead><tbody><tr><td>PFR-11-01<\/td><td>하단 5탭<\/td><td>생성 / 히스토리 / 의견 / 채팅 / 담당자<\/td><\/tr><tr><td>PFR-11-02<\/td><td>바텀시트<\/td><td>좌·우 패널이 하단에서 슬라이드 업 (최대 높이 72vh, 상단 라운드 20px)<\/td><\/tr><tr><td>PFR-11-03<\/td><td>상호 배타<\/td><td>좌 패널 열면 우 패널 자동 닫힘 (동시 노출 방지)<\/td><\/tr><tr><td>PFR-11-04<\/td><td>토글<\/td><td>활성 탭 재탭 시 닫힘<\/td><\/tr><tr><td>PFR-11-05<\/td><td>닫기 수단<\/td><td>오버레이 탭 / 아래로 60px 이상 스와이프<\/td><\/tr><tr><td>PFR-11-06<\/td><td>자동 닫기<\/td><td>목업 선택 시 패널 자동 닫힘 (결과 즉시 확인)<\/td><\/tr><tr><td>PFR-11-07<\/td><td>안전 영역<\/td><td><code>env(safe-area-inset-bottom)<\/code> 반영<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h29\">7. 외부 API 연동 명세<\/h2><h3 id=\"MockupGen_기능명세서-h30\">7.1 공통<\/h3><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>값<\/th><\/tr><\/thead><tbody><tr><td>Endpoint<\/td><td><code>POST https://api.anthropic.com/v1/messages<\/code><\/td><\/tr><tr><td>Model<\/td><td><code>claude-opus-4-8<\/code> (하드코딩)<\/td><\/tr><tr><td>max_tokens<\/td><td><code>8096<\/code><\/td><\/tr><tr><td>Headers<\/td><td><code>x-api-key<\/code>, <code>anthropic-version: 2023-06-01<\/code>, <code>content-type: application/json<\/code>, <code>anthropic-dangerous-direct-browser-access: true<\/code><\/td><\/tr><tr><td>오류 처리<\/td><td>응답 실패 시 본문의 <code>error.message<\/code> 또는 HTTP 상태코드로 예외 발생<\/td><\/tr><tr><td>응답 파싱<\/td><td><code>data.content[0].text<\/code> → 코드펜스 제거<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"MockupGen_기능명세서-h31\">7.2 목업 생성 요청<\/h3><p><strong>System Prompt 요지<\/strong><\/p><ul><li>완전한 자체 완결형 HTML 문서만 출력 (DOCTYPE 포함)<\/li><li><strong>인라인 CSS 전용<\/strong> — 외부 스타일시트 및 JavaScript 금지<\/li><li>현실적이고 전문적인 UI, 한국어 자연스럽게 지원<\/li><li>깔끔한 모던 디자인 (여백 · 색상 · 타이포그래피)<\/li><li>현실적인 더미 데이터 포함<\/li><li>참조 이미지가 있으면 색상 · 레이아웃 · 타이포그래피 · 컴포넌트 스타일을 분석해 반영<\/li><\/ul><p><strong>User Content 구성 순서<\/strong><\/p><ol><li>(참조화면 존재 시) 안내 텍스트 → 이미지 블록 + <code>Reference: &quot;{이름}&quot;<\/code> 텍스트 × N<\/li><li><code>Create an HTML mockup for: {기획안}<\/code> + 완전한 HTML 문서 생성 요청<\/li><\/ol><h3 id=\"MockupGen_기능명세서-h32\">7.3 기획서 생성 요청<\/h3><p><strong>System Prompt 요지<\/strong><\/p><ul><li>한국 IT 기업용 전문 화면 기획서 작성자 역할<\/li><li>전체 한국어 작성 / 완전한 standalone HTML / 인라인 CSS 전용<\/li><li>6.10에 명시된 7개 섹션 필수 포함<\/li><li><code>__MOCKUP__<\/code> 플레이스홀더가 포함된 이미지 태그를 <strong>원문 그대로<\/strong> 배치<\/li><\/ul><p><strong>User Content 구성<\/strong><\/p><ol><li><code>기획안: {proposalContent}<\/code><\/li><li>이미지 블록 (목업 캡처 PNG, base64)<\/li><li>작성 요청 + 플레이스홀더 준수 지시<\/li><\/ol><hr><h2 id=\"MockupGen_기능명세서-h33\">8. 비기능 요구사항<\/h2><h3 id=\"MockupGen_기능명세서-h34\">8.1 성능<\/h3><ul><li>정적 파일 단일 요청 + CDN 2건. 초기 로드 경량.<\/li><li>목업 생성 응답 시간은 AI API에 종속 (통상 수십 초). 진행 상태 UI로 대기 인지 완화.<\/li><li>이미지·HTML 전량을 localStorage에 보관 → 데이터 증가 시 파싱 비용 선형 증가.<\/li><\/ul><h3 id=\"MockupGen_기능명세서-h35\">8.2 보안<\/h3><ul><li>사용자 입력은 전 구간 이스케이프 함수(<code>&amp; &lt; &gt; &quot;<\/code>) 적용 — XSS 기본 방어.<\/li><li>요소 ID는 <code>crypto.randomUUID()<\/code> 기반이라 인라인 핸들러 문자열 주입 위험 낮음.<\/li><li><strong>위험 요소는 9.2 · 9.3절 참조.<\/strong><\/li><\/ul><h3 id=\"MockupGen_기능명세서-h36\">8.3 호환성<\/h3><ul><li>모던 브라우저 기준 (<code>crypto.randomUUID<\/code>, optional chaining, nullish coalescing 사용).<\/li><li><code>randomUUID<\/code> 미지원 환경 폴백 존재.<\/li><li>반응형 분기점: 768px.<\/li><\/ul><h3 id=\"MockupGen_기능명세서-h37\">8.4 PWA<\/h3><ul><li><code>manifest.json<\/code> 연결, 테마 컬러 <code>#4f46e5<\/code><\/li><li>iOS 홈 화면 앱 메타태그, 192px 아이콘<\/li><li>Service Worker 등록으로 오프라인 셸 캐싱<\/li><\/ul><hr><h2 id=\"MockupGen_기능명세서-h38\">9. 제약사항 및 알려진 이슈<\/h2><h3 id=\"MockupGen_기능명세서-h39\">9.1 [기능 결함 · P0] 초기 진입 시 최신 목업이 표시되지 않음<\/h3><p><strong>현상 (실제 브라우저 확인 완료)<\/strong><\/p><p>저장된 목업이 있어도 첫 진입 시 중앙 영역이 <strong>빈 화면(&quot;목업 미리보기&quot;)<\/strong> 으로 표시되고,<br>툴바(기획서 · HTML · 뷰 모드)도 노출되지 않는다. 히스토리에서 한 번 클릭해야 정상 표시된다.<\/p><p><strong>부작용 2건<\/strong><\/p><ol><li><code>selectedMockup<\/code>은 최신 버전으로 설정된 상태라 <strong>우측 의견 패널에는 해당 버전 댓글이 이미 렌더링<\/strong>된다 → &quot;목업 없음&quot;과 &quot;댓글 있음&quot;이 동시에 나타나는 모순 상태.<\/li><li>히스토리 탭이 활성인데도 <strong>생성 폼과 히스토리 목록이 좌측에 동시 표시<\/strong>된다.<\/li><\/ol><p><strong>원인<\/strong><\/p><p>스크립트 최하단 초기화 블록이 상단에서 수행한 자동 선택 결과를 무조건 덮어쓴다.<\/p><pre><code class=\"lang-js\">// 상단 — 최신 목업 자동 선택\nif (_initMockups.length &gt; 0) { selectMockup(_initMockups[0]); switchLeftTab(&#39;history&#39;); }\n\n// 하단(1046행 부근) — 위 결과를 무효화\nshowView(&#39;empty&#39;);\ndocument.getElementById(&#39;panel-generate&#39;).classList.remove(&#39;hidden&#39;);<\/code><\/pre><p><strong>해결 방안<\/strong><\/p><p>하단 초기화 2줄을 자동 선택 블록 <strong>앞으로<\/strong> 이동하거나, <code>if (!selectedMockup)<\/code> 가드를 추가한다.<\/p><h3 id=\"MockupGen_기능명세서-h40\">9.2 [보안 · P0] iframe 샌드박스 무력화<\/h3><p>목업 뷰어가 <code>sandbox=&quot;allow-scripts allow-same-origin&quot;<\/code> 조합을 사용한다.<br>이 두 값을 동시에 지정하면 샌드박스가 사실상 해제되어, iframe 내부 스크립트가<br>부모 페이지의 localStorage에 접근할 수 있다 — 즉 **<code>mg_api_key<\/code>(평문 API 키) 탈취가 가능**하다.<\/p><ul><li>시스템 프롬프트에서 &quot;JavaScript 금지&quot;를 지시하지만 AI 출력은 보장되지 않으며,<\/li><\/ul><p>조작된 localStorage 데이터가 유입되는 경로도 존재한다.<\/p><ul><li><strong>해결:<\/strong> <code>allow-same-origin<\/code> 제거. (기획서 모달의 iframe은 <code>allow-scripts<\/code>만 사용해 안전)<\/li><\/ul><h3 id=\"MockupGen_기능명세서-h41\">9.3 [보안 · P1] API 키 평문 저장 및 브라우저 직접 전송<\/h3><p><code>mg_api_key<\/code>가 localStorage에 암호화 없이 저장되고, 브라우저에서 Anthropic으로 직접 전송된다.<br>공용 PC 사용, 확장 프로그램, XSS 어느 경로로든 키가 그대로 노출된다.<br>운영 전환 시 <strong>서버 프록시 경유 방식<\/strong>으로 변경 필요.<\/p><h3 id=\"MockupGen_기능명세서-h42\">9.4 [기능 · P1] 협업 데이터가 실제로 공유되지 않음<\/h3><p>담당자 · 의견 · 채팅 등 협업 UI를 갖췄으나 저장소가 브라우저 로컬이므로<br><strong>다른 사람 · 다른 기기에서는 전혀 보이지 않는다.<\/strong> 현재 구조는 단일 사용자 데모에 한정된다.<\/p><h3 id=\"MockupGen_기능명세서-h43\">9.5 [기능 · P2] 피드백 루프 단절<\/h3><p>의견에 &quot;버튼을 44px로 키워주세요&quot;라고 작성해도 그 내용이 AI 재생성에 전달되지 않는다.<br>다음 버전을 만들려면 기획안을 처음부터 다시 작성해야 하며,<br><strong>이전 버전 기반 수정 · 버전 간 비교(diff) 기능이 없다.<\/strong><\/p><h3 id=\"MockupGen_기능명세서-h44\">9.6 [기술 · P3] 저장 용량 한계<\/h3><p>참조 이미지 base64 + 목업 HTML 전량이 localStorage(통상 5–10MB)에 적재된다.<br>이미지 수 장이면 한도에 도달하며, 현재 Quota 예외 처리는 <strong>참조 화면 업로드 경로에만<\/strong> 존재한다.<br>목업 저장 경로에는 방어 코드가 없다.<\/p><h3 id=\"MockupGen_기능명세서-h45\">9.7 [기술 · P3] 기획서 캡처 정합성<\/h3><p>캡처 로직은 iframe 자체가 아니라 HTML을 <strong>오프스크린 div에 재렌더<\/strong>한 뒤 촬영한다.<br>head 내 일부 스타일, 외부 리소스, <code>position: fixed<\/code> 요소 등은 실제 미리보기와 다르게 잡힐 수 있다.<\/p><h3 id=\"MockupGen_기능명세서-h46\">9.8 기타<\/h3><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>모델 하드코딩<\/td><td><code>claude-opus-4-8<\/code>이 코드에 직접 기입 — 모델 교체 시 소스 수정 필요<\/td><\/tr><tr><td>참조 무결성<\/td><td>사용자 삭제 기능이 없으나, 데이터 직접 조작 시 기존 댓글 작성자가 <code>?<\/code>로 표시됨<\/td><\/tr><tr><td>인증 부재<\/td><td>사용자 전환에 검증 없음 — 누구나 타인 명의로 작성 가능<\/td><\/tr><tr><td>동시성<\/td><td>다중 탭에서 동일 프로젝트 편집 시 <code>storage<\/code> 이벤트 미처리로 마지막 쓰기가 승리<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h47\">10. 개선 제안 (Backlog)<\/h2><div class=\"table-wrap\"><table><thead><tr><th>우선순위<\/th><th>항목<\/th><th>기대 효과<\/th><\/tr><\/thead><tbody><tr><td>P0<\/td><td>9.1 초기 렌더 순서 수정<\/td><td>첫 진입 UX 정상화 (2줄 이동으로 해결)<\/td><\/tr><tr><td>P0<\/td><td><code>allow-same-origin<\/code> 제거<\/td><td>API 키 탈취 경로 차단<\/td><\/tr><tr><td>P1<\/td><td>서버 프록시 경유 AI 호출<\/td><td>API 키 비노출, 사용량 통제<\/td><\/tr><tr><td>P1<\/td><td>백엔드 + 실시간 동기화 도입<\/td><td>실질적 팀 협업 기능 확보<\/td><\/tr><tr><td>P2<\/td><td>의견 → 재생성 반영 (다음 버전 프롬프트 자동 구성)<\/td><td>피드백 루프 완성, 반복 작업 제거<\/td><\/tr><tr><td>P2<\/td><td>버전 간 비교(diff) 뷰<\/td><td>변경점 리뷰 효율 향상<\/td><\/tr><tr><td>P3<\/td><td>IndexedDB 전환 + 이미지 압축<\/td><td>용량 한계 해소<\/td><\/tr><tr><td>P3<\/td><td>모델 · max_tokens 설정 UI 분리<\/td><td>운영 유연성<\/td><\/tr><tr><td>P3<\/td><td>목업 저장 시 Quota 예외 처리<\/td><td>데이터 유실 방지<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"MockupGen_기능명세서-h48\">11. 데모 시드 데이터 (참고)<\/h2><p><code>index.html<\/code>의 <code>seedDemoData()<\/code>가 최초 방문 시 자동 생성한다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>구분<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>사용자<\/td><td>김태정(PM) · 이수진(UI 디자이너) · 박준호(개발팀)<\/td><\/tr><tr><td>프로젝트 1<\/td><td><code>seed-p1<\/code> — 농협 올원뱅크 앱 리뉴얼 (목업 v1·v2, 의견 5건, 채팅 6건)<\/td><\/tr><tr><td>프로젝트 2<\/td><td><code>seed-p2<\/code> — SmartRoom 회의실 예약 앱 (목업 v1, 의견 2건, 채팅 3건)<\/td><\/tr><tr><td>특징<\/td><td>v1 → v2 개선 서사(여백 확대, 터치 영역 44px 확보, 지출 분석 위젯 추가)가 의견·채팅에 반영되어 있음<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"WORKFLOW","group":"개발 가이드라인","title":"개발 워크플로","lede":"3-Phase 탐색 → 계획 → 실행","author":"Lucas-one","commit":"ad7b5e6","date":"2026-08-30","path":"docs/guidelines/WORKFLOW.md","size":"4KB","changed":false,"roles":["dev"],"body":"<h1 id=\"WORKFLOW-h0\">Development Workflow<\/h1><h2 id=\"WORKFLOW-h1\">Core Directive<\/h2><p>You are a senior software engineer AI assistant. For EVERY task request, you MUST follow the three-phase process below in exact order. Each phase must be completed with expert-level precision and detail.<\/p><h2 id=\"WORKFLOW-h2\">Guiding Principles<\/h2><ul><li><strong>Minimalistic Approach<\/strong>: Implement high-quality, clean solutions while avoiding unnecessary complexity<\/li><li><strong>Expert-Level Standards<\/strong>: Every output must meet professional software engineering standards<\/li><li><strong>Concrete Results<\/strong>: Provide specific, actionable details at each step<\/li><\/ul><hr><h2 id=\"WORKFLOW-h3\">Phase 1: Codebase Exploration &amp; Analysis<\/h2><p><strong>REQUIRED ACTIONS:<\/strong><\/p><ol><li><strong>Docs Reference (read before anything else)<\/strong><\/li><\/ol><p>Read only the docs relevant to the current task. Skip the rest.<\/p><p>상황별 전체 목록은 <code>CLAUDE.md<\/code>의 <strong>작업 상황별 필독 문서<\/strong> 표를 따른다. 요약:<\/p><div class=\"table-wrap\"><table><thead><tr><th>상황<\/th><th>읽을 파일<\/th><\/tr><\/thead><tbody><tr><td>모든 작업 시작 시<\/td><td><code>개발문서/01_PRD.md<\/code> — 프로젝트 목적/기능 범위 확인 (PRD 정본)<\/td><\/tr><tr><td>코드 변경 시<\/td><td><code>docs/architecture/ARCHITECTURE.md<\/code> — API 설계, 에러 처리, 폴더 구조<\/td><\/tr><tr><td>새 기능 / 의존성 추가 시<\/td><td><code>docs/architecture/TECH_STACK.md<\/code> — 기술 스택 결정, <strong>&quot;검토 후 제외한 기술&quot; 섹션 우선 확인<\/strong><\/td><\/tr><tr><td>인증/보안/입력처리/AI호출 작업 시<\/td><td><code>docs/guidelines/SECURITY_CHECKLIST.md<\/code><\/td><\/tr><tr><td>배포/인프라 작업 시<\/td><td><code>docs/architecture/DEPLOYMENT.md<\/code><\/td><\/tr><tr><td>API·DB 설계 시<\/td><td><code>개발문서/05_API_DB_SPEC.md<\/code><\/td><\/tr><tr><td>미결 사항 확인 시<\/td><td><code>개발문서/08_DECISIONS_OPEN_ISSUES.md<\/code> — 미결이면 가정하지 말고 질문<\/td><\/tr><\/tbody><\/table><\/div><ol><li><strong>Systematic File Discovery<\/strong><ul><li>List ALL potentially relevant files, directories, and modules<\/li><li>Search for related keywords, functions, classes, and patterns<\/li><li>Examine each identified file thoroughly<\/li><\/ul><\/li><\/ol><ol><li><strong>Convention &amp; Style Analysis<\/strong><ul><li>Document coding conventions (naming, formatting, architecture patterns)<\/li><li>Identify existing code style guidelines<\/li><li>Note framework/library usage patterns<\/li><li>Catalog error handling approaches<\/li><\/ul><\/li><\/ol><p><strong>OUTPUT FORMAT:<\/strong><\/p><pre><code>### Codebase Analysis Results\n**Relevant Files Found:**\n- [file_path]: [brief description of relevance]\n\n**Code Conventions Identified:**\n- Naming: [convention details]\n- Architecture: [pattern details]\n- Styling: [format details]\n\n**Key Dependencies &amp; Patterns:**\n- [library/framework]: [usage pattern]<\/code><\/pre><hr><h2 id=\"WORKFLOW-h4\">Phase 2: Implementation Planning<\/h2><p><strong>REQUIRED ACTIONS:<\/strong><br>Based on Phase 1 findings, create a detailed implementation roadmap.<\/p><p><strong>OUTPUT FORMAT:<\/strong><\/p><pre><code class=\"lang-markdown\">## Implementation Plan\n\n### Module: [Module Name]\n**Summary:** [1-2 sentence description of what needs to be implemented]\n\n**Tasks:**\n- [ ] [Specific implementation task]\n- [ ] [Specific implementation task]\n\n**Acceptance Criteria:**\n- [ ] [Measurable success criterion]\n- [ ] [Measurable success criterion]\n- [ ] [Performance/quality requirement]\n\n### Module: [Next Module Name]\n[Repeat structure above]<\/code><\/pre><hr><h2 id=\"WORKFLOW-h5\">Phase 3: Implementation Execution<\/h2><p><strong>REQUIRED ACTIONS:<\/strong><\/p><ol><li>Implement each module following the plan from Phase 2<\/li><li>Verify ALL acceptance criteria are met before proceeding<\/li><li>Ensure code adheres to conventions identified in Phase 1<\/li><\/ol><p><strong>QUALITY GATES:<\/strong><\/p><ul><li><span class=\"chk\">☐<\/span>All acceptance criteria validated<\/li><li><span class=\"chk\">☐<\/span>Code follows established conventions<\/li><li><span class=\"chk\">☐<\/span>Minimalistic approach maintained<\/li><li><span class=\"chk\">☐<\/span>Expert-level implementation standards met<\/li><\/ul><hr><h2 id=\"WORKFLOW-h6\">Success Validation<\/h2><p>Before completing any task, confirm:<\/p><ul><li>✅ All three phases completed sequentially<\/li><li>✅ Each phase output meets specified format requirements<\/li><li>✅ Implementation satisfies all acceptance criteria<\/li><li>✅ Code quality meets professional standards<\/li><\/ul><h2 id=\"WORKFLOW-h7\">Response Structure<\/h2><p>Always structure your response as:<\/p><ol><li><strong>Phase 1 Results<\/strong>: [Codebase analysis findings]<\/li><li><strong>Phase 2 Plan<\/strong>: [Implementation roadmap]<\/li><li><strong>Phase 3 Implementation<\/strong>: [Actual code with validation]<\/li><\/ol>"},{"id":"CLEAN_CODE","group":"개발 가이드라인","title":"클린 코드 규칙","lede":"네이밍 · 함수 · 구조 · 테스트","author":"Lucas-one","commit":"cce6eab","date":"2026-08-30","path":"docs/guidelines/CLEAN_CODE.md","size":"3KB","changed":false,"roles":[],"body":"<h1 id=\"CLEAN_CODE-h0\">Clean Code Guidelines<\/h1><p>You are an expert software engineer focused on writing clean, maintainable code. Follow these principles rigorously:<\/p><h2 id=\"CLEAN_CODE-h1\">Core Principles<\/h2><ul><li><strong>DRY<\/strong> - Eliminate duplication ruthlessly<\/li><li><strong>KISS<\/strong> - Simplest solution that works<\/li><li><strong>YAGNI<\/strong> - Build only what&#39;s needed now<\/li><li><strong>SOLID<\/strong> - Apply all five principles consistently<\/li><li><strong>Boy Scout Rule<\/strong> - Leave code cleaner than found<\/li><\/ul><h2 id=\"CLEAN_CODE-h2\">Naming Conventions<\/h2><ul><li>Use <strong>intention-revealing<\/strong> names<\/li><li>Avoid abbreviations except well-known ones (e.g., URL, API)<\/li><li>Classes: <strong>nouns<\/strong>, Methods: <strong>verbs<\/strong>, Booleans: <strong>is/has/can<\/strong> prefix<\/li><li>Constants: UPPER_SNAKE_CASE<\/li><li>No magic numbers - use named constants<\/li><\/ul><h2 id=\"CLEAN_CODE-h3\">Functions &amp; Methods<\/h2><ul><li><strong>Single Responsibility<\/strong> - one reason to change<\/li><li>Maximum 20 lines (prefer under 10)<\/li><li>Maximum 3 parameters (use objects for more)<\/li><li>No side effects in pure functions<\/li><li>Early returns over nested conditions<\/li><\/ul><h2 id=\"CLEAN_CODE-h4\">Code Structure<\/h2><ul><li><strong>Cyclomatic complexity<\/strong> &lt; 10<\/li><li>Maximum nesting depth: 3 levels<\/li><li>Organize by feature, not by type<\/li><li>Dependencies point inward (Clean Architecture)<\/li><li>Interfaces over implementations<\
