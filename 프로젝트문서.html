<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NH 위드캔버스 · 프로젝트 문서 허브</title>
<style>
:root{
--nh-blue-700:#00689b;--nh-blue-600:#007ec0;--nh-blue-500:#0094d9;--nh-blue-300:#79c8ee;--nh-blue-100:#d6eefa;--nh-blue-50:#eef8fd;
--nh-navy-900:#0a2540;--nh-navy-800:#122f50;--nh-navy-700:#1d3d63;--nh-navy-500:#34507a;
--nh-slate-700:#353f5e;--nh-slate-600:#3f4a68;--nh-slate-500:#4a5677;
--nh-green-700:#007f3d;--nh-green-600:#009047;--nh-green-500:#00a04e;--nh-green-100:#d6f1e1;--nh-green-50:#ecf9f1;
--grey-900:#1a1c1f;--grey-800:#2b2f36;--grey-700:#41464f;--grey-600:#5b616b;--grey-500:#767d88;--grey-400:#9aa0aa;--grey-300:#c4c9d0;--grey-200:#e2e5ea;--grey-150:#eaedf1;--grey-100:#f0f2f5;--grey-50:#f5f6f8;--white:#fff;
--amber-600:#b26a00;--amber-100:#fdeecf;--amber-50:#fdf6e8;--red-600:#c22e22;--red-50:#fdecea;
--page:var(--grey-50);--card:var(--white);--sunken:var(--grey-100);
--tx-strong:var(--grey-900);--tx-body:var(--grey-700);--tx-muted:var(--grey-500);--tx-faint:var(--grey-400);
--bd-subtle:var(--grey-200);--bd:var(--grey-300);--bd-strong:var(--grey-400);
--rail:var(--white);--rail-bd:var(--grey-200);--rail-hover:var(--grey-100);--rail-active:var(--nh-blue-50);
--st-done-fg:var(--nh-green-700);--st-done-bg:var(--nh-green-50);--st-done-bd:var(--nh-green-100);--st-done-dot:var(--nh-green-500);
--st-part-fg:var(--amber-600);--st-part-bg:var(--amber-50);--st-part-bd:var(--amber-100);--st-part-dot:#e2a33a;
--st-todo-fg:var(--grey-500);--st-todo-bg:var(--grey-100);--st-todo-bd:var(--grey-200);--st-todo-dot:var(--grey-300);
--shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow-md:0 4px 14px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(10,37,64,.12);
--font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Nanum Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--mono:"SFMono-Regular",Consolas,"D2Coding","Liberation Mono",Menlo,monospace;
--sb:296px;--toc:236px;
}
html[data-theme="dark"]{
--page:#0e1319;--card:#161c24;--sunken:#1c232c;
--tx-strong:#e8ecf1;--tx-body:#bcc5d0;--tx-muted:#8892a0;--tx-faint:#6b7480;
--bd-subtle:#252d38;--bd:#333d4a;--bd-strong:#454f5e;
--rail:#131920;--rail-bd:#242c37;--rail-hover:#1c232c;--rail-active:#15304a;
--nh-blue-50:#12283a;--nh-blue-100:#1a3a53;--nh-blue-600:#54b6e8;--nh-blue-500:#3aa8e0;--nh-blue-700:#7cc9ee;
--nh-green-50:#11291d;--nh-green-100:#1a3d2a;--nh-green-700:#4cc888;--nh-green-600:#3cbb79;
--amber-50:#2b220f;--amber-100:#3d3116;--amber-600:#e0b055;--red-50:#331917;--red-600:#f08a80;
--grey-100:#1c232c;--grey-150:#222a34;--grey-50:#161c24;
--st-todo-fg:#8892a0;--st-todo-bg:#1c232c;--st-todo-bd:#252d38;--st-todo-dot:#3c4552;
--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 14px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--tx-body);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--nh-blue-600);text-decoration:none}
a:hover{color:var(--nh-blue-700);text-decoration:underline}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--nh-blue-100);color:var(--tx-strong)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.shell.has-toc{grid-template-columns:var(--sb) minmax(0,1fr) var(--toc)}

/* ---------- sidebar ---------- */
.sb{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--rail-bd);display:flex;flex-direction:column;overflow:hidden}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid var(--rail-bd);cursor:pointer;background:none;border-left:0;border-top:0;border-right:0;text-align:left;width:100%;display:block;transition:background 140ms}
.sb-brand:hover{background:var(--rail-hover)}
.sb-brand .bt{display:flex;align-items:center;gap:8px}
.sb-brand .mark{width:22px;height:22px;border-radius:5px;background:var(--nh-blue-500);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em;flex:none}
.sb-brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.035em;color:var(--tx-strong);line-height:1.3}
.sb-brand .meta{margin-top:7px;font-size:11.5px;line-height:1.6;color:var(--tx-faint);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sb-search{padding:14px 16px 10px}
.sb-search .wrap{position:relative}
.sb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx-faint);pointer-events:none}
.sb-search input{width:100%;height:38px;padding:0 30px 0 33px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx-strong);font-family:inherit;font-size:13.5px;letter-spacing:-.01em;outline:none;transition:border-color 140ms,box-shadow 140ms}
.sb-search input::placeholder{color:var(--tx-faint)}
.sb-search input:focus{border-color:var(--nh-blue-500);box-shadow:0 0 0 3px var(--nh-blue-50)}
.sb-search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:none;color:var(--tx-faint);font-size:15px;line-height:1;border-radius:5px;display:none;align-items:center;justify-content:center}
.sb-search .clr:hover{background:var(--sunken);color:var(--tx-body)}
.sb-search.filled .clr{display:flex}
.sb-roles{padding:0 16px 12px;border-bottom:1px solid var(--rail-bd)}
.sb-roles .lbl{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--tx-faint);margin-bottom:7px}
.seg{display:flex;background:var(--sunken);border-radius:7px;padding:2.5px;gap:2px}
.seg button{flex:1;height:27px;border:0;background:none;border-radius:5px;font-size:11.5px;font-weight:600;letter-spacing:-.02em;color:var(--tx-muted);white-space:nowrap;transition:all 140ms}
.seg button:hover{color:var(--tx-body)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx-strong);font-weight:700;box-shadow:var(--shadow-sm)}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 24px;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:9px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px;border:3px solid var(--rail)}
.sb-nav::-webkit-scrollbar-thumb:hover{background:var(--bd-strong)}
.grp{margin-bottom:6px}
.grp-h{display:flex;align-items:center;gap:6px;width:100%;padding:8px 8px 6px;border:0;background:none;text-align:left}
.grp-h .cv{color:var(--tx-faint);transition:transform 160ms;flex:none}
.grp.closed .cv{transform:rotate(-90deg)}
.grp-h .tt{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tx-muted)}
.grp-h .ct{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--tx-faint);font-variant-numeric:tabular-nums}
.grp.closed .grp-b{display:none}
.grp.fr .grp-h .tt{color:var(--nh-blue-600)}

.nl{display:flex;align-items:center;gap:7px;width:100%;padding:6px 9px;border:0;background:none;border-radius:6px;text-align:left;color:var(--tx-body);font-size:13px;letter-spacing:-.015em;line-height:1.4;transition:background 120ms,color 120ms;position:relative}
.nl:hover{background:var(--rail-hover);color:var(--tx-strong)}
.nl.on{background:var(--rail-active);color:var(--nh-blue-700);font-weight:700}
.nl.on::before{content:"";position:absolute;left:-10px;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:var(--nh-blue-500)}
.nl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .dot{width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500);flex:none}
.nl.dim{opacity:.32}
.frid{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0;padding:1.5px 5px;border-radius:4px;background:var(--sunken);color:var(--tx-muted);border:1px solid var(--bd-subtle)}
.nl.on .frid{background:var(--nh-blue-100);color:var(--nh-blue-700);border-color:transparent}
.trio{display:flex;gap:2.5px;flex:none}
.trio i{width:6px;height:6px;border-radius:2px;display:block}
.trio i.done{background:var(--st-done-dot)}
.trio i.partial{background:var(--st-part-dot)}
.trio i.todo{background:var(--st-todo-dot)}
.sub{padding:2px 0 6px 20px;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--bd-subtle);margin-left:14px}
.sub button{border:0;background:none;text-align:left;padding:4px 8px;border-radius:5px;font-size:12px;color:var(--tx-muted);letter-spacing:-.015em;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background 120ms,color 120ms}
.sub button:hover{background:var(--rail-hover);color:var(--tx-body)}
.sb-foot{border-top:1px solid var(--rail-bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.sb-foot .v{font-size:11px;color:var(--tx-faint);font-variant-numeric:tabular-nums}
.tgl{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx-body);font-size:11.5px;font-weight:600;letter-spacing:-.01em;transition:border-color 140ms,color 140ms}
.tgl:hover{border-color:var(--nh-blue-500);color:var(--nh-blue-600)}

/* ---------- main ---------- */
.main{min-width:0;padding:0 0 96px}
.inner{max-width:1000px;margin:0 auto;padding:0 40px}
.wide .inner{max-width:1180px}

/* cover */
.cover-h{padding:52px 0 30px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--nh-blue-600);margin-bottom:12px}
.cover-h h2{margin:0;font-size:40px;font-weight:800;letter-spacing:-.045em;color:var(--tx-strong);line-height:1.18}
.cover-h p{margin:12px 0 0;font-size:16px;color:var(--tx-muted);letter-spacing:-.015em;max-width:620px;text-wrap:pretty}

.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:2px solid var(--nh-navy-800);margin-bottom:0}
.sect-h h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.035em;color:var(--tx-strong)}
.sect-h .sum{font-size:12.5px;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums;padding-bottom:2px;white-space:nowrap}
.sect-h .sum b{color:var(--tx-strong);font-weight:700}

/* filter bar */
.fbar{background:var(--card);border:1px solid var(--bd-subtle);border-top:0;border-radius:0 0 12px 12px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.fgrid{display:flex;flex-wrap:wrap;gap:0;padding:4px 0}
.fdim{padding:10px 18px;border-right:1px solid var(--bd-subtle);display:flex;flex-direction:column;gap:7px}
.fdim:last-of-type{border-right:0}
.fdim .lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tx-faint)}
.chips{display:flex;gap:5px}
.chip{height:28px;padding:0 11px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx-body);font-size:12.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;transition:all 140ms;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--nh-blue-300);color:var(--nh-blue-600)}
.chip[aria-pressed="true"]{background:var(--nh-navy-800);border-color:var(--nh-navy-800);color:#fff}
html[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--nh-blue-600);border-color:var(--nh-blue-600);color:#08121c}
.chip.solo[aria-pressed="true"]{background:var(--amber-50);border-color:var(--amber-600);color:var(--amber-600)}
.fbar-foot{display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--bd-subtle);background:var(--sunken);border-radius:0 0 11px 11px;min-height:42px;flex-wrap:wrap}
.fbar-foot .st{font-size:12.5px;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fbar-foot .st b{color:var(--tx-strong);font-weight:700}
.act{display:flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 9px;border-radius:5px;background:var(--card);border:1px solid var(--bd);font-size:11.5px;font-weight:600;color:var(--tx-body);letter-spacing:-.01em}
.act i{font-style:normal;color:var(--tx-faint);font-weight:500}
.act button{width:16px;height:16px;border:0;background:none;color:var(--tx-faint);font-size:13px;line-height:1;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0}
.act button:hover{background:var(--sunken);color:var(--red-600)}
.reset{margin-left:auto;height:26px;padding:0 10px;border:0;background:none;color:var(--tx-muted);font-size:12px;font-weight:600;border-radius:5px;text-decoration:underline;text-underline-offset:2px}
.reset:hover{color:var(--tx-strong)}

/* feature cards */
.fgridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:14px}
.fc{background:var(--card);border:1px solid var(--bd-subtle);border-radius:12px;box-shadow:var(--shadow-sm);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow 160ms,border-color 160ms,transform 160ms}
.fc:hover{box-shadow:var(--shadow-md);border-color:var(--nh-blue-300);transform:translateY(-1px)}
.fc-top{padding:15px 17px 0;display:flex;align-items:center;gap:7px}
.fc-id{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--nh-navy-800);color:#fff;letter-spacing:0}
html[data-theme="dark"] .fc-id{background:var(--nh-blue-600);color:#08121c}
.fc-ph{font-size:11px;font-weight:700;color:var(--tx-muted);letter-spacing:-.01em;padding:2px 6px;border-radius:4px;background:var(--sunken);border:1px solid var(--bd-subtle);font-variant-numeric:tabular-nums}
.fc-q{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--amber-600);background:var(--amber-50);border:1px solid var(--amber-100);padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.fc-body{padding:9px 17px 14px;flex:1;display:flex;flex-direction:column}
.fc-body h4{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.032em;color:var(--tx-strong);line-height:1.35}
.fc-body p{margin:5px 0 0;font-size:12.5px;line-height:1.6;color:var(--tx-muted);letter-spacing:-.012em;text-wrap:pretty}
.fc-meta{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;line-height:1.55;padding-top:10px;border-top:1px dashed var(--bd-subtle)}
.fc-meta dt{color:var(--tx-faint);font-weight:700;letter-spacing:.02em}
.fc-meta dd{margin:0;color:var(--tx-body);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-meta dd.mono{font-family:var(--mono);font-size:11px}

/* the three-stage rail — the loudest thing on the card */
.rail3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd-subtle);border-top:1px solid var(--bd-subtle);margin-top:auto}
.rail3 .st{background:var(--card);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:default}
.rail3 .st .bar{width:100%;height:4px;border-radius:999px;background:var(--st-todo-dot)}
.rail3 .st .nm{font-size:11.5px;font-weight:700;letter-spacing:-.02em;color:var(--tx-faint)}
.rail3 .st.done{background:var(--st-done-bg)}
.rail3 .st.done .bar{background:var(--st-done-dot)}
.rail3 .st.done .nm{color:var(--st-done-fg)}
.rail3 .st.partial{background:var(--st-part-bg)}
.rail3 .st.partial .bar{background:linear-gradient(90deg,var(--st-part-dot) 0 55%,var(--st-part-bd) 55% 100%)}
.rail3 .st.partial .nm{color:var(--st-part-fg)}
.rail3 .st.todo .nm{color:var(--st-todo-fg)}
.rail3 .st[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--nh-navy-900);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:-.01em;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:30;box-shadow:var(--shadow-md);pointer-events:none}
.rail3 .st[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--nh-navy-900);z-index:30;pointer-events:none}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--tx-muted);font-size:14px;background:var(--card);border:1px dashed var(--bd);border-radius:12px}

/* role entries */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
.role{background:var(--card);border:1px solid var(--bd-subtle);border-radius:12px;box-shadow:var(--shadow-sm);padding:24px 26px 22px;border-top:3px solid var(--nh-navy-800)}
.role.dev{border-top-color:var(--nh-green-500)}
.role h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.032em;color:var(--tx-strong)}
.role p{margin:5px 0 16px;font-size:13px;color:var(--tx-muted);letter-spacing:-.012em}
.role ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.role li button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;text-align:left;font-size:13.5px;color:var(--tx-body);letter-spacing:-.015em;transition:background 120ms,color 120ms}
.role li button:hover{background:var(--sunken);color:var(--nh-blue-600)}
.role li button .ar{margin-left:auto;color:var(--tx-faint);font-size:12px}
.role li button:hover .ar{color:var(--nh-blue-600)}

/* doc view */
.doc-h{padding:44px 0 0}
.crumb{font-size:12px;color:var(--tx-faint);letter-spacing:-.01em;margin-bottom:10px}
.doc-h h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-.042em;color:var(--tx-strong);line-height:1.24}
.doc-h .lede{margin:11px 0 0;font-size:15.5px;line-height:1.7;color:var(--tx-muted);letter-spacing:-.015em;max-width:660px;text-wrap:pretty}
.metachips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-bottom:22px;border-bottom:1px solid var(--bd-subtle)}
.mchip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:5px;background:var(--sunken);border:1px solid var(--bd-subtle);font-size:11.5px;font-weight:600;color:var(--tx-muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mchip b{color:var(--tx-body);font-weight:700}
.mchip.hi{background:var(--nh-blue-50);border-color:var(--nh-blue-100);color:var(--nh-blue-700)}
.mchip.hi::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--nh-blue-500)}

/* canon band — the hero device of the doc view */
.canon{margin:24px 0 30px;background:var(--card);border:1px solid var(--bd-subtle);border-left:3px solid var(--nh-navy-800);border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden}
html[data-theme="dark"] .canon{border-left-color:var(--nh-blue-500)}
.canon-h{display:flex;align-items:center;gap:9px;padding:12px 20px;background:var(--sunken);border-bottom:1px solid var(--bd-subtle)}
.canon-h .t{font-size:13px;font-weight:800;letter-spacing:-.02em;color:var(--tx-strong)}
.canon-h .d{font-size:11.5px;color:var(--tx-faint);letter-spacing:-.01em}
.canon-h .rail-mini{margin-left:auto;display:flex;gap:5px}
.rmini{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:5px;font-size:11.5px;font-weight:700;letter-spacing:-.015em;border:1px solid}
.rmini::before{content:"";width:6px;height:6px;border-radius:50%}
.rmini.done{background:var(--st-done-bg);border-color:var(--st-done-bd);color:var(--st-done-fg)}

.rmini.partial{background:var(--st-part-bg);border-color:var(--st-part-bd);color:var(--st-part-fg)}
.rmini.partial::before{background:var(--st-part-dot)}
.rmini.todo{background:var(--st-todo-bg);border-color:var(--st-todo-bd);color:var(--st-todo-fg)}
.rmini.todo::before{background:var(--st-todo-dot)}
.canon-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--bd-subtle)}
.cgrp{background:var(--card);padding:13px 18px 14px;display:flex;flex-direction:column;gap:6px}
.cgrp .gl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tx-faint)}
.cgrp .gi{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cgrp .gi a,.cgrp .gi button{border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--nh-blue-600);letter-spacing:-.015em;text-align:left;line-height:1.5;font-family:inherit}
.cgrp .gi a:hover,.cgrp .gi button:hover{color:var(--nh-blue-700);text-decoration:underline}
.cgrp .gi .none{color:var(--tx-faint);font-size:12.5px;font-weight:500}
.cgrp.q .gl{color:var(--amber-600)}
.cgrp.q .gi button{color:var(--amber-600)}

/* markdown body */
.md{font-size:15px;line-height:1.78;color:var(--tx-body);letter-spacing:-.01em;padding-bottom:40px}
.md>*:first-child{margin-top:0}
.md h2{margin:44px 0 14px;padding-top:22px;border-top:1px solid var(--bd-subtle);font-size:23px;font-weight:800;letter-spacing:-.038em;color:var(--tx-strong);line-height:1.35;scroll-margin-top:24px}
.md h2:first-child{border-top:0;padding-top:0;margin-top:0}
.md h3{margin:30px 0 10px;font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--tx-strong);scroll-margin-top:24px}
.md h4{margin:22px 0 8px;font-size:14.5px;font-weight:700;letter-spacing:-.025em;color:var(--tx-body)}
.md p{margin:0 0 15px;text-wrap:pretty}
.md ul,.md ol{margin:0 0 16px;padding-left:20px}
.md li{margin-bottom:5px}
.md li::marker{color:var(--tx-faint)}
.md strong{color:var(--tx-strong);font-weight:700}
.md code{font-family:var(--mono);font-size:.875em;background:var(--sunken);border:1px solid var(--bd-subtle);border-radius:4px;padding:1px 5px;color:var(--nh-navy-700)}
html[data-theme="dark"] .md code{color:var(--nh-blue-600)}
.md pre{margin:0 0 18px;background:var(--nh-navy-900);border-radius:9px;padding:16px 18px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;color:#d7e3f0;font-size:12.5px;line-height:1.7}
.md blockquote{margin:0 0 18px;padding:12px 18px;background:var(--nh-blue-50);border-left:3px solid var(--nh-blue-500);border-radius:0 8px 8px 0;color:var(--tx-body);font-size:14px}
.md blockquote p:last-child{margin:0}
.md hr{border:0;border-top:1px solid var(--bd-subtle);margin:32px 0}
/* wide tables: scroller with edge affordance + sticky head */
.tw{position:relative;margin:0 0 20px}
.tw-scroll{overflow-x:auto;border:1px solid var(--bd-subtle);border-radius:9px;background:var(--card);scrollbar-width:thin}
.tw-scroll::-webkit-scrollbar{height:9px}
.tw-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}
.tw::after{content:"";position:absolute;top:1px;bottom:10px;right:1px;width:34px;border-radius:0 9px 9px 0;background:linear-gradient(90deg,transparent,var(--card) 78%);opacity:0;transition:opacity 180ms;pointer-events:none}
.tw.more::after{opacity:1}
.md table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6;min-width:max-content}
.md thead th{position:sticky;top:0;background:var(--sunken);color:var(--tx-muted);font-size:11.5px;font-weight:800;letter-spacing:.02em;text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;z-index:1}
.md tbody td{padding:10px 14px;border-bottom:1px solid var(--bd-subtle);color:var(--tx-body);vertical-align:top;letter-spacing:-.01em}
.md tbody tr:last-child td{border-bottom:0}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.md tbody tr:hover{background:var(--nh-blue-50)}
.md td .mono,.md td code{white-space:nowrap}

/* search results */
.sr-h{padding:44px 0 18px;border-bottom:2px solid var(--nh-navy-800);margin-bottom:0}
.sr-h h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--tx-strong)}
.sr-h h2 em{font-style:normal;color:var(--nh-blue-600)}
.sr-h .c{font-size:13px;color:var(--tx-muted);margin-top:6px;font-variant-numeric:tabular-nums}
.sr-list{display:flex;flex-direction:column;margin-top:0}
.sr{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:15px 18px;border:0;border-bottom:1px solid var(--bd-subtle);background:var(--card);transition:background 120ms}
.sr:first-child{border-radius:0 0 0 0}
.sr:hover{background:var(--nh-blue-50)}
.sr .src{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-faint);letter-spacing:-.01em}
.sr .src b{color:var(--tx-muted);font-weight:700}
.sr .src .kind{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--sunken);border:1px solid var(--bd-subtle);color:var(--tx-faint)}
.sr .snip{font-size:13.5px;line-height:1.65;color:var(--tx-body);letter-spacing:-.012em}
.sr mark{background:#fff2b8;color:var(--tx-strong);font-weight:700;border-radius:2px;padding:0 1px}
html[data-theme="dark"] .sr mark{background:#5c4a12;color:#ffe89a}
.sr-none{padding:60px 20px;text-align:center;color:var(--tx-muted);background:var(--card);border:1px dashed var(--bd);border-radius:12px;margin-top:20px}

/* toc */
.toc{position:sticky;top:0;height:100vh;overflow-y:auto;padding:44px 20px 40px 4px;scrollbar-width:thin}
.toc::-webkit-scrollbar{width:8px}
.toc::-webkit-scrollbar-thumb{background:var(--bd-subtle);border-radius:8px}
.toc .h{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--tx-faint);padding:0 0 9px 11px;border-bottom:1px solid var(--bd-subtle);margin-bottom:8px}
.toc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 10px;border-radius:5px;font-size:12px;line-height:1.5;color:var(--tx-muted);letter-spacing:-.015em;border-left:2px solid transparent;transition:color 120ms,border-color 120ms,background 120ms}
.toc button:hover{color:var(--tx-body);background:var(--sunken)}
.toc li.l3 button{padding-left:22px;font-size:11.5px;color:var(--tx-faint)}
.toc button.on{color:var(--nh-blue-600);font-weight:700;border-left-color:var(--nh-blue-500);background:var(--nh-blue-50)}

/* ============================================================ 모바일
   이 문서는 모바일 웹에서 주로 본다. 3단 그리드를 한 컬럼으로 무너뜨리고
   사이드바는 드로어로 돌린다. 고정 폭(--sb 296px)이 남으면 본문이 짜부라진다. */
.mtop{display:none}
.mnav-back{display:none}

@media (max-width:900px){
  .mtop{display:flex;align-items:center;gap:10px;position:fixed;inset:0 0 auto 0;height:52px;
    z-index:70;padding:0 12px;background:var(--rail);border-bottom:1px solid var(--rail-bd)}
  .mtop-t{font-size:14px;font-weight:800;letter-spacing:-.03em;color:var(--tx-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop-btn{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--bd-subtle);border-radius:9px;background:var(--card);cursor:pointer;padding:0}
  .mtop-btn .bars{position:relative}
  .mtop-btn .bars,.mtop-btn .bars::before,.mtop-btn .bars::after{display:block;width:16px;height:2px;
    border-radius:2px;background:var(--tx-body);content:""}
  .mtop-btn .bars::before{position:absolute;top:-5px}
  .mtop-btn .bars::after{position:absolute;top:5px}

  .shell,.shell.has-toc{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}

  .sb{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);height:100dvh;z-index:80;
    transform:translateX(-100%);transition:transform 220ms ease}
  .shell.nav-open .sb{transform:none;box-shadow:var(--shadow-md)}
  .mnav-back{display:block;position:fixed;inset:0;z-index:75;background:rgba(10,37,64,.45);
    opacity:0;pointer-events:none;transition:opacity 200ms}
  .shell.nav-open .mnav-back{opacity:1;pointer-events:auto}

  .main{padding-top:52px}
  .inner,.wide .inner{padding:0 16px;max-width:none}

  .cover-h h2{font-size:27px}
  .doc-h h2{font-size:23px}
  .sect-h{flex-direction:column;align-items:flex-start;gap:8px}

  /* 필터 바 — 차원을 가로로 붙이면 한 칸이 40px 남는다 */
  .fgrid{display:block}
  .fdim{border-right:0;border-bottom:1px solid var(--bd-subtle);padding:10px 14px}
  .fdim:last-of-type{border-bottom:0}

  .fgridcards,.canon-b,.roles{grid-template-columns:minmax(0,1fr)}
  .canon-h{flex-wrap:wrap}

  .chip,.seg button{min-height:34px}
  .mchip.mono{word-break:break-all}
  .md pre{overflow-x:auto}
}

@media print{.sb,.toc,.fbar,.mtop,.mnav-back{display:none}.shell{display:block}}

var DOCS = [{"id":"NH뚝딱협업스튜디오_기획안","group":"기획","title":"프로젝트 계획서","lede":"「AI Agent 챌린지」 최종개선본","author":"Lucas-one","commit":"cce6eab","date":"2026-08-30","path":"docs/NH뚝딱협업스튜디오_기획안.md","size":"14KB","changed":false,"roles":["pm"],"body":"<h1 id=\"NH뚝딱협업스튜디오_기획안-h0\">NH 뚝딱협업스튜디오 — 프로젝트 계획서<\/h1><blockquote><p>「AI Agent 챌린지」 프로젝트 계획서<br>AI 기반 NH 업무 제작 · 협의 · 의사결정 자산화 플랫폼<\/p><p>원본 PDF: <code>docs/NH뚝딱협업스튜디오_기획안_최종개선본.pdf<\/code> (본 문서는 검색·차이 비교를 위한 텍스트 사본)<\/p><\/blockquote><h2 id=\"NH뚝딱협업스튜디오_기획안-h1\">제안의 핵심<\/h2><p>디자인을 잘 만드는 또 하나의 도구가 아니라, NH의 업무 맥락을 바탕으로 문서·화면을 만들고<br>사업·테크·디자인·준법이 함께 검토한 뒤, 결정과 변경 과정을 조직의 자산으로 남기는 <strong>업무 제작 플랫폼<\/strong>.<\/p><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>팀<\/td><td>농알이 / 외부 Track / 4명<\/td><\/tr><tr><td>인프라<\/td><td>농협은행 내부 Linux 서버 · Docker<\/td><\/tr><tr><td>AI<\/td><td>승인된 LLM 서버를 인증 API로 호출 / 모델 직접 운영하지 않음<\/td><\/tr><tr><td>구축 방식<\/td><td>프로젝트 단위 단계적 구축<\/td><\/tr><tr><td>가치<\/td><td>AI 제작 + NH 업무자산 + 협업 + 의사결정 추적 + 재사용<\/td><\/tr><\/tbody><\/table><\/div><p><strong>한 문장 정의<\/strong> — &quot;아이디어는 빠르게 구체화하고, 협업 과정은 조직의 자산으로 남긴다.&quot;<\/p><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h2\">1. 문제 정의와 서비스 방향<\/h2><h3 id=\"NH뚝딱협업스튜디오_기획안-h3\">1-1. 현재 업무의 비효율<\/h3><div class=\"table-wrap\"><table><thead><tr><th>단계<\/th><th>현재 문제<\/th><th>NH 뚝딱의 해결 방향<\/th><\/tr><\/thead><tbody><tr><td>기획/제작<\/td><td>문서·PPT·웹/앱 시안을 각각 제작<\/td><td>채팅 + 참고자료 + Template 기반 동시 초안<\/td><\/tr><tr><td>자료 활용<\/td><td>내부 자료와 과거 산출물이 개인/부서 단위로 분산<\/td><td>프로젝트 자료와 조직 자산으로 축적<\/td><\/tr><tr><td>협의<\/td><td>사업·테크·디자인·준법 의견이 여러 채널로 분산<\/td><td>하나의 결과물에서 공동 검토<\/td><\/tr><tr><td>수정<\/td><td>반영 이유와 이전 결과를 다시 찾아야 함<\/td><td>의견 → 결정 → Version → History 연결<\/td><\/tr><tr><td>인수인계<\/td><td>최종 파일 위주로 전달되어 배경이 소실<\/td><td>결과물과 의사결정 근거를 함께 보존<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h4\">1-2. 제품 포지셔닝<\/h3><ul><li><strong>기존 접근<\/strong>: AI 디자인 생성 / 문서 생성 / 디자인 시스템 구축<\/li><li><strong>권장 포지셔닝<\/strong>: NH 업무 제작·협의 플랫폼. 디자인 시스템은 독립 제품이 아니라 NH Template·컴포넌트·업무기준을 제공하는 &quot;업무 자산 계층&quot;으로 둔다.<\/li><\/ul><h3 id=\"NH뚝딱협업스튜디오_기획안-h5\">1-3. 내부 환경을 고려한 원칙<\/h3><ul><li>자체 LLM을 만들기보다 승인된 사내 LLM API를 사용하고, AI 연계 계층은 서비스와 모델 사이의 추상화 레이어로 둔다.<\/li><li>AI-DLC 등 기존 디자인 시스템과 경쟁하지 않고 기존 자산을 가져와 실제 업무 프로젝트에서 재사용한다.<\/li><li>폐쇄망/내부망 운영을 고려해 Linux/Docker 배포를 기본으로 하고, 향후 K8s 전환 가능한 컨테이너 구조를 유지한다.<\/li><li>AI OCR, 챗봇, RAG 등 기존·향후 AI 서비스와 연결할 수 있도록 자료·API·Project 구조를 공통화한다.<\/li><\/ul><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h6\">2. 차별화 전략: &quot;디자인 시스템&quot;이 아니라 &quot;업무 의사결정 시스템&quot;<\/h2><blockquote><p><strong>중요한 결론<\/strong> — 협업·댓글·버전관리만으로는 차별화가 약하다. Figma는 실시간 협업·댓글·Version History를 제공하고, Claude Design도 조직 공유·인라인 피드백·디자인 시스템 적용·버전별 공유를 지원한다. 내부 AI-DLC에도 디자인 시스템과 버전/PR 중심 관리가 이미 존재한다.<\/p><\/blockquote><h3 id=\"NH뚝딱협업스튜디오_기획안-h7\">2-1. 레퍼런스 비교<\/h3><div class=\"table-wrap\"><table><thead><tr><th>대상<\/th><th>이미 강한 기능<\/th><th>NH 뚝딱의 포지션<\/th><\/tr><\/thead><tbody><tr><td>Figma<\/td><td>디자인 제작 / 협업 / 댓글 / Version History<\/td><td>디자인 파일이 아니라 &quot;업무 프로젝트&quot;를 관리<\/td><\/tr><tr><td>Storybook<\/td><td>컴포넌트 / 문서화 / UI 라이브러리<\/td><td>컴포넌트보다 NH 업무 Template·업무기준과 연결<\/td><\/tr><tr><td>Claude Design<\/td><td>AI 디자인 / 프로토타입 / 조직 공유 / 피드백<\/td><td>NH 업무자료 + 검토 + 반영 + History까지 업무 흐름화<\/td><\/tr><tr><td>NH AI-DLC<\/td><td>사내 디자인 규칙 / 컴포넌트 / 버전·PR 관리<\/td><td>기존 디자인 자산을 재사용하고 업무 결과물과 연결<\/td><\/tr><tr><td><strong>NH 뚝딱<\/strong><\/td><td>업무 제작·협의·자산화<\/td><td>의견 → 결정 → 반영 → Version → History → 재사용<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h8\">2-2. 우리가 반드시 잡아야 할 차별점<\/h3><div class=\"table-wrap\"><table><thead><tr><th>차별점<\/th><th>구체화<\/th><\/tr><\/thead><tbody><tr><td>업무 프로젝트 중심<\/td><td>Canvas가 아니라 Project가 시작점. 사람·자료·결과물·검토·Version·History를 한 단위로 묶음<\/td><\/tr><tr><td>NH 업무 맥락<\/td><td>NH Template, 서비스별 화면 기준, 업무자료, 과거 사례를 생성 맥락으로 제공<\/td><\/tr><tr><td>의사결정 추적<\/td><td>댓글을 &quot;합의 / 이견 / 추가확인&quot;으로 구조화하고 반영 여부와 변경 이유까지 연결<\/td><\/tr><tr><td>과정의 자산화<\/td><td>최종 파일뿐 아니라 검토 근거·Template·사례를 다음 프로젝트에서 재사용<\/td><\/tr><tr><td>승인 AI 독립성<\/td><td>AI Orchestrator가 모델과 서비스를 분리하여 사내 LLM 변경에 대응<\/td><\/tr><tr><td>내부 운영 적합성<\/td><td>SSO·내부 저장소·폐쇄망·권한·Audit을 고려한 사내 전용 서비스<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h9\">3. 핵심 서비스 구조<\/h2><h3 id=\"NH뚝딱협업스튜디오_기획안-h10\">3-1. 서비스 모듈<\/h3><div class=\"table-wrap\"><table><thead><tr><th>영역<\/th><th>핵심 기능<\/th><th>핵심 질문<\/th><\/tr><\/thead><tbody><tr><td>Project Workspace<\/td><td>프로젝트 / 참여자 / 권한 / 자료<\/td><td>누가 무엇을 만들고 있는가?<\/td><\/tr><tr><td>AI Studio<\/td><td>Chat / 자료 기반 생성 / 문서·화면 초안<\/td><td>무엇을 빠르게 만들 것인가?<\/td><\/tr><tr><td>NH Design &amp; Template<\/td><td>NH Template / 나만의 Template / Asset Library<\/td><td>NH답게 어떻게 만들 것인가?<\/td><\/tr><tr><td>Collaboration<\/td><td>댓글 / 담당자 검토 / 멘션 / 상태<\/td><td>누가 어떤 의견을 냈는가?<\/td><\/tr><tr><td>Decision Center<\/td><td>합의 / 이견 / 추가확인 / 반영·미반영<\/td><td>무엇을 결정했는가?<\/td><\/tr><tr><td>Version &amp; History<\/td><td>Version / 변경사유 / 행동·의견 이력<\/td><td>왜 이렇게 바뀌었는가?<\/td><\/tr><tr><td>Export &amp; Reuse<\/td><td>업무파일 / 공유 / 재사용<\/td><td>다음 업무에 어떻게 활용할 것인가?<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h11\">3-2. 대표 사용자 흐름<\/h3><p><code>01. 생성 → 02. 검토 → 03. 결정 → 04. 반영 → 05. 자산화<\/code><\/p><p>프로젝트 생성 → 참고자료/Template 선택 → AI 초안 → 공동 검토 → AI 의견 취합 → 담당자 반영 선택 → 새 Version → 최종 파일 + History 저장 → Template/사례 재사용<\/p><h3 id=\"NH뚝딱협업스튜디오_기획안-h12\">3-3. 핵심 UX 원칙<\/h3><ul><li>AI가 제안하고, 사람이 최종 결정한다. UI에서도 AI 제안과 사용자 승인 상태를 명확히 구분한다.<\/li><li>댓글은 기록으로 끝나지 않고 &quot;반영/미반영/추가 확인&quot; 상태를 가진다.<\/li><li>특정 Version만 공유할 수 있고, 해당 Version의 주요 결정 근거까지 확인할 수 있게 한다.<\/li><li>프로젝트 종료 후 결과물을 Asset으로 승격해 다음 프로젝트의 시작점으로 사용할 수 있게 한다.<\/li><\/ul><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h13\">4. 시스템 구성 및 AI 연계<\/h2><h3 id=\"NH뚝딱협업스튜디오_기획안-h14\">4-1. 권장 아키텍처<\/h3><ul><li><strong>사용자 영역<\/strong>: 사내 사용자 → SSO → Nginx / Reverse Proxy → Frontend<\/li><li><strong>애플리케이션 영역<\/strong>: Backend API → Project / Collaboration / Template / Version / History + AI Orchestrator + Async Worker<\/li><li><strong>데이터 영역<\/strong>: PostgreSQL(업무데이터) + Redis(Session/Cache) + NFS 또는 승인 저장소(참고자료·생성파일·Version 산출물)<\/li><li><strong>AI 영역<\/strong>: AI Orchestrator → HTTPS + 인증 Token → 승인된 LLM API Gateway → LLM Server<\/li><\/ul><h3 id=\"NH뚝딱협업스튜디오_기획안-h15\">4-2. 필수 설계 원칙<\/h3><div class=\"table-wrap\"><table><thead><tr><th>원칙<\/th><th>설계 내용<\/th><\/tr><\/thead><tbody><tr><td>LLM 직접 호출 금지<\/td><td>Browser가 LLM을 직접 호출하지 않고 Backend/AI Orchestrator가 호출<\/td><\/tr><tr><td>인증정보 보호<\/td><td>Token/API Key는 Frontend에 노출하지 않고 서버 측 보안 저장 영역에서 관리<\/td><\/tr><tr><td>비동기 처리<\/td><td>대용량 파일·장시간 생성은 Job으로 처리하고 상태/재처리 관리<\/td><\/tr><tr><td>파일/DB 분리<\/td><td>DB는 메타데이터, 실제 문서·이미지·Export 결과는 파일 저장소에 보관<\/td><\/tr><tr><td>모델 독립성<\/td><td>서비스 API와 LLM 모델을 분리하여 승인 모델 변경 영향 최소화<\/td><\/tr><tr><td>운영 확장성<\/td><td>초기 Docker Linux 배포 → 향후 K8s 전환 가능한 컨테이너 단위 설계<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h16\">4-3. 내부 AI 생태계와 역할 분담<\/h3><ul><li><strong>AI-DLC<\/strong>: 기존 디자인 규칙·컴포넌트·개발 가이드를 재사용하고 중복 구축을 피한다.<\/li><li><strong>AI-Driven / AI OCR<\/strong>: 공통 AI 환경 및 OCR 결과와 연계하되 역할을 분리한다.<\/li><li><strong>RAG<\/strong>: 업무기준·VOC·사례 확대 시 선택적으로 검색·생성 계층을 추가한다.<\/li><li><strong>SSO·폐쇄망·Docker/K8s<\/strong>: 사내 인증·접근통제와 초기 Docker 배포, 향후 K8s 전환을 고려한다.<\/li><\/ul><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h17\">5. 개발 프로젝트 분할<\/h2><blockquote><p><strong>개발 전략<\/strong> — 서비스를 한 번에 만들기보다 공통 기반 → NH 업무자산 → AI 제작 → 협업/의사결정 → Version/자산화 순으로 분리한다. 각 Project는 독립 데모와 검증이 가능해야 하며 선행 결과물을 후속 Project가 재사용한다.<\/p><\/blockquote><div class=\"table-wrap\"><table><thead><tr><th>Project<\/th><th>목표<\/th><th>핵심 개발<\/th><th>완료 기준<\/th><\/tr><\/thead><tbody><tr><td>P1. 업무공간<\/td><td>서비스 골격<\/td><td>SSO / Project / 권한 / UI / DB / 파일 / Docker<\/td><td>로그인 후 Project 생성·자료 등록·조회<\/td><\/tr><tr><td>P2. NH 업무자산<\/td><td>NH 특화 맥락<\/td><td>NH Template / 서비스별 Template / 나만의 Template / Asset Library<\/td><td>Template을 선택해 일관된 결과물 생성<\/td><\/tr><tr><td>P3. AI 제작<\/td><td>AI 초안/시안<\/td><td>Chat / 참고자료 / LLM API / AI Orchestrator / Async Job<\/td><td>승인 LLM API로 문서·화면 생성<\/td><\/tr><tr><td>P4. 협업·의사결정<\/td><td>공동 검토<\/td><td>댓글 / 검토상태 / AI 의견 취합 / 합의·이견·추가확인 / 반영선택<\/td><td>여러 담당자가 하나의 결과물을 검토하고 결정<\/td><\/tr><tr><td>P5. Version·자산화<\/td><td>과정과 결과 연결<\/td><td>Version / History / Diff / Audit / Export / 재사용 / RAG 검토<\/td><td>변경 근거 추적 + 결과물 재사용<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h18\">5-1. MVP 범위<\/h3><div class=\"table-wrap\"><table><thead><tr><th>MVP<\/th><th>후속 고도화<\/th><\/tr><\/thead><tbody><tr><td>Project / SSO / 파일 / 기본 권한<\/td><td>정교한 조직권한 / 결재 연계<\/td><\/tr><tr><td>NH Template 기본 세트<\/td><td>Template 추천 / Marketplace<\/td><\/tr><tr><td>Chat + 승인 LLM API<\/td><td>다중 모델 라우팅 / Agent Workflow<\/td><\/tr><tr><td>기본 댓글 + AI 의견 취합<\/td><td>고급 Workflow / 실시간 공동편집<\/td><\/tr><tr><td>Version + History + 기본 Export<\/td><td>고급 Diff / Audit Analytics / RAG<\/td><\/tr><\/tbody><\/table><\/div><p><strong>권장 개발 순서: P1 → P2 → P3 → P4 → P5<\/strong><\/p><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h19\">6. 데이터·이력·업무 자산화<\/h2><h3 id=\"NH뚝딱협업스튜디오_기획안-h20\">6-1. Version과 History를 분리<\/h3><div class=\"table-wrap\"><table><thead><tr><th>구분<\/th><th>정의<\/th><th>예시<\/th><\/tr><\/thead><tbody><tr><td>Version<\/td><td>공식 결과물의 변경 단위<\/td><td>v1 최초 생성 → v2 사업 의견 반영 → v3 준법 의견 반영<\/td><\/tr><tr><td>History<\/td><td>행동·의견·AI 처리·의사결정 과정<\/td><td>댓글 → AI 취합 → 반영 선택 → 수정 → v3 생성<\/td><\/tr><tr><td>Audit<\/td><td>접근·권한 등 주요 운영 행위<\/td><td>로그인 / 프로젝트 접근 / 권한 변경 / AI 요청<\/td><\/tr><tr><td>Asset<\/td><td>향후 재사용 대상<\/td><td>Template / 업무사례 / 결과물 / 검토 기준<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h21\">6-2. 핵심 데이터 관계<\/h3><pre><code>USER → PROJECT → DOCUMENT → VERSION\nPROJECT → MEMBER / COMMENT / REVIEW / HISTORY / AUDIT / TEMPLATE\nVERSION → FILE → EXPORT RESULT<\/code><\/pre><blockquote><p><strong>업무 자산화의 차별점<\/strong> — 프로젝트 종료 시 최종 파일만 보관하지 않고, &quot;어떤 Template을 사용했고 / 어떤 의견을 반영했으며 / 왜 변경했는지&quot;를 함께 저장한다. 다음 프로젝트는 과거 결과물을 그대로 복사하는 것이 아니라, 검토 근거와 Template까지 재사용할 수 있다.<\/p><\/blockquote><h3 id=\"NH뚝딱협업스튜디오_기획안-h22\">6-3. 핵심 화면 예시<\/h3><div class=\"table-wrap\"><table><thead><tr><th>AI 협의 정리<\/th><th>상태<\/th><\/tr><\/thead><tbody><tr><td>CTA 위치 상단 이동<\/td><td>합의 완료 → 반영<\/td><\/tr><tr><td>상품 비교 기준<\/td><td>의견 조율 필요 → 담당자 선택<\/td><\/tr><tr><td>우대금리 표현<\/td><td>추가 확인 → 준법 검토 요청<\/td><\/tr><tr><td>최종 결과<\/td><td>v4 생성 → History 자동 기록<\/td><\/tr><\/tbody><\/table><\/div><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h23\">7. 기대효과·리스크·확정사항<\/h2><h3 id=\"NH뚝딱협업스튜디오_기획안-h24\">7-1. 성과지표<\/h3><div class=\"table-wrap\"><table><thead><tr><th>효과<\/th><th>KPI 방향<\/th><\/tr><\/thead><tbody><tr><td>제작시간<\/td><td>초안·시안·Export 소요시간<\/td><\/tr><tr><td>협의시간<\/td><td>의견 취합시간·재회의·재작업 횟수<\/td><\/tr><tr><td>추적성<\/td><td>의견-반영·Version 연결률 / History 조회<\/td><\/tr><tr><td>자산화<\/td><td>재사용 Template·과거 사례 활용 건수<\/td><\/tr><tr><td>AI 안정성<\/td><td>API 성공률·처리시간·재처리율<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h25\">7-2. 주요 리스크와 대응<\/h3><div class=\"table-wrap\"><table><thead><tr><th>리스크<\/th><th>대응<\/th><\/tr><\/thead><tbody><tr><td>기존 디자인 시스템과 중복<\/td><td>기존 시스템 대체가 아닌 상위 업무 레이어로 정의<\/td><\/tr><tr><td>Claude/Figma와 차별성 약화<\/td><td>NH 업무맥락·의사결정 추적·자산화에 집중<\/td><\/tr><tr><td>AI 품질 편차<\/td><td>Template·참고자료·검토·승인으로 보완<\/td><\/tr><tr><td>내부정보 유출<\/td><td>내부망·서버측 인증·접근권한·보존정책 적용<\/td><\/tr><tr><td>LLM 변경·장시간 처리<\/td><td>AI Orchestrator + Async Job으로 대응<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"NH뚝딱협업스튜디오_기획안-h26\">7-3. 개발 전 확정이 필요한 사항<\/h3><div class=\"table-wrap\"><table><thead><tr><th>영역<\/th><th>확정 질문<\/th><\/tr><\/thead><tbody><tr><td>승인 LLM<\/td><td>API endpoint / 인증 / 모델 / 호출한도 / Timeout<\/td><\/tr><tr><td>Infra·Storage<\/td><td>Linux/Docker 사양·운영방식 / NFS 등 저장소 / 용량·보존기간<\/td><\/tr><tr><td>Security<\/td><td>입력자료·AI 로그 저장범위 / 마스킹 / Audit 정책<\/td><\/tr><tr><td>권한·RAG<\/td><td>Owner/Editor/Reviewer/Viewer / RAG 대상과 검색 인프라<\/td><\/tr><tr><td>Export<\/td><td>HTML / PPTX / DOCX / HWPX 우선순위<\/td><\/tr><\/tbody><\/table><\/div><blockquote><p>7-3의 &quot;영역&quot; 열 일부는 원본 PDF에서 표 좌측이 잘려 인쇄되어 있어, 문맥에 따라 복원한 값이다. 원본 확정 시 대조 필요.<\/p><\/blockquote><hr><h2 id=\"NH뚝딱협업스튜디오_기획안-h27\">8. 최종 제안<\/h2><blockquote><p><strong>NH 뚝딱협업스튜디오<\/strong><br>&quot;범용 AI가 결과물을 만드는 수준을 넘어, NH의 업무 맥락을 이해하고 여러 담당자의 의견을 의사결정으로 연결하며, 그 과정과 결과물을 조직의 자산으로 남기는 내부 업무 제작 플랫폼&quot;<\/p><\/blockquote><p><strong>내부 참고<\/strong>: AI-DLC 디자인 시스템 가이드·버전관리·화면 구성, 내부망 배포 자료 등<br><strong>외부 참고<\/strong>: Figma Design Systems/Version History, Storybook Docs, Atlassian Design System, Anthropic Claude Design/Artifacts<\/p>"},{"id":"README","group":"개발문서","title":"문서 패키지 개요","lede":"01~08 인덱스 · 권장 개발 순서","author":"Lucas-one","commit":"3fd2dee","date":"2026-09-05","path":"개발문서/README.md","size":"2KB","changed":false,"roles":[],"body":"<h1 id=\"README-h0\">NH뚝딱협업스튜디오 개발 문서 패키지<\/h1><h2 id=\"README-h1\">1. 문서 목적<\/h2><p>이 패키지는 NH뚝딱협업스튜디오의 개발 착수를 위한 기준 문서다. 제품의 핵심은 범용 디자인 생성기가 아니라, NH의 기존 업무 자산과 승인된 AI를 활용해 아이디어 생성부터 협업, 의사결정, 버전 관리, 업무 자산화를 연결하는 내부 업무 제작 플랫폼이다.<\/p><h2 id=\"README-h2\">2. 문서 구성<\/h2><ul><li>01_PRD.md: 제품 목표, 사용자, 문제, 기능 범위, MVP, 비기능 요구사항<\/li><li>02_USER_STORIES_AC.md: Epic, User Story, Acceptance Criteria, 우선순위<\/li><li>03_IA_FUNCTION_SPEC.md: IA, 화면 구조, 주요 상태<\/li><li>기능명세/: FR-01~13 기능별 상세 명세와 추적 매트릭스(00_INDEX.md)<\/li><li>04_SYSTEM_ARCHITECTURE.md: Linux + Docker 기반 시스템 구조, LLM API 연계, 비동기 처리, 보안 원칙<\/li><li>05_API_DB_SPEC.md: API 초안, 도메인 모델, 주요 테이블 및 데이터 관계<\/li><li>06_DEVELOPMENT_BACKLOG.md: 프로젝트 분할, Sprint/단계, 개발 티켓 후보, 완료 기준<\/li><li>07_QA_SECURITY_OPERATIONS.md: 테스트, 보안, 운영, 장애 대응 체크리스트<\/li><li>08_DECISIONS_OPEN_ISSUES.md: 결정사항, 미결사항, 인프라/보안 협의 항목<\/li><li>09_UI_SPEC_브랜드시안.md: S08·S09 화면 상세 명세 (FR-13 브랜드 시안 제작)<\/li><\/ul><h2 id=\"README-h3\">3. 권장 개발 순서<\/h2><p>P0 제품/환경 확정 → P1 업무공간 기반 → P2 AI 제작 → P3 협업/의사결정 → P4 Version/History/Export → P5 고도화(RAG/통계/자동화)<\/p><h2 id=\"README-h4\">4. 핵심 차별화<\/h2><ol><li>NH 디자인 시스템을 또 하나 만드는 것이 아니라 기존 자산을 업무 맥락에 연결한다.<\/li><li>댓글 자체가 아니라 의견 → 합의/이견/추가확인 → 반영 여부 → 버전 생성의 의사결정 흐름을 관리한다.<\/li><li>Version은 결과물의 상태, History는 변경/의사결정의 과정을 관리한다.<\/li><li>개인 결과물이 아니라 프로젝트 단위로 업무 자산을 축적하고 후속 업무에서 재사용한다.<\/li><li>승인된 LLM을 API로 호출하는 AI orchestration layer로 모델 교체와 운영 통제를 분리한다.<\/li><\/ol>"},{"id":"01_PRD","group":"개발문서","title":"01 · PRD","lede":"제품 목표 · 범위 · FR-01~15","author":"Lucas-one","commit":"96221a4","date":"2026-09-08","path":"개발문서/01_PRD.md","size":"10KB","changed":false,"roles":["pm"],"body":"<h1 id=\"01_PRD-h0\">NH뚝딱협업스튜디오 PRD v1.0<\/h1><h2 id=\"01_PRD-h1\">1. 제품 정의<\/h2><p><strong>제품명:<\/strong> NH뚝딱협업스튜디오<br><strong>한 줄 정의:<\/strong> NH 업무 맥락과 승인된 AI를 활용해 아이디어를 결과물로 만들고, 관련 담당자의 협의·의사결정·변경 이력을 하나의 흐름으로 관리하는 내부 업무 제작 플랫폼.<\/p><h2 id=\"01_PRD-h2\">2. 배경과 문제<\/h2><p>업무 담당자는 보고서, PPT, 웹/앱 화면 시안, 카드·홍보물 시안 등을 반복 작성·수정하고, 사업/테크/디자인/준법 등 여러 조직의 의견을 메일·메신저·회의 등 여러 경로에서 취합한다. 범용 AI는 초안 생산성은 높이지만 NH 업무양식과 내부 참고자료를 매번 설명해야 하고, 내부 자료 활용에는 보안·사용범위 제약이 있다.<\/p><h2 id=\"01_PRD-h3\">3. 제품 목표<\/h2><ul><li>아이디어를 문서·웹·앱 결과물로 빠르게 구체화<\/li><li>NH Template과 내부 업무 자산의 재사용성 확보<\/li><li>협의 내용을 한 곳에 모아 재작업과 협의 시간을 줄임<\/li><li>AI가 의견을 합의/이견/추가확인으로 정리하도록 지원<\/li><li>담당자가 반영 여부를 직접 결정하고 결과물을 새 버전으로 생성<\/li><li>Version과 History를 통해 변경 이유와 의사결정 과정을 추적<\/li><li>프로젝트별 결과물과 업무 노하우를 조직 자산으로 축적<\/li><\/ul><h2 id=\"01_PRD-h4\">4. 범위<\/h2><h3 id=\"01_PRD-h5\">MVP 포함<\/h3><ul><li>사내 SSO 로그인 및 사용자/권한<\/li><li>프로젝트 생성/조회/공유/멤버 관리<\/li><li>참고자료 업로드 및 파일 메타데이터 관리<\/li><li>NH Template / 나만의 Template 선택<\/li><li>AI Chat 및 기본 결과 생성<\/li><li>문서/웹·앱 시안 초안 생성<\/li><li>브랜드 시안(카드 실물·홍보물) 초안 생성 및 3안 비교·선택<\/li><li>LLM API 인증/호출을 위한 AI Orchestrator<\/li><li>댓글 및 협업 의견 등록<\/li><li>AI 의견 요약(합의/이견/추가확인)<\/li><li>생성 결과물의 책임성 검토(표현·차별 / 금융소비자보호 / 다크패턴 / 접근성) 및 담당자 결정<\/li><li>논의와 화면을 함께 읽는 UX 리스크 검토(누적·중단·예외상황·되돌리기·사용맥락·빠진 이해관계자) 및 담당자 결정<\/li><li>반영할 의견 선택 및 AI 수정 요청<\/li><li>Version 생성/조회/비교<\/li><li>History 기록<\/li><\/ul><h3 id=\"01_PRD-h6\">후속 고도화<\/h3><ul><li>PPTX/DOCX/HWPX/HTML Export 고도화<\/li><li>내부 업무기준/VOC 연계<\/li><li>RAG 기반 검색·근거 제시<\/li><li>승인/결재 워크플로우 연계<\/li><li>업무사례/Template 추천<\/li><li>프로젝트 분석 및 협업 지표<\/li><li>AI Agent 기반 반복 업무 자동화<\/li><\/ul><h2 id=\"01_PRD-h7\">5. 비범위<\/h2><ul><li>자체 LLM 개발/학습<\/li><li>새로운 디자인 시스템의 전면 구축<ul><li>FR-13 브랜드 시안 제작은 이에 해당하지 않는다. 새 디자인 체계를 세우는 것이 아니라 <strong>기존 NH 자산을 배치해 컨셉 시안을 만드는 것<\/strong>이다. 자산의 정본은 기존 NH 디자인 자산이며 본 제품은 그것을 소비만 한다.<\/li><\/ul><\/li><li>카드·홍보물의 인쇄용 최종 파일 제작 (인쇄 규격·CMYK·재단선·해상도) — FR-13은 컨셉 시안까지만 다룬다<\/li><li>사용자 브라우저의 직접 LLM 호출<\/li><li>기관 전체 문서 저장소를 초기부터 통합하는 작업<\/li><li>자동 승인 또는 준법 판단의 완전 자동화<ul><li>FR-14 책임성 검토는 이에 해당하지 않는다. AI는 <strong>&quot;준법 검토가 필요해 보인다&quot;까지만<\/strong> 말하고 적법성을 판정하지 않으며, Export·공유를 차단하지 않는다. 판단이 필요한 건은 <code>준법 검토 요청<\/code> 결정으로 사람에게 넘긴다.<\/li><li>FR-15 UX 리스크 검토도 이에 해당하지 않는다. AI는 <strong>&quot;이 결정들이 합쳐지면 이런 결과가 됩니다&quot;까지만<\/strong> 말하고 설계의 좋고 나쁨을 판정하지 않으며, 특정 의견이나 작성자를 지목해 틀렸다고 말하지 않는다. 생성·Export·공유를 차단하지 않는다.<\/li><\/ul><\/li><\/ul><h2 id=\"01_PRD-h8\">6. 핵심 사용자<\/h2><h3 id=\"01_PRD-h9\">U1 업무 담당자<\/h3><p>아이디어를 정리하고 산출물을 만들어야 하는 실무자.<\/p><h3 id=\"01_PRD-h10\">U2 협업 검토자<\/h3><p>사업/테크/디자인/준법 등 결과물을 검토하고 의견을 남기는 사용자.<\/p><h3 id=\"01_PRD-h11\">U3 프로젝트 관리자<\/h3><p>프로젝트 멤버, 결과물, 협의상태와 History를 관리하는 사용자.<\/p><h3 id=\"01_PRD-h12\">U4 운영 관리자<\/h3><p>Template, 권한, 시스템 정책과 운영 로그를 관리하는 역할.<\/p><h2 id=\"01_PRD-h13\">7. 핵심 사용자 여정<\/h2><p>프로젝트 생성 → 자료/Template 선택 → AI로 초안 생성 → 검토자 초대 → 결과물에 의견 등록 → AI 의견 취합 → 담당자가 반영할 의견 선택 → AI 수정 → 새 Version 생성 → History 축적 → 최종 파일 Export<\/p><h2 id=\"01_PRD-h14\">8. 성공 지표<\/h2><p>초기에는 정량 KPI보다 사용성 검증 지표를 우선한다.<\/p><ul><li>프로젝트 최초 결과물 생성 성공률<\/li><li>AI 생성 결과의 사용자 채택률<\/li><li>의견 취합 후 재작업 횟수 감소<\/li><li>프로젝트당 협의 완료까지의 평균 소요시간<\/li><li>Version 간 변경사항 추적 가능 비율<\/li><li>Template 재사용률<\/li><\/ul><h2 id=\"01_PRD-h15\">9. 핵심 기능 요구사항<\/h2><blockquote><p>기능별 상세 명세와 추적 매트릭스는 <a href=\"#00_INDEX\">기능명세 인덱스<\/a> 참고.<\/p><\/blockquote><h3 id=\"01_PRD-h16\">FR-01 인증/권한<\/h3><p>사내 SSO를 통해 사용자를 인증하고 프로젝트 단위 접근권한을 통제한다.<br>상세: <a href=\"#FR-01_인증권한\">FR-01 인증/권한<\/a><\/p><h3 id=\"01_PRD-h17\">FR-02 프로젝트<\/h3><p>프로젝트명, 설명, 상태, 소유자, 멤버, 생성일, 최근 활동을 관리한다.<br>상세: <a href=\"#FR-02_프로젝트\">FR-02 프로젝트<\/a><\/p><h3 id=\"01_PRD-h18\">FR-03 참고자료<\/h3><p>파일 업로드, 목록, 삭제, 버전 연결, AI 참조 대상 선택을 지원한다.<br>상세: <a href=\"#FR-03_참고자료\">FR-03 참고자료<\/a><\/p><h3 id=\"01_PRD-h19\">FR-04 Template<\/h3><p>NH 공통 Template과 개인/부서 Template을 구분하고 사용 이력과 버전을 관리한다.<br>상세: <a href=\"#FR-04_템플릿\">FR-04 Template<\/a><\/p><h3 id=\"01_PRD-h20\">FR-05 AI 제작<\/h3><p>사용자의 요청과 선택한 자료/Template을 LLM API에 전달하고 결과를 저장한다.<br>상세: <a href=\"#FR-05_AI제작\">FR-05 AI 제작<\/a><\/p><h3 id=\"01_PRD-h21\">FR-06 협업<\/h3><p>결과물 또는 특정 영역에 의견을 남기고 담당자를 지정할 수 있어야 한다.<br>상세: <a href=\"#FR-06_협업의견\">FR-06 협업<\/a><\/p><h3 id=\"01_PRD-h22\">FR-07 AI 의견 취합<\/h3><p>다수 의견을 합의/이견/추가확인으로 분류하고 수정 후보를 제시한다.<br>상세: <a href=\"#FR-07_AI의견취합\">FR-07 AI 의견 취합<\/a><\/p><h3 id=\"01_PRD-h23\">FR-08 반영 결정<\/h3><p>AI 제안은 자동 확정하지 않으며 담당자가 반영/보류/반려를 선택한다.<br>상세: <a href=\"#FR-08_반영결정\">FR-08 반영 결정<\/a><\/p><h3 id=\"01_PRD-h24\">FR-09 Version<\/h3><p>결과물이 변경되면 불변에 가까운 Version 스냅샷을 만들고 작성 원인과 연결한다.<br>상세: <a href=\"#FR-09_버전관리\">FR-09 Version<\/a><\/p><h3 id=\"01_PRD-h25\">FR-10 History<\/h3><p>사용자 행동, AI 작업, 댓글, 반영 결정, Version 생성을 시간순으로 기록한다.<br>상세: <a href=\"#FR-10_히스토리\">FR-10 History<\/a><\/p><h3 id=\"01_PRD-h26\">FR-11 Export<\/h3><p>최종 산출물을 실제 업무파일 형태로 생성/다운로드한다.<br>상세: <a href=\"#FR-11_Export\">FR-11 Export<\/a><\/p><h3 id=\"01_PRD-h27\">FR-12 감사 추적<\/h3><p>주요 인증·권한·변경·AI 호출 관련 이벤트를 감사 대상으로 남길 수 있어야 한다.<br>상세: <a href=\"#FR-12_감사추적\">FR-12 감사 추적<\/a><\/p><h3 id=\"01_PRD-h28\">FR-13 브랜드 시안 제작<\/h3><p>카드 실물·홍보물의 컨셉 시안을 서로 다른 방향 3안으로 생성하고, 담당자가 하나를 선택해 방향을 확정한다. 선택 시점에 Version이 생성된다.<br>상세: <a href=\"#FR-13_브랜드시안제작\">FR-13 브랜드 시안 제작<\/a><\/p><h3 id=\"01_PRD-h29\">FR-14 책임성 검토<\/h3><p>생성된 화면·산출물에서 표현·차별, 금융소비자보호, 다크패턴, 접근성 축의 문제 지점을 근거와 함께 제시하고, 담당자가 반영/보류/반려/준법 검토 요청을 선택한다. <strong>AI는 판정하지 않는다.<\/strong><br>상세: <a href=\"#FR-14_책임성검토\">FR-14 책임성 검토<\/a> · 규칙 정본: <a href=\"#RESPONSIBLE_DESIGN\">RESPONSIBLE_DESIGN.md<\/a><\/p><h3 id=\"01_PRD-h30\">FR-15 UX 리스크 검토<\/h3><p>담당자가 요청하면 전 화면의 목업과 의견 전문을 함께 읽고, 개별 의견으로는 타당하지만 합쳐지면 사용자가 불편해지는 지점을 근거와 함께 의견 흐름에 올린다. 담당자가 반영/보류/반려를 선택한다. <strong>AI는 판정하지 않으며, 사람의 의견을 대체하지 않는다.<\/strong><br>상세: <a href=\"#FR-15_UX리스크검토\">FR-15 UX 리스크 검토<\/a> · 렌즈 정본: <a href=\"#USABILITY_REVIEW\">USABILITY_REVIEW.md<\/a><\/p><h2 id=\"01_PRD-h31\">10. 비기능 요구사항<\/h2><ul><li>내부 Linux 서버 + Docker 배포 가능 구조<\/li><li>모든 외부/AI 연계는 서버 측에서 수행<\/li><li>LLM Token/Secret은 코드/프론트에 노출하지 않음<\/li><li>API timeout/retry/error handling 제공<\/li><li>장시간 AI 작업은 비동기 처리 가능<\/li><li>파일과 DB 데이터를 분리 저장<\/li><li>API/DB/File 권한을 최소권한으로 설계<\/li><li>운영 로그와 감사 로그를 구분<\/li><li>향후 K8s 전환이 가능한 컨테이너 구조 유지<\/li><\/ul><h2 id=\"01_PRD-h32\">11. MVP Definition of Done<\/h2><ul><li>사용자 로그인 후 프로젝트를 생성할 수 있다.<\/li><li>프로젝트 자료를 업로드하고 AI 요청에 선택해서 사용할 수 있다.<\/li><li>승인된 LLM API로 생성 요청을 보내고 결과를 저장할 수 있다.<\/li><li>협업자가 결과물에 의견을 남길 수 있다.<\/li><li>AI가 의견을 정리하고 담당자가 반영 여부를 선택할 수 있다.<\/li><li>반영 결과로 새 Version이 생성된다.<\/li><li>Version과 History에서 변경 원인과 작업 이력을 확인할 수 있다.<\/li><li>운영환경에서 재현 가능한 Docker 배포가 가능하다.<\/li><\/ul>"},{"id":"02_USER_STORIES_AC","group":"개발문서","title":"02 · User Stories & AC","lede":"Epic E1~E6 · US-001~060","author":"Lucas-one","commit":"96221a4","date":"2026-09-08","path":"개발문서/02_USER_STORIES_AC.md","size":"9KB","changed":false,"roles":["pm"],"body":"<h1 id=\"02_USER_STORIES_AC-h0\">NH뚝딱협업스튜디오 User Stories &amp; Acceptance Criteria v1.0<\/h1><h2 id=\"02_USER_STORIES_AC-h1\">Epic E1. 인증/업무공간<\/h2><h3 id=\"02_USER_STORIES_AC-h2\">US-001 SSO 로그인<\/h3><p><strong>As a<\/strong> 사내 사용자<br><strong>I want<\/strong> SSO로 로그인하고<br><strong>So that<\/strong> 별도 계정 없이 서비스를 이용하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>Given 사내 SSO 인증 성공, When 서비스 접속, Then 사용자 계정과 기본 권한이 생성/조회된다.<\/li><li>인증 실패 시 서비스 API가 보호된다.<\/li><li>브라우저에 LLM Token이 노출되지 않는다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h3\">US-002 프로젝트 생성<\/h3><p><strong>As a<\/strong> 업무 담당자<br><strong>I want<\/strong> 업무 단위 프로젝트를 생성하고 멤버를 초대하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>프로젝트명/설명/소유자를 입력해 생성할 수 있다.<\/li><li>멤버별 권한을 구분할 수 있다.<\/li><li>모든 주요 변경은 History에 남는다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h4\">Epic E2. NH 업무자산<\/h2><h3 id=\"02_USER_STORIES_AC-h5\">US-010 Template 선택<\/h3><p><strong>As a<\/strong> 업무 담당자<br><strong>I want<\/strong> NH Template을 선택해 결과물에 적용하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>NH 공통 Template과 개인/부서 Template이 구분된다.<\/li><li>Template 버전을 선택할 수 있다.<\/li><li>사용할 Template이 AI 요청 컨텍스트로 전달된다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h6\">US-011 참고자료 등록<\/h3><p><strong>As a<\/strong> 업무 담당자<br><strong>I want<\/strong> 기존 자료를 프로젝트에 등록하고 AI가 참고하도록 하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>허용된 파일 형식과 크기 정책을 적용한다.<\/li><li>파일은 프로젝트와 연결된다.<\/li><li>AI 요청 시 사용자가 참조 여부를 선택할 수 있다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h7\">US-012 브랜드 자산 선택<\/h3><p><strong>As a<\/strong> 업무 담당자<br><strong>I want<\/strong> NH 로고·색·서체 자산을 골라 시안에 반영하고<br><strong>So that<\/strong> 디자인을 몰라도 결과물이 NH답게 나오길 원한다.<\/p><p><strong>AC<\/strong><\/p><ul><li>브랜드 자산은 Template의 한 유형(<code>BRAND_ASSET<\/code>)으로 조회된다.<\/li><li>선택한 자산이 AI 요청 컨텍스트로 전달된다.<\/li><li>자산이 하나도 없어도 생성은 가능하되, NH 색·로고가 반영되지 않는다는 안내가 표시된다.<\/li><li>로고·캐릭터 등 그림 요소는 선택된 자산만 사용되며 AI가 새로 생성하지 않는다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h8\">Epic E3. AI 제작<\/h2><h3 id=\"02_USER_STORIES_AC-h9\">US-020 AI 초안 생성<\/h3><p><strong>As a<\/strong> 업무 담당자<br><strong>I want<\/strong> 채팅으로 업무 내용을 설명해 문서/화면 초안을 만들고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>요청/참고자료/Template을 기준으로 AI 작업이 생성된다.<\/li><li>LLM API 호출 실패 시 사용자에게 작업 상태와 재시도 방법이 표시된다.<\/li><li>완료된 결과는 프로젝트와 연결된다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h10\">US-021 비동기 AI 작업<\/h3><p><strong>As a<\/strong> 사용자<br><strong>I want<\/strong> 긴 AI 작업도 화면을 닫지 않고 처리되길 원한다.<\/p><p><strong>AC<\/strong><\/p><ul><li>작업은 REQUESTED/PROCESSING/COMPLETED/FAILED 상태를 가진다.<\/li><li>실패한 작업은 원인 요약과 재시도 옵션을 제공한다.<\/li><li>중복 제출을 방지한다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h11\">US-022 브랜드 시안 생성<\/h3><p><strong>As a<\/strong> 카드 상품 기획자 / 마케팅 담당자<br><strong>I want<\/strong> 카드나 홍보물의 시안을 서로 다른 방향으로 여러 개 받아<br><strong>So that<\/strong> 회의에서 방향을 눈으로 놓고 정하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>산출물 유형(카드 실물 / 홍보물)과 규격 프리셋을 선택할 수 있다.<\/li><li>브리프(상품·캠페인명, 타겟, 전달할 느낌, 필수 문구)를 디자인 용어 없이 입력할 수 있다.<\/li><li>Given 브리프와 자산이 입력됨, When 생성을 요청, Then 서로 다른 방향의 시안 3개가 하나의 AI 작업으로 생성된다.<\/li><li>각 시안에는 방향을 설명하는 라벨이 함께 제공된다.<\/li><li>일부 시안만 실패한 경우 성공한 시안은 그대로 표시되고 실패분만 재시도할 수 있다.<\/li><li>생성 시점에는 Version이 만들어지지 않는다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h12\">US-023 시안 비교·선택<\/h3><p><strong>As a<\/strong> 프로젝트 담당자<br><strong>I want<\/strong> 시안 3개를 나란히 놓고 의견을 모은 뒤 하나를 확정하고<br><strong>So that<\/strong> 왜 그 방향으로 갔는지가 기록으로 남길 원한다.<\/p><p><strong>AC<\/strong><\/p><ul><li>3개 시안이 규격 비율을 유지한 채 나란히 표시된다.<\/li><li>시안별로 의견을 등록할 수 있고, 의견은 해당 시안에 귀속된다.<\/li><li>Given 3안이 표시됨, When 하나를 선택, Then Version 1개가 생성되고 선택되지 않은 시안은 Version이 되지 않는다.<\/li><li>생성된 Version은 <code>source_type = AI_GENERATION<\/code>과 원 AI 작업(<code>source_job_id<\/code>)에 연결된다.<\/li><li>선택 이유를 선택적으로 남길 수 있으며, 남기면 Version 요약과 History에 함께 기록된다.<\/li><li>선택되지 않은 시안도 검토 후보로 조회 가능한 상태를 유지한다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h13\">Epic E4. 협업/의사결정<\/h2><h3 id=\"02_USER_STORIES_AC-h14\">US-030 의견 등록<\/h3><p><strong>As a<\/strong> 검토자<br><strong>I want<\/strong> 결과물에 의견을 남기고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>일반 의견과 특정 영역/요소에 대한 의견을 구분할 수 있다.<\/li><li>작성자와 작성시각이 기록된다.<\/li><li>담당자에게 알림할 수 있는 확장 포인트를 둔다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h15\">US-031 AI 의견 취합<\/h3><p><strong>As a<\/strong> 프로젝트 담당자<br><strong>I want<\/strong> AI가 여러 의견을 합의/이견/추가확인으로 정리해주길 원한다.<\/p><p><strong>AC<\/strong><\/p><ul><li>원 의견과 AI 요약 결과의 연결관계를 보존한다.<\/li><li>AI 결과는 제안이며 자동 확정되지 않는다.<\/li><li>분류되지 않은 의견은 누락되지 않아야 한다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h16\">US-032 반영 결정<\/h3><p><strong>As a<\/strong> 담당자<br><strong>I want<\/strong> 제안된 의견을 선택해서 반영하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>각 의견에 대해 반영/보류/반려를 선택할 수 있다.<\/li><li>결정 이유를 선택적으로 기록한다.<\/li><li>선택된 의견을 기준으로 AI 수정 작업이 생성된다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h17\">US-033 책임성 검토<\/h3><p><strong>As a<\/strong> 담당자<br><strong>I want<\/strong> 만들어진 화면이 사회적·윤리적으로 문제가 될 만한 지점을 미리 알고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>목업이 생성되면 표현·차별 / 금융소비자보호 / 다크패턴 / 접근성 네 축의 검토가 <strong>자동으로 실행된다.<\/strong><\/li><li>각 지적은 <strong>목업에서 그대로 인용한 근거<\/strong>를 포함한다. 근거가 없는 지적은 표시되지 않는다.<\/li><li>AI는 적법성을 <strong>판정하지 않는다.<\/strong> &quot;위법/적법&quot; 같은 판정 표현이 결과에 나타나지 않는다.<\/li><li>각 지적에 대해 <strong>반영 / 보류 / 반려 / 준법 검토 요청<\/strong> 중 하나를 선택할 수 있고, 누가·언제 결정했는지 남는다.<\/li><li>금융소비자보호 축의 지적은 <code>준법 검토 요청<\/code> 경로가 강조된다.<\/li><li>지적할 항목이 없으면 없다고 표시된다. 억지로 채우지 않는다.<\/li><li>검토 결과는 화면을 막지 않는다. Export·공유는 지적이 남아 있어도 가능하다.<\/li><li>담당자가 수동으로 다시 검토할 수 있으며, 재실행은 이전 결정을 덮어쓰지 않는다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h18\">US-034 UX 리스크 검토<\/h3><p><strong>As a<\/strong> 담당자<br><strong>I want<\/strong> 우리가 나눈 논의대로 가면 사용자가 불편해지는 지점이 없는지 확인하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>검토는 <strong>담당자가 요청할 때만<\/strong> 실행된다. 댓글이 달릴 때마다 자동으로 끼어들지 않는다.<\/li><li>AI는 <strong>전 화면의 목업과 의견 전문을 함께<\/strong> 읽는다. 화면 한 장만 보고 판단하지 않는다.<\/li><li>각 지적은 기획안·목업·의견에서 <strong>그대로 인용한 근거<\/strong>를 포함한다. 원문에 존재하지 않는 인용만 달린 지적은 표시되지 않는다.<\/li><li>AI는 품질을 <strong>판정하지 않으며<\/strong>, 특정 의견이나 작성자를 지목해 틀렸다고 말하지 않는다.<\/li><li>지적은 <strong>의견 목록에 사람 댓글과 시간순으로 섞여<\/strong> 표시되고, <code>AI<\/code> 표기로 사람 의견과 구분된다.<\/li><li>각 지적에 대해 <strong>반영 / 보류 / 반려<\/strong> 중 하나를 선택할 수 있고, 누가·언제 결정했는지 남는다.<\/li><li>지적할 항목이 없으면 없다고 표시된다. 억지로 채우지 않는다.<\/li><li>재실행은 이전 검토와 결정을 덮어쓰지 않는다.<\/li><li>AI 카드가 섞여도 캔버스 메모 핀 번호는 사람 댓글 기준을 유지한다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h19\">Epic E5. Version/History<\/h2><h3 id=\"02_USER_STORIES_AC-h20\">US-040 Version 생성<\/h3><p><strong>As a<\/strong> 담당자<br><strong>I want<\/strong> 수정된 결과를 새 버전으로 남기고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>Version 번호가 순차적으로 부여된다.<\/li><li>각 Version은 이전 Version과 부모 관계를 가진다.<\/li><li>생성 원인이 AI 작업 또는 사용자 변경과 연결된다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h21\">US-041 변경 비교<\/h3><p><strong>As a<\/strong> 사용자<br><strong>I want<\/strong> 두 Version의 차이와 변경 이유를 확인하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>변경 전/후 결과를 비교할 수 있다.<\/li><li>변경 사유와 연결된 의견을 볼 수 있다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h22\">US-042 History 조회<\/h3><p><strong>As a<\/strong> 사용자<br><strong>I want<\/strong> 프로젝트의 작업과 의사결정 과정을 시간순으로 보고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>사용자 행동과 AI 작업을 모두 조회할 수 있다.<\/li><li>Version 생성 이벤트를 History와 연결한다.<\/li><li>권한 없는 사용자는 History를 조회할 수 없다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h23\">Epic E6. Export/운영<\/h2><h3 id=\"02_USER_STORIES_AC-h24\">US-050 Export<\/h3><p><strong>As a<\/strong> 담당자<br><strong>I want<\/strong> 최종 결과를 실제 업무 파일로 내려받고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>지원 포맷별 생성 상태를 보여준다.<\/li><li>다운로드 파일과 해당 Version을 연결한다.<\/li><\/ul><h3 id=\"02_USER_STORIES_AC-h25\">US-060 감사 로그<\/h3><p><strong>As a<\/strong> 운영자<br><strong>I want<\/strong> 중요한 접근과 변경 이벤트를 추적하고 싶다.<\/p><p><strong>AC<\/strong><\/p><ul><li>인증, 권한 변경, 파일 접근, AI 요청, Version 생성 등 주요 이벤트가 정책에 따라 기록된다.<\/li><li>민감정보 원문은 불필요하게 로그에 남기지 않는다.<\/li><\/ul><h2 id=\"02_USER_STORIES_AC-h26\">우선순위 기준<\/h2><p>P0: MVP에서 반드시 동작해야 하는 기능<br>P1: 초기 운영에 필요한 핵심 기능<br>P2: 업무 고도화 기능<br>P3: 향후 확장 기능<\/p>"},{"id":"03_IA_FUNCTION_SPEC","group":"개발문서","title":"03 · IA & 화면","lede":"화면 S01~S10 · 상태 모델","author":"Lucas-one","commit":"96221a4","date":"2026-09-08","path":"개발문서/03_IA_FUNCTION_SPEC.md","size":"9KB","changed":false,"roles":["dev"],"body":"<h1 id=\"03_IA_FUNCTION_SPEC-h0\">IA &amp; 화면 명세 v1.0<\/h1><blockquote><p><strong>관련 문서<\/strong>: <a href=\"#00_INDEX\">기능명세 인덱스<\/a> | <a href=\"#01_PRD\">PRD<\/a><\/p><p>기능별 동작 상세는 <a href=\"#00_INDEX\">기능명세<\/a>로 분리했다. 본 문서는 IA · 화면 · 상태 모델의 정본이다.<\/p><\/blockquote><h2 id=\"03_IA_FUNCTION_SPEC-h1\">1. IA<\/h2><pre class=\"mermaid\">flowchart TD\n  A[Dashboard] --&gt; B[Project]\n  B --&gt; C[Workspace]\n  C --&gt; C1[AI Chat]\n  C --&gt; C2[Result]\n  C --&gt; C3[Comments]\n  C --&gt; C4[AI Review]\n  C --&gt; C5[Version]\n  C --&gt; C6[History]\n  C --&gt; C7[Files]\n  C --&gt; C8[Export]\n  C --&gt; C9[Brand Concept]\n  A --&gt; D[Template]\n  D --&gt; D1[NH Template]\n  D --&gt; D2[My Template]\n  D --&gt; D3[Design Asset Library]\n  A --&gt; E[My Work]\n  A --&gt; F[Admin]<\/pre><h2 id=\"03_IA_FUNCTION_SPEC-h2\">2. 핵심 화면<\/h2><h3 id=\"03_IA_FUNCTION_SPEC-h3\">S01 Dashboard<\/h3><p>최근 프로젝트, 나의 작업, 검토 대기, 최근 Version, 최근 활동을 보여준다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h4\">S02 Project List<\/h3><p>프로젝트명, 상태, 소유자, 마지막 활동, 멤버 수, 미처리 검토 건수를 표시한다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h5\">S03 Project Workspace<\/h3><p>좌측: 파일/Template/멤버<br><del>중앙: 생성 결과물<\/del> → <strong>중앙: 협업 디자인 캔버스<\/strong> (2026-09-05 확장)<br>우측: <del>AI Chat/협업/AI 의견/AI 검토<\/del> → <strong>속성/협업/AI 의견/AI 검토/AI Chat<\/strong><br>상단: Version/History/Export<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h6\">중앙 — 협업 디자인 캔버스<\/h3><p>결과물을 &quot;보여주기만 하는 영역&quot;에서 &quot;같이 만들어 가는 영역&quot;으로 바꾼다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>구성<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>화면 필름스트립<\/td><td>한 Version이 화면 여러 장을 가질 수 있다. 화면별 생성 상태(대기/생성중/완료/실패)와 실패 화면 재시도를 함께 노출한다<\/td><\/tr><tr><td>캔버스<\/td><td>샌드박스 iframe. <strong>선택 모드<\/strong>에서는 화면 위 HTML 요소를 클릭해 지목하고, <strong>미리보기 모드<\/strong>에서는 목업 안의 버튼을 눌러 다음 화면으로 이동한다<\/td><\/tr><tr><td>메모 핀<\/td><td>요소에 달린 의견을 그 요소 위에 번호 핀으로 겹쳐 보여준다<\/td><\/tr><tr><td>흐름 보기<\/td><td>화면 사이의 이동 관계를 노드-간선으로 그린다. 관계는 별도 테이블이 아니라 생성 HTML의 <code>data-goto<\/code> 속성에서 읽어낸다<\/td><\/tr><\/tbody><\/table><\/div><p><strong>요소 = 임의의 HTML 요소<\/strong>다(버튼·입력창·카드 등). 디자인시스템 컴포넌트 단위가 아니다.<br>이 구분은 중요하다 — 컴포넌트 카탈로그를 만드는 것이 아니라, 사람이 화면에서 손가락으로 가리키는 그 자리를 지목하게 하는 것이다. (08 Q1 &quot;이 서비스는 디자인 시스템인가? 아니다&quot;와 충돌하지 않는 이유)<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h7\">우측 — 속성 패널 (신규)<\/h3><p>요소를 고르면 자동으로 열린다. 태그·텍스트·화이트리스트된 스타일 값을 보여주고, 두 가지 방식으로 고칠 수 있다.<\/p><ol><li><strong>직접 편집<\/strong> — 텍스트·색·크기 등을 손으로 바꾼다.<\/li><li><strong>AI 재생성<\/strong> — &quot;이 버튼을 리스트로 바꿔줘&quot;처럼 말하면 <strong>선택한 요소만<\/strong> 다시 만든다.<\/li><\/ol><p>두 경우 모두 원본 HTML을 덮어쓰지 않고 <strong>편집 패치로 쌓는다.<\/strong> 누가 왜 바꿨는지가 남고 되돌릴 수 있다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h8\">우측 — 협업 패널에 섞이는 AI 카드 (2026-09-08 확장)<\/h3><p><code>협업<\/code>(의견) 탭은 사람 댓글만 담던 곳이었다. 여기에 <a href=\"#FR-15_UX리스크검토\">FR-15 UX 리스크 검토<\/a>의 지적이 <strong>같은 목록에 시간순으로 섞여<\/strong> 놓인다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>구성<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td><code>AI에게 검토 요청<\/code> 버튼<\/td><td>패널 상단. <strong>담당자가 누를 때만<\/strong> 검토가 돈다. 자동 실행하지 않는다<\/td><\/tr><tr><td>AI 카드<\/td><td>좌측 보더 + <code>AI<\/code> 표기로 사람 댓글과 구분한다. [근거 인용 → 사유 → 제안] 순, 결정 버튼 3종<\/td><\/tr><tr><td>메모 핀 번호<\/td><td><strong>사람 댓글만 세어<\/strong> 매긴다. AI 카드가 번호를 밀면 캔버스 위의 핀과 목록이 어긋난다<\/td><\/tr><tr><td>탭 배지<\/td><td><code>의견 (N)<\/code>의 N은 사람 댓글 수를 유지하고, 미결정 AI 지적이 있으면 점으로 표시한다<\/td><\/tr><\/tbody><\/table><\/div><p><code>AI 검토<\/code> 탭(FR-14)은 그대로 둔다. 화면만 보고 규칙으로 판정하는 검토와, 논의까지 읽고 누적을 보는 검토는 자리가 다르다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h9\">S04 AI Chat<\/h3><p>입력 영역 + 참고자료 선택 + Template 선택 + 작업 유형 선택.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h10\">S05 Result/Review<\/h3><p>결과물 미리보기, 댓글, AI 의견 요약, 반영 선택을 한 화면에서 연결한다.<\/p><p><strong>AI 검토<\/strong>(<a href=\"#FR-14_책임성검토\">FR-14<\/a>)도 이 화면에 함께 놓인다. 지적 카드는 [근거 인용 → 사유 → 제안] 순으로 보여주고, 담당자는 <strong>반영 / 보류 / 반려 / 준법 검토 요청<\/strong>을 고른다. AI 제안(축별 좌측 보더 · <code>AI<\/code> 표기)과 사람의 결정(아바타 배지)을 시각적으로 구분한다.<\/p><p><strong>UX 리스크 검토<\/strong>(<a href=\"#FR-15_UX리스크검토\">FR-15<\/a>)는 별도 자리를 만들지 않고 <strong>댓글 목록 안에<\/strong> 놓인다. 논의에 의견을 하나 더 얹는 것이 이 기능의 요지이기 때문이다. 카드 형식은 같고 결정은 <strong>반영 / 보류 / 반려<\/strong> 3종이다 — <code>준법 검토 요청<\/code>은 FR-14 고유다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h11\">S06 Version<\/h3><p>Version 목록, 현재 버전, 비교 대상 선택, 변경 요약, 관련 의견을 제공한다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h12\">S07 History<\/h3><p>시간순 Timeline 형태로 사용자 작업, AI 작업, 댓글, 반영 결정, Version 생성 이력을 제공한다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h13\">S08 Brand Concept Brief<\/h3><p>카드 실물·홍보물 시안을 요청하는 화면. 산출물 유형·규격 프리셋 선택, 브리프 입력(상품·캠페인명 / 타겟 / 전달할 느낌 / 필수 문구), 브랜드 자산 선택, 참고자료 선택으로 구성한다. 비디자이너가 채울 수 있도록 디자인 용어를 입력칸에 쓰지 않는다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h14\">S09 Concept Compare<\/h3><p>생성된 시안 3개를 규격 비율을 유지한 채 나란히 비교하는 화면. 시안별 방향 라벨·확대 보기·개별 의견 등록을 제공하고, 하나를 선택하면 Version이 생성된다. 선택하지 않으면 Version은 만들어지지 않는다. 시안은 샌드박스 iframe으로 격리 렌더링한다.<\/p><p>화면 상세: <a href=\"#09_UI_SPEC_브랜드시안\">09_UI_SPEC_브랜드시안.md<\/a><\/p><h3 id=\"03_IA_FUNCTION_SPEC-h15\">S10 Design Asset Library<\/h3><p>IA의 <code>D3<\/code>. NH가 보유한 디자인 자산을 <strong>자산 종류별<\/strong>(<del>로고·워드마크<\/del> 로고·CI 기본요소 / 컴포넌트 / 화면 템플릿 / 컬러·타이포 토큰)로 한 화면에 펼쳐 보여준다. 각 자산은 출처(올원뱅크 / 기업인터넷뱅킹 / NH공통)와 <strong>실물 보유 여부<\/strong>를 배지로 표시하고, 자산을 프로젝트에 담아 AI 생성 컨텍스트로 넘기는 진입점을 제공한다.<\/p><p>이 화면의 목적은 자산 관리가 아니라 <strong>&quot;외부 AI와 달리 NH 자산에서 출발한다&quot;는 제품 차별점을 눈으로 확인시키는 것<\/strong>이다. 그래서 상단에 보유 자산 규모를 고정 배치한다. Template의 버전 선택·소유 구분(D1/D2)은 이 화면이 아니라 S03·S04에서 다룬다.<\/p><ul><li>실물 자산이 없는 항목은 대체본(자리표시)을 그려 빈 칸을 만들지 않되, 배지로 실물과 명확히 구분한다.<\/li><li>실물 이미지 파일은 공개 서빙 대상에서 제외되는 경로에만 둔다. → DEPLOYMENT.md 3절<\/li><li>농협 공식 CI(심볼마크·워드마크·전용색상·그래픽모티브)는 <code>로고·CI 기본요소<\/code>에 둔다. 전용색상 규격서의 PANTONE·RGB 값은 이미지와 별개로 코드에 옮겨 두어, 이미지가 없어도 토큰 카드가 정본 값을 보여준다.<\/li><li>관련 기능: <a href=\"#FR-04_템플릿\">FR-04 Template<\/a>(<code>BRAND_ASSET<\/code>), <a href=\"#FR-13_브랜드시안제작\">FR-13 브랜드 시안 제작<\/a><\/li><\/ul><h2 id=\"03_IA_FUNCTION_SPEC-h16\">3. 상태 모델<\/h2><h3 id=\"03_IA_FUNCTION_SPEC-h17\">AI Job<\/h3><p>REQUESTED → PROCESSING → COMPLETED / FAILED / CANCELLED<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h18\">Comment/Review<\/h3><p>OPEN → REVIEWED → ACCEPTED / REJECTED / DEFERRED<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h19\">Responsibility Review (FR-14)<\/h3><p>검토 실행: RUNNING → DONE / FAILED<br>지적 결정: (미결정) → ACCEPTED / DEFERRED / REJECTED / COMPLIANCE_REQUESTED<\/p><p><code>COMPLIANCE_REQUESTED<\/code>가 Comment/Review 상태 모델과 다른 지점이다. AI도 담당자도 판단하지 않고 준법 담당자에게 넘기는 상태다. → ❓ 수신자·알림·SLA 미결<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h20\">Usability Review (FR-15)<\/h3><p>검토 실행: RUNNING → DONE / FAILED<br>지적 결정: (미결정) → ACCEPTED / DEFERRED / REJECTED<\/p><p>FR-14와 실행 상태는 같고 **결정에 <code>COMPLIANCE_REQUESTED<\/code>가 없다.** 준법 축은 FR-14의 몫이다.<br>검토는 담당자 요청 시에만 시작되므로 <code>REQUESTED<\/code> 대기 상태를 따로 두지 않는다.<\/p><h3 id=\"03_IA_FUNCTION_SPEC-h21\">Project<\/h3><p>DRAFT → ACTIVE → REVIEW → COMPLETED → ARCHIVED<\/p><h2 id=\"03_IA_FUNCTION_SPEC-h22\">4. 핵심 UX 원칙<\/h2><ul><li>AI 제안과 사람의 최종 결정을 시각적으로 구분한다.<\/li><li>Version과 History를 같은 화면에서 연결한다.<\/li><li>사용자가 “왜 바뀌었는지”를 두 번 이상 클릭하지 않고 확인할 수 있게 한다.<\/li><li>프로젝트의 현재 상태와 다음 액션을 항상 보여준다.<\/li><li>파일/의견/Version을 프로젝트 단위로 묶어 검색 가능하게 한다.<\/li><\/ul>"},{"id":"04_SYSTEM_ARCHITECTURE","group":"개발문서","title":"04 · 시스템 아키텍처","lede":"Linux + Docker · AI Orchestrator","author":"Lucas-one","commit":"21fc3c1","date":"2026-09-06","path":"개발문서/04_SYSTEM_ARCHITECTURE.md","size":"5KB","changed":false,"roles":["dev"],"body":"<h1 id=\"04_SYSTEM_ARCHITECTURE-h0\">NH뚝딱협업스튜디오 시스템 아키텍처 v1.0<\/h1><h2 id=\"04_SYSTEM_ARCHITECTURE-h1\">1. 목표 배포 환경<\/h2><ul><li>농협은행 내부 Linux 서버<\/li><li>Docker 컨테이너 기반 배포<\/li><li>승인된 LLM 서버는 API 방식으로 연계<\/li><li>사용자 브라우저에서 LLM 직접 호출 금지<\/li><li>향후 K8s 전환을 고려한 stateless 애플리케이션 구조<\/li><\/ul><h2 id=\"04_SYSTEM_ARCHITECTURE-h2\">2. 논리 구성<\/h2><pre class=\"mermaid\">flowchart TB\n  U[사내 사용자 PC]\n  SSO[사내 SSO]\n  RP[Nginx / Reverse Proxy]\n  subgraph APP[Linux Server / Docker]\n    FE[Frontend Vue3 / Nginx]\n    BE[Backend Spring Boot]\n    AO[AI Orchestrator]\n    WK[Async Worker]\n    DB[(PostgreSQL)]\n    RD[(Redis)]\n    FS[File Storage / NFS or Object Storage]\n    AL[Audit Log]\n  end\n  subgraph LLM[승인 AI 영역]\n    GW[LLM API Gateway]\n    MODEL[LLM Server]\n  end\n  U --&gt; RP --&gt; FE --&gt; BE\n  U --&gt; SSO\n  BE --&gt; SSO\n  BE --&gt; DB\n  BE --&gt; RD\n  BE --&gt; FS\n  BE --&gt; AL\n  BE --&gt; AO\n  BE --&gt; WK\n  WK --&gt; AO\n  AO --&gt;|HTTPS + 인증정보| GW --&gt; MODEL<\/pre><h2 id=\"04_SYSTEM_ARCHITECTURE-h3\">3. 컴포넌트 책임<\/h2><h3 id=\"04_SYSTEM_ARCHITECTURE-h4\">Frontend<\/h3><p>화면/상태 표시, 파일 선택, Chat 입력, 협업 UI, Version/History 시각화.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h5\">Backend<\/h3><p>인증/인가, 프로젝트 도메인, 파일 메타데이터, 협업, Version, History, Export orchestration, API 제공.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h6\">AI Orchestrator<\/h3><p>LLM API 표준화, 인증정보 주입, 프롬프트 구성, 모델 라우팅, timeout/retry, 오류 정규화, 사용량 메타데이터 관리.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h7\">Async Worker<\/h3><p>장시간 문서 분석/생성/Export 작업을 큐 기반으로 처리할 확장 지점.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h8\">PostgreSQL<\/h3><p>프로젝트, 사용자, 멤버, 댓글, Review, Version, History, Template 메타데이터를 저장.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h9\">Redis<\/h3><p>세션/캐시/작업 상태 등 용도로 사용. 실제 운영 목적은 인프라 협의 후 확정.<\/p><h3 id=\"04_SYSTEM_ARCHITECTURE-h10\">File Storage<\/h3><p>원본 참고자료와 Version별 생성 산출물을 DB와 분리해 저장.<\/p><h2 id=\"04_SYSTEM_ARCHITECTURE-h11\">4. AI 호출 흐름<\/h2><p>LLM 호출 경로는 두 가지로 구분한다. 어느 경우든 브라우저는 LLM을 직접 호출하지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>경로<\/th><th>대상<\/th><th>흐름<\/th><\/tr><\/thead><tbody><tr><td>동기 단건<\/td><td>화면 1장 생성, 요소 AI 편집처럼 단일 응답으로 끝나는 호출 (05_API_DB_SPEC.md 3-2절)<\/td><td>FE → BE → AO → GW. 여러 건 팬아웃은 클라이언트가 한다<\/td><\/tr><tr><td>비동기 Job<\/td><td>문서 분석, 시안 3안 생성, Export 등 장시간 작업<\/td><td>FE → BE(Job 등록 후 즉시 202) → 큐 → Async Worker → AO → GW<\/td><\/tr><\/tbody><\/table><\/div><p>비동기 Job의 상태 전달은 폴링으로 한다(<code>GET /ai/jobs/{jobId}<\/code>, 권장 주기 2~3초). 초기 사용자 규모에서 SSE/WebSocket은 운영 비용이 이득보다 크므로 도입하지 않고, 규모 확대 시 재검토한다.<\/p><p><del>이전 다이어그램은 Backend가 LLM 응답까지 받은 뒤 Frontend에 반환하는 동기 흐름이었다<\/del> → 비동기 Job 결정(ARCHITECTURE.md 4절)과 모순되어 수정 (2026-09-06).<\/p><pre class=\"mermaid\">sequenceDiagram\n  actor User\n  participant FE as Frontend\n  participant BE as Backend\n  participant WK as Async Worker\n  participant AO as AI Orchestrator\n  participant GW as LLM API Gateway\n  participant LLM as LLM Server\n  participant DB as PostgreSQL\n\n  User-&gt;&gt;FE: AI 작업 요청\n  FE-&gt;&gt;BE: POST /ai/jobs\n  BE-&gt;&gt;DB: Job REQUESTED 저장\n  BE-&gt;&gt;WK: 큐 적재\n  BE--&gt;&gt;FE: 202 + jobId 즉시 반환\n  WK-&gt;&gt;DB: PROCESSING 갱신\n  WK-&gt;&gt;AO: 작업 전달\n  AO-&gt;&gt;GW: 인증 Token + 요청\n  GW-&gt;&gt;LLM: 모델 호출\n  LLM--&gt;&gt;GW: 결과\n  GW--&gt;&gt;AO: 응답\n  AO--&gt;&gt;WK: 정규화된 결과\n  WK-&gt;&gt;DB: 결과 저장 · COMPLETED/FAILED 갱신\n  loop 완료까지 2~3초 간격\n    FE-&gt;&gt;BE: GET /ai/jobs/{jobId}\n    BE--&gt;&gt;FE: 상태/결과\n  end<\/pre><h2 id=\"04_SYSTEM_ARCHITECTURE-h12\">5. 보안 원칙<\/h2><ul><li>SSO/사내 인증을 Backend에서 검증<\/li><li>LLM credential은 Secret/보안 저장소 등 허용된 방식 사용<\/li><li>프론트 번들에 credential 포함 금지<\/li><li>프로젝트별 파일 접근권한 확인<\/li><li>로그에 원문/민감정보를 기본 저장하지 않음<\/li><li>AI 요청 대상 자료를 사용자가 명시적으로 선택할 수 있게 함<\/li><li>파일 업로드 시 확장자/바이러스/용량 정책 적용<\/li><\/ul><h2 id=\"04_SYSTEM_ARCHITECTURE-h13\">6. 안정성<\/h2><ul><li>LLM timeout/retry/circuit-breaker 고려<\/li><li>장시간 작업 비동기 처리<\/li><li>실패 작업 재시도 가능, 진행 중 작업 취소 가능(<code>POST /ai/jobs/{jobId}/cancel<\/code>)<\/li><li>중복 요청 idempotency 고려<\/li><li>DB/파일 간 불일치 복구 절차 필요<\/li><li>파일 업로드/다운로드는 Backend 경유 스트리밍으로 처리해 요청 스레드 장기 점유를 피하고, 용량 상한 초과는 413으로 즉시 거절<\/li><\/ul><h2 id=\"04_SYSTEM_ARCHITECTURE-h14\">7. 확장성<\/h2><p>초기에는 Docker 단일/소수 컨테이너로 구성하되, Frontend/Backend/AI Worker를 stateless하게 설계한다. 향후 NH K8s 환경으로 전환할 경우 Deployment/Service/Ingress/PVC 등으로 분리하기 쉽도록 이미지와 환경변수를 명확히 관리한다.<\/p>"},{"id":"05_API_DB_SPEC","group":"개발문서","title":"05 · API / DB","lede":"엔드포인트 · 테이블 · 관계","author":"Lucas-one","commit":"456c719","date":"2026-09-08","path":"개발문서/05_API_DB_SPEC.md","size":"15KB","changed":false,"roles":["dev"],"body":"<h1 id=\"05_API_DB_SPEC-h0\">API / DB 초안 v1.0<\/h1><h2 id=\"05_API_DB_SPEC-h1\">1. API 기본 원칙<\/h2><ul><li>REST API 기준<\/li><li><code>/api/v1<\/code> 버전 사용<\/li><li>사용자 인증은 사내 SSO 연계<\/li><li>서버 간 AI 호출은 내부 credential을 사용<\/li><li>장시간 작업은 Job 리소스로 비동기 처리<\/li><li>목록 API는 커서 기반 페이지네이션을 기본으로 한다 (<code>?cursor=&amp;limit=<\/code>, limit 기본 20 · 최대 100). 무한 증가하는 리소스(history 등)의 전체 반환 금지 (2026-09-06 추가)<\/li><li>목록 화면에 필요한 집계는 목록 응답에 포함한다 — 프론트가 행마다 추가 호출하는 N+1 금지 (2026-09-06 추가)<\/li><li>비동기 Job 상태는 폴링으로 조회한다 (권장 주기 2~3초 — 04_SYSTEM_ARCHITECTURE.md 4절)<\/li><li>파일 다운로드는 Backend 경유 스트리밍이며 모든 다운로드는 감사 대상 이벤트다 (2026-09-06 추가)<\/li><\/ul><h2 id=\"05_API_DB_SPEC-h2\">2. 주요 API<\/h2><h3 id=\"05_API_DB_SPEC-h3\">Auth<\/h3><p><code>GET /api/v1/me<\/code><\/p><h3 id=\"05_API_DB_SPEC-h4\">Dashboard<\/h3><p><code>GET /api/v1/dashboard<\/code>  — S01 대시보드 집계를 1회 호출로 반환 (최근 프로젝트 · 나의 작업 · 검토 대기 · 최근 Version · 최근 활동). 화면 1개당 API 다중 호출 방지 (2026-09-06 추가)<\/p><h3 id=\"05_API_DB_SPEC-h5\">Project<\/h3><p><code>GET /api/v1/projects<\/code>  — 응답에 S02 목록 표시용 집계 포함 (멤버 수 · 미처리 검토 건수 · 마지막 활동)<br><code>POST /api/v1/projects<\/code><br><code>GET /api/v1/projects/{projectId}<\/code><br><code>PATCH /api/v1/projects/{projectId}<\/code><br><code>POST /api/v1/projects/{projectId}/members<\/code><\/p><h3 id=\"05_API_DB_SPEC-h6\">Files<\/h3><p><code>POST /api/v1/projects/{projectId}/files<\/code><br><code>GET /api/v1/projects/{projectId}/files<\/code><br><code>GET /api/v1/projects/{projectId}/files/{fileId}/content<\/code>  — 원본 다운로드, 스트리밍 (2026-09-06 추가)<br><code>DELETE /api/v1/projects/{projectId}/files/{fileId}<\/code><\/p><h3 id=\"05_API_DB_SPEC-h7\">Template<\/h3><p><code>GET /api/v1/templates<\/code>  — <code>?type=DOCUMENT|BRAND_ASSET<\/code>로 유형 필터<br><code>GET /api/v1/templates/{templateId}<\/code><\/p><h3 id=\"05_API_DB_SPEC-h8\">AI Job<\/h3><p><code>POST /api/v1/projects/{projectId}/ai/jobs<\/code>  — body의 <code>job_type<\/code>으로 산출물 종류를 구분 (8절)<br><code>GET /api/v1/ai/jobs/{jobId}<\/code>  — <code>BRAND_CONCEPT<\/code> Job은 출력 3건을 함께 반환<br><code>POST /api/v1/ai/jobs/{jobId}/retry<\/code><br><code>POST /api/v1/ai/jobs/{jobId}/cancel<\/code>  — <code>REQUESTED<\/code>/<code>PROCESSING<\/code>에서만 허용 → <code>CANCELLED<\/code> (03 상태 모델 대응, 2026-09-06 추가)<\/p><h3 id=\"05_API_DB_SPEC-h9\">Collaboration<\/h3><p><code>GET /api/v1/projects/{projectId}/comments<\/code><br><code>POST /api/v1/projects/{projectId}/comments<\/code><br><code>PATCH /api/v1/comments/{commentId}<\/code><\/p><h3 id=\"05_API_DB_SPEC-h10\">AI Review<\/h3><p><code>POST /api/v1/projects/{projectId}/reviews/summarize<\/code><br><code>GET /api/v1/projects/{projectId}/reviews<\/code><br><code>POST /api/v1/reviews/{reviewId}/decisions<\/code><\/p><h3 id=\"05_API_DB_SPEC-h11\">Responsibility Review (FR-14)<\/h3><p><code>POST /api/v1/versions/{versionId}/responsibility-review<\/code>  — 검토 실행. 이전 검토를 덮어쓰지 않고 새 이력을 만든다<br><code>GET /api/v1/versions/{versionId}/responsibility-review<\/code>  — 최신 검토 + 지적 목록<br><code>PATCH /api/v1/responsibility-findings/{findingId}<\/code>  — body의 <code>decision<\/code>은 <code>ACCEPTED<\/code> / <code>DEFERRED<\/code> / <code>REJECTED<\/code> / <code>COMPLIANCE_REQUESTED<\/code><\/p><h3 id=\"05_API_DB_SPEC-h12\">Usability Review (FR-15)<\/h3><p><code>POST /api/v1/versions/{versionId}/usability-review<\/code>  — 검토 실행. <strong>담당자 요청 시에만<\/strong> 호출된다. body의 <code>userId<\/code>가 <code>requested_by<\/code>로 기록된다. 이전 검토를 덮어쓰지 않고 새 이력을 만든다<br><code>GET /api/v1/versions/{versionId}/usability-review<\/code>  — 최신 검토 + 지적 목록<br><code>PATCH /api/v1/usability-findings/{findingId}<\/code>  — body의 <code>decision<\/code>은 <code>ACCEPTED<\/code> / <code>DEFERRED<\/code> / <code>REJECTED<\/code> (<code>COMPLIANCE_REQUESTED<\/code> 없음 — 준법 축은 FR-14 고유)<\/p><p>입력이 전 화면 HTML + 의견 전문이라 요청 본문이 아닌 <strong>서버가 DB에서 조립한다.<\/strong> 총량이 상한을 넘으면 <code>413<\/code>으로 거부한다. 잘라내면 잘린 뒷부분의 문제를 못 봐서 결과가 조용히 틀린다.<\/p><h3 id=\"05_API_DB_SPEC-h13\">Version<\/h3><p><code>GET /api/v1/projects/{projectId}/versions<\/code><br><code>GET /api/v1/versions/{versionId}<\/code><br><code>GET /api/v1/versions/{versionId}/files/{fileId}/content<\/code>  — Version 산출물 다운로드 (2026-09-06 추가)<br><code>GET /api/v1/versions/{versionId}/compare?baseVersionId=...<\/code>  — 비교는 화면(<code>screens<\/code>)·파일(<code>version_files<\/code>) 단위로 전/후를 짝지어 반환<\/p><h3 id=\"05_API_DB_SPEC-h14\">History<\/h3><p><code>GET /api/v1/projects/{projectId}/history<\/code><\/p><h3 id=\"05_API_DB_SPEC-h15\">Export<\/h3><p><code>POST /api/v1/versions/{versionId}/exports<\/code><br><code>GET /api/v1/exports/{exportId}<\/code>  — 상태·메타데이터 조회<br><code>GET /api/v1/exports/{exportId}/download<\/code>  — 완료된 결과 파일 다운로드, 감사 대상 (2026-09-06 추가)<\/p><h2 id=\"05_API_DB_SPEC-h16\">3. 주요 DB<\/h2><pre><code class=\"lang-text\">users\nprojects\nproject_members\nfiles\nfile_references\ntemplates\ntemplate_versions\nai_jobs\nai_job_inputs\nai_job_outputs\ncomments\nreview_summaries\nreview_items\nreview_decisions\nresponsibility_reviews\nresponsibility_findings\nusability_reviews  (2026-09-08 추가 — FR-15)\nusability_findings  (2026-09-08 추가)\nversions\nversion_files\nhistory_events\nexports\naudit_logs\nscreens            (2026-09-05 추가 — 협업 디자인 캔버스)\nscreen_elements    (2026-09-05 추가)\nelement_patches    (2026-09-05 추가)<\/code><\/pre><h3 id=\"05_API_DB_SPEC-h17\">3-1. 협업 디자인 캔버스 (2026-09-05)<\/h3><p>한 Version이 화면 여러 장을 갖고, 화면 안의 요소 단위로 메모·수정이 붙는다.<br>(03_IA_FUNCTION_SPEC.md S03)<\/p><div class=\"table-wrap\"><table><thead><tr><th>테이블<\/th><th>주요 컬럼<\/th><th>목적<\/th><\/tr><\/thead><tbody><tr><td><code>screens<\/code><\/td><td><code>version_id<\/code>, <code>screen_key<\/code>, <code>name<\/code>, <code>role<\/code>, <code>sort_order<\/code>, <code>html_content<\/code>, <code>status<\/code>, <code>error_message<\/code><\/td><td>Version에 속한 화면 한 장. <code>status<\/code>로 화면별 생성 성공/실패를 따로 다뤄 실패한 화면만 재시도한다<\/td><\/tr><tr><td><code>screen_elements<\/code><\/td><td><code>screen_id<\/code>, <code>nh_id<\/code>, <code>tag<\/code>, <code>doc_order<\/code>, <code>path_sig<\/code>, <code>text_sig<\/code><\/td><td>요소 지문. 화면을 다시 만든 뒤 메모를 원래 자리에 다시 잇는 데 쓴다<\/td><\/tr><tr><td><code>element_patches<\/code><\/td><td><code>screen_id<\/code>, <code>nh_id<\/code>, <code>user_id<\/code>, <code>op<\/code>, <code>payload<\/code>, <code>reason<\/code>, <code>source<\/code>, <code>seq<\/code>, <code>reverted_at<\/code>, <code>comment_id<\/code><\/td><td>요소 편집 이력. <code>op<\/code>은 <code>setText<\/code>/<code>setStyle<\/code>/<code>setAttr<\/code>/<code>aiRewrite<\/code>. <strong>원본 HTML을 덮어쓰지 않는다<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><code>comments<\/code> 확장: <code>screen_id<\/code>, <code>nh_id<\/code>, <code>anchor_status<\/code>(<code>none<\/code>/<code>anchored<\/code>/<code>orphaned<\/code>), <code>resolved_at<\/code>, <code>parent_id<\/code>.<br><code>anchor_status=&#39;none&#39;<\/code>이 일반 의견이고, 요소를 지목한 의견은 <code>anchored<\/code>다. 재생성으로 앵커가 끊기면 삭제하지 않고 <code>orphaned<\/code>로 남겨 사람이 다시 붙일 수 있게 한다. (FR-06의 &quot;일반 의견과 특정 영역/요소에 대한 의견을 구분해 등록한다&quot;가 여기서 실체를 얻는다)<\/p><p><strong>화면 간 이동 관계는 테이블로 두지 않는다.<\/strong> 생성 HTML의 <code>data-goto=&quot;화면key&quot;<\/code> 속성이 유일한 출처이며, 저장 시 존재하지 않는 화면을 가리키는 값은 제거된다. 별도 테이블을 두면 HTML과 어긋날 수 있고, 어긋나면 &quot;눌러도 반응 없는 버튼&quot;이 된다.<\/p><h3 id=\"05_API_DB_SPEC-h18\">3-2. 캔버스 API (2026-09-05)<\/h3><p>화면 생성은 <strong>2단계<\/strong>다. 한 번에 여러 화면의 HTML을 만들면 토큰 한도와 타임아웃에 걸리고, 어느 화면이 실패했는지도 보이지 않는다.<\/p><div class=\"table-wrap\"><table><thead><tr><th>메서드<\/th><th>경로<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>POST<\/td><td><code>/projects/{projectId}/plan-screens<\/code><\/td><td>1단계. 화면 목록·역할·전환 관계만 만든다. HTML은 만들지 않는다<\/td><\/tr><tr><td>POST<\/td><td><code>/screens/{screenId}/generate<\/code><\/td><td>2단계. 화면 한 장. 다시 호출하면 그대로 재시도<\/td><\/tr><tr><td>POST<\/td><td><code>/screens/{screenId}/patches<\/code> · DELETE <code>/patches/{patchId}<\/code><\/td><td>요소 편집 기록 / 되돌리기(soft revert)<\/td><\/tr><tr><td>POST<\/td><td><code>/screens/{screenId}/ai-edit<\/code><\/td><td>선택한 요소만 AI가 재생성. 요소의 outerHTML만 보낸다<\/td><\/tr><tr><td>GET/POST<\/td><td><code>/screens/{screenId}/comments<\/code><\/td><td>요소 앵커 의견. POST는 <code>parentId<\/code>로 답글을 만든다(2026-09-08). 답글은 앵커를 갖지 않고, 답글의 답글은 뿌리로 평탄화된다<\/td><\/tr><tr><td>GET<\/td><td><code>/mockups/{mockupId}/patches<\/code><\/td><td>한 Version의 편집 내역 전체(2026-09-08). 되돌린 것을 포함하고 <code>payload<\/code>는 뺀다. 편집 이력 목록과, 의견 스레드에 끼는 AI 반영 카드가 함께 읽는다<\/td><\/tr><tr><td>GET<\/td><td><code>/screens/{screenId}/html<\/code><\/td><td>화면 하나의 HTML을 <strong>편집이 반영된 상태로<\/strong> 내려준다(2026-09-08). 다운로드가 쓴다<\/td><\/tr><\/tbody><\/table><\/div><p><strong>저장본을 직접 읽지 않는다(baking).<\/strong> 요소 편집은 <code>screens
