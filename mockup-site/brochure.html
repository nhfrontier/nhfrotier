<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH 위드캔버스 - 지점 안내 리플렛</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #4f46e5; text-decoration: none; }
  a:hover { color: #4338ca; }
  .obtn { display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;font-weight:500;color:#475569;background:#fff; }
  .obtn:hover { background:#f8fafc; }
</style>
</head>
<body>
<div style="width:1440px;min-height:900px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

  <header style="height:56px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;padding:0 24px;">
    <div style="width:26px;height:26px;background:#4f46e5;border-radius:7px;display:flex;align-items:center;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <a href="main.html" style="font-size:13px;color:#94a3b8;">대시보드</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <a href="projects.html" style="font-size:13px;color:#94a3b8;">프로젝트</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <span style="font-size:13px;font-weight:600;color:#0f172a;">지점 안내 리플렛</span>
    <span style="font-size:11px;font-weight:600;color:#64748b;background:#f1f5f9;padding:3px 8px;border-radius:999px;">DRAFT</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <button class="obtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>다시 생성</button>
      <div style="width:28px;height:28px;border-radius:50%;background:#4f46e5;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;">김</div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:32px 32px 48px;">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:20px;font-weight:700;color:#0f172a;margin:0 0 6px;">지점 안내 리플렛</h1>
      <p style="font-size:14px;color:#64748b;margin:0;">영업점 비치용 상품 안내 리플렛 초안</p>
    </div>

    <div style="background:#fff;border:1px solid #fecaca;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">
      <div style="width:32px;height:32px;border-radius:50%;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      </div>
      <div>
        <p style="font-size:13px;font-weight:600;color:#991b1b;margin:0 0 2px;">초안 생성 실패</p>
        <p style="font-size:12.5px;color:#b91c1c;margin:0;">LLM 응답 지연으로 생성이 완료되지 못했습니다 · 2시간 전</p>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
      <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;">프로젝트 정보</h2>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#94a3b8;">소유자</span>
          <span style="color:#1e293b;font-weight:500;display:flex;align-items:center;gap:6px;"><span style="width:18px;height:18px;border-radius:50%;background:#3b82f6;color:#fff;font-size:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;">박</span>박준혁</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#94a3b8;">멤버</span>
          <span style="color:#1e293b;font-weight:500;">박준혁 · 김민준 (2명)</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#94a3b8;">마지막 활동</span>
          <span style="color:#1e293b;font-weight:500;">2시간 전</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#94a3b8;">상태</span>
          <span style="color:#64748b;font-weight:600;">아직 초안 없음</span>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
