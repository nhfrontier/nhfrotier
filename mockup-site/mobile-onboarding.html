<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH 위드캔버스 - 모바일뱅킹 온보딩</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #4f46e5; text-decoration: none; }
  a:hover { color: #4338ca; }
  .obtn { display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;font-weight:500;color:#475569;background:#fff; }
</style>
</head>
<body>
<div style="width:1440px;min-height:900px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

  <header style="height:56px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;padding:0 24px;">
    <div style="width:26px;height:26px;background:#4f46e5;border-radius:7px;display:flex;align-items:center;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <a href="main.html" style="font-size:13px;color:#94a3b8;">대시보드</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <a href="projects.html" style="font-size:13px;color:#94a3b8;">프로젝트</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <span style="font-size:13px;font-weight:600;color:#0f172a;">모바일뱅킹 온보딩</span>
    <span style="font-size:11px;font-weight:600;color:#b45309;background:#fffbeb;padding:3px 8px;border-radius:999px;">REVIEW</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#4f46e5;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;">김</div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:32px 32px 48px;">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:20px;font-weight:700;color:#0f172a;margin:0 0 6px;">모바일뱅킹 온보딩</h1>
      <p style="font-size:14px;color:#64748b;margin:0;">신규 고객 대상 모바일뱅킹 첫 진입 화면 개선 프로젝트</p>
    </div>

    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;">
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
        <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;">프로젝트 정보</h2>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">소유자</span>
            <span style="color:#1e293b;font-weight:500;display:flex;align-items:center;gap:6px;"><span style="width:18px;height:18px;border-radius:50%;background:#ec4899;color:#fff;font-size:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;">이</span>이서연</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">멤버</span>
            <span style="color:#1e293b;font-weight:500;">이서연 · 김민준 · 박준혁 (3명)</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">마지막 활동</span>
            <span style="color:#1e293b;font-weight:500;">1시간 전</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">상태</span>
            <span style="color:#b45309;font-weight:600;">검토 1건 대기</span>
          </div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
        <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;">의견 취합 현황</h2>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#16a34a;"></div>
            <span style="font-size:12.5px;color:#334155;">합의 3건</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#d97706;"></div>
            <span style="font-size:12.5px;color:#334155;">이견 1건</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#2563eb;"></div>
            <span style="font-size:12.5px;color:#334155;">추가확인 1건</span>
          </div>
        </div>
        <a href="main.html" style="display:block;margin-top:16px;font-size:12px;font-weight:600;color:#4f46e5;">← 대시보드에서 확인하기</a>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
      <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 10px;">진행 메모</h2>
      <p style="font-size:13px;color:#475569;line-height:1.6;margin:0;">최초 온보딩 화면 초안(v1)에 대해 팀 의견을 취합했습니다. 대부분 레이아웃에는 동의했으나 안내 문구 톤에 대한 이견이 1건 남아있어, 확정 전 담당자 논의가 필요합니다.</p>
    </div>
  </main>
</div>
</body>
</html>
