<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH 위드캔버스 - 채널 앱 리뉴얼</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #4f46e5; text-decoration: none; }
  a:hover { color: #4338ca; }
</style>
</head>
<body>
<div style="width:1440px;min-height:900px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

  <header style="height:56px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;padding:0 24px;">
    <div style="width:26px;height:26px;background:#4f46e5;border-radius:7px;display:flex;align-items:center;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <a href="main.html" style="font-size:13px;color:#94a3b8;">대시보드</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <a href="projects.html" style="font-size:13px;color:#94a3b8;">프로젝트</a>
    <span style="font-size:13px;color:#cbd5e1;">/</span>
    <span style="font-size:13px;font-weight:600;color:#0f172a;">채널 앱 리뉴얼</span>
    <span style="font-size:11px;font-weight:600;color:#4f46e5;background:#eef2ff;padding:3px 8px;border-radius:999px;">ACTIVE</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#4f46e5;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;">김</div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:32px 32px 48px;">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:20px;font-weight:700;color:#0f172a;margin:0 0 6px;">채널 앱 리뉴얼</h1>
      <p style="font-size:14px;color:#64748b;margin:0;">모바일 앱 채널 로그인 화면 개선 프로젝트</p>
    </div>

    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;">
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
        <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;">프로젝트 정보</h2>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">소유자</span>
            <span style="color:#1e293b;font-weight:500;display:flex;align-items:center;gap:6px;"><span style="width:18px;height:18px;border-radius:50%;background:#4f46e5;color:#fff;font-size:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;">김</span>김민준</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">멤버</span>
            <span style="color:#1e293b;font-weight:500;">김민준 (1명)</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">마지막 활동</span>
            <span style="color:#1e293b;font-weight:500;">41분 전</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:#94a3b8;">상태</span>
            <span style="color:#15803d;font-weight:600;">로그인 화면 시안 완료</span>
          </div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
        <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;">최근 Version</h2>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:12px;font-weight:700;color:#4f46e5;background:#eef2ff;padding:2px 7px;border-radius:6px;">v2</span>
          <div style="flex:1;min-width:0;">
            <p style="font-size:12.5px;color:#1e293b;margin:0;">로그인 화면 초안 수정</p>
          </div>
        </div>
        <p style="font-size:11px;color:#94a3b8;margin:8px 0 0;">41분 전 · 현재 버전</p>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
      <h2 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 10px;">진행 메모</h2>
      <p style="font-size:13px;color:#475569;line-height:1.6;margin:0;">로그인 화면 시안을 다듬어 v2로 반영했습니다. 아직 다른 담당자의 검토 요청은 없는 개인 작업 단계입니다.</p>
    </div>
  </main>
</div>
</body>
</html>
