<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}
.grp{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subtle)}
.cols{display:grid;grid-template-columns:1fr 1fr 220px;gap:20px;align-items:start}</style></head><body><div id="root"></div>
<script type="text/babel">
const {TextField,Toggle,CheckRow,PinDots,Keypad,Divider,Icon}=window.YeoulBankDesignSystem_073d1f;
function Demo(){
  const [v,setV]=React.useState('홍길동');const [big,setBig]=React.useState(true);
  const [all,setAll]=React.useState(false);const [a,setA]=React.useState(true);
  const [pin,setPin]=React.useState('123');
  return (<div className="cols">
    <div className="grp">
      <TextField label="이름" value={v} onChange={setV}/>
      <TextField label="이체금액" value="500,000" inputMode="numeric" suffix={<span style={{color:'var(--text-muted)'}}>원</span>}/>
      <TextField label="계좌번호" value="302-2212" error="계좌번호를 확인해주세요"/>
      <TextField label="비활성" value="변경 불가" disabled/>
    </div>
    <div className="grp">
      <div className="row" style={{justifyContent:'space-between'}}><Toggle label="큰글" checked={big} onChange={setBig}/><Toggle size="sm" checked={false} onChange={()=>{}}/><Toggle checked disabled onChange={()=>{}}/></div>
      <Divider/>
      <CheckRow emphasis checked={all} onChange={setAll}>약관 전체 동의</CheckRow>
      <Divider inset={34}/>
      <CheckRow checked={a} onChange={setA} trailing={<Icon name="chevron-right" size={18} color="var(--ink-300)"/>}>[필수] 서비스 이용약관</CheckRow>
      <CheckRow checked={false} onChange={()=>{}} trailing={<Icon name="chevron-right" size={18} color="var(--ink-300)"/>}>[선택] 마케팅 정보 수신</CheckRow>
      <Divider/>
      <div className="lbl">PinDots</div>
      <PinDots length={6} filled={pin.length}/>
      <PinDots length={6} filled={6} error/>
    </div>
    <div><div className="lbl" style={{marginBottom:8}}>Keypad · secure</div><Keypad shuffle variant="secure" onKey={k=>setPin(p=>k==='⌫'?p.slice(0,-1):k==='재배열'?p:(p+k).slice(0,6))} style={{borderRadius:'var(--r-md)',overflow:'hidden'}}/></div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
