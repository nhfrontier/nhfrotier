<!-- @dsCard group="Colors" viewport="700x150" name="Navy & Green" subtitle="딥 네이비(로그인·푸터) · NH 그린(NH BOX)" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--white); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 7px 9px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
  .star { outline: 2px solid var(--color-primary); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--nh-navy-900)"></div><div class="meta"><div class="name">navy-900</div><div class="hex">#0A2540</div></div></div>
    <div class="sw star"><div class="chip" style="background:var(--nh-navy-800)"></div><div class="meta"><div class="name">navy-800 ★</div><div class="hex">#122F50</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-navy-500)"></div><div class="meta"><div class="name">navy-500</div><div class="hex">#34507A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-green-600)"></div><div class="meta"><div class="name">green-600</div><div class="hex">#009047</div></div></div>
    <div class="sw star"><div class="chip" style="background:var(--nh-green-500)"></div><div class="meta"><div class="name">green-500 ★</div><div class="hex">#00A04E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-green-100)"></div><div class="meta"><div class="name">green-100</div><div class="hex">#D6F1E1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-green-50)"></div><div class="meta"><div class="name">green-50</div><div class="hex">#ECF9F1</div></div></div>
  </div>
</body>
</html>
