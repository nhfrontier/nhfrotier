<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--white); }
  .line { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; }
  .spec { width: 92px; flex: none; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .sample { color: var(--text-strong); letter-spacing: var(--ls-tight); }
</style>
</head>
<body>
  <div class="line"><span class="spec">40 / Bold</span><span class="sample" style="font-size:40px;font-weight:700">기업금융 한눈에</span></div>
  <div class="line"><span class="spec">30 / Bold</span><span class="sample" style="font-size:30px;font-weight:700">자금관리 서비스</span></div>
  <div class="line"><span class="spec">24 / Bold</span><span class="sample" style="font-size:24px;font-weight:700">이체 · 출금 내역 조회</span></div>
  <div class="line"><span class="spec">20 / SemiBold</span><span class="sample" style="font-size:20px;font-weight:600">계좌 잔액 정보</span></div>
</body>
</html>
