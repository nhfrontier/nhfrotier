<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale — 8px grid" subtitle="여백 토큰 1→20" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--white); display:flex; gap:18px; align-items:flex-end; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background: var(--nh-blue-100); border:1px solid var(--nh-blue-300); border-radius: var(--radius-xs); }
  .t { font-size:11px; color:var(--text-muted); font-family:var(--font-mono); }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="t">1·4</div></div>
  <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="t">2·8</div></div>
  <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="t">3·12</div></div>
  <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="t">4·16</div></div>
  <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="t">6·24</div></div>
  <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="t">8·32</div></div>
  <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="t">12·48</div></div>
  <div class="col"><div class="bar" style="width:64px;height:64px"></div><div class="t">16·64</div></div>
  <div class="col"><div class="bar" style="width:80px;height:80px"></div><div class="t">20·80</div></div>
</body>
</html>
