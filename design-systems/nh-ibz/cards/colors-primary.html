<!-- @dsCard group="Colors" viewport="700x150" name="Primary — NH Blue" subtitle="핵심 브랜드 블루 · 로고·버튼·링크" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--white); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 7px 9px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
  .star { outline: 2px solid var(--color-primary); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--nh-blue-700)"></div><div class="meta"><div class="name">blue-700</div><div class="hex">#00689B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-blue-600)"></div><div class="meta"><div class="name">blue-600</div><div class="hex">#007EC0</div></div></div>
    <div class="sw star"><div class="chip" style="background:var(--nh-blue-500)"></div><div class="meta"><div class="name">blue-500 ★</div><div class="hex">#0094D9</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-blue-400)"></div><div class="meta"><div class="name">blue-400</div><div class="hex">#36ABE2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-blue-300)"></div><div class="meta"><div class="name">blue-300</div><div class="hex">#79C8EE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-blue-100)"></div><div class="meta"><div class="name">blue-100</div><div class="hex">#D6EEFA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--nh-blue-50)"></div><div class="meta"><div class="name">blue-50</div><div class="hex">#EEF8FD</div></div></div>
  </div>
</body>
</html>
