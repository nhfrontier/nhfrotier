<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="텍스트·보더·배경 그레이 스케일" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--white); }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 60px; }
  .meta { padding: 6px 7px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--grey-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#1A1C1F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-700)"></div><div class="meta"><div class="name">700</div><div class="hex">#41464F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-500)"></div><div class="meta"><div class="name">500</div><div class="hex">#767D88</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#C4C9D0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#E2E5EA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#F0F2F5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grey-50)"></div><div class="meta"><div class="name">50 ★</div><div class="hex">#F5F6F8</div></div></div>
  </div>
</body>
</html>
