<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NH 증권 — 투자, 누구에게나 쉽고 정직하게</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="securities.css">
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--white); }
  .skip-link { position: absolute; left: -9999px; top: 0; z-index: 300; background: var(--color-primary); color: #fff; padding: 10px 18px; border-radius: 0 0 8px 0; font-weight: 600; }
  .skip-link:focus { left: 0; }
</style>
</head>
<body>
<a href="#main" class="skip-link">본문 바로가기</a>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>

<script type="text/babel" src="../ibz/Icon.jsx"></script>
<script type="text/babel" src="../ibz/Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Mission.jsx"></script>
<script type="text/babel" src="AccountBenefits.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Disclaimer.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <div className="sec-page">
        <Header extraNav={["주식투자"]} />
        <main id="main">
          <SecHero />
          <SecMission />
          <SecAccountBenefits />
          <SecFeatures />
          <SecDisclaimer />
        </main>
        <SecFooter />
      </div>
    );
  }

  function setupReveal() {
    const els = Array.prototype.slice.call(document.querySelectorAll(".reveal"));
    if (!els.length) { setTimeout(setupReveal, 60); return; }
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    const reveal = (el) => el.classList.add("is-in");
    if (!("IntersectionObserver" in window)) { els.forEach(reveal); return; }
    const vh = window.innerHeight || 800;
    // reveal anything already in view (hero / above the fold)
    els.forEach((el) => { if (el.getBoundingClientRect().top < vh * 0.92) reveal(el); });
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    els.forEach((el) => { if (!el.classList.contains("is-in")) io.observe(el); });
    // safety net: never leave anything hidden
    setTimeout(() => els.forEach(reveal), 3500);
  }

  function mount() {
    if (!window.SecHero || !window.Header || !window.SecFooter) { setTimeout(mount, 30); return; }
    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    setTimeout(setupReveal, 150);
  }
  mount();
</script>
</body>
</html>
