<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NH기업뱅킹 Design System</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px}.main{background:var(--nh-blue-500);display:flex;align-items:center;justify-content:center;padding:0 56px}.main span{font-family:var(--font-sans);color:#fff;font-weight:800;font-size:150px;letter-spacing:-0.04em;white-space:nowrap;line-height:1}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head>
<body>
<div class="tile">
<div class="main"><span>NH기업뱅킹</span></div>
<div class="strip"><div style="background:var(--nh-blue-300)"></div><div style="background:var(--nh-green-500)"></div><div style="background:var(--nh-slate-600)"></div><div style="background:var(--nh-navy-800)"></div></div>
</div>
</body>
</html>
