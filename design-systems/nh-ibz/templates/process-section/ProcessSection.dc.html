<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="프로세스 섹션" description="번호형 5단계 프로세스 — 연결 레일과 재검토 루프 포함" -->
<helmet><script src="./ds-base.js"></script></helmet>
<section style="background:var(--white);padding:96px 20px 88px;font-family:var(--font-sans)">
<div style="max-width:1200px;margin:0 auto">
<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px">
<span style="font-size:12.5px;font-weight:800;letter-spacing:0.18em;color:var(--nh-green-600)">PROCESS</span>
<h2 style="margin:0;font-size:46px;font-weight:800;letter-spacing:-0.04em;color:var(--text-strong);line-height:1.15">아이디어에서 완성까지</h2>
<p style="margin:0;font-size:17px;color:var(--text-muted);letter-spacing:-0.01em">다섯 단계로 끝나는 업무 협업</p>
</div>
<div style="position:relative;margin-top:64px">
<div style="position:absolute;top:29px;left:10%;right:10%;height:2px;background:var(--grey-200);z-index:0"></div>
<div style="position:relative;z-index:1;display:flex;align-items:flex-start">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 10px">
<div style="width:60px;height:60px;border-radius:50%;background:var(--white);border:2px solid var(--nh-green-500);color:var(--nh-green-600);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">01</div>
<div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text-strong)">아이디어 입력</div>
<div style="font-size:14px;line-height:1.55;color:var(--text-muted);text-align:center;white-space:nowrap">채팅 설명 + 참고자료</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 10px">
<div style="width:60px;height:60px;border-radius:50%;background:var(--white);border:2px solid var(--nh-green-500);color:var(--nh-green-600);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">02</div>
<div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text-strong)">AI 초안 생성</div>
<div style="font-size:14px;line-height:1.55;color:var(--text-muted);text-align:center;white-space:nowrap">문서 · PPT · 화면 시안</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 10px">
<div style="width:60px;height:60px;border-radius:50%;background:var(--white);border:2px solid var(--nh-green-500);color:var(--nh-green-600);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">03</div>
<div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text-strong)">공동 검토</div>
<div style="font-size:14px;line-height:1.55;color:var(--text-muted);text-align:center;white-space:nowrap">사업 · 테크 · 디자인 · 준법</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 10px">
<div style="width:60px;height:60px;border-radius:50%;background:var(--white);border:2px solid var(--nh-green-500);color:var(--nh-green-600);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">04</div>
<div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text-strong)">의견 반영</div>
<div style="font-size:14px;line-height:1.55;color:var(--text-muted);text-align:center;white-space:nowrap">선택한 의견만 재생성</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 10px">
<div style="width:60px;height:60px;border-radius:50%;background:var(--nh-green-500);border:2px solid var(--nh-green-500);color:var(--white);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,160,78,0.28)">05</div>
<div style="font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text-strong)">파일 완성</div>
<div style="font-size:14px;line-height:1.55;color:var(--text-muted);text-align:center;white-space:nowrap">다운로드 + History</div>
</div>
</div>
<sc-if value="{{ showLoop }}" hint-placeholder-val="{{ true }}">
<div style="position:relative;height:118px;margin-top:14px">
<div style="position:absolute;left:50%;width:20%;top:0;height:52px;border:2px dashed var(--nh-green-100);border-top:none;border-radius:0 0 20px 20px"></div>
<div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid var(--nh-green-500)"></div>
<div style="position:absolute;left:60%;top:66px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:34px;padding:0 18px;border-radius:999px;background:var(--nh-green-50);border:1px solid var(--nh-green-100);font-size:13.5px;font-weight:600;color:var(--nh-green-700);white-space:nowrap"><span style="font-size:15px;line-height:1">↻</span>협의가 더 필요하면 다시 검토</div>
</div>
</sc-if>
</div>
</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showLoop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showLoop: this.props.showLoop ?? true };
  }
}
</script>
</body>
</html>
