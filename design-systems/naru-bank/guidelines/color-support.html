<!-- @dsCard group="Colors" viewport="700x160" name="Support hues" subtitle="Category tints. Each product family owns one hue, fixed across screens." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-radius:var(--r-md);overflow:hidden}
.sw{height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.sw b{font-size:11px;font-weight:700;letter-spacing:.02em}
.sw i{font-size:10px;font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:flex-end}
.tile b{font-size:12px;font-weight:700}.tile i{font-size:10px;font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.k{font-size:10px;color:var(--text-subtle);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:14px}
.line .k{min-width:118px;flex:none}
</style></head><body><div class="tiles" style="grid-template-columns:repeat(5,1fr)">
<div class="tile" style="background:#E9E7FD;color:#5445D6"><b>Violet</b><i>--violet-100</i><i>--violet-600</i></div><div class="tile" style="background:#DDEDFD;color:#1D72C4"><b>Sky</b><i>--sky-100</i><i>--sky-600</i></div><div class="tile" style="background:#FDE6E6;color:#CF3B3B"><b>Rose</b><i>--rose-100</i><i>--rose-600</i></div><div class="tile" style="background:#E8F5D9;color:#568C25"><b>Lime</b><i>--lime-100</i><i>--lime-600</i></div><div class="tile" style="background:#FCEFCF;color:#B98708"><b>Gold</b><i>--gold-100</i><i>--gold-600</i></div></div>
<div class="tiles" style="grid-template-columns:repeat(5,1fr);margin-top:10px">
<div class="tile" style="background:#7A6CF0;color:#fff;min-height:44px"><i>--violet-400 · #7A6CF0</i></div><div class="tile" style="background:#3E9BF0;color:#fff;min-height:44px"><i>--sky-400 · #3E9BF0</i></div><div class="tile" style="background:#F06767;color:#fff;min-height:44px"><i>--rose-400 · #F06767</i></div><div class="tile" style="background:#78BE3C;color:#fff;min-height:44px"><i>--lime-400 · #78BE3C</i></div><div class="tile" style="background:#EFB528;color:#fff;min-height:44px"><i>--gold-400 · #EFB528</i></div></div></body></html>
