<!-- @dsCard group="Colors" viewport="700x130" name="Neutral · Cool Ink" subtitle="Backgrounds, hairlines and text. Slightly green-cool, never blue-grey." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-radius:var(--r-md);overflow:hidden}
.sw{height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.sw b{font-size:11px;font-weight:700;letter-spacing:.02em}
.sw i{font-size:10px;font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:flex-end}
.tile b{font-size:12px;font-weight:700}.tile i{font-size:10px;font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.k{font-size:10px;color:var(--text-subtle);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:14px}
.line .k{min-width:118px;flex:none}
</style></head><body><div class="ramp"><div class="sw" style="background:#FFFFFF;color:var(--ink-900)"><b>0</b><i>#FFFFFF</i></div><div class="sw" style="background:#FAFBFB;color:var(--ink-900)"><b>25</b><i>#FAFBFB</i></div><div class="sw" style="background:#F4F6F6;color:var(--ink-900)"><b>50</b><i>#F4F6F6</i></div><div class="sw" style="background:#EAEEEE;color:var(--ink-900)"><b>100</b><i>#EAEEEE</i></div><div class="sw" style="background:#DBE1E1;color:var(--ink-900)"><b>200</b><i>#DBE1E1</i></div><div class="sw" style="background:#C0C8C8;color:var(--ink-900)"><b>300</b><i>#C0C8C8</i></div><div class="sw" style="background:#98A2A2;color:var(--ink-900)"><b>400</b><i>#98A2A2</i></div><div class="sw" style="background:#6E7878;color:#fff"><b>500</b><i>#6E7878</i></div><div class="sw" style="background:#4C5555;color:#fff"><b>600</b><i>#4C5555</i></div><div class="sw" style="background:#333B3B;color:#fff"><b>700</b><i>#333B3B</i></div><div class="sw" style="background:#1E2525;color:#fff"><b>800</b><i>#1E2525</i></div><div class="sw" style="background:#0E1414;color:#fff"><b>900</b><i>#0E1414</i></div></div></body></html>
