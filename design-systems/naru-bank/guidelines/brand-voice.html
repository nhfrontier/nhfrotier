<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-radius:var(--r-md);overflow:hidden}
.sw{height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.sw b{font-size:11px;font-weight:700;letter-spacing:.02em}
.sw i{font-size:10px;font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:flex-end}
.tile b{font-size:12px;font-weight:700}.tile i{font-size:10px;font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.k{font-size:10px;color:var(--text-subtle);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:14px}
.line .k{min-width:118px;flex:none}
</style></head><body><div class="stack">
<div class="line"><span style="color:var(--success);font-weight:800;min-width:16px">✓</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">중요한 일을 기다리고 있다면?</span><span class="k" style="min-width:150px">질문으로 열고</span></div><div class="line"><span style="color:var(--success);font-weight:800;min-width:16px">✓</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">운세 확인하고 포인트도 받자☆</span><span class="k" style="min-width:150px">짧은 보상으로 닫기</span></div><div class="line"><span style="color:var(--success);font-weight:800;min-width:16px">✓</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">1분이면 끝, 매일 새로운 혜택</span><span class="k" style="min-width:150px">시간·노력을 먼저 밝히기</span></div><div class="line"><span style="color:var(--success);font-weight:800;min-width:16px">✓</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">지난 달 같은 기간보다 650,000원 아꼈어요</span><span class="k" style="min-width:150px">수치를 문장 안에</span></div><div class="line"><span style="color:var(--danger);font-weight:800;min-width:16px">✗</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">고객님께서는 당사의 서비스를 이용하실 수 있습니다</span><span class="k" style="min-width:150px">합니다체·과공대</span></div><div class="line"><span style="color:var(--danger);font-weight:800;min-width:16px">✗</span><span style="flex:1;font-size:16px;font-weight:600;color:var(--text-strong)">지금 바로 신청하세요!!! 🎉</span><span class="k" style="min-width:150px">느낌표 남발·이모지</span></div></div></body></html>
