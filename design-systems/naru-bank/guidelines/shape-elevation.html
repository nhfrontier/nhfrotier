<!-- @dsCard group="Shape" viewport="700x180" name="Elevation" subtitle="Soft, cool-tinted, low-contrast. Cards float; nothing embosses." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-radius:var(--r-md);overflow:hidden}
.sw{height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.sw b{font-size:11px;font-weight:700;letter-spacing:.02em}
.sw i{font-size:10px;font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:flex-end}
.tile b{font-size:12px;font-weight:700}.tile i{font-size:10px;font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.k{font-size:10px;color:var(--text-subtle);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:14px}
.line .k{min-width:118px;flex:none}
</style></head><body><div style="display:flex;gap:20px;padding:14px 4px;background:var(--surface-app);border-radius:var(--r-md)">
<div style="flex:1;height:100px;background:#fff;border-radius:20px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><b style="font-size:12px;color:var(--text-strong)">--shadow-card</b><span class="k">카드 기본</span></div><div style="flex:1;height:100px;background:#fff;border-radius:20px;box-shadow:var(--shadow-raised);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><b style="font-size:12px;color:var(--text-strong)">--shadow-raised</b><span class="k">눌린 카드·팝오버</span></div><div style="flex:1;height:100px;background:#fff;border-radius:20px;box-shadow:var(--shadow-nav);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><b style="font-size:12px;color:var(--text-strong)">--shadow-nav</b><span class="k">하단 탭 (위로)</span></div><div style="flex:1;height:100px;background:#fff;border-radius:20px;box-shadow:var(--shadow-brand);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><b style="font-size:12px;color:var(--text-strong)">--shadow-brand</b><span class="k">주요 CTA</span></div></div></body></html>
