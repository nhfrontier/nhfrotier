<!-- @dsCard group="Type" viewport="700x230" name="Body & Caption" subtitle="15px baseline, 1.5 line-height. Korean needs the extra leading." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.ramp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-radius:var(--r-md);overflow:hidden}
.sw{height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.sw b{font-size:11px;font-weight:700;letter-spacing:.02em}
.sw i{font-size:10px;font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:flex-end}
.tile b{font-size:12px;font-weight:700}.tile i{font-size:10px;font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.k{font-size:10px;color:var(--text-subtle);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:14px}
.line .k{min-width:118px;flex:none}
.s{letter-spacing:var(--ls-body);line-height:var(--lh-normal);margin:0;color:var(--text-body)}</style></head><body><div class="stack">
<div class="line"><span class="k">body-lg · 17 / 600</span><p class="s" style="font-size:17px;font-weight:600">내 자동차 지금 시세는 얼마?</p></div>
<div class="line"><span class="k">body · 15 / 400</span><p class="s" style="font-size:15px">자녀의 생애 첫 금융을 시작하세요</p></div>
<div class="line"><span class="k">body-sm · 14 / 400</span><p class="s" style="font-size:14px;color:var(--text-muted)">매일 돌리고 포인트 챙겨가세요</p></div>
<div class="line"><span class="k">caption · 13 / 500</span><p class="s" style="font-size:13px;color:var(--text-muted)">지난 달 같은 기간보다 650,000원 아꼈어요</p></div>
<div class="line"><span class="k">micro · 11 / 500</span><p class="s" style="font-size:11px;color:var(--text-subtle)">준법감시인 심의필 2026-0000</p></div>
</div></body></html>
