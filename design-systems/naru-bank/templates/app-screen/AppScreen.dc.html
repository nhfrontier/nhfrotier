<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="나루뱅크 앱 화면" description="Phone-frame screen shell: status bar, app bar, scrolling card content, bottom nav." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#EFF3F3 0%,#E3E9E9 100%);font-family:"Pretendard Variable",system-ui,sans-serif}</style></helmet>
<div style="width:360px;height:780px;display:flex;flex-direction:column;background:#F4F6F6;border-radius:36px;overflow:hidden;box-shadow:0 24px 70px rgba(14,20,20,.24);border:1px solid #EAEEEE">
<div style="display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 20px;flex:none;font-size:12px;font-weight:700;color:#0E1414;letter-spacing:-.01em"><span style="font-variant-numeric:tabular-nums">1:09</span><span style="display:flex;align-items:center;gap:5px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Icon" name="signal" size="13" hint-size="13px,13px"></x-import><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Icon" name="wifi" size="13" hint-size="13px,13px"></x-import><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Icon" name="battery-full" size="15" hint-size="15px,15px"></x-import></span></div>
<header style="display:flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 20px;flex:none;background:#F4F6F6"><span style="flex:1;font-size:19px;font-weight:800;letter-spacing:-.02em;color:#0E1414">화면 제목</span><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.IconButton" label="알림" badge="{{ true }}" hint-size="40px,40px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Icon" name="bell" size="22" hint-size="22px,22px"></x-import></x-import><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.IconButton" label="전체메뉴" hint-size="40px,40px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Icon" name="menu" size="22" hint-size="22px,22px"></x-import></x-import></header>
<div style="flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:12px">
<x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Banner" tone="brand" eyebrow="중요한 일을 기다리고 있다면?" title="운세 확인하고 포인트도 받자☆" hint-size="100%,92px"></x-import>
<x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Card" hint-size="100%,200px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:999px;background:#0B8478;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:-.03em">나루</span><span style="flex:1;min-width:0"><span style="display:block;font-size:17px;font-weight:700;color:#0E1414">나루 주거래우대통장</span><span style="display:block;font-size:14px;color:#6E7878">나루은행 302-2212-1373-21</span></span></div>
<div style="display:flex;align-items:center;justify-content:center;padding:22px 0 20px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.AmountText" value="{{ balance }}" unit="원" hint-size="160px,32px"></x-import></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Button" variant="outline" hint-size="100%,44px">ATM출금</x-import><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Button" variant="outline" hint-size="100%,44px">거래내역</x-import><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Button" variant="outline" hint-size="100%,44px">이체</x-import></div>
</x-import>
<h2 style="margin:16px 0 0;font-size:19px;font-weight:700;letter-spacing:-.02em;color:#0E1414">섹션 제목</h2>
<x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.Card" hint-size="100%,140px"><x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.MenuGrid" items="{{ shortcuts }}" hint-size="100%,110px"></x-import></x-import>
</div>
<x-import component-from-global-scope="YeoulBankDesignSystem_073d1f.BottomNav" items="{{ tabs }}" value="{{ tab }}" onChange="{{ setTab }}" hint-size="100%,64px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:830},&quot;balance&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1175776,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;계좌&quot;}}">
class Component extends DCLogic {
  state = { tab: 'home' };
  icon(name, size) {
    const NS = window.YeoulBankDesignSystem_073d1f || {};
    return NS.Icon ? React.createElement(NS.Icon, { name, size }) : null;
  }
  tile(name, size) { return this.icon(name, size); }
  renderVals() {
    return {
      balance: this.props.balance ?? 1175776,
      tab: this.state.tab,
      setTab: (id) => this.setState({ tab: id }),
      tabs: [
        { id: 'home', label: '홈', icon: this.icon('house', 22) },
        { id: 'products', label: '금융상품', icon: this.icon('briefcase', 22) },
        { id: 'assets', label: '내 자산', icon: this.icon('wallet', 22) },
        { id: 'points', label: '포인트쌓기', icon: this.icon('circle-dollar-sign', 22) },
        { id: 'benefits', label: '생활혜택', icon: this.icon('gift', 22) }
      ],
      shortcuts: [
        { id: '1', label: '계좌등록', icon: this.tile('file-text', 22), shape: 'squircle', bg: 'var(--obj-violet)', accent: { icon: this.tile('plus', 12), bg: 'var(--obj-green)' } },
        { id: '2', label: '전체계좌', icon: this.tile('list', 22), shape: 'squircle', bg: 'var(--obj-blue)' },
        { id: '3', label: '공과금납부', icon: this.tile('receipt', 22), shape: 'squircle', bg: 'var(--obj-blue-deep)', accent: { icon: this.tile('arrow-right', 11), bg: 'var(--ink-800)' } },
        { id: '4', label: '이체한도변경', icon: this.tile('arrow-down-up', 22), shape: 'circle', bg: 'var(--obj-amber)' }
      ]
    };
  }
}
</script>
</body>
</html>
