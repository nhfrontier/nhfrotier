<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}
.grp{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subtle)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}

<script type="text/babel">
const {Banner,Sheet,Toast,EmptyState,Button,Badge,Icon}=window.YeoulBankDesignSystem_073d1f;
function Demo(){
  return (<div className="cols">
    <div className="grp">
      <Banner tone="brand" eyebrow="중요한 일을 기다리고 있다면?" title="운세 확인하고 포인트도 받자☆" media={<Icon name="clover" size={40} color="var(--teal-400)"/>}/>
      <Banner tone="accent" eyebrow="오늘의 혜택" title="1분이면 끝, 매일 새로운 혜택" media={<Icon name="gift" size={40} color="var(--amber-500)"/>}/>
      <Banner tone="inverse" title="뚜레쥬르 x 요기요" description="8/24-8/31 포장 50%" action={<Button size="sm" variant="secondary">바로가기</Button>}/>
      <div style={{position:'relative',height:60}}><Toast message="계좌번호를 복사했어요" style={{bottom:0}}/></div>
    </div>
    <div className="stage">
      <EmptyState media={<Icon name="inbox" size={40} color="var(--ink-300)"/>} title="등록된 계좌가 없어요" description="다른 은행 계좌를 연결하면 한눈에 볼 수 있어요" style={{padding:'32px 20px'}}/>
      <Sheet open secondaryLabel="1일동안 안보기" dismissLabel="닫기">
        <Badge tone="info">오늘의 혜택</Badge>
        <div style={{marginTop:12,fontSize:'var(--fs-title-2)',fontWeight:800,letterSpacing:'var(--ls-title)',lineHeight:1.3,color:'var(--text-strong)'}}>요즘 핫한 이벤트<br/>보기만 해도 포인트를!</div>
      </Sheet>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
