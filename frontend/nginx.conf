# Vue 빌드 산출물을 서빙하고 /api 를 백엔드로 넘긴다.
# ARCHITECTURE 2절의 FE → BE 경로가 이것이다. 브라우저가 LLM 을 직접 부르는 경로는 없다.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 상한은 백엔드(FILE_MAX_BYTES 기본 50MB)와 맞춘다.
    # 여기서 먼저 잘리면 백엔드의 413 응답 대신 Nginx 기본 오류 페이지가 나가 원인이 안 보인다.
    client_max_body_size 50m;

    # 생성 HTML 미리보기가 iframe 안에서 도므로 DENY 는 쓰지 않는다. 같은 출처만 허용한다.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 해시가 붙은 자산은 내용이 바뀌면 이름이 바뀐다. 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # proxy_pass 에 이름을 그대로 쓰면 nginx 가 기동 시 한 번만 DNS 를 풀고 그 IP 를 계속 쓴다.
        # 백엔드 컨테이너만 재시작해 IP 가 바뀌면 nginx 를 재시작할 때까지 502 가 계속된다.
        # 변수로 넘기면 요청마다 다시 푼다. 127.0.0.11 은 Docker 내장 DNS 다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream "backend:8080";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 작업은 동기 단건도 수십 초 걸린다. 기본 60초로는 502 가 난다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Export ZIP 다운로드가 버퍼링으로 지연되지 않게 한다.
        proxy_buffering off;
    }

    # SPA 라 새로고침·직접 진입도 index.html 로 보낸다. 경로 판단은 vue-router 가 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
